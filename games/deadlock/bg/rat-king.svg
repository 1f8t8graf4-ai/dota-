<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 400" preserveAspectRatio="xMidYMid slice">
  <!-- Крысиный король: трон из труб, красный круг света, канализация. Путь Б -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2823"/>
      <stop offset=".45" stop-color="#151d1a"/>
      <stop offset="1" stop-color="#0a0f10"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d84a36" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#b03228" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7a2420" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2622"/>
      <stop offset=".5" stop-color="#5c3a30"/>
      <stop offset="1" stop-color="#241715"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10181a"/>
      <stop offset="1" stop-color="#080d0e"/>
    </linearGradient>
  </defs>
  <rect width="180" height="400" fill="url(#sky)"/>
  <!-- красный круг света за троном -->
  <circle cx="90" cy="118" r="46" fill="url(#glow)"/>
  <circle cx="90" cy="118" r="30" fill="#c94032" opacity=".8"/>
  <!-- горизонтальные трубы сверху -->
  <g>
    <rect x="0" y="16" width="180" height="7" fill="url(#pipe)"/>
    <rect x="0" y="23" width="180" height="2" fill="#1a100d"/>
    <rect x="0" y="40" width="180" height="5" fill="#33211d" opacity=".9"/>
    <circle cx="42" cy="19" r="6" fill="#4a2f28"/><circle cx="132" cy="19" r="6" fill="#4a2f28"/>
  </g>
  <!-- вертикальные трубы по краям -->
  <g>
    <rect x="12" y="20" width="13" height="300" fill="url(#pipe)"/>
    <rect x="10" y="90" width="17" height="8" fill="#6e4638"/><rect x="10" y="220" width="17" height="8" fill="#6e4638"/>
    <rect x="155" y="20" width="13" height="300" fill="url(#pipe)"/>
    <rect x="153" y="130" width="17" height="8" fill="#6e4638"/><rect x="153" y="260" width="17" height="8" fill="#6e4638"/>
    <rect x="38" y="46" width="8" height="180" fill="#2c1c18" opacity=".9"/>
    <rect x="136" y="60" width="8" height="200" fill="#2c1c18" opacity=".9"/>
  </g>
  <!-- туман -->
  <rect x="0" y="200" width="180" height="130" fill="#1a2420" opacity=".25"/>
  <rect x="0" y="250" width="180" height="80" fill="#202c26" opacity=".2"/>
  <!-- вода внизу: живая группа hb-wv -->
  <g class="hb-wv">
    <rect x="0" y="318" width="180" height="82" fill="url(#water)"/>
    <path d="M8 334 q14 -5 28 0 t28 0 t28 0 t28 0 t28 0 t24 0 v10 H8 Z" fill="#a03028" opacity=".38"/>
    <path d="M14 358 q12 -4 24 0 t24 0 t24 0 t24 0 t24 0 v8 H14 Z" fill="#8a2a24" opacity=".3"/>
    <path d="M4 380 q16 -5 32 0 t32 0 t32 0 t32 0 v12 H4 Z" fill="#6e2420" opacity=".35"/>
    <ellipse cx="56" cy="342" rx="16" ry="3" fill="#c94032" opacity=".25"/>
    <ellipse cx="122" cy="364" rx="20" ry="3" fill="#c94032" opacity=".2"/>
  </g>
  <!-- отблеск света, ползущий по трубам: hb-glow -->
  <g class="hb-glow" opacity=".5">
    <rect x="12" y="60" width="13" height="34" fill="#c94032" opacity=".35"/>
    <rect x="155" y="140" width="13" height="30" fill="#c94032" opacity=".3"/>
  </g>
</svg>
