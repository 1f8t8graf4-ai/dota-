<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 400" preserveAspectRatio="xMidYMid slice">
  <!-- Венатор: нимб-роза с лучами, точечный растр, фиолетовые мазки. Путь Б -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17131d"/>
      <stop offset=".5" stop-color="#120e17"/>
      <stop offset="1" stop-color="#0c0910"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6e6e78" stop-opacity=".55"/>
      <stop offset=".62" stop-color="#7e7e88" stop-opacity=".4"/>
      <stop offset=".78" stop-color="#8a8a94" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8a8a94" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="180" height="400" fill="url(#sky)"/>
  <!-- нимб с лучами: живая группа hb-ray (медленное вращение) -->
  <g class="hb-ray">
    <circle cx="90" cy="112" r="58" fill="url(#halo)"/>
    <circle cx="90" cy="112" r="30" fill="#82828c" opacity=".5"/>
    <g stroke="#94949e" stroke-width="1" opacity=".4">
      <line x1="90" y1="112" x2="90" y2="44"/>
      <line x1="90" y1="112" x2="136" y2="66"/>
      <line x1="90" y1="112" x2="156" y2="112"/>
      <line x1="90" y1="112" x2="136" y2="158"/>
      <line x1="90" y1="112" x2="90" y2="180"/>
      <line x1="90" y1="112" x2="44" y2="158"/>
      <line x1="90" y1="112" x2="24" y2="112"/>
      <line x1="90" y1="112" x2="44" y2="66"/>
      <line x1="90" y1="112" x2="118" y2="52"/>
      <line x1="90" y1="112" x2="62" y2="52"/>
      <line x1="90" y1="112" x2="118" y2="172"/>
      <line x1="90" y1="112" x2="62" y2="172"/>
    </g>
    <circle cx="90" cy="112" r="44" fill="none" stroke="#8a8a94" stroke-width="1" opacity=".3"/>
  </g>
  <!-- точечный растр: живая группа hb-dr (мерцание) -->
  <g class="hb-dr" fill="#6a6a74">
    <circle cx="34" cy="196" r="1.4" opacity=".5"/><circle cx="42" cy="204" r="1.2" opacity=".4"/><circle cx="50" cy="196" r="1" opacity=".45"/>
    <circle cx="128" cy="188" r="1.4" opacity=".5"/><circle cx="138" cy="198" r="1.2" opacity=".4"/><circle cx="146" cy="190" r="1" opacity=".45"/>
    <circle cx="60" cy="210" r="1.2" opacity=".4"/><circle cx="108" cy="214" r="1.2" opacity=".4"/>
    <circle cx="26" cy="168" r="1.1" opacity=".35"/><circle cx="152" cy="164" r="1.1" opacity=".35"/>
    <circle cx="44" cy="240" r="1.3" opacity=".4"/><circle cx="134" cy="244" r="1.3" opacity=".4"/>
    <circle cx="70" cy="188" r="1" opacity=".3"/><circle cx="98" cy="192" r="1" opacity=".3"/>
  </g>
  <!-- фиолетовые мазки внизу, по краям активнее -->
  <g opacity=".85">
    <path d="M6 400 L14 292 Q17 282 21 292 L34 400 Z" fill="#7a32a0" opacity=".7"/>
    <path d="M30 400 L40 316 Q43 306 47 316 L58 400 Z" fill="#8a3ab4" opacity=".55"/>
    <path d="M118 400 L128 306 Q131 296 135 306 L150 400 Z" fill="#7a32a0" opacity=".6"/>
    <path d="M148 400 L156 280 Q159 270 163 280 L174 400 Z" fill="#8a3ab4" opacity=".7"/>
    <path d="M70 400 L76 344 Q78 336 82 344 L90 400 Z" fill="#5c2680" opacity=".4"/>
    <path d="M96 400 L102 352 Q104 344 108 352 L114 400 Z" fill="#5c2680" opacity=".35"/>
    <path d="M0 400 L4 340 Q6 332 9 340 L12 400 Z" fill="#9a44c4" opacity=".5"/>
  </g>
  <!-- брызги -->
  <g fill="#9a44c4">
    <circle cx="24" cy="272" r="2" opacity=".5"/><circle cx="40" cy="292" r="1.5" opacity=".4"/>
    <circle cx="146" cy="264" r="2" opacity=".5"/><circle cx="160" cy="296" r="1.5" opacity=".4"/>
  </g>
</svg>
