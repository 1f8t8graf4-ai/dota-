(function(){var V='7.0b',files=["icons","dota","words","lore-vocab","tips","spy","scenes"];window.__DATA={};

.catch(function(e){var a=document.getElementById('app');if(a)a.innerHTML='<p style="padding:40px 16px;color:#ccc;font:16px system-ui">Не загрузились данные ('+e.message+'). Проверь интернет и открой ещё раз.</p>';});})();
