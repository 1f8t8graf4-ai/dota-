<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0C0E0F">
<title>Языки по кино</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Golos+Text:wght@400;500;600;700;800&family=Playfair+Display:wght@700&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&family=PT+Mono&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="styles/main.css?v=7.8">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="topfade"></div>
<div id="app"></div>
<script>
/* Где лежат видео и картинки сцен. После переезда в Cloudflare R2 впиши сюда публичный адрес бакета (см. docs/object-storage.md в репозитории scenes). */
window.ASSET_BASE='https://1f8t8graf4-ai.github.io/scenes';
</script>
<script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<script src="js/mascot/mascot-engine.js?v=7.8"></script>
<script>
/* Загрузка данных: сначала JSON из папки data, потом код js/app.js.
   Если index.html открыт двойным кликом (file://) и браузер не даёт читать JSON — берём data/all-data.js (те же данные одним файлом). */
(function(){var V='7.8',files=["icons","dota","words","lore-vocab","tips","spy","scenes"];window.__DATA={};
function go(){var s=document.createElement('script');s.src='js/app.js?v='+V;document.body.appendChild(s);}
function local(){var s=document.createElement('script');s.src='data/all-data.js?v='+V;s.onload=function(){window.__DATA=window.__DATA_ALL||{};go();};
  s.onerror=function(){var a=document.getElementById('app');if(a)a.innerHTML='<p style="padding:40px 16px;color:#ccc;font:16px system-ui">Не загрузились данные. Проверь интернет и открой ещё раз.</p>';};document.body.appendChild(s);}
if(location.protocol==='file:'){local();return;}
Promise.all(files.map(function(f){return fetch('data/'+f+'.json?v='+V).then(function(r){if(!r.ok)throw new Error('data/'+f+'.json');return r.json();}).then(function(j){Object.assign(window.__DATA,j);});}))
.then(go).catch(local);})();
</script>
</body>
</html>
