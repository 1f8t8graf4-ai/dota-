<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0C0E0F">
<title>Языки по кино</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Golos+Text:wght@400;500;600;700;800&family=Playfair+Display:wght@700&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&family=PT+Mono&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>/* Версия релиза — одна на всё: сбивает кэш у стилей, скриптов и данных (?v=). Поднимай вместе с APP_V в js/app.js. */
var V='12.6';document.write('<link rel="stylesheet" href="styles/main.css?v='+V+'">');</script>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="bgfade" aria-hidden="true"></div>
<div class="topfade"></div>
<div id="app"></div>
<script>
/* Где лежат видео и картинки сцен. После переезда в Cloudflare R2 впиши сюда публичный адрес бакета (см. docs/object-storage.md в репозитории scenes). */
/* Репозиторий scenes публикуется как https://1f8t8graf4-ai.github.io/scenes/, а папки сцен лежат в его корне.
   Код просит адрес вида ASSET_BASE + '/scenes/<сцена>/<файл>', поэтому база — без «/scenes» на конце
   (с ним получалось .../scenes/scenes/... — и ни одно видео не находилось). */
window.ASSET_BASE='https://1f8t8graf4-ai.github.io';
</script>
<script>
/* На ПК тяжёлые эффекты (размытие, бесконечные анимации) выключены — класс lite.
   12.6: 3D-маскот (model-viewer, ~1 МБ с unpkg) больше не грузится на телефонах — Гаврик выключен с 12.5. */
(function(){var desk=!matchMedia('(pointer:coarse)').matches||/Windows NT|Macintosh|X11; Linux x86/.test(navigator.userAgent);
  if(desk)document.documentElement.classList.add('lite');})();
document.write('<script src="js/bg3d.js?v='+V+'"><\/script><script src="js/mascot/mascot-engine.js?v='+V+'"><\/script>');
</script>
<script>
/* Загрузка данных: сначала JSON из папки data, потом код js/app.js.
   Если index.html открыт двойным кликом (file://) и браузер не даёт читать JSON — берём data/all-data.js (те же данные одним файлом). */
(function(){var need=["icons","dota","words","lore-vocab","tips","spy","scenes"],opt=["topics","scenewords","glossary"];window.__DATA={};
function go(){var s=document.createElement('script');s.src='js/app.js?v='+V;document.body.appendChild(s);}
function fail(miss){var a=document.getElementById('app');if(a)a.innerHTML='<p style="padding:40px 16px;color:#ccc;font:16px/1.5 system-ui">Не загрузились данные'+(miss?': <b>'+miss+'</b>. Проверь, что этот файл лежит в папке data в корне репозитория.':'. Проверь интернет и открой ещё раз.')+'</p>';}
function local(miss){var s=document.createElement('script');s.src='data/all-data.js?v='+V;s.onload=function(){window.__DATA=window.__DATA_ALL||{};if(!window.__DATA.SCENES)return fail(miss||'data/scenes.json');go();};s.onerror=function(){fail(miss);};document.body.appendChild(s);}
if(location.protocol==='file:'){local();return;}
var miss='';
Promise.all(need.map(function(f){return fetch('data/'+f+'.json?v='+V).then(function(r){if(!r.ok){miss='data/'+f+'.json';throw 0;}return r.json();}).then(function(j){Object.assign(window.__DATA,j);});}))
.then(function(){return Promise.all(opt.map(function(f){return fetch('data/'+f+'.json?v='+V).then(function(r){return r.ok?r.json():{};}).catch(function(){return {};}).then(function(j){Object.assign(window.__DATA,j);});}));})
.then(go).catch(function(){local(miss);});})();
</script>
</body>
</html>
