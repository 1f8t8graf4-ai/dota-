<title>Кино: три дизайна</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@500;700;900&family=Caveat:wght@600&display=swap">
<style>
:root{--bg:#EEEDEA;--fg:#18181A;--mut:#6E6C68;--line:rgba(20,20,20,.1);--chip:#fff;--acc:#18181A;--acct:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0E10;--fg:#EDEDEF;--mut:#97969C;--line:rgba(255,255,255,.1);--chip:#1B1B1F;--acc:#FFD23F;--acct:#111;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0E10;--fg:#EDEDEF;--mut:#97969C;--line:rgba(255,255,255,.1);--chip:#1B1B1F;--acc:#FFD23F;--acct:#111;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;padding-inline:16px;padding-block:20px 60px;margin:0}
.top{max-width:1500px;margin:0 auto 18px;display:grid;gap:14px}
.top h1{margin:0;font:600 30px/1.1 Lora,Georgia,serif;text-wrap:balance}
.top p{margin:0;color:var(--mut);max-width:70ch}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--fg);font:600 14px/1 inherit;font-family:inherit;padding:10px 14px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--acct)}
.note{max-width:1500px;margin:0 auto 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 22px;border-top:1px solid var(--line);padding-top:14px}
.note div{min-width:0}
.note b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.grid{max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;gap:28px 22px;justify-content:center}
.cap{width:300px;max-width:100%;display:grid;gap:8px}
.cap>span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding-left:6px}
.cap>span i{font-style:normal;color:var(--fg);opacity:.5;margin-right:6px}

/* ===== телефон ===== */
.ph{width:300px;max-width:100%;height:640px;border-radius:42px;padding:8px;background:#000;box-shadow:0 18px 40px rgba(0,0,0,.18);position:relative}
.scr{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--b);color:var(--t);font-family:var(--fui);font-size:13px;line-height:1.4}
.in{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:38px 14px 92px}
.in::-webkit-scrollbar{display:none}
.in.nopad{padding:0 0 92px}
.sb{position:absolute;top:0;left:0;right:0;height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font:600 12px/1 -apple-system,Inter,sans-serif;z-index:9;color:var(--t);pointer-events:none}
.sb.w{color:#fff}
.sb i{width:56px;height:16px;border-radius:9px;background:#000;position:absolute;left:50%;margin-left:-28px;top:9px}
.tb{position:absolute;left:10px;right:10px;bottom:12px;height:58px;border-radius:22px;display:flex;justify-content:space-around;align-items:center;background:var(--tbb);z-index:8;box-shadow:var(--tbs)}
.tb a{display:grid;justify-items:center;gap:3px;font-size:9.5px;color:var(--m);text-decoration:none;font-weight:600;padding:6px 8px;border-radius:14px}
.tb a.on{color:var(--t);background:var(--soft)}
.tb svg{width:20px;height:20px}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.img{background-size:cover;background-position:center}
.ser{font-family:var(--fser)}
.lab{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--m);font-weight:600}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row>.grow{flex:1;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 16px;font:700 14px/1 var(--fui);background:var(--bt);color:var(--btt);width:100%;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--t)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--t)}
.lv{font-size:9.5px;font-weight:800;padding:3px 6px;border-radius:6px;color:#fff;background:var(--lc);letter-spacing:.02em}
.A1{--lc:#2BAE66}.A2{--lc:#7BBF2A}.B1{--lc:#E9A21B}.B2{--lc:#E5632A}.C1{--lc:#C93A5A}
.bar{height:4px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc2);border-radius:inherit;transform-origin:left;transform:scaleX(var(--p));transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.dots{display:inline-flex;gap:3px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--soft2)}.dots i.f{background:var(--ok)}
.spoil{position:relative;cursor:pointer;border-radius:6px;display:inline-block}
.vd{aspect-ratio:16/10;position:relative;background-color:#000}
.spoil::after{content:"";position:absolute;inset:-2px -4px;border-radius:6px;background:radial-gradient(circle,var(--dust) .9px,transparent 1.3px) 0 0/5px 5px,radial-gradient(circle,var(--dust) .7px,transparent 1.1px) 2px 3px/7px 6px,var(--b2);animation:dust 2.4s linear infinite;transition:opacity .35s}
.spoil.op::after{opacity:0;pointer-events:none}
@keyframes dust{to{background-position:5px 5px,9px -3px,0 0}}
.hint{font-size:10.5px;color:var(--m)}
.sec{margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec h3{margin:0;font-size:15px}
.kk span{transition:opacity .25s,color .25s}
.wdk{opacity:.42}
.wnow{color:var(--kara)!important;opacity:1}
.ring{--r:44px;width:var(--r);height:var(--r);border-radius:50%;background:conic-gradient(var(--acc2) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;flex:none}
.ring b{width:calc(var(--r) - 8px);height:calc(var(--r) - 8px);border-radius:50%;background:var(--b);display:grid;place-items:center;font-size:11px;font-weight:800}
.tile{display:inline-flex;padding:9px 12px;border-radius:12px;background:var(--card);box-shadow:0 2px 0 var(--soft2);font-weight:600;cursor:pointer;transition:transform .2s}
.tile:active{transform:translateY(2px)}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:44px}
.slot{min-width:56px;height:38px;border-radius:10px;border:1.5px dashed var(--soft2);display:grid;place-items:center;font-weight:600;padding:0 10px}
.slot.f{border-style:solid;border-color:var(--ok);color:var(--t)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pool .tile.used{opacity:0;pointer-events:none}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;border-radius:24px;background:var(--card);padding:10px 16px 16px;z-index:20;box-shadow:0 -10px 40px rgba(0,0,0,.35);color:var(--t)}
.sheet .hd{width:36px;height:4px;border-radius:4px;background:var(--soft2);margin:0 auto 10px}
.film{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pst{display:grid;gap:5px;min-width:0;cursor:pointer}
.pst .im{aspect-ratio:2/3;border-radius:10px;position:relative;overflow:hidden;max-width:100%}
.pst .im .lv{position:absolute;left:5px;top:5px}
.pst small{font-size:10.5px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rail{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.rail::-webkit-scrollbar{display:none}
.rail .pst{width:84px;flex:none}
.hero-g{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.hr{border-radius:14px;aspect-ratio:3/4;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#fff;cursor:pointer;background:linear-gradient(160deg,var(--h1),var(--h2))}
.hr .mono{position:absolute;inset:0;display:grid;place-items:center;font:900 34px/1 var(--fhead,Inter);opacity:.28;letter-spacing:-.04em}
.hr b{font-size:11.5px;position:relative}.hr small{font-size:9.5px;opacity:.8;position:relative;line-height:1.2}
.hr.soon{background:var(--soft);color:var(--m)}
.wk{display:flex;gap:6px;align-items:flex-end;height:58px}
.wk div{flex:1;display:grid;gap:4px;justify-items:center;font-size:9px;color:var(--m)}
.wk div i{width:100%;border-radius:5px;background:var(--acc2);height:calc(var(--h)*1px);transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.wk div.no i{background:var(--soft)}
@keyframes grow{from{transform:scaleY(0)}}
.ln{padding:11px 0;border-bottom:1px solid var(--ln)}
.ln:last-child{border-bottom:0}
.pp{position:absolute;inset:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== Версия 1 — «Клауд» ===== */
.v1 .scr{--fui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,sans-serif;--fser:Lora,Georgia,serif}
.v1 .scr.L{--b:#F3F2EF;--b2:#E6E4DF;--card:#fff;--t:#141414;--m:#7A776F;--ln:rgba(0,0,0,.07);--soft:rgba(0,0,0,.06);--soft2:rgba(0,0,0,.16);--acc2:#141414;--bt:#141414;--btt:#fff;--ok:#1E9E5A;--kara:#B58300;--dust:rgba(0,0,0,.55);--tbb:rgba(255,255,255,.96);--tbs:0 6px 24px rgba(0,0,0,.08);--mk:#FFE36B}
.v1 .scr.D{--b:#121214;--b2:#1F1F23;--card:#1C1C1F;--t:#F2F2F3;--m:#8E8D93;--ln:rgba(255,255,255,.07);--soft:rgba(255,255,255,.07);--soft2:rgba(255,255,255,.2);--acc2:#FFD23F;--bt:#FFD23F;--btt:#111;--ok:#36C47A;--kara:#FFD23F;--dust:rgba(255,255,255,.6);--tbb:#1C1C1F;--tbs:0 6px 24px rgba(0,0,0,.4);--mk:rgba(255,210,63,.35)}
.v1 .mk{background:linear-gradient(transparent 55%,var(--mk) 55%);padding:0 2px}
.v1 .hh{border-radius:22px;overflow:hidden;position:relative;aspect-ratio:4/5;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
.v1 .hh .img{position:absolute;inset:-6%;animation:kb 18s ease-in-out infinite alternate}
.v1 .hh::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.82));z-index:1}
.v1 .hh>*:not(.img){position:relative;z-index:2}
@keyframes kb{to{transform:scale(1.08) translate(-2%,-1%)}}
.v1 .pull{margin-top:12px;height:50px;border-radius:16px;background:rgba(255,255,255,.16);position:relative;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12.5px}
.v1 .pull i{position:absolute;left:5px;top:5px;width:40px;height:40px;border-radius:12px;background:#FFD23F;display:grid;place-items:center;color:#111;animation:nudge 2.6s ease-in-out infinite}
@keyframes nudge{0%,60%,100%{transform:none}75%{transform:translateX(18px)}}
.v1 .card{background:var(--card);border-radius:18px;padding:14px}
.v1 .say{font:500 17px/1.35 var(--fser)}
.v1 .say i{font-style:italic}
.v1 .seg2{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.v1 .seg2 button{flex:1;border:0;background:none;color:var(--m);font:600 11.5px/1 var(--fui);padding:8px 2px;border-radius:9px;cursor:pointer}
.v1 .seg2 button.on{background:var(--card);color:var(--t);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.v1 .eprow{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;background:var(--card)}
.v1 .eprow+.eprow{margin-top:8px}
.v1 .eprow .th{width:74px;height:46px;border-radius:9px;flex:none;position:relative;overflow:hidden}
.v1 .eprow.cur{box-shadow:0 0 0 1.5px var(--acc2)}
.v1 .eprow.lock .th{filter:grayscale(1) blur(2px);opacity:.5}
.v1 .eprow.lock{opacity:.6}
.v1 .st{color:#E9A21B;font-size:11px;letter-spacing:1px}
.v1 .pl .vd{aspect-ratio:16/10;position:relative;border-radius:0}
.v1 .sub{position:absolute;left:10px;right:10px;bottom:16px;text-align:center;color:#fff;font:700 15px/1.3 var(--fui);text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.6)}
.v1 .sub .tr{display:block;font:500 11.5px/1.3 var(--fui);opacity:.85;margin-top:4px}
.v1 .tl{height:4px;border-radius:3px;background:rgba(255,255,255,.18);position:relative;margin:12px 0 6px}
.v1 .tl b{position:absolute;left:0;top:0;bottom:0;width:58%;background:#fff;border-radius:3px}
.v1 .tl u{position:absolute;top:-3px;width:4px;height:10px;border-radius:2px;background:#FFD23F}
.v1 .opt{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--card);margin-top:8px;cursor:pointer;font-weight:500}
.v1 .opt .rd{width:18px;height:18px;border-radius:50%;border:1.6px solid var(--soft2);flex:none;display:grid;place-items:center}
.v1 .opt.ok{box-shadow:0 0 0 1.5px var(--ok)}.v1 .opt.ok .rd{background:var(--ok);border-color:var(--ok);color:#fff}
.v1 .opt.x{opacity:.45;text-decoration:line-through}
.v1 .segs{display:flex;gap:4px;flex:1}.v1 .segs i{flex:1;height:4px;border-radius:3px;background:var(--soft)}.v1 .segs i.f{background:var(--acc2)}
.v1 .mc{display:flex;gap:11px;align-items:center;padding:10px;background:var(--card);border-radius:16px}
.v1 .mc+.mc{margin-top:8px}
.v1 .mc .th{width:62px;height:62px;border-radius:12px;flex:none}
.v1 .stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.v1 .stat3>div{background:var(--card);border-radius:14px;padding:10px;display:grid;gap:2px}
.v1 .stat3 b{font-size:20px;font-variant-numeric:tabular-nums}
.v1 .stat3 small{font-size:10px;color:var(--m)}
.v1 .dl{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}
.v1 .dl:last-child{border:0}
.v1 .dl .cb{width:3px;border-radius:3px;background:var(--lc,var(--acc2));flex:none}
.v1 .pf{border-radius:22px;overflow:hidden;position:relative;height:200px;display:flex;align-items:flex-end;padding:14px;color:#fff}
.v1 .pf::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.75));z-index:1}
.v1 .pf>*{position:relative;z-index:2}
.v1 .pf>.pp{position:absolute;z-index:0}
.v1 .ava{width:54px;height:54px;border-radius:50%;background:#E5632A;display:grid;place-items:center;font:700 22px/1 var(--fui);border:2.5px solid #FFD23F;flex:none}
.v1 .list{background:var(--card);border-radius:18px;padding:0 14px}
.v1 .list .ln{display:flex;gap:10px;align-items:center}

/* ===== Версия 2 — «Минимал» ===== */
.v2 .scr{--fui:Inter,-apple-system,"Segoe UI",sans-serif;--fser:Lora,Georgia,serif}
.v2 .scr.L{--b:#FFFFFF;--b2:#F1F1F1;--card:#fff;--t:#0F0F10;--m:#8C8C90;--ln:#EDEDED;--soft:#F2F2F3;--soft2:#DCDCDE;--acc2:#2350F5;--bt:#0F0F10;--btt:#fff;--ok:#1E9E5A;--kara:#2350F5;--dust:rgba(0,0,0,.5);--tbb:#fff;--tbs:0 0 0 1px #EDEDED}
.v2 .scr.D{--b:#0A0A0B;--b2:#1A1A1C;--card:#0A0A0B;--t:#F3F3F4;--m:#86868C;--ln:#1E1E21;--soft:#18181B;--soft2:#2E2E33;--acc2:#7C95FF;--bt:#F3F3F4;--btt:#0A0A0B;--ok:#3CCB7F;--kara:#7C95FF;--dust:rgba(255,255,255,.55);--tbb:#0A0A0B;--tbs:0 0 0 1px #1E1E21}
.v2 .tb{left:0;right:0;bottom:0;border-radius:0;height:66px;padding-bottom:8px}
.v2 .tb a.on{background:none;color:var(--acc2)}
.v2 h2{font:800 28px/1.05 var(--fui);letter-spacing:-.03em;margin:4px 0 14px}
.v2 .big{font:800 44px/1 var(--fui);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.v2 .ln{display:flex;align-items:center;gap:12px}
.v2 .go{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.v2 .go .grow{flex:1;min-width:0}
.v2 .go b{display:block;font-size:15px;letter-spacing:-.01em}
.v2 .go small{color:var(--m);font-size:11.5px}
.v2 .arr{color:var(--m)}
.v2 .acc{color:var(--acc2)}
.v2 .cta{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--bt);color:var(--btt);cursor:pointer}
.v2 .cta .th{width:46px;height:46px;border-radius:10px;flex:none}
.v2 .cta b{display:block;font-size:15px}.v2 .cta small{opacity:.65;font-size:11.5px}
.v2 .tabs{display:flex;gap:13px;border-bottom:1px solid var(--ln);margin-bottom:4px;overflow-x:auto;scrollbar-width:none}
.v2 .tabs button{border:0;background:none;padding:10px 0;font:700 13px/1 var(--fui);color:var(--m);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.v2 .tabs button.on{color:var(--t);border-color:var(--t)}
.v2 .sm{width:38px;height:54px;border-radius:6px;flex:none}
.v2 .num{font-variant-numeric:tabular-nums;color:var(--m);font-size:12px;font-weight:600}
.v2 .ph1{font:500 17px/1.35 var(--fser)}
.v2 .vd{aspect-ratio:16/10;border-radius:0}
.v2 .sub2{padding:16px 14px 6px;font:600 18px/1.35 var(--fui);letter-spacing:-.01em}
.v2 .tl{height:2px;background:var(--soft2);position:relative;margin:0 14px}
.v2 .tl b{position:absolute;left:0;top:0;bottom:0;width:58%;background:var(--t)}
.v2 .tl u{position:absolute;top:-3px;width:2px;height:8px;background:var(--acc2)}
.v2 .opt{padding:14px 0;border-bottom:1px solid var(--ln);display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:500}
.v2 .opt.ok{color:var(--ok);font-weight:700}
.v2 .wkn{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:10px;color:var(--m)}
.v2 .wkn i{display:block;width:8px;height:8px;border-radius:50%;margin:6px auto 0;background:var(--soft2)}.v2 .wkn i.f{background:var(--acc2)}
.v2 .hrt{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.v2 .hrt .mn{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:11px;color:#fff;background:var(--h1)}
.v2 .lvl{display:grid;grid-template-columns:28px 1fr 32px;gap:10px;align-items:center;padding:7px 0;font-size:12px}
.v2 .lvl .bar{height:6px}

/* ===== Версия 3 — «Макс» ===== */
.v3 .scr{--fui:Inter,-apple-system,sans-serif;--fser:Lora,Georgia,serif;--fhead:Unbounded,Inter,sans-serif}
.v3 .scr.D{--b:#07060B;--b2:#16131F;--card:#14111C;--t:#FFF6E6;--m:#A79FB6;--ln:rgba(255,255,255,.08);--soft:rgba(255,255,255,.08);--soft2:rgba(255,255,255,.22);--acc2:#FFC94A;--acc3:#FF3D7F;--bt:linear-gradient(100deg,#FFC94A,#FF7A3D 55%,#FF3D7F);--btt:#1A0B00;--ok:#39F59A;--kara:#FFC94A;--dust:rgba(255,220,150,.75);--tbb:rgba(20,17,28,.98);--tbs:0 0 0 1px rgba(255,201,74,.25),0 10px 30px rgba(0,0,0,.6);--glow:0 0 22px rgba(255,201,74,.55)}

  <div class="card" style="padding:0 14px">${fg.map(x=>`<div class="dl" style="--lc:${x[2].includes('просроч')?'#E5632A':'#E9A21B'}"><span class="cb"></span><div class="grow" style="flex:1;min-width:0"><div class="ser" style="font-size:15px">${x[0]}</div><div class="hint">${x[1]} · ${x[2]}</div></div>${dots(x[3])}</div>`).join('')}</div>
  <div class="sec"><h3>По фильмам</h3></div>
  <div class="rail">${[['wolf','Волк',.38],['sopranos','Сопрано',.33],['psycho','Психопат',.58],['durov','Дуров',.22]].map(([k,n,p])=>`<div class="pst"><div class="im img" ${P('p_'+k)}></div><small>${n} · ${Math.round(p*100)}%</small><div class="bar"><i style="--p:${p}"></i></div></div>`).join('')}</div>
 </div>${tb('dict')}`}};

SCR.game={n:'Игра: таблица героев',f(v){
 const H=HEROES.concat([['Скоро','',0,'','','?']]);
 if(v==='v2')return `${sb()}<div class="in"><div class="row" style="color:var(--m)">${ic('back')}<span>Игры</span></div><h2 style="margin-top:8px">Deadlock</h2><div class="hint" style="margin:-8px 0 12px">5 героев · 85 фраз · собрано 12</div>
  ${HEROES.map(h=>`<div class="hrt" data-hero><span class="mn" style="--h1:${h[3]}">${h[5]}</span><div style="min-width:0"><b>${h[0]}</b><div class="hint">${h[1]}</div></div><span class="num">${h[2]}</span></div>`).join('')}
 </div>${tb('film')}`;
 return `${sb(1)}<div class="in nopad"><div style="height:170px;position:relative;overflow:hidden;background:linear-gradient(160deg,#C9772B,#2A1408 70%)"><div style="position:absolute;inset:0;display:grid;place-items:center;font:900 ${v==='v3'?34:44}px/1 ${v==='v3'?'var(--fhead)':'Inter'};color:rgba(255,255,255,.14);letter-spacing:-.04em">DEADLOCK</div><div style="position:absolute;left:14px;bottom:12px;color:#fff"><div style="font:${v==='v3'?'900 24px/1 var(--fhead)':'800 24px/1 Inter'};${v==='v3'?'text-transform:uppercase':''}">Deadlock</div><div style="font-size:11.5px;opacity:.8;margin-top:4px">5 героев · 85 фраз · собрано 12</div></div></div>
  <div style="padding:14px"><div class="row" style="justify-content:space-between;margin-bottom:10px"><b>Герои</b><span class="hint">по фразам ▾</span></div>
  <div class="hero-g">${H.map(h=>h[0]==='Скоро'?`<div class="hr soon"><div class="mono">?</div><b>Скоро</b><small>новые герои</small></div>`:`<div class="hr" data-hero style="--h1:${h[3]};--h2:${h[4]}">${v==='v3'?'<span class="rar"></span>':''}<div class="mono">${h[5]}</div><b>${h[0]}</b><small>${h[2]} фраз</small></div>`).join('')}</div>
  <div class="hint" style="margin-top:12px">Герой → его диалоги. Собранные фразы идут в общий Словарь и в повторение.</div></div>
 </div>${tb('film')}`}};

SCR.hero={n:'Герой: его фразы',f(v){
 const L=[['Rat King',"Well, well. A priest with a boomstick. Come to confess, old man?","Так-так. Священник со стволом. Исповедаться пришёл, старик?"],['Venator',"I hunt what crawls out of the abyss. You reek of it, rat.","Я охочусь на то, что выползает из бездны. От тебя несёт ею, крыса."],['Rat King',"Heh. My rats smell better than your heaven does.","Хе. Мои крысы пахнут лучше твоего рая."]];
 const voc=['boomstick — ствол','reek of — смердеть','crawl out — выползать'];
 const rows=L.map((x,i)=>`<div class="${v==='v2'?'go':'ln'}" style="display:block"><div class="lab" style="color:${x[0]==='Rat King'?'#7BBF2A':'#E5632A'}">${x[0]}</div><div class="row" style="align-items:flex-start;margin-top:3px"><div class="grow" style="flex:1;min-width:0"><div class="ser" style="font-size:15px">${x[1]}</div><div style="margin-top:4px"><span class="spoil" data-sp style="font-size:12px;color:var(--m)">${x[2]}</span></div></div><span style="width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none">${ic('sound')}</span></div></div>`).join('');
 const head=v==='v2'?`<div class="row" style="color:var(--m)">${ic('back')}<span>Deadlock</span></div><h2 style="margin-top:8px">Rat King</h2><div class="hint" style="margin:-8px 0 8px">Крысиный босс мафии · 21 фраза · собрано 4</div>`
 :`<div style="height:150px;position:relative;margin:-38px -14px 12px;background:linear-gradient(160deg,#4B6B2A,#1E2A12);color:#fff;padding:14px;display:flex;flex-direction:column;justify-content:flex-end"><div style="position:absolute;right:10px;top:30px;font:900 70px/1 ${v==='v3'?'var(--fhead)':'Inter'};opacity:.2">RK</div><div style="font:${v==='v3'?'900 22px/1 var(--fhead);text-transform:uppercase':'800 22px/1 Inter'}">Rat King</div><div style="font-size:11.5px;opacity:.8;margin-top:4px">Крысиный босс мафии · 21 фраза · собрано 4</div></div>`;
 return `${sb(v!=='v2')}<div class="in">${head}
  <div class="lab" style="margin:6px 0 2px">Встреча с Венатором · 1 из 6</div>${v==='v1'?`<div class="card" style="padding:0 14px">${rows}</div>`:rows}
  <div class="lab" style="margin:14px 0 6px">Слова</div><div class="row" style="flex-wrap:wrap;gap:6px">${voc.map(w=>`<span class="chip">${w}</span>`).join('')}</div>
  <button class="btn" style="margin-top:16px">Тренировать героя · 4</button>
 </div>${tb('film')}`}};

SCR.prof={n:'Профиль',f(v){
 const stats=[['23','эпизода'],['182','фразы'],['46','слов'],['3','фона']];
 if(v==='v2')return `${sb()}<div class="in"><div class="row" style="gap:12px;margin:8px 0 16px"><span style="width:52px;height:52px;border-radius:50%;background:#E5632A;color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px">А</span><div><b style="font-size:20px">Андрей</b><div class="hint">B1 · с 3 октября · 🔥 6</div></div></div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px">${stats.map(s=>`<div><div style="font:800 22px/1 var(--fui);font-variant-numeric:tabular-nums">${s[0]}</div><div class="hint">${s[1]}</div></div>`).join('')}</div>
  ${[['Премиум','7 дней бесплатно'],['Коллекция','фоны, карточки, кадры'],['Билеты','1 240'],['Игры','Deadlock'],['Настройки','']].map(x=>`<div class="go"><div class="grow"><b>${x[0]}</b></div><span class="num">${x[1]}</span><span class="arr">${ic('fwd')}</span></div>`).join('')}
 </div>${tb('user')}`;
 if(v==='v3')return `${sb(1)}<div class="in" style="padding-top:40px"><div class="pfx"><div class="img" ${P('bd_titanic')}></div><div class="row" style="gap:10px"><span class="ava" style="width:56px;height:56px;border-radius:50%;background:#E5632A;display:grid;place-items:center;font:900 22px/1 var(--fhead);border:3px solid #FFC94A">А</span><div><div style="font:900 20px/1 var(--fhead);text-transform:uppercase">Андрей</div><div style="font-size:11px;opacity:.85;margin-top:4px">🏆 Весь фильм · Титаник</div></div></div></div>
  <div class="meter" style="margin:12px 0;grid-template-columns:repeat(4,1fr)">${stats.map(s=>`<div><b>${s[0]}</b><small>${s[1]}</small></div>`).join('')}</div>
  <div class="hd3" style="font-size:14px">Достижения · 5 / 24</div>
  <div class="ach">${['🎬','🔥','🐺','⚔️','👑','🎟','🧠','🌍'].map((e,i)=>`<div class="${i<5?'on':''}">${i<5?e:'🔒'}</div>`).join('')}</div>
  <div style="margin-top:12px"><button class="btn">${ic('crown')}Премиум · 7 дней даром</button></div>
 </div>${tb('user')}`;
 return `${sb(1)}<div class="in" style="padding-top:40px"><div class="pf"><div class="img pp" ${P('bd_titanic')}></div><div class="row" style="gap:10px;width:100%"><span class="ava">А</span><div class="grow" style="flex:1"><b style="font-size:19px">Андрей</b><div style="font-size:11px;opacity:.85">B1 · 🔥 6</div></div><span class="chip" style="background:rgba(255,255,255,.2);color:#fff">Сменить фон</span></div></div>
  <div class="stat3" style="grid-template-columns:repeat(4,1fr);margin:10px 0">${stats.map(s=>`<div><b>${s[0]}</b><small>${s[1]}</small></div>`).join('')}</div>
  <div class="list">${[['crown','Премиум','7 дней бесплатно'],['star','Коллекция','3 фона'],['ticket','Билеты','1 240'],['game','Игры','Deadlock'],['gear','Настройки','']].map(x=>`<div class="ln">${ic(x[0])}<b class="grow" style="flex:1">${x[1]}</b><span class="hint">${x[2]}</span>${ic('fwd')}</div>`).join('')}</div>
 </div>${tb('user')}`}};

const ORDER=['today','kino','scene','player','task','dict','prog','game','hero','prof'];
const NOTE={
 v1:[['Откуда','Netflix — кадр главный и ряды постеров; Germanize — одна фраза-план, перевод под пылью, засечки у реплик; Duolingo — кольцо и серия; Letterboxd — постеры с уровнем.'],['Почему так','Ты пришёл смотреть кино: кадр крупно, одна главная кнопка, всё остальное тихо. Шрифт системный, жёлтый — только у главного (как субтитры).'],['Слабое','Держится на хороших кадрах. Перевод под спойлером — лишний тап для тех, кто хочет сразу.']],
 v2:[['Откуда','Things 3, Linear, Apple Music (списки), Readwise. Крупные цифры и списки с тонкими линиями.'],['Почему так','Не пусто: на каждом экране сразу контент и следующий шаг — «Продолжить», 3 фразы на повтор, фраза дня. Всё в один тап, ничего не надо искать.'],['Слабое','Меньше «кино» и вау. Постеры мелкие, фильм не продаёт себя сам.']],
 v3:[['Откуда','Netflix-превью, Marvel Snap и Hearthstone (карты, голограмма), Balatro (сочность), Spotify Wrapped (крупные цифры), афиши кинотеатров.'],['Почему так','Всё празднует: билеты, огонь серии, эпизоды плёнкой, «горят» фразы, достижения. Затягивает как игра.'],['Слабое','Тяжело и шумно. Анимации только transform/opacity, иначе на iPhone лаги. Сложнее держать одним стилем.']]
};
function render(){
 document.querySelectorAll('#sv button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.v));
 document.querySelectorAll('#st button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.t));
 document.getElementById('note').innerHTML=NOTE[S.v].map(([a,b])=>`<div><b>${a}</b>${b}</div>`).join('');
 const g=document.getElementById('grid');g.className='grid '+S.v;
 g.innerHTML=ORDER.map((k,i)=>`<div class="cap"><span><i>${String(i+1).padStart(2,'0')}</i>${SCR[k].n}</span><div class="ph"><div class="scr ${S.t}" data-k="${k}">${SCR[k].f(S.v)}</div></div></div>`).join('');
 try{localStorage.setItem('kd3',JSON.stringify({v:S.v,t:S.t}))}catch(e){}
}
function re(k){const el=document.querySelector(`.scr[data-k="${k}"]`);if(el)el.innerHTML=SCR[k].f(S.v);}
document.getElementById('sv').onclick=e=>{const b=e.target.closest('button');if(b){S.v=b.dataset.v;S.tiles=[];render()}};
document.getElementById('st').onclick=e=>{const b=e.target.closest('button');if(b){S.t=b.dataset.t;render()}};
document.getElementById('grid').addEventListener('click',e=>{
 const sp=e.target.closest('[data-sp]');if(sp){sp.classList.toggle('op');return}
 const c=e.target.closest('[data-cats] [data-c]');if(c){S.cat[S.v]=c.dataset.c;re('kino');return}
 const t=e.target.closest('[data-tile]');if(t&&S.tiles.length<4&&!S.tiles.includes(t.dataset.tile)){S.tiles.push(t.dataset.tile);re('task');return}
 if(e.target.closest('[data-reset]')){S.tiles=[];re('task');return}
 const w=e.target.closest('.kk [data-w]');if(w){const box=w.closest('.kk');box.querySelectorAll('[data-w]').forEach(x=>{const i=+x.dataset.w,k=+w.dataset.w;x.classList.toggle('wdk',i>k);x.classList.toggle('wnow',i===k)});const sh=w.closest('.scr').querySelector('[data-sheet] b');if(sh)sh.textContent=w.textContent.replace(/[.,]/g,'');return}
 const h=e.target.closest('[data-hero]');if(h){const el=document.querySelector('.scr[data-k="hero"]');if(el){el.closest('.cap').scrollIntoView({behavior:'smooth',block:'center'});el.animate([{transform:'scale(.97)'},{transform:'none'}],{duration:400,easing:'cubic-bezier(.2,.8,.2,1)'})}}
});
render();
</script>
