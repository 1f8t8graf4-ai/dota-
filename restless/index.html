<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Restless · Deadlock</title>
<meta name="description" content="Restless — статистика Deadlock как League of Graphs: профиль, матчи с предметами и всеми игроками, оценки S+…D−, лайв-матч как Porofessor, мета, лидеры, сборки с винрейтом, патчноуты">
<meta name="theme-color" content="#09090b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>

/* Restless 2.0 — приложение: шапка с вкладками и поиском игрока, ниже экран вкладки.
   Чёрный, янтарный акцент, заголовки Oswald капсом (как у Deadlock Labs), цифры моноширинные, метки игроков цветными плашками. */
:root{
 --bg:#09090b; --s1:#111115; --s2:#17171c; --s3:#1f1f26; --ln:#26262e; --ln2:#33333d;
 --tx:#f2ede4; --mu:#8e897f; --mu2:#6a665e; --ac:#ffb020; --acd:#1c1303; --hot:#ff5a1f;
 --win:#39d17f; --loss:#ff5050; --us:#ffb020; --en:#4da3ff; --r:14px;
 --f:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --h:'Oswald','Arial Narrow',Impact,sans-serif; --m:'JetBrains Mono',ui-monospace,Consolas,monospace;
 color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--f);-webkit-text-size-adjust:100%}
body{min-height:100vh}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
img{display:block}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.num,.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.win{color:var(--win)}.loss{color:var(--loss)}.mu{color:var(--mu)}
.hide{display:none!important}

/* шапка */
.nav{position:sticky;top:0;z-index:30;background:rgba(9,9,11,.92);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
.nav .in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:18px;height:62px;padding:0 max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px))}
.logo{font:700 24px/1 var(--h);letter-spacing:.07em;color:var(--ac);text-decoration:none;white-space:nowrap}
.logo small{display:block;font:600 9.5px/1 var(--f);letter-spacing:.18em;color:var(--mu);margin-top:3px}
.tabs{display:flex;gap:2px;height:100%}
.tabs a{display:flex;align-items:center;gap:8px;padding:0 14px;text-decoration:none;font:600 13.5px/1 var(--f);color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--tx)}
.tabs a.on{color:var(--tx);border-bottom-color:var(--ac)}
.tabs a .dot{width:7px;height:7px;border-radius:50%;background:var(--win);box-shadow:0 0 8px var(--win)}
.sp{flex:1}
.srch{position:relative;width:min(320px,34vw)}
.srch input{width:100%;height:38px;border-radius:10px;border:1px solid var(--ln2);background:var(--s1);padding:0 12px 0 36px;font-size:13.5px}
.srch svg{position:absolute;left:11px;top:11px;width:16px;height:16px;opacity:.55}
.srch .dd{position:absolute;top:44px;left:0;right:0;background:var(--s2);border:1px solid var(--ln2);border-radius:12px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.6);max-height:60vh;overflow:auto}
.srch .dd button{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;padding:7px;border-radius:8px}
.srch .dd button:hover,.srch .dd button.on{background:var(--s3)}
.srch .dd img{width:32px;height:32px;border-radius:50%;background:var(--s3)}
.srch .dd b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch .dd small{color:var(--mu);font-size:11.5px}
.me{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border-radius:24px;background:var(--s1);border:1px solid var(--ln);max-width:240px;text-decoration:none}
.me img.av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--s3)}
.me b{font:600 13px/1.1 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:120px}
.me span{font-size:11px;color:var(--mu);white-space:nowrap}
.me .rk{width:28px;height:28px}
@media (max-width:860px){.nav .in{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:0;gap:10px}.tabs{order:3;width:100%;overflow-x:auto;height:44px}.srch{width:auto;flex:1}.me b{max-width:80px}.logo small{display:none}}

/* страница */
.wrap{max-width:1280px;margin:0 auto;padding:22px max(18px,env(safe-area-inset-right,0px)) 70px max(18px,env(safe-area-inset-left,0px))}
.h1{font:700 34px/1.05 var(--h);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.h1 em{font-style:normal;color:var(--ac)}
.h2{display:flex;align-items:baseline;gap:10px;font:600 15px/1 var(--h);letter-spacing:.1em;text-transform:uppercase;color:var(--tx);margin:28px 0 12px}
.h2 small{font:500 12.5px/1 var(--f);letter-spacing:0;text-transform:none;color:var(--mu)}
.h2 .sp{flex:1}
.sub{color:var(--mu);font-size:13.5px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);min-width:0}
.pad{padding:16px 18px}
.row{display:flex;align-items:center;gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:980px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.h1{font-size:28px}}
.load{padding:40px 0;color:var(--mu);display:flex;align-items:center;gap:12px}
.load::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--ln2);border-top-color:var(--ac);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{padding:14px 16px;border-radius:12px;background:#2a1212;color:#ffb3ab;font-size:14px}
.empty{padding:18px;color:var(--mu);font-size:14px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;background:var(--ac);color:var(--acd);font:700 14px/1 var(--f);text-decoration:none;white-space:nowrap}
.btn.g{background:var(--s3);color:var(--tx);border:1px solid var(--ln2)}
.btn.s{height:34px;padding:0 12px;font-size:13px}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 11px;border-radius:7px;font:600 12.5px/1 var(--f);color:var(--mu);white-space:nowrap}
.seg button.on{background:var(--s3);color:var(--tx)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font:700 10.5px/1 var(--f);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;background:var(--s3);color:#d6d1c7}
.tag.a{background:#3a2a07;color:var(--ac)}.tag.g{background:#0f3321;color:var(--win)}.tag.r{background:#3a1212;color:#ff8a80}.tag.b{background:#0f2440;color:#8cc4ff}.tag.h{background:var(--hot);color:#1a0800}
.hi{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--s3);flex:none}
.hi.s{width:28px;height:28px;border-radius:6px}.hi.l{width:56px;height:56px;border-radius:12px}
.rk{width:36px;height:36px;object-fit:contain;flex:none}
.bar{height:6px;border-radius:3px;background:var(--s3);overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;border-radius:3px}

/* главная без игрока */
.land{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--ln);background:radial-gradient(900px 420px at 85% 0%,rgba(255,176,32,.16),transparent 60%),linear-gradient(180deg,#141418,#0d0d10);padding:42px 34px}
.land .h1{font-size:clamp(34px,5vw,58px);max-width:15ch}
.land p{max-width:58ch;color:#c9c3b8;font-size:16px;margin:14px 0 22px}
.land form{display:flex;gap:10px;max-width:620px;flex-wrap:wrap}
.land input{flex:1;min-width:220px;height:48px;border-radius:12px;border:1px solid var(--ln2);background:#0b0b0e;padding:0 16px;font-size:15px}
.land .btn{height:48px}
.land .ex{margin-top:14px;font-size:13.5px;color:var(--mu)}
.land .ex button{color:var(--ac);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.land .art{position:absolute;right:-20px;bottom:-30px;display:flex;gap:10px;opacity:.9;pointer-events:none}
.land .art img{width:118px;height:236px;object-fit:cover;border-radius:12px;transform:rotate(-6deg);box-shadow:0 20px 40px rgba(0,0,0,.6)}
.land .art img:nth-child(2){transform:rotate(3deg) translateY(-26px)}.land .art img:nth-child(3){transform:rotate(9deg) translateY(-6px)}
@media (max-width:980px){.land .art{display:none}.land{padding:28px 20px}}
.feat a{display:block;text-decoration:none;padding:16px 18px}
.feat b{display:block;font:600 18px/1.1 var(--h);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.feat span{color:var(--mu);font-size:13.5px}
.feat a:hover{background:var(--s2)}

/* дашборд */
.prof{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px 20px}
.prof .av{width:76px;height:76px;border-radius:16px;object-fit:cover;background:var(--s3)}
.prof .nm{font:700 30px/1.05 var(--h);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof .rkb{display:flex;align-items:center;gap:12px;text-align:right}
.prof .rkb .rk{width:64px;height:64px}
.prof .rkb b{display:block;font:700 22px/1 var(--h);letter-spacing:.03em}
@media (max-width:640px){.prof{grid-template-columns:auto minmax(0,1fr)}.prof .rkb{grid-column:1/-1;text-align:left}.prof .av{width:56px;height:56px}.prof .nm{font-size:22px}}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat span{font:600 11px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.stat b{font:700 28px/1.05 var(--m)}
.stat small{color:var(--mu);font-size:12.5px}
.traj{display:flex;gap:4px;flex-wrap:wrap}
.traj a{width:24px;height:30px;border-radius:5px;display:grid;place-items:center;font:700 11px var(--m);text-decoration:none}
.traj a.w{background:#0f3321;color:var(--win)}.traj a.l{background:#3a1212;color:var(--loss)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:120px;padding-top:6px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wk i{display:block;width:100%;max-width:34px;border-radius:5px 5px 2px 2px;background:var(--win)}
.wk i.l{background:var(--loss)}.wk i.n{background:var(--s3)}
.wk small{font:600 10.5px/1 var(--m);color:var(--mu)}
.wk em{font:700 11px/1 var(--m);font-style:normal}
.pool a{display:grid;grid-template-columns:40px minmax(0,1fr) 90px 52px;gap:12px;align-items:center;padding:9px 14px;text-decoration:none;border-top:1px solid var(--ln)}
.pool a:first-child{border-top:0}
.pool a:hover{background:var(--s2)}
.pool b{display:block;font-weight:600;font-size:14px}
.pool small{color:var(--mu);font-size:12px}
.pool .wr{font:700 15px/1 var(--m);text-align:right}
.mt{display:grid;grid-template-columns:4px 40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px 10px 0;text-decoration:none;border-top:1px solid var(--ln)}
.mt:first-child{border-top:0}
.mt:hover{background:var(--s2)}
.mt .st{height:100%;border-radius:0 3px 3px 0}
.mt .k{font:700 15px/1.2 var(--m)}
.mt .r{text-align:right;font-size:12.5px;color:var(--mu)}
.mt .r b{display:block;font:600 14px/1.2 var(--h);letter-spacing:.06em}
.mt .dl{font:700 12px var(--m)}

/* лобби */
.lob{overflow-x:auto}
.lob table{width:100%;border-collapse:collapse;min-width:820px}
.lob th{font:700 10.5px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-align:left;padding:10px 12px;border-bottom:1px solid var(--ln)}
.lob td{padding:9px 12px;border-bottom:1px solid var(--ln);vertical-align:middle;font-size:13.5px}
.lob tr:last-child td{border-bottom:0}
.lob tr.mine td{background:rgba(255,176,32,.07)}
.lob tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--ac)}
.lob tr.thr td{background:rgba(255,90,31,.08)}
.lob tr.thr td:first-child{box-shadow:inset 3px 0 0 var(--hot)}
.lob tr.en{cursor:pointer}
.lob tr.en:hover td,.lob tr.sel td{background:var(--s2)}
.lob .pn{display:flex;align-items:center;gap:10px;min-width:0}
.lob .pn b{display:block;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.lob .pn small{display:block;color:var(--mu);font-size:11.5px}
.lob .av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--s3);flex:none}
.lob .rkc{display:flex;align-items:center;gap:8px;white-space:nowrap}
.lob .rkc .rk{width:30px;height:30px}
.lob .wr{font:700 14px/1 var(--m)}
.lob .tags{display:flex;flex-wrap:wrap;gap:4px}
.thd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:12px 14px;border-bottom:1px solid var(--ln)}
@media (max-width:640px){.thd .hint{display:none}.g4.st{grid-template-columns:repeat(2,minmax(0,1fr))}.stat b{font-size:22px}}
.thd b{font:600 15px/1 var(--h);letter-spacing:.08em;text-transform:uppercase}
.thd i{width:10px;height:10px;border-radius:3px}
.cnt{padding:14px 16px;display:grid;gap:10px}
.cr{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center}
.cr .its{display:flex;flex-wrap:wrap;gap:6px}
.cr.fl{animation:fl 1.4s ease-out}
@keyframes fl{0%,40%{background:rgba(255,176,32,.14)}100%{background:transparent}}
.cr{border-radius:10px;padding:4px}
.crn{font:600 13px/1 var(--f);text-decoration:none;min-width:96px;margin-right:4px}
.crn:hover{color:var(--ac)}
.it{display:inline-flex;align-items:center;gap:7px;padding:5px 8px 5px 5px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);font:600 12.5px/1 var(--f);white-space:nowrap}
.it img{width:24px;height:24px;border-radius:5px;background:var(--s3)}
.it em{font:700 12px/1 var(--m);font-style:normal;color:var(--win)}
.it em.l{color:var(--loss)}
.note{font-size:12.5px;color:var(--mu);margin:8px 0 0}

/* герои: мета */
.tl{display:grid;grid-template-columns:64px minmax(0,1fr);border-top:1px solid var(--ln)}
.tl:first-child{border-top:0}
.tl .t{display:grid;place-items:center;font:700 30px/1 var(--h)}
.tl .hs{display:flex;flex-wrap:wrap;gap:8px;padding:12px;min-width:0}
.hc{display:flex;flex-direction:column;width:92px;text-decoration:none;border-radius:10px;overflow:hidden;background:var(--s2);border:1px solid var(--ln)}
.hc:hover{border-color:var(--ac)}
.hc img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--s3)}
.hc b{font:600 11.5px/1.15 var(--f);padding:6px 7px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc span{display:flex;justify-content:space-between;padding:3px 7px 7px;font:700 11px/1 var(--m)}
.hc span small{color:var(--mu);font-weight:500}
.flt{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* страница героя */
.hh{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--ln);min-height:260px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:end;padding:24px;background:#101014}
.hh .bgi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
.hh::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,9,11,.95),rgba(9,9,11,.55) 60%,rgba(9,9,11,.2)),linear-gradient(0deg,rgba(9,9,11,.85),transparent 60%)}
.hh>*{position:relative;z-index:1}
.hh .vi{width:200px;aspect-ratio:1/2;object-fit:cover;border-radius:12px;align-self:stretch;max-height:300px;box-shadow:0 0 0 2px var(--hc,var(--ac))}
.hh .ty{font:700 11px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--hc,var(--ac))}
.hh .nm{font:700 clamp(40px,6vw,68px)/.95 var(--h);letter-spacing:.02em;text-transform:uppercase;margin:6px 0 14px}
.hh .ss{display:flex;flex-wrap:wrap;gap:22px}
.hh .ss div span{display:block;font:600 10.5px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:5px}
.hh .ss div b{font:700 24px/1 var(--m)}
@media (max-width:700px){.hh{grid-template-columns:96px minmax(0,1fr);gap:14px;padding:16px;min-height:0}.hh .vi{width:96px;max-height:190px}.hh .ss{gap:14px}.hh .ss div b{font-size:18px}}
.mu-l a{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;text-decoration:none;border-top:1px solid var(--ln)}
.mu-l a:first-child{border-top:0}
.mu-l a:hover{background:var(--s2)}
.mu-l b{font-weight:600;font-size:13.5px}
.mu-l small{display:block;color:var(--mu);font-size:11.5px}
.mu-l .wr{font:700 14px/1 var(--m)}
.so{overflow-x:auto;padding:14px 16px}
.so table{border-collapse:separate;border-spacing:4px;min-width:560px}
.so td{width:30px;height:30px;border-radius:6px;background:var(--s2);text-align:center;font:700 11.5px/1 var(--m);color:var(--mu2)}
.so td.on{background:var(--ac);color:var(--acd)}
.so td.un{background:#3a2a07;color:var(--ac)}
.so th{text-align:left;padding-right:10px;white-space:nowrap}
.so th .row{gap:8px;font:600 12.5px/1.2 var(--f)}
.so th img{width:28px;height:28px;border-radius:6px;background:var(--s3)}
.so th small{display:block;color:var(--mu);font-size:10.5px;font-weight:500}
.phs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:980px){.phs{grid-template-columns:minmax(0,1fr)}}
.ir{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--ln)}
.ir:first-child{border-top:0}
.ir img{width:36px;height:36px;border-radius:8px;background:var(--s3)}
.ir b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir small{color:var(--mu);font-size:11.5px}
.ir .wr{font:700 14px/1 var(--m);text-align:right}
.ir .wr small{display:block;font:500 10.5px var(--f)}
.bd{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:11px 16px;border-top:1px solid var(--ln)}
.bd:first-child{border-top:0}
.bd b{display:block;font-weight:600}
.bd small{color:var(--mu);font-size:12px}
.bd .wr{font:700 16px/1 var(--m);text-align:right}
.bd .wr small{display:block;font:500 10.5px var(--f)}
.cp{height:30px;padding:0 10px;border-radius:8px;background:var(--s3);border:1px solid var(--ln2);font:600 12px/1 var(--m)}
.tipc{padding:16px 18px;border-left:3px solid var(--hot)}
.tipc b{color:var(--ac)}
.tipc p{margin:6px 0 0;font-size:14.5px}
.tipc small{display:block;color:var(--mu);font-size:12px;margin-top:6px}

/* разбор */
.mh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.mh .cardimg{width:96px;height:128px;object-fit:cover;border-radius:12px;background:var(--s3)}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.pts li{padding-left:18px;position:relative;font-size:14.5px}
.pts li::before{content:"";position:absolute;left:0;top:8px;width:8px;height:8px;border-radius:2px;background:var(--ac)}
.chart{width:100%;height:auto}
.map{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;background:#0f1013;border:1px solid var(--ln)}
.map .mi{width:100%;height:100%;object-fit:cover;opacity:.75}
.map .d{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--loss);color:#fff;font:700 11px/22px var(--m);text-align:center;box-shadow:0 0 0 2px #000}
.sbw{overflow-x:auto}
.sb{width:100%;border-collapse:collapse;min-width:420px}
.sb th{font:700 10.5px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-align:left;padding:10px 12px}
.sb td{padding:7px 12px;border-top:1px solid var(--ln);font-size:13px;font-family:var(--m)}
.sb td:first-child{font-family:var(--f)}
.sb tr.me3 td{background:rgba(255,176,32,.07)}
.ft{max-width:1280px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-right,0px)) 40px max(18px,env(safe-area-inset-left,0px));color:var(--mu2);font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ==== компоненты (лобби, разбор матча, герой, сборки, мета, топ, настройки) ==== */
/* ---------- список матчей / про ---------- */
.mt{display:grid;grid-template-columns:10px 46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln);text-decoration:none;transition:background .2s}
.mt:last-child{border-bottom:0}
.mt:hover{background:rgba(255,176,58,.045)}
.mt .st{width:9px;height:38px;border-radius:5px}
.mt .hi{width:46px;height:46px;border-radius:12px;object-fit:cover;background:var(--s3)}
.mt .k{font:600 15px/1.2 var(--m)}
.mt .r{text-align:right;display:grid;gap:3px;justify-items:end}
.mt .r b{font:700 11px/1 var(--f);letter-spacing:.12em}
.mt .r small{color:var(--mu2);font-size:11.5px}
.mt .grd.sm{justify-self:end}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:14px}
.pc{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--s2);border:1px solid var(--ln);border-radius:12px;text-decoration:none;transition:all .25s;min-width:0}
.pc:hover{border-color:var(--ac);transform:translateY(-2px)}
.pc>b{font:600 14px/1 var(--m);color:var(--ac);min-width:34px}
.pc>span{flex:1;min-width:0;font:600 13px/1.2 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc small{display:block;font:500 11px/1.3 var(--f);color:var(--mu);margin-top:3px}
.pc .his{display:flex;gap:4px}
.pc .his .hi{width:26px;height:26px;border-radius:7px}

/* ---------- лобби ---------- */
.lob{overflow-x:auto}
.lob table{width:100%;border-collapse:collapse;min-width:860px}
.lob th{font:700 10px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;color:var(--mu2);text-align:left;padding:11px 13px;border-bottom:1px solid var(--ln2)}
.lob td{padding:10px 13px;border-bottom:1px solid var(--ln);vertical-align:middle;font-size:13.5px}
.lob tr:last-child td{border-bottom:0}
.lob tr.mine td{background:rgba(255,176,58,.07)}
.lob tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--ac)}
.lob tr.thr td{background:rgba(255,90,31,.07)}
.lob tr.thr td:first-child{box-shadow:inset 3px 0 0 var(--hot)}
.lob tr.en{cursor:pointer}
.lob tr.en:hover td,.lob tr.sel td{background:var(--s2)}
.lob .pn{display:flex;align-items:center;gap:10px;min-width:0}
.lob .pn b{display:block;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.lob .pn small{display:block;color:var(--mu);font-size:11px}
.lob .av{width:32px;height:32px;border-radius:10px;object-fit:cover;background:var(--s3);flex:none}
.lob .rkc{display:flex;align-items:center;gap:8px;white-space:nowrap}
.lob .rkc .rk{width:30px;height:30px}
.lob .wr{font:700 13.5px/1 var(--m)}
.lob .tags{display:flex;flex-wrap:wrap;gap:4px}
.prow{display:flex;align-items:center;gap:10px;min-width:0}
.prow .pnm{min-width:0;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pnm small{display:block;color:var(--mu);font-weight:400;font-size:11px}
.prow .res{font:700 11px/1 var(--m);padding:4px 8px;border-radius:5px;border:1px solid;white-space:nowrap}
.prow .res.w{color:var(--win);border-color:rgba(61,220,151,.5)}
.prow .res.l{color:var(--loss);border-color:rgba(255,93,93,.5)}
.his{display:flex;gap:4px;align-items:center}
.his .hi{width:30px;height:30px;border-radius:8px;object-fit:cover;background:var(--s3);box-shadow:0 0 0 1px var(--ln2)}

/* ---------- разбор матча ---------- */
.chart{width:100%;height:auto}
.rgs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:12px}
.rg{position:relative;background:var(--s2);border:1px solid var(--ln);border-radius:var(--rr);padding:12px 8px 10px;display:grid;justify-items:center;gap:2px;text-align:center;min-width:0}
.rg svg{width:64px;height:64px;transform:rotate(-90deg)}
.rg circle{fill:none;stroke:var(--s3);stroke-width:6}
.rg circle.v{stroke:var(--ac);stroke-linecap:round}
.rg b{position:absolute;top:31px;left:0;right:0;font:700 14px/1 var(--m)}
.rg b.sm{font-size:11px}
.rg span{font:600 12px/1.2 var(--f);margin-top:4px}
.rg small{color:var(--mu);font-size:11px}
.map{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;background:#0b0d12;border:1px solid var(--ln2)}
.map .mi{width:100%;height:100%;object-fit:cover;opacity:.78}
.map .d{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--loss);color:#fff;font:700 11px/22px var(--m);text-align:center;box-shadow:0 0 0 2px #000;cursor:help}
.map .hd{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;overflow:hidden;background:var(--s3);box-shadow:0 0 0 2px var(--us);transition:left .25s linear,top .25s linear,opacity .2s;cursor:help}
.map .hd.en{box-shadow:0 0 0 2px var(--en)}
.map .hd.me{width:32px;height:32px;z-index:2;box-shadow:0 0 0 3px var(--us),0 0 14px var(--us)}
.map .hd.dead{opacity:.25}
.map .hd img{width:100%;height:100%;object-fit:cover}
.msl{display:flex;align-items:center;gap:12px;margin:10px 0 6px}
.msl input{flex:1;accent-color:var(--ac)}
.msl b{font-size:13px;min-width:44px;text-align:right;font-family:var(--m)}
.tln{position:relative;height:58px;margin:4px 6px 0;border-bottom:1px solid var(--ln2)}
.tln>i{position:absolute;bottom:8px;transform:translateX(-50%)}
.tln>i img{width:28px;height:28px;border-radius:7px;background:var(--s3);box-shadow:0 0 0 1px var(--ln2)}
.tln>i:nth-child(even){bottom:26px}
.tlx{position:absolute;left:0;right:0;top:100%}
.tlx span{position:absolute;transform:translateX(-50%);top:4px;font:600 10px/1 var(--m);color:var(--mu2)}
.tln+.tlx{display:none}
.card.pad .tln{margin-bottom:18px}
.traj{display:flex;gap:4px;flex-wrap:wrap}
.traj a{width:24px;height:30px;border-radius:6px;display:grid;place-items:center;font:700 11px var(--m);text-decoration:none;transition:transform .15s}
.traj a:hover{transform:scale(1.15)}
.traj a.w{background:rgba(61,220,151,.14);color:var(--win)}
.traj a.l{background:rgba(255,93,93,.14);color:var(--loss)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:120px;padding-top:6px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wk i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--win),#1f7a50)}
.wk i.l{background:linear-gradient(180deg,var(--loss),#8a2626)}
.wk i.n{background:var(--s3)}
.wk small{font:600 10px/1 var(--m);color:var(--mu)}
.wk em{font:700 11px/1 var(--m);font-style:normal}
.vd{display:inline-block;padding:2px 7px;border-radius:6px;background:var(--s3);font:600 11px/1.5 var(--f);cursor:help}
.vd.h{background:var(--acd);color:var(--ac)}
.vd.b{background:rgba(90,167,255,.14);color:#8cc4ff}
.vd.a{background:rgba(167,139,250,.16);color:var(--spir)}
.vd.r{background:rgba(255,93,93,.14);color:#ff8a80}
.vd.big{height:auto;padding:9px 15px;font:700 24px/1 var(--h);letter-spacing:.03em;border-radius:10px}
.vdc{margin-top:16px;display:grid;gap:10px}
.vdc>p{margin:0;font-size:14.5px}
.vdb{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.vds{display:flex;align-items:center;gap:10px}
.vds b{font-size:30px;font-weight:700;font-family:var(--h)}
.vds small{color:var(--mu);font-size:12px;line-height:1.35}
.md{display:inline-block;margin:2px 4px 0 0;padding:2px 7px;border-radius:5px;background:var(--acd);color:var(--ac);font:700 10px/1.4 var(--f);letter-spacing:.05em;text-transform:uppercase;cursor:help}
.why summary{cursor:pointer;color:var(--mu);font-size:13px}
.why p{margin:8px 0 0;color:var(--mu);font-size:13px}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.pts li{padding-left:18px;position:relative;font-size:14px;line-height:1.5}
.pts li::before{content:"";position:absolute;left:0;top:7px;width:8px;height:8px;border-radius:3px;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.nms{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.nms .nm{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;background:var(--s2);border:1px solid var(--ln);border-left:3px solid var(--us);border-radius:11px;padding:10px 12px}
.nms .nm.en{border-left-color:var(--en)}
.nms .nm.me{background:rgba(255,176,58,.07)}
.nms .nm .hi.s{width:34px;height:34px;border-radius:9px}
.nms .nm b{display:block;font:600 13px/1.25 var(--f)}
.nms .nm small{color:var(--mu);font-size:11.5px}
.sb tr.me3 td{background:rgba(255,176,58,.07)}
.crn{font:600 13px/1 var(--f);text-decoration:none;min-width:96px;margin-right:4px}
.crn:hover{color:var(--ac)}
.cnt{padding:14px 16px;display:grid;gap:10px}
.cp{height:30px;padding:0 10px;border-radius:9px;background:var(--s3);border:1px solid var(--ln2);font:600 12px/1 var(--m);color:var(--tx)}
.cp:hover{border-color:var(--ac)}
.rgb{display:grid;justify-items:center;text-align:center;gap:3px;padding:12px;border-radius:12px;background:var(--s2)}
.rgb b{font-size:38px;line-height:1;color:var(--ac);font-family:var(--h)}
.rgb span{font-weight:600;font-size:12.5px}
.rgb small{color:var(--mu);font-size:11.5px}
.thd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln)}
.thd b{font:600 13.5px/1.2 var(--h);letter-spacing:.03em}
.thd .hint{display:none}
.ir{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:11px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--ln)}
.ir:last-child{border-bottom:0}
.ir img{width:36px;height:36px;border-radius:9px;background:var(--s3)}
.ir b{display:block;font:600 13px/1.25 var(--f)}
.ir small{color:var(--mu2);font-size:11.5px}
.so{overflow-x:auto;padding:14px 16px}
.so table{border-collapse:separate;border-spacing:4px;min-width:560px}
.so td{width:30px;height:30px;border-radius:7px;background:var(--s2);text-align:center;font:700 11.5px/1 var(--m);color:var(--mu2)}
.so td.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1a0d00}
.so td.un{background:rgba(255,176,58,.16);color:var(--ac)}
.so th{text-align:left;padding-right:10px;white-space:nowrap}
.so th .row{gap:8px;font:600 12.5px/1.2 var(--f)}
.so th img{width:28px;height:28px;border-radius:7px;background:var(--s3)}
.so th small{display:block;color:var(--mu);font-size:10.5px;font-weight:500}
.phs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

/* ---------- герои: снап-карты ---------- */
.hvb .seg{overflow-x:auto;max-width:100%}
.hg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sn{position:relative;border-radius:16px;cursor:pointer;transform-style:preserve-3d;transition:transform .18s ease-out;outline:none;--rx:0;--ry:0;transform:perspective(700px) rotateX(var(--rx)) rotateY(var(--ry))}
.sn:focus-visible{box-shadow:0 0 0 2px var(--ac)}
.sn-in{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--ln);box-shadow:0 8px 22px rgba(0,0,0,.4);transition:box-shadow .2s}
.sn:hover .sn-in{box-shadow:0 14px 34px rgba(0,0,0,.55)}
.sn-bg{position:absolute;inset:0}
.sn-bg img{width:100%;height:100%;object-fit:cover;opacity:.5}
.sn-art{position:relative;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;transform:translateZ(14px)}
.sn-nm{position:absolute;left:8px;right:8px;bottom:26px;font:600 13px/1.2 var(--h);letter-spacing:.02em;text-transform:uppercase;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.9);transform:translateZ(24px)}
.sn-foil{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.09) 45%,transparent 60%);transform:translateZ(30px);pointer-events:none;opacity:0;transition:opacity .25s}
.sn:hover .sn-foil{opacity:1}
.sn-lv,.sn-sc{position:absolute;top:-9px;width:34px;height:42px;display:grid;place-items:center;font:700 15px/1 var(--h);color:#140b00;background:linear-gradient(160deg,#ffd68a,var(--ac2));border-radius:9px;box-shadow:0 4px 12px rgba(0,0,0,.5);z-index:2}
.sn-lv{left:-7px}
.sn-sc{right:-7px;background:linear-gradient(160deg,#141927,var(--s3));color:var(--ac);border:1px solid var(--ln2)}
.sn-n{position:absolute;left:8px;bottom:7px;font:500 10.5px/1 var(--f);color:var(--mu)}
.sn.l2 .sn-in,.sn.l3 .sn-in,.sn.l4 .sn-in,.sn.l5 .sn-in,.sn.l6 .sn-in{box-shadow:0 0 0 2px var(--hc),0 0 22px -6px var(--hc),0 12px 26px rgba(0,0,0,.5)}
.sn.l3 .sn-art,.sn.l4 .sn-art,.sn.l5 .sn-art,.sn.l6 .sn-art{height:116%;border-radius:0 0 15px 15px;-webkit-mask-image:linear-gradient(0deg,#000 82%,transparent);mask-image:linear-gradient(0deg,#000 82%,transparent);transform:translateZ(28px)}
.sn.big .sn-nm{font-size:24px}
.sn.big .sn-lv,.sn.big .sn-sc{width:44px;height:52px;font-size:20px;top:-13px}
.tl{display:grid;grid-template-columns:74px minmax(0,1fr);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;background:var(--s1)}
.tl:first-child{border-top:0}
.tl .t{display:grid;place-items:center;font:700 30px/1 var(--h)}
.tl .hs{display:flex;flex-wrap:wrap;gap:8px;padding:12px;min-width:0}

/* ---------- страница героя ---------- */
.hh{position:relative;display:grid;grid-template-columns:minmax(260px,420px) minmax(0,1fr);gap:24px;align-items:center;padding:22px;border-radius:22px;border:1px solid var(--ln2);overflow:hidden;background:
  linear-gradient(120deg, rgba(255,138,46,.14), rgba(167,139,250,.1) 55%, rgba(6,8,13,0)),
  var(--s1);background-size:200% 200%;animation:gradShift 14s ease infinite}
.hh .bgi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.16;filter:saturate(.7)}
.hh>*{position:relative}
.viw{position:relative;border-radius:18px;overflow:hidden;background:var(--s2);border:1px solid var(--ln2);box-shadow:var(--sh)}
.viw .vi{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top;display:block}
.viw .vv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.viw .vv.on{opacity:1}
.ty{font:600 11px/1 var(--f);letter-spacing:.22em;text-transform:uppercase;color:var(--mu)}
.hh .nm{margin:8px 0 0;font:600 clamp(26px,3.6vw,42px)/1.04 var(--h);letter-spacing:.01em;text-transform:uppercase;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.ss{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px}
.ss>div{display:grid;gap:3px}
.ss span{color:var(--mu);font:600 10.5px/1 var(--f);letter-spacing:.1em;text-transform:uppercase}
.ss b{font:600 20px/1.1 var(--h)}
.hmr{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:center;padding:4px 0}
.ss2{display:flex;flex-wrap:wrap;gap:22px}
.ss2 span{display:block;font:600 10.5px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:5px}
.ss2 b{display:block;font:700 22px/1 var(--m)}
.ss2 small{display:block;color:var(--mu);font-size:11.5px;margin-top:4px}
.why summary{cursor:pointer;color:var(--mu);font-size:13px}
.why p{margin:8px 0 0;color:var(--mu);font-size:13px}
.hln{display:flex;align-items:flex-start;gap:11px;margin-top:18px;padding:13px 15px;border-radius:14px;background:rgba(6,8,13,.55);border:1px solid var(--ln2);backdrop-filter:blur(6px);max-width:560px}
.hln .pl{flex:none;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1a0d00;font-size:12px;display:grid;place-items:center;transition:transform .2s}
.hln .pl:hover{transform:scale(1.1)}
.hln .nx{flex:none;width:26px;height:26px;border-radius:50%;background:var(--s3);color:var(--mu);font-size:11px;display:grid;place-items:center;align-self:center}
.hln .nx:hover{color:var(--ac)}
.hln span{min-width:0;display:grid;gap:3px}
.hln b{font:600 14px/1.35 var(--f);font-style:italic}
.hln small{color:var(--mu);font-size:12.5px;line-height:1.45}
.tipc{padding:16px;border-left:3px solid var(--ac)}
.tipc b{font:600 14px/1.3 var(--h)}
.tipc p{margin:8px 0;font-size:14px;line-height:1.55}
.tipc small{color:var(--mu2)}
.mu-l{display:grid}
.mu-l a{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:11px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--ln);text-decoration:none;transition:background .2s}
.mu-l a:last-child{border-bottom:0}
.mu-l a:hover{background:rgba(255,176,58,.045)}
.mu-l .hi{width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--s3)}
.mu-l b{display:block;font:600 13.5px/1.2 var(--f)}
.mu-l small{color:var(--mu2);font-size:11.5px}

/* ---------- билды ---------- */
.bd2{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin-bottom:12px;transition:border-color .25s}
.bd2:hover{border-color:var(--ln2)}
.bd2.on{border-color:rgba(61,220,151,.5);box-shadow:0 0 0 1px rgba(61,220,151,.25),0 10px 30px -14px rgba(61,220,151,.35)}
.bdh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.bdh b{display:block;font:600 14.5px/1.25 var(--f)}
.bdh small{color:var(--mu2);font-size:12px}
.bdi{display:flex;gap:5px;flex-wrap:wrap;margin:11px 0}
.ii{width:34px;height:34px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);transition:transform .15s}
.ii:hover{transform:translateY(-3px) scale(1.06)}
.srcs{display:flex;gap:5px;flex-wrap:wrap}
.bdd{margin-top:10px;display:grid;gap:9px}
.bdc{background:var(--s2);border:1px solid var(--ln);border-radius:11px;padding:10px 12px}
.bdc b{display:block;font:600 12px/1.2 var(--f);letter-spacing:.05em;text-transform:uppercase;color:var(--mu);margin-bottom:7px}
.bdc>div{display:flex;flex-wrap:wrap;gap:6px}
.it{display:inline-flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;border-radius:8px;background:var(--s3);font:500 12px/1.2 var(--f)}
.it img{width:24px;height:24px;border-radius:5px}
.it em{font:600 11px/1 var(--m);font-style:normal;color:var(--mu)}

/* ---------- мета ---------- */
.tw{display:grid;grid-template-columns:70px minmax(0,1fr);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;background:var(--s1);margin-bottom:12px}
.tw .t{display:grid;place-items:center;font:700 34px/1 var(--h);background:color-mix(in srgb, currentColor 7%, transparent);border-right:1px solid var(--ln);text-shadow:0 0 24px currentColor}
.hs{display:flex;flex-wrap:wrap;gap:9px;padding:13px;min-width:0}
.hc{display:flex;gap:10px;align-items:center;padding:7px 12px 7px 7px;border-radius:13px;background:var(--s2);border:1px solid var(--ln);border-left:3px solid var(--hc);text-decoration:none;transition:all .2s;min-width:0}
.hc:hover{transform:translateY(-2px);border-color:var(--hc);background:var(--s3)}
.hc img{width:52px;height:52px;border-radius:11px;object-fit:cover;background:var(--s3)}
.hc b{display:block;font:600 13px/1.2 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc em{font:700 12px/1.2 var(--m);font-style:normal}
.hc small{display:block;color:var(--mu2);font-size:10.5px;margin-top:2px}

/* ---------- лидерборд ---------- */
.lbt{width:100%;border-collapse:collapse;min-width:720px}
.lbt th{font:700 10px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;color:var(--mu2);text-align:left;padding:12px 14px;border-bottom:1px solid var(--ln2)}
.lbt td{padding:9px 14px;border-bottom:1px solid var(--ln);font-size:13.5px}
.lbt tr:last-child td{border-bottom:0}
.lbt tr:hover td{background:rgba(255,176,58,.035)}
.lbt tr.mine td{background:rgba(255,176,58,.07);animation:flashRow 1.2s ease-out}
.lbt tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--ac)}
.lbt .pn{display:flex;align-items:center;gap:10px;min-width:0}
.lbt .pn small{display:block;color:var(--mu);font-size:11px}
.lbt .rkc{display:flex;align-items:center;gap:8px;white-space:nowrap}
.lbt .rkc .rk{width:30px;height:30px}
.lbt .hi{width:28px;height:28px;border-radius:8px;object-fit:cover;background:var(--s3)}

/* ---------- настройки ---------- */
.sno{position:fixed;inset:0;z-index:60;background:rgba(4,6,10,.72);backdrop-filter:blur(8px);display:grid;place-items:center;padding:18px;animation:pop .25s both}
.sno-c{width:560px;max-width:100%;max-height:86vh;overflow-y:auto;background:var(--s1);border:1px solid var(--ln2);border-radius:20px;padding:22px;box-shadow:var(--sh)}
.set{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:13px 0;border-bottom:1px dashed var(--ln)}
.set:last-of-type{border-bottom:0}
.set b{font:600 14px/1.3 var(--f)}
.set small{display:block;color:var(--mu);font-size:12.5px;margin-top:3px;line-height:1.5}
.sw2{position:relative;width:44px;height:25px;display:inline-block;flex:none}
.sw2 input{opacity:0;width:0;height:0;position:absolute}
.sw2 span{position:absolute;inset:0;border-radius:20px;background:var(--s3);border:1px solid var(--ln2);transition:all .25s;cursor:pointer}
.sw2 span::after{content:"";position:absolute;left:3px;top:2.5px;width:18px;height:18px;border-radius:50%;background:var(--mu);transition:all .25s}
.sw2 input:checked+span{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}
.sw2 input:checked+span::after{left:21px;background:#1a0d00}
.skpick{display:flex;gap:8px;flex-wrap:wrap}
.skpick button{padding:8px 13px;border-radius:10px;background:var(--s2);border:1px solid var(--ln2);font:600 12.5px var(--f);color:var(--mu)}
.skpick button.on{border-color:var(--ac);color:var(--ac)}


/* карточка героя при наведении (Marvel Snap) */
#hcard{position:fixed;z-index:55;width:176px;pointer-events:none;opacity:0;transform:translateY(8px) scale(.96);transition:opacity .16s ease,transform .16s ease;filter:drop-shadow(0 16px 32px rgba(0,0,0,.6))}
#hcard.on{opacity:1;transform:none}
#hcard .sn{width:100%}
#hcard .hcc{margin-top:8px;background:rgba(8,8,12,.9);border:1px solid var(--ln2);border-radius:10px;padding:7px 9px;font-size:11px;line-height:1.35;color:var(--mu);text-align:center}
#hcard .hcc b{display:block;font:700 12.5px/1.2 var(--h);letter-spacing:.04em;text-transform:uppercase;color:var(--tx);margin-bottom:2px}

/* ==== 31.10 — «Форма» (Performance как у deadlocklabs): Score, кривая, где силён, когда получается, герои ==== */
.ptabs{display:flex;gap:4px;margin:14px 0 4px;border-bottom:1px solid var(--ln)}
.ptabs a{padding:10px 14px;font:700 13px/1 var(--f);letter-spacing:.06em;text-transform:uppercase;color:var(--mu);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s}
.ptabs a:hover{color:var(--tx)}
.ptabs a.on{color:var(--ac);border-color:var(--ac)}
.fm-top{gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0}
.fm-g{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.5fr;gap:12px}
.fm-sc{padding:16px 18px}
.fm-k{font:700 11px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
.fm-n{display:flex;align-items:baseline;gap:6px;margin-top:8px}
.fm-n b{font:700 56px/1 var(--h);letter-spacing:-.02em}
.fm-n small{font:600 18px var(--h);color:var(--mu)}
.fm-lb{font:700 14px/1.2 var(--f);margin-top:4px}
.fm-gg{position:relative;height:6px;border-radius:4px;margin:16px 0 22px;background:linear-gradient(90deg,var(--loss),var(--ac) 50%,var(--win))}
.fm-gg i{position:absolute;top:-6px;width:4px;height:18px;border-radius:2px;background:var(--tx);box-shadow:0 0 0 2px var(--s1);transform:translateX(-50%)}
.fm-gg span{position:absolute;top:12px;font:500 10.5px var(--f);color:var(--mu2)}
.fm-gg span:nth-of-type(1){left:0}.fm-gg span:nth-of-type(2){left:50%;transform:translateX(-50%);white-space:nowrap}.fm-gg span:nth-of-type(3){right:0}
.fm-dl{margin:0;font-size:12.5px;color:var(--mu)}
.fm-bg{text-decoration:none}
.fm-ins{padding:12px 14px;display:grid;gap:8px;align-content:start}
.fm-i{display:grid;gap:2px;padding:8px 10px;border-radius:10px;background:var(--s2);border-left:3px solid var(--mu2)}
.fm-i b{font:700 10.5px/1 var(--f);letter-spacing:.12em;text-transform:uppercase}
.fm-i span{font-size:13px}
.fm-i.g{border-color:var(--win)}.fm-i.g b{color:var(--win)}
.fm-i.r{border-color:var(--loss)}.fm-i.r b{color:var(--loss)}
.fm-i.a{border-color:var(--ac)}.fm-i.a b{color:var(--ac)}
.fm-cw{overflow-x:auto}
.fm-cv{display:block;width:100%;min-width:520px;height:170px}
.fm-cv line{stroke:var(--ln);stroke-width:1}
.fm-cv line.m{stroke:var(--mu2);stroke-dasharray:4 4}
.fm-cv rect.w{fill:var(--win);opacity:.85}
.fm-cv rect.l{fill:var(--loss);opacity:.8}
.fm-cv rect.b{stroke:var(--tx);stroke-width:1.5}
.fm-cv a:hover rect{opacity:1}
.fm-cv polyline{fill:none;stroke:var(--ac);stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.fm-cl{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--mu2);margin-top:6px}
.fm-2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.fm-r{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--ln)}
.fm-r:last-child{border-bottom:0}
.fm-r b{font:600 13.5px/1.2 var(--f);display:block}
.fm-r small{font-size:11.5px;color:var(--mu2)}
.fm-r em{font:700 13px var(--m);font-style:normal;text-align:right}
.fm-bar{position:relative;height:8px;border-radius:5px;background:var(--s3)}
.fm-f{position:absolute;top:0;bottom:0;border-radius:5px}
.fm-f.up{background:var(--win)}.fm-f.dn{background:var(--loss)}
.fm-mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--tx);opacity:.6}
.fm-d{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--s1)}
.fm-d.w{background:var(--win)}.fm-d.l{background:var(--loss)}
.fm-bk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fm-b{display:grid;gap:3px;text-align:center;padding:10px 6px;border-radius:12px;background:var(--s2)}
.fm-b b{font:700 30px/1 var(--h)}
.fm-b span{font:700 13px var(--f)}
.fm-b small{font-size:11px;color:var(--mu2)}
.fm-wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.fm-w{display:grid;gap:2px;text-align:center;padding:8px 4px;border-radius:10px;background:var(--s2);border:1px solid transparent}
.fm-w.cur{border-color:var(--ac)}
.fm-w b{font:700 22px/1 var(--h)}
.fm-w em{font:700 11px var(--m);font-style:normal}
.fm-w small{font-size:10.5px;color:var(--mu2)}
.fm-hl{display:grid}
.fm-h{display:grid;grid-template-columns:46px minmax(0,1fr) 120px 150px;gap:14px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--ln);text-decoration:none;color:var(--tx);transition:background .2s}
.fm-h:last-child{border-bottom:0}
.fm-h:hover{background:rgba(255,176,58,.045)}
.fm-h .hi{width:46px;height:46px;border-radius:12px;object-fit:cover;background:var(--s3)}
.fm-hn b{font:600 14.5px/1.2 var(--f);display:block}
.fm-hn small{font-size:12px;color:var(--mu)}
.fm-hn .ptags{margin-top:5px}
.fm-hn .tag{font-size:10.5px;padding:1px 7px}
.fm-hs{display:grid;justify-items:start}
.fm-hs b{font:700 28px/1 var(--h)}
.fm-hs small{font-size:11px;color:var(--mu)}
.fm-mb{display:flex;align-items:flex-end;gap:3px;height:38px}
.fm-mb i{flex:1;max-width:11px;border-radius:2px 2px 0 0}
.fm-mb i.w{background:var(--win)}.fm-mb i.l{background:var(--loss)}
.fm-how{margin-top:14px}
.fm-how summary{cursor:pointer;font-weight:600}
.fm-how p{color:var(--mu);font-size:13px;line-height:1.55;margin:10px 0 0}
@media (max-width:1100px){.fm-g{grid-template-columns:repeat(2,minmax(0,1fr))}.fm-2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){
  .fm-g{grid-template-columns:minmax(0,1fr)}
  .fm-n b{font-size:46px}
  .fm-r{grid-template-columns:96px minmax(0,1fr) 52px;gap:8px}
  .fm-r small{display:none}
  .fm-h{grid-template-columns:40px minmax(0,1fr) 54px;gap:10px;padding:10px 12px}
  .fm-h .hi{width:40px;height:40px}
  .fm-mb{grid-column:2/4;height:24px}
  .fm-hs b{font-size:22px}
  .fm-hs small{display:none}
  .fm-cv{min-width:0;height:140px}
}
.fm-g .stat{align-content:start}
.fm-g .stat b{font:700 40px/1.05 var(--h);margin:6px 0 2px}
@media (max-width:560px){.fm-g{grid-template-columns:repeat(2,minmax(0,1fr))}.fm-g .fm-sc,.fm-g .fm-ins{grid-column:1/-1}.fm-g .stat b{font-size:32px}}

/* ==== 31.10 — Restless простой: вид как в версии 28.10 (Porofessor / League of Graphs), профиль по схеме Андрея ==== */
.ft{padding-top:10px}
.lnk{font:600 13px/1 var(--f);color:var(--ac);text-decoration:none}
.lnk:hover{text-decoration:underline}
.prof{margin-bottom:14px}
.prof .av{display:block}
.prof .sub{margin-top:4px}
.prof .ptags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.prof .rkb small{display:block;font-size:11px}
.prof .rkb .eu{display:block;margin-top:6px;font:600 12.5px/1.2 var(--f);color:var(--mu);text-decoration:none}
.prof .rkb a.eu{color:var(--ac)}
.prof .rkb a.eu:hover{text-decoration:underline}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--ln);margin:20px 0 0}
.ptabs a{padding:11px 14px;font:600 13.5px/1 var(--f);letter-spacing:0;text-transform:none;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-1px;text-decoration:none}
.ptabs a:hover{color:var(--tx)}
.ptabs a.on{color:var(--tx);border-color:var(--ac)}
.hm{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:980px){.hm{grid-template-columns:minmax(0,1fr)}}
.btn.live{width:100%;margin-top:28px}
.btn.more{width:100%;margin-top:10px}
/* строка матча */
.mr2{display:grid;grid-template-columns:44px minmax(0,1fr) auto 34px 132px;gap:12px;align-items:center;padding:10px 14px 10px 16px;border-top:1px solid var(--ln);text-decoration:none;box-shadow:inset 3px 0 0 var(--win)}
.mr2.l{box-shadow:inset 3px 0 0 var(--loss)}
.mr2:first-child{border-top:0}
.mr2:hover{background:var(--s2)}
.mr2-m{min-width:0}
.mr2-m b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr2-m .kd{display:block;font:600 13px/1.3 var(--m);color:var(--tx);margin-top:2px}
.mr2-m .kd i{font-style:normal;color:var(--loss)}
.mr2-t{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.mr2-r{text-align:right;min-width:0}
.mr2-r b{display:block;font:600 13px/1.2 var(--h);letter-spacing:.06em;text-transform:uppercase}
.mr2-r small{color:var(--mu);font-size:12px;white-space:nowrap}
.mr2-r em{font-style:normal;font-weight:700}
.grd{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font:700 15px/1 var(--h);color:var(--gc);box-shadow:inset 0 0 0 2px var(--gc);background:color-mix(in srgb,var(--gc) 10%,transparent);cursor:help}
.grd.sm{display:inline-grid;width:24px;height:24px;font-size:12px;margin-left:6px;vertical-align:middle}
/* лицо героя: радуется победе, грустит после поражения + рейтинг на герое под иконкой */
.hfw{position:relative;display:block;width:44px;flex:none}
.hf{position:relative;display:block;width:44px;height:44px;border-radius:9px;overflow:hidden;background:var(--s3)}
.hf img{width:100%;height:100%;object-fit:cover;display:block}
.hf svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.9))}

.hf svg .e{fill:#fff;stroke:rgba(8,9,14,.75);stroke-width:2.6}

.hf.w{box-shadow:0 0 0 2px rgba(57,209,127,.55)}

.hfw .mr,.hiw .mr{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);background:#14100a;border:1px solid rgba(255,176,32,.5);color:#ffd68a;font:700 9px/1 var(--m);font-style:normal;padding:2px 5px;border-radius:6px;white-space:nowrap;z-index:1}
.hiw{position:relative;display:inline-flex;width:40px;flex:none}
.hiw .hi{width:40px;height:40px}
/* мейн-герои и паттерны */
.pool a{grid-template-columns:40px minmax(0,1fr) 70px 46px}
.pts2>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--ln)}
.pts2>div:first-child{border-top:0}
.pts2 span{font-size:13.5px;font-weight:600;min-width:0}
.pts2 small{display:block;font-weight:400;color:var(--mu);font-size:11.5px}
.pts2 em{font:700 13px/1 var(--m);font-style:normal;white-space:nowrap}
/* сетка героев (вкладка «Герои») — плитки как у League of Graphs */
.hg{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.hgc{display:flex;flex-direction:column;min-width:0;background:var(--s1);border:1px solid var(--ln);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--tx)}
.hgc:hover{border-color:var(--ac)}
.hgc>img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 14%;background:var(--s2)}
.hgc>div{display:grid;gap:4px;padding:8px 9px 10px;min-width:0}
.hgc b{font:600 14px/1.2 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hgc .mono{font-size:12.5px}
.hgc .mono small{font-size:11px;color:var(--mu)}
.hgc .ptags{display:flex;flex-wrap:wrap;gap:4px}
/* топ Европы во вкладке «Про» */
.pc.lk{cursor:pointer}
.pc>span small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .his a{display:block;line-height:0}
/* без «стекла» и плавающих анимаций */
.sno{backdrop-filter:none;background:rgba(5,5,7,.82)}
.hln{backdrop-filter:none}
.ptags{display:flex;flex-wrap:wrap;gap:5px}
@media (max-width:860px){

  .tabs a{padding:0 12px;font-size:13px}
}

  .mr2-r b{font-size:11.5px}
  .mr2-t{grid-column:2/4;grid-row:3;justify-content:flex-start}

.h2 .lnk{font:600 13px/1 var(--f);letter-spacing:0;text-transform:none}
.mr2-r b em{font:700 12px/1 var(--m);letter-spacing:0;margin-left:4px}
/* «Мета»: плитка героя — иконка, имя, % побед, KDA и сколько берут */
#mtw>.card{background:none;border:0}
.tw .t{text-shadow:none}
.tw .hc{width:98px;display:flex;flex-direction:column;align-items:stretch;background:var(--s2);border:1px solid var(--ln);border-radius:10px;overflow:hidden;text-decoration:none}
.tw .hc:hover{border-color:var(--ac)}

.tw .hc span{display:grid;gap:2px;padding:6px 7px 8px;justify-content:stretch}
.tw .hc b{font:600 12px/1.15 var(--f);padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw .hc em{font:700 13px/1 var(--m);font-style:normal}
.tw .hc small{display:block;font:500 10px/1.3 var(--f);color:var(--mu)}
.hgc .tag{font-size:9.5px;height:18px}
@media (max-width:640px){.tw{grid-template-columns:44px minmax(0,1fr)}.tw .t{font-size:24px}.hs{gap:6px;padding:8px}.tw .hc{width:calc(33.3% - 4px)}}
.tag.h{background:#3b1d0e;color:#ff9a6a}
.stg{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--s1);border:1px solid var(--ln);color:var(--mu);flex:none}
.stg:hover{color:var(--tx);border-color:var(--ln2)}
@media (max-width:640px){

}

/* ==== 31.10 (вечер) — Restless как League of Graphs: RESTLESS по центру, вкладки Профиль · Лайв-матч · Мета · Лидеры · Про · Обновления,
   профиль панелями (ранг, частые герои, метки и паттерны, базовые цифры, недавние игры с предметами и 12 игроками),
   лица героев из файлов игры, страница героя: портрет слева, настоящие сборки справа ==== */
:root{--win:#36d6c3;--loss:#ff6b81;--q-bx:#121216;--q-bh:#16161b;--q-ln:#24242c;--q-am:#ffb020;--q-sp:#5aa9ff}
.tag.g{background:#0c3330;color:var(--win)}.tag.r{background:#3a1420;color:#ff8fa0}

/* шапка: поиск слева, логотип по центру, ты и настройки справа; вкладки строкой ниже */
.q-nav{position:sticky;top:0;z-index:30;background:rgba(9,9,11,.94);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
.q-in{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;height:64px;padding:0 max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px))}
.q-in .srch{justify-self:start;width:min(320px,100%)}
.q-nr{justify-self:end;display:flex;align-items:center;gap:10px;min-width:0}
.q-logo{display:block;text-decoration:none;line-height:1;padding:6px 4px}
.q-lw{display:flex;gap:.05em;font:700 31px/1 var(--h);letter-spacing:.16em;color:var(--q-am)}
.q-lw i{font-style:normal;display:inline-block;animation:qIn .5s cubic-bezier(.2,.8,.2,1) both,qWave 7s ease-in-out 1.2s infinite;animation-delay:calc(var(--i)*45ms),calc(1.2s + var(--i)*70ms)}
@keyframes qIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes qWave{0%,12%,100%{color:var(--q-am);transform:none;text-shadow:none}5%{color:#fff1c9;transform:translateY(-2px);text-shadow:0 0 14px rgba(255,190,70,.55)}}
.q-logo:hover .q-lw i{animation:qIn .5s both,qWave 1.2s ease-in-out infinite;animation-delay:0s,calc(var(--i)*60ms)}
@media (prefers-reduced-motion:reduce){.q-lw i{animation:none!important}}
.q-tabs{display:flex;justify-content:center;gap:4px;height:44px;border-top:1px solid #18181d;max-width:1240px;margin:0 auto;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.q-tabs::-webkit-scrollbar{display:none}
.q-tabs a{display:flex;align-items:center;padding:0 16px;text-decoration:none;font:600 14px/1 var(--f);color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap}
.q-tabs a:hover{color:var(--tx)}
.q-tabs a.on{color:var(--tx);border-bottom-color:var(--q-am)}
@media (max-width:760px){
 .q-in{grid-template-columns:44px minmax(0,1fr) auto;height:auto;padding-top:8px;padding-bottom:8px;gap:8px 10px}
 .q-in .srch{grid-column:1/-1;grid-row:2;width:100%}
 .q-logo{grid-column:2;grid-row:1;justify-self:center}
 .q-nr{grid-column:3;grid-row:1}
 .q-lw{font-size:25px}
 .q-nr .me{padding:3px;border-radius:50%}.q-nr .me b,.q-nr .me span,.q-nr .me .rk{display:none}
 .q-tabs{justify-content:flex-start;height:42px}
 .q-tabs a{padding:0 11px;font-size:13.5px}
}
.wrap{max-width:1240px}

/* панель как у League of Graphs */
.q-box{background:var(--q-bx);border:1px solid var(--q-ln);border-radius:12px;min-width:0;overflow:hidden}
.q-bh{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 16px;border-bottom:1px solid var(--q-ln);background:var(--q-bh)}
.q-bh b{font:600 14px/1.2 var(--f)}
.q-bh small{color:var(--mu);font-size:12.5px}
.q-bh .sp{flex:1}
.q-bh .lnk{font-size:12.5px}
.q-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
@media (max-width:900px){.q-row{grid-template-columns:minmax(0,1fr)}}

/* лицо героя из файлов игры */
.q-fc{position:relative;display:block;width:46px;height:46px;border-radius:10px;overflow:hidden;background:#1d1d24;flex:none}
.q-fc img{width:100%;height:100%;object-fit:cover;transform:scale(1.06);transform-origin:50% 18%}
.q-fc.g{box-shadow:0 0 0 2px rgba(54,214,195,.6)}
.q-fc.c{box-shadow:0 0 0 2px rgba(255,107,129,.55)}
.q-fc.s{width:30px;height:30px;border-radius:7px}
.q-fc.m{width:38px;height:38px;border-radius:9px}
.q-fc.l{width:58px;height:58px;border-radius:12px}
.q-fc.xl{width:84px;height:84px;border-radius:14px}
.grd{letter-spacing:-.02em}
.q-grd{font-size:13px}

/* шапка профиля: баннер с артом мейна */
.q-ban{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--q-ln);background:#101014;min-height:178px;display:flex;align-items:flex-end}
.q-ban .bg{position:absolute;inset:0;background-size:cover;background-position:right 30%;opacity:.75}
.q-ban .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0d0d10 0%,rgba(13,13,16,.92) 34%,rgba(13,13,16,.35) 70%,rgba(13,13,16,.15)),linear-gradient(0deg,rgba(13,13,16,.85),transparent 55%)}
.q-ban .q-bin{position:relative;display:flex;align-items:flex-end;gap:18px;padding:22px 22px 20px;min-width:0;width:100%}
.q-av{position:relative;flex:none}
.q-av img,.q-av i{display:block;width:92px;height:92px;border-radius:16px;object-fit:cover;background:var(--s3);border:2px solid rgba(255,176,32,.55)}
.q-av em{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);font:700 11px/1 var(--m);font-style:normal;background:#14100a;color:#ffd68a;border:1px solid rgba(255,176,32,.55);border-radius:8px;padding:3px 7px;white-space:nowrap}
.q-pn{min-width:0;flex:1}
.q-pn h1{margin:0;font:700 34px/1.05 var(--h);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-pn h1 small{font:500 14px/1 var(--f);letter-spacing:0;color:var(--mu);text-transform:none;margin-left:8px}
.q-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.q-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:7px;background:#1b1b21;border:1px solid #2c2c35;font:600 12.5px/1 var(--f);color:var(--tx);text-decoration:none;white-space:nowrap}
.q-chip.q-rkc{background:#1f1606;border-color:rgba(255,176,32,.55);color:#ffd68a}
.q-chip img{width:18px;height:18px;object-fit:contain}
.q-chip .q-fc{width:18px;height:18px;border-radius:4px;box-shadow:none}
a.q-chip:hover{border-color:var(--q-am)}
@media (max-width:640px){.q-ban{min-height:150px}.q-ban .q-bin{gap:14px;padding:16px}.q-av img,.q-av i{width:66px;height:66px;border-radius:12px}.q-pn h1{font-size:24px}.q-ban .bg{opacity:.45}}
.ptabs{margin-top:14px}

/* ранг */
.q-rkb{display:grid;grid-template-columns:118px minmax(0,1fr);gap:18px;align-items:center;padding:18px}
.q-rkb>img,.q-rkb>span.rk{width:118px;height:118px;object-fit:contain}
.q-rkn{font:700 26px/1.05 var(--h);letter-spacing:.03em}
.q-rkn small{display:block;font:500 12.5px/1.3 var(--f);color:var(--mu);letter-spacing:0;margin-top:3px}
.q-l{font-size:13.5px;margin-top:5px;color:#d9d3c8}
.q-l b{font-weight:700}
.q-en{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--q-ln)}
.q-en .rk{width:40px;height:40px}
.q-en b{display:block;font-size:14px}
.q-en small{color:var(--mu);font-size:12px}
.q-cap{font:600 11px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);padding:12px 18px 0}
@media (max-width:480px){.q-rkb{grid-template-columns:84px minmax(0,1fr);gap:12px;padding:14px}.q-rkb>img,.q-rkb>span.rk{width:84px;height:84px}.q-rkn{font-size:21px}}

/* таблица героев (частые герои, герои профиля) */
.q-tbl{width:100%;border-collapse:collapse}
.q-tbl th{font:600 10.5px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-align:left;padding:10px 12px;white-space:nowrap}
.q-tbl th.s{cursor:pointer;user-select:none}.q-tbl th.s:hover{color:var(--tx)}.q-tbl th.on{color:var(--q-am)}
.q-tbl td{padding:8px 12px;border-top:1px solid var(--q-ln);vertical-align:middle;font-size:13.5px}
.q-tbl tr.lk{cursor:pointer}.q-tbl tr.lk:hover td{background:#17171c}
.q-tbl .q-hn{display:flex;align-items:center;gap:10px;min-width:0}
.q-tbl .q-hn b{display:block;font-weight:600;white-space:nowrap}
.q-tbl .q-hn small{display:block;color:var(--mu);font-size:12px;white-space:nowrap}
.q-kda{font:600 12.5px/1.2 var(--m);white-space:nowrap}.q-kda i{font-style:normal;color:var(--loss)}.q-kda em{font-style:normal;color:var(--mu)}
.q-bw{display:flex;align-items:center;gap:8px;min-width:96px}
.q-bw .bar{flex:1;height:7px;min-width:44px}
.q-bw b{font:700 12.5px/1 var(--m);min-width:40px;text-align:right}
.q-num{font:600 13px/1 var(--m);white-space:nowrap}
@media (max-width:700px){.q-tbl .qh,.q-tbl th.qh{display:none}.q-tbl td,.q-tbl th{padding-left:8px;padding-right:8px}}

/* метки и паттерны */
.q-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:16px}
.q-tags .tag{height:26px;padding:0 10px;font-size:11.5px;letter-spacing:.03em;text-transform:none;border:1px solid rgba(255,255,255,.08)}
.q-pt{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid var(--q-ln)}
.q-pt span{font-size:13.5px}.q-pt small{display:block;color:var(--mu);font-size:12px}
.q-pbar{position:relative;height:8px;border-radius:4px;background:#1e1e25}
.q-pbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.q-pbar i.up{left:50%;background:var(--win)}.q-pbar i.dn{right:50%;background:var(--loss)}
.q-pbar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:#3a3a44}
.q-pv{display:block;font:700 12px/1 var(--m);margin-top:5px;text-align:center}
@media (max-width:480px){.q-pt{grid-template-columns:minmax(0,1fr) 110px}}

/* базовые цифры и типы героев */
.q-bs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px 16px}
.q-bs>div{background:#18181e;border:1px solid var(--q-ln);border-radius:10px;padding:10px 12px;text-align:center}
.q-bs span{display:block;font:600 10.5px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.q-bs b{display:block;font:700 18px/1.2 var(--m);margin-top:6px;white-space:nowrap}
.q-bs>div:first-child b{font-size:15px;line-height:1.45}
.q-bs b i{font-style:normal;color:var(--loss)}
.q-donut{display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;align-items:center;padding:6px 16px 16px}
.q-dn{position:relative;width:130px;height:130px;border-radius:50%}
.q-dn::after{content:"";position:absolute;inset:18px;border-radius:50%;background:var(--q-bx)}
.q-dn b{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 15px/1.1 var(--h);letter-spacing:.04em;text-align:center}
.q-dn b small{font:600 9.5px/1 var(--f);letter-spacing:.1em;color:var(--mu);text-transform:uppercase;margin-bottom:3px}
.q-dl2{width:100%;border-collapse:collapse;font-size:13px}
.q-dl2 td{padding:4px 6px}.q-dl2 td.n{font:600 12.5px/1 var(--m);text-align:right}
.q-dl2 i.sq{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
@media (max-width:480px){.q-bs b{font-size:16px}.q-donut{grid-template-columns:100px minmax(0,1fr)}.q-dn{width:100px;height:100px}.q-dn::after{inset:14px}}

/* недавние игры — строки как у League of Graphs */
.q-hh{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 16px;background:var(--q-bh);border-bottom:2px solid var(--q-am)}
.q-hh>b{font:600 15px/1 var(--f)}
.q-hs{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 12px;border-left:1px solid #2c2c35}
.q-hs b{font:700 15px/1 var(--m)}.q-hs small{color:var(--mu);font-size:11px}
.q-hf{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--q-ln)}
.q-sel{height:36px;border-radius:8px;border:1px solid var(--ln2);background:#0d0d10;color:var(--tx);padding:0 30px 0 12px;font:500 13px/1 var(--f);appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8e897f 50%),linear-gradient(135deg,#8e897f 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat;max-width:100%}
.q-gm{position:relative;display:block;padding:10px 16px 10px 20px;border-top:1px solid var(--q-ln);cursor:pointer;background:linear-gradient(90deg,rgba(54,214,195,.07),transparent 40%)}
.q-gm.l{background:linear-gradient(90deg,rgba(255,107,129,.08),transparent 40%)}
.q-gm::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--win)}
.q-gm.l::before{background:var(--loss)}
.q-gm:hover{background-color:#16161b}
.q-gm:focus-visible{outline-offset:-2px}
.q-gt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--mu)}
.q-gt>b{font:600 14px/1 var(--f);color:var(--win)}.q-gm.l .q-gt>b{color:var(--loss)}
.q-gt span+span::before{content:"";display:inline-block;width:1px;height:11px;background:#33333d;margin-right:10px;vertical-align:-1px}
.q-gt .q-dl{font-weight:700;color:var(--win)}.q-gt .q-dl.loss{color:var(--loss)}
.q-gb{display:grid;grid-template-columns:auto 92px 104px 70px 64px minmax(0,1fr) 40px 300px;gap:14px;align-items:center;margin-top:8px}
.q-gh{position:relative;display:block}
.q-gh .q-lv{position:absolute;right:-6px;bottom:-6px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:#101014;border:1px solid #3a3a44;font:700 10.5px/18px var(--m);font-style:normal;text-align:center}
.q-gk b{display:block;font:700 15px/1.15 var(--m);white-space:nowrap}.q-gk b i{font-style:normal;color:var(--loss)}
.q-gk small,.q-gs small{display:block;color:var(--mu);font-size:11.5px;margin-top:3px;white-space:nowrap}
.q-gs b{display:block;font:700 14px/1.15 var(--m);white-space:nowrap}
.q-gi{display:grid;grid-template-columns:repeat(6,26px);gap:3px;justify-content:start}
.q-it{width:26px;height:26px;border-radius:6px;background:#1d1d24;border:1px solid #2c2c35;object-fit:cover}
.q-it.weapon{border-color:#b9733a}.q-it.vitality{border-color:#5f9c3a}.q-it.spirit{border-color:#8a5ac8}
.q-gi0{width:26px;height:26px;border-radius:6px;background:#17171c}
.q-gp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;min-width:0}
.q-tm{display:flex;flex-direction:column;gap:1px;min-width:0}
.q-tm.t0{border-left:2px solid rgba(255,176,32,.45);padding-left:6px}.q-tm.t1{border-left:2px solid rgba(90,169,255,.45);padding-left:6px}
.q-pl{display:flex;align-items:center;gap:5px;min-width:0;text-decoration:none;font-size:12px;line-height:17px;color:#cfc9be}
.q-pl img{width:16px;height:16px;border-radius:4px;flex:none;background:#1d1d24}
.q-pl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-pl.q-me{color:var(--q-am);font-weight:700}
a.q-pl:hover span{text-decoration:underline}
.q-gtg{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.q-gtg .tag{text-transform:none;letter-spacing:0;font-size:11.5px;height:22px}
.q-more{display:block;width:calc(100% - 32px);margin:12px 16px 14px}
@media (max-width:1180px){.q-gb{grid-template-columns:auto 86px 96px 64px 58px minmax(0,1fr) 40px 230px}}
@media (max-width:1000px){.q-gb{grid-template-columns:auto 90px 100px 64px minmax(0,1fr) 40px}.q-gb .qh{display:none}.q-gp{grid-column:1/-1}}
@media (max-width:640px){
 .q-gm{padding:10px 12px 10px 16px}

  const B = {s1: [], s2: [], s3: [], l2: [], long: []}; let pos = 0;

    if (pos <= 3) B['s' + pos].push(won(m));

  ranks.forEach(r => R[r.account_id] = r);
  hs.forEach(h => { (H[h.account_id] = H[h.account_id] || {})[h.hero_id] = h; const t = T[h.account_id] = T[h.account_id] || {m: 0, w: 0}; t.m += h.matches_played || 0; t.w += h.wins || 0; });
  return players.map(p => {
    const id = p.account_id, hid = p.hero_id, h = (H[id] || {})[hid] || {}, t = T[id] || {m: 0, w: 0}, r = R[id] || {};
    const hm = h.matches_played || 0, hw = h.wins || 0, tags = [];
    if (hm >= 20 && t.m && hm / t.m >= .25) tags.push(['a', 'мейн героя']);
    else if (hm >= 150) tags.push(['b', 'ветеран героя']);
    if (hm <= 2 && t.m >= 30) tags.push(['r', hm ? 'почти не играл' : 'первый раз на герое']);
    if (t.m && t.m < 60) tags.push(['', 'новичок']);
    const ws = r.last_match && r.last_match.player_rank_initial_win_streak;
    if (ws >= 3 && r.last_match.start_time > now() - 86400 * 2) tags.push(['g', 'серия побед · ' + ws]);
    if (hm >= 15 && hw / hm >= .6) tags.push(['g', 'сильный на герое']);
    if (hm >= 15 && hw / hm <= .4) tags.push(['r', 'слабый на герое']);
    const threat = hm >= 10 ? (hw / hm - .5) * Math.min(1, hm / 60) + (ws >= 3 ? .05 : 0) + (r.badge || 0) / 1000 : (r.badge || 0) / 1000 - .1;
    return {id, hid, team: p.team, lane: p.assigned_lane, name: (S[id] || {}).personaname || 'Скрытый игрок', avatar: (S[id] || {}).avatarmedium, badge: r.badge || 0, hm, hw, tm: t.m, tw: t.w, kda: hm ? (h.kills + h.assists) / Math.max(1, h.deaths) : 0, tags, threat};
  });
}

function lineChart(series, w = 640, h = 220) {
  const xs = series.flatMap(s => s.pts.map(p => p[0])), ys = series.flatMap(s => s.pts.map(p => p[1]));

  const x = v => pl0 + (w - pl0 - pr) * v / X, y = v => pt + (h - pt - pb) * (1 - v / Y);
  const grid = [0, .25, .5, .75, 1].map(f => `<line x1="${pl0}" x2="${w - pr}" y1="${y(Y * f)}" y2="${y(Y * f)}" stroke="#26262e"/><text x="${pl0 - 6}" y="${y(Y * f) + 4}" text-anchor="end" font-size="10.5" fill="#6a665e">${nf(Y * f / 1000)}к</text>`).join('');
  const xt = []; for (let t = 0; t <= X; t += 300) xt.push(`<text x="${x(t)}" y="${h - 6}" text-anchor="middle" font-size="10.5" fill="#6a665e">${t / 60}</text>`);
  const lines = series.map(s => `<polyline fill="none" stroke="${s.c}" stroke-width="${s.w || 2.5}" ${s.dash ? 'stroke-dasharray="5 5"' : ''} points="${s.pts.map(p => x(p[0]) + ',' + y(p[1])).join(' ')}"/><circle cx="${x(s.pts[s.pts.length - 1][0])}" cy="${y(s.pts[s.pts.length - 1][1])}" r="3.5" fill="${s.c}"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Души по времени">${grid}${xt.join('')}${lines}</svg>`;
}
// ---------- разбор как у RUINER: вклад, вердикт, почему умирал, номинации, метки ----------
// всё считается внутри матча: игрок против среднего в этом матче (а не по слухам)
function mLast(p) { return p.stats[p.stats.length - 1] || {}; }
function mAt(p, t, k = 'net_worth') { let v = 0; for (const s of p.stats) if (s.time_stamp_s <= t) v = s[k] || 0; return v; }
function mAnalyze(mi) {
  const P = mi.players, dur = mi.duration_s, A = new Map();
  const avg = (L, f) => L.reduce((a, p) => a + f(p), 0) / Math.max(1, L.length);
  const dmg = p => mLast(p).player_damage || 0, boss = p => mLast(p).boss_damage || 0, heal = p => mLast(p).teammate_healing || 0;
  const tk = t => P.filter(p => p.team === t).reduce((a, p) => a + p.kills, 0);
  const avgD = avg(P, p => p.deaths), avgDmg = avg(P, dmg), avgB = avg(P, boss);
  const cap = v => Math.max(0, Math.min(2, v));
  for (const p of P) {
    const T = P.filter(q => q.team === p.team), s = mLast(p);
    const tnw = avg(T, q => q.net_worth), tkills = tk(p.team);
    const kp = tkills ? (p.kills + p.assists) / tkills : 0, tkp = avg(T, q => tkills ? (q.kills + q.assists) / tkills : 0);
    const shots = (s.shots_hit || 0) + (s.shots_missed || 0), acc = shots >= 300 ? s.shots_hit / shots : null;
    const r = {souls: cap(p.net_worth / Math.max(1, tnw)), dmg: cap(dmg(p) / Math.max(1, avgDmg)), kp: cap(tkp ? kp / tkp : 1), live: cap((avgD + 1) / (p.deaths + 1)), obj: cap(avgB ? boss(p) / avgB : 1)};
    let sc = .25 * r.souls + .25 * r.dmg + .2 * r.kp + .2 * r.live + .1 * r.obj;
    const hb = Math.min(.12, heal(p) / 40000); sc += hb;
    const score = Math.max(0, Math.min(100, Math.round(50 * sc)));
    const prob = [];
    if (p.deaths >= 5 && p.deaths >= avgD * 1.5) prob.push(`умирал ${p.deaths} раз — в 1,5 раза чаще среднего (${avgD.toFixed(1)})`);
    if (p.net_worth <= .75 * tnw) prob.push(`душ ${nf(p.net_worth)} — на ${pc(tnw - p.net_worth, tnw)}% меньше среднего в команде`);
    if (dmg(p) <= .7 * avgDmg && heal(p) < 8000) prob.push(`урона по героям ${nf(dmg(p))} — на ${pc(avgDmg - dmg(p), avgDmg)}% меньше среднего в матче`);
    if (tkills >= 10 && kp < .35) prob.push(`участие в убийствах ${Math.round(100 * kp)}% — почти не был в драках`);
    if (p.abandon_match_time_s) prob.push(`вышел из матча на ${mmss(p.abandon_match_time_s)}`);

async function restlessItems(hid) {
  const k = hid + '|' + F.b; if (RLC[k]) return RLC[k];
  RLC[k] = (async () => {
    const bq = F.b ? '&min_average_badge=' + F.b : '', t = t30();
    const PH = [[0, 600, 'Сначала', 'до 10 мин'], [600, 1500, 'Потом', '10–25 мин'], [1500, 0, 'В конце', '25+ мин']];
    const [HSx, ...PL] = await Promise.all([api(`analytics/hero-stats?min_unix_timestamp=${t}${bq}`), ...PH.map(([a, b]) => api(`analytics/item-stats?hero_id=${hid}&min_unix_timestamp=${t}${bq}&min_bought_at_s=${a}${b ? '&max_bought_at_s=' + b : ''}`))]);
    const hb = HSx.find(x => x.hero_id === hid); if (!hb || hb.matches < 300) return null;
    const bw = hb.wins / hb.matches, used = new Set();

function route() {
  vNew(); clearInterval(LVT);
  const h = location.hash.replace(/^#/, '') || 'home';
  const [t, a, b] = h.split('/');
  if (t === 'matches') { location.replace('#home'); return; }
  const tab = {m: 'home', h: b === 'me' ? 'home' : 'meta', who: 'home', profile: 'home', form: 'home', mine: 'home', now: 'live', top: 'lb', leaderboard: 'lb', heroes: 'meta', builds: 'meta', b: 'meta'}[t] || t;
  $$('#tabs a').forEach(x => x.classList.toggle('on', x.dataset.t === tab));
  $('#v').onclick = null;
  window.scrollTo(0, 0);
  if (t === 'live' || t === 'now') return viewLive(a);
  if (t === 'form') return a ? viewStats(a) : viewForm();
  if (t === 'mine') return viewMine();
  if (t === 'meta') return viewMeta();
  if (t === 'lb' || t === 'top' || t === 'leaderboard') return viewLb();
  if (t === 'pro') return viewPro();
  if (t === 'upd') return viewUpd(a);
  if (t === 'heroes' || t === 'builds') return viewHeroes();
  if ((t === 'h' || t === 'b') && a) return viewHero(a, b);
  if (t === 'm' && a) return viewMatch(a);
  return viewHome();
}

// Поэтому «#1 Рэм» = самый высокий ранг среди мейнов Рэм в топ-1000, а не лучший Рэм из всех.

    const el = $('#rtop'); if (el) el.insertAdjacentHTML('beforeend', ` · <a class="lnk" href="#lb" id="eub2">#${i + 1} в топе: ${REGN[rg]}</a>`);
    ['#eub', '#eub2'].forEach(s => { const a = $(s); if (a) a.onclick = () => { try { sessionStorage.setItem('lb-seek', '1'); } catch (er) {} }; }); }).catch(() => {});

// ---------- статистика: Обзор · Линия · Смерти · Экономика · Бой (по поминутным данным последних матчей) ----------

  return {m, P, me, tm, dur, won, mates, foes, mate: mates.find(p => p !== me && p.assigned_lane === me.assigned_lane), lf: foes.filter(p => p.assigned_lane === me.assigned_lane)};
}

// ----- Линия: дуэт против дуэта на 9:00 -----

}

// ----- Экономика: откуда души и куда уходят -----
const SRC = [['lane', 'Крипы на линии', '#3fbf8f', ['lane_creeps']], ['jg', 'Лес', '#a3d34a', ['neutrals']], ['kill', 'Убийства', '#ff6b81', ['players']], ['ast', 'Помощь', '#ff9eb0', ['assists']],

  const bf = Object.entries(BH).filter(([h, o]) => o.n >= 2 && D.heroes[h]).map(([h, o]) => ({h: +h, n: o.n, r: o.r / o.n})).sort((a, b) => b.r - a.r)[0];

}
