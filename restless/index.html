<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Restless · Deadlock</title>
<meta name="description" content="Restless — кто в матче, мета героев, сборки по винрейту и разбор матча в Deadlock">
<meta name="theme-color" content="#0a1420">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Cormorant+SC:wght@600;700&family=Cormorant+Garamond:ital,wght@1,600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script>try{var _s=localStorage.getItem('rl-skin');if(!localStorage.getItem('rl-skin-pick')&&(!_s||_s=='labs'))_s='graphs';document.documentElement.dataset.skin=_s||'graphs'}catch(e){document.documentElement.dataset.skin='graphs'}</script>
<style>
/* Restless 2.0 — приложение: шапка с вкладками и поиском игрока, ниже экран вкладки.
   Чёрный, янтарный акцент, заголовки Oswald капсом (как у Deadlock Labs), цифры моноширинные, метки игроков цветными плашками. */
:root{
 --bg:#09090b; --s1:#111115; --s2:#17171c; --s3:#1f1f26; --ln:#26262e; --ln2:#33333d;
 --tx:#f2ede4; --mu:#8e897f; --mu2:#6a665e; --ac:#ffb020; --acd:#1c1303; --hot:#ff5a1f;
 --win:#39d17f; --loss:#ff5050; --us:#ffb020; --en:#4da3ff; --r:14px;
 --f:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --h:'Oswald','Arial Narrow',Impact,sans-serif; --m:'JetBrains Mono',ui-monospace,Consolas,monospace;
 color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--f);-webkit-text-size-adjust:100%}
body{min-height:100vh}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
img{display:block}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.num,.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.win{color:var(--win)}.loss{color:var(--loss)}.mu{color:var(--mu)}
.hide{display:none!important}

/* шапка */
.nav{position:sticky;top:0;z-index:30;background:rgba(9,9,11,.92);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
.nav .in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:18px;height:62px;padding:0 max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px))}
.logo{font:700 24px/1 var(--h);letter-spacing:.07em;color:var(--ac);text-decoration:none;white-space:nowrap}
.logo small{display:block;font:600 9.5px/1 var(--f);letter-spacing:.18em;color:var(--mu);margin-top:3px}
.tabs{display:flex;gap:2px;height:100%}
.tabs a{display:flex;align-items:center;gap:8px;padding:0 14px;text-decoration:none;font:600 13.5px/1 var(--f);color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--tx)}
.tabs a.on{color:var(--tx);border-bottom-color:var(--ac)}
.tabs a .dot{width:7px;height:7px;border-radius:50%;background:var(--win);box-shadow:0 0 8px var(--win)}
.sp{flex:1}
.srch{position:relative;width:min(320px,34vw)}
.srch input{width:100%;height:38px;border-radius:10px;border:1px solid var(--ln2);background:var(--s1);padding:0 12px 0 36px;font-size:13.5px}
.srch svg{position:absolute;left:11px;top:11px;width:16px;height:16px;opacity:.55}
.srch .dd{position:absolute;top:44px;left:0;right:0;background:var(--s2);border:1px solid var(--ln2);border-radius:12px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.6);max-height:60vh;overflow:auto}
.srch .dd button{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;padding:7px;border-radius:8px}
.srch .dd button:hover,.srch .dd button.on{background:var(--s3)}
.srch .dd img{width:32px;height:32px;border-radius:50%;background:var(--s3)}
.srch .dd b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch .dd small{color:var(--mu);font-size:11.5px}
.me{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border-radius:24px;background:var(--s1);border:1px solid var(--ln);max-width:240px;text-decoration:none}
.me img.av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--s3)}
.me b{font:600 13px/1.1 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:120px}
.me span{font-size:11px;color:var(--mu);white-space:nowrap}
.me .rk{width:28px;height:28px}
@media (max-width:860px){.nav .in{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:0;gap:10px}.tabs{order:3;width:100%;overflow-x:auto;height:44px}.srch{width:auto;flex:1}.me b{max-width:80px}.logo small{display:none}}

/* страница */
.wrap{max-width:1280px;margin:0 auto;padding:22px max(18px,env(safe-area-inset-right,0px)) 70px max(18px,env(safe-area-inset-left,0px))}
.h1{font:700 34px/1.05 var(--h);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.h1 em{font-style:normal;color:var(--ac)}
.h2{display:flex;align-items:baseline;gap:10px;font:600 15px/1 var(--h);letter-spacing:.1em;text-transform:uppercase;color:var(--tx);margin:28px 0 12px}
.h2 small{font:500 12.5px/1 var(--f);letter-spacing:0;text-transform:none;color:var(--mu)}
.h2 .sp{flex:1}
.sub{color:var(--mu);font-size:13.5px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);min-width:0}
.pad{padding:16px 18px}
.row{display:flex;align-items:center;gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:980px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.h1{font-size:28px}}
.load{padding:40px 0;color:var(--mu);display:flex;align-items:center;gap:12px}
.load::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--ln2);border-top-color:var(--ac);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{padding:14px 16px;border-radius:12px;background:#2a1212;color:#ffb3ab;font-size:14px}
.empty{padding:18px;color:var(--mu);font-size:14px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;background:var(--ac);color:var(--acd);font:700 14px/1 var(--f);text-decoration:none;white-space:nowrap}
.btn.g{background:var(--s3);color:var(--tx);border:1px solid var(--ln2)}
.btn.s{height:34px;padding:0 12px;font-size:13px}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 11px;border-radius:7px;font:600 12.5px/1 var(--f);color:var(--mu);white-space:nowrap}
.seg button.on{background:var(--s3);color:var(--tx)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font:700 10.5px/1 var(--f);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;background:var(--s3);color:#d6d1c7}
.tag.a{background:#3a2a07;color:var(--ac)}.tag.g{background:#0f3321;color:var(--win)}.tag.r{background:#3a1212;color:#ff8a80}.tag.b{background:#0f2440;color:#8cc4ff}.tag.h{background:var(--hot);color:#1a0800}
#tagtip{position:fixed;z-index:60;max-width:290px;transform:translate(-50%,-100%);background:var(--bg);border:1px solid var(--ln2);border-radius:8px;color:var(--tx);font:500 12.5px/1.45 var(--f);letter-spacing:0;padding:8px 11px;pointer-events:none;box-shadow:0 10px 26px rgba(0,0,0,.5);text-transform:none;white-space:normal}
#tagtip.dn{transform:translate(-50%,0)}
.hi{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--s3);flex:none}
.hi.s{width:28px;height:28px;border-radius:6px}.hi.l{width:56px;height:56px;border-radius:12px}
.rk{width:36px;height:36px;object-fit:contain;flex:none}
.bar{height:6px;border-radius:3px;background:var(--s3);overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;border-radius:3px}

/* главная без игрока */
.land{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--ln);background:radial-gradient(900px 420px at 85% 0%,rgba(255,176,32,.16),transparent 60%),linear-gradient(180deg,#141418,#0d0d10);padding:42px 34px}
.land .h1{font-size:clamp(34px,5vw,58px);max-width:15ch}
.land p{max-width:58ch;color:#c9c3b8;font-size:16px;margin:14px 0 22px}
.land form{display:flex;gap:10px;max-width:620px;flex-wrap:wrap}
.land input{flex:1;min-width:220px;height:48px;border-radius:12px;border:1px solid var(--ln2);background:#0b0b0e;padding:0 16px;font-size:15px}
.land .btn{height:48px}
.land .ex{margin-top:14px;font-size:13.5px;color:var(--mu)}
.land .ex button{color:var(--ac);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.land .art{position:absolute;right:-20px;bottom:-30px;display:flex;gap:10px;opacity:.9;pointer-events:none}
.land .art img{width:118px;height:236px;object-fit:cover;border-radius:12px;transform:rotate(-6deg);box-shadow:0 20px 40px rgba(0,0,0,.6)}
.land .art img:nth-child(2){transform:rotate(3deg) translateY(-26px)}.land .art img:nth-child(3){transform:rotate(9deg) translateY(-6px)}
@media (max-width:980px){.land .art{display:none}.land{padding:28px 20px}}
.feat a{display:block;text-decoration:none;padding:16px 18px}
.feat b{display:block;font:600 18px/1.1 var(--h);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.feat span{color:var(--mu);font-size:13.5px}
.feat a:hover{background:var(--s2)}

/* дашборд */
.prof{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px 20px}
.prof .av{width:76px;height:76px;border-radius:16px;object-fit:cover;background:var(--s3)}
.prof .nm{font:700 30px/1.05 var(--h);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof .rkb{display:flex;align-items:center;gap:12px;text-align:right}
.prof .rkb .rk{width:64px;height:64px}
.prof .rkb b{display:block;font:700 22px/1 var(--h);letter-spacing:.03em}
@media (max-width:640px){.prof{grid-template-columns:auto minmax(0,1fr)}.prof .rkb{grid-column:1/-1;text-align:left}.prof .av{width:56px;height:56px}.prof .nm{font-size:22px}}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat span{font:600 11px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.stat b{font:700 28px/1.05 var(--m)}
.stat small{color:var(--mu);font-size:12.5px}
.traj{display:flex;gap:4px;flex-wrap:wrap}
.traj a{width:24px;height:30px;border-radius:5px;display:grid;place-items:center;font:700 11px var(--m);text-decoration:none}
.traj a.w{background:#0f3321;color:var(--win)}.traj a.l{background:#3a1212;color:var(--loss)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:120px;padding-top:6px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wk i{display:block;width:100%;max-width:34px;border-radius:5px 5px 2px 2px;background:var(--win)}
.wk i.l{background:var(--loss)}.wk i.n{background:var(--s3)}
.wk small{font:600 10.5px/1 var(--m);color:var(--mu)}
.wk em{font:700 11px/1 var(--m);font-style:normal}
.pool a{display:grid;grid-template-columns:40px minmax(0,1fr) 90px 52px;gap:12px;align-items:center;padding:9px 14px;text-decoration:none;border-top:1px solid var(--ln)}
.pool a:first-child{border-top:0}
.pool a:hover{background:var(--s2)}
.pool b{display:block;font-weight:600;font-size:14px}
.pool small{color:var(--mu);font-size:12px}
.pool .wr{font:700 15px/1 var(--m);text-align:right}
.mt{display:grid;grid-template-columns:4px 40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px 10px 0;text-decoration:none;border-top:1px solid var(--ln)}
.mt:first-child{border-top:0}
.mt:hover{background:var(--s2)}
.mt .st{height:100%;border-radius:0 3px 3px 0}
.mt .k{font:700 15px/1.2 var(--m)}
.mt .r{text-align:right;font-size:12.5px;color:var(--mu)}
.mt .r b{display:block;font:600 14px/1.2 var(--h);letter-spacing:.06em}
.mt .dl{font:700 12px var(--m)}

/* лобби */
.lob{overflow-x:auto}
.lob table{width:100%;border-collapse:collapse;min-width:820px}
.lob th{font:700 10.5px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-align:left;padding:10px 12px;border-bottom:1px solid var(--ln)}
.lob td{padding:9px 12px;border-bottom:1px solid var(--ln);vertical-align:middle;font-size:13.5px}
.lob tr:last-child td{border-bottom:0}
.lob tr.mine td{background:rgba(255,176,32,.07)}
.lob tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--ac)}
.lob tr.thr td{background:rgba(255,90,31,.08)}
.lob tr.thr td:first-child{box-shadow:inset 3px 0 0 var(--hot)}
.lob tr.en{cursor:pointer}
.lob tr.en:hover td,.lob tr.sel td{background:var(--s2)}
.lob .pn{display:flex;align-items:center;gap:10px;min-width:0}
.lob .pn b{display:block;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.lob .pn small{display:block;color:var(--mu);font-size:11.5px}
.lob .av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--s3);flex:none}
.lob .rkc{display:flex;align-items:center;gap:8px;white-space:nowrap}
.lob .rkc .rk{width:30px;height:30px}
.lob .wr{font:700 14px/1 var(--m)}
.lob .tags{display:flex;flex-wrap:wrap;gap:4px}
.thd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:12px 14px;border-bottom:1px solid var(--ln)}
@media (max-width:640px){.thd .hint{display:none}.g4.st{grid-template-columns:repeat(2,minmax(0,1fr))}.stat b{font-size:22px}}
.thd b{font:600 15px/1 var(--h);letter-spacing:.08em;text-transform:uppercase}
.thd i{width:10px;height:10px;border-radius:3px}
.cnt{padding:14px 16px;display:grid;gap:10px}
.cr{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center}
.cr .its{display:flex;flex-wrap:wrap;gap:6px}
.cr.fl{animation:fl 1.4s ease-out}
@keyframes fl{0%,40%{background:rgba(255,176,32,.14)}100%{background:transparent}}
.cr{border-radius:10px;padding:4px}
.crn{font:600 13px/1 var(--f);text-decoration:none;min-width:96px;margin-right:4px}
.crn:hover{color:var(--ac)}
.it{display:inline-flex;align-items:center;gap:7px;padding:5px 8px 5px 5px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);font:600 12.5px/1 var(--f);white-space:nowrap}
.it img{width:24px;height:24px;border-radius:5px;background:var(--s3)}
.it em{font:700 12px/1 var(--m);font-style:normal;color:var(--win)}
.it em.l{color:var(--loss)}
.note{font-size:12.5px;color:var(--mu);margin:8px 0 0}

/* герои: мета */
.tl{display:grid;grid-template-columns:64px minmax(0,1fr);border-top:1px solid var(--ln)}
.tl:first-child{border-top:0}
.tl .t{display:grid;place-items:center;font:700 30px/1 var(--h)}
.tl .hs{display:flex;flex-wrap:wrap;gap:8px;padding:12px;min-width:0}
.hc{display:flex;flex-direction:column;width:92px;text-decoration:none;border-radius:10px;overflow:hidden;background:var(--s2);border:1px solid var(--ln)}
.hc:hover{border-color:var(--ac)}
.hc img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--s3)}
.hc b{font:600 11.5px/1.15 var(--f);padding:6px 7px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc span{display:flex;justify-content:space-between;padding:3px 7px 7px;font:700 11px/1 var(--m)}
.hc span small{color:var(--mu);font-weight:500}
.flt{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* страница героя */
.hh{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--ln);min-height:260px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:end;padding:24px;background:#101014}
.hh .bgi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
.hh::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,9,11,.95),rgba(9,9,11,.55) 60%,rgba(9,9,11,.2)),linear-gradient(0deg,rgba(9,9,11,.85),transparent 60%)}
.hh>*{position:relative;z-index:1}
.hh .vi{width:200px;aspect-ratio:1/2;object-fit:cover;border-radius:12px;align-self:stretch;max-height:300px;box-shadow:0 0 0 2px var(--hc,var(--ac))}
.hh .ty{font:700 11px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--hc,var(--ac))}
.hh .nm{font:700 clamp(40px,6vw,68px)/.95 var(--h);letter-spacing:.02em;text-transform:uppercase;margin:6px 0 14px}
.hh .ss{display:flex;flex-wrap:wrap;gap:22px}
.hh .ss div span{display:block;font:600 10.5px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:5px}
.hh .ss div b{font:700 24px/1 var(--m)}
@media (max-width:700px){.hh{grid-template-columns:96px minmax(0,1fr);gap:14px;padding:16px;min-height:0}.hh .vi{width:96px;max-height:190px}.hh .ss{gap:14px}.hh .ss div b{font-size:18px}}
.mu-l a{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;text-decoration:none;border-top:1px solid var(--ln)}
.mu-l a:first-child{border-top:0}
.mu-l a:hover{background:var(--s2)}
.mu-l b{font-weight:600;font-size:13.5px}
.mu-l small{display:block;color:var(--mu);font-size:11.5px}
.mu-l .wr{font:700 14px/1 var(--m)}
.so{overflow-x:auto;padding:14px 16px}
.so table{border-collapse:separate;border-spacing:4px;min-width:560px}
.so td{width:30px;height:30px;border-radius:6px;background:var(--s2);text-align:center;font:700 11.5px/1 var(--m);color:var(--mu2)}
.so td.on{background:var(--ac);color:var(--acd)}
.so td.un{background:#3a2a07;color:var(--ac)}
.so th{text-align:left;padding-right:10px;white-space:nowrap}
.so th .row{gap:8px;font:600 12.5px/1.2 var(--f)}
.so th img{width:28px;height:28px;border-radius:6px;background:var(--s3)}
.so th small{display:block;color:var(--mu);font-size:10.5px;font-weight:500}
.phs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:980px){.phs{grid-template-columns:minmax(0,1fr)}}
.ir{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--ln)}
.ir:first-child{border-top:0}
.ir img{width:36px;height:36px;border-radius:8px;background:var(--s3)}
.ir b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir small{color:var(--mu);font-size:11.5px}
.ir .wr{font:700 14px/1 var(--m);text-align:right}
.ir .wr small{display:block;font:500 10.5px var(--f)}
.bd{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:11px 16px;border-top:1px solid var(--ln)}
.bd:first-child{border-top:0}
.bd b{display:block;font-weight:600}
.bd small{color:var(--mu);font-size:12px}
.bd .wr{font:700 16px/1 var(--m);text-align:right}

/* разбор */
.mh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}

.sbw{overflow-x:auto}
.sb{width:100%;border-collapse:collapse;min-width:420px}
.sb th{font:700 10.5px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-align:left;padding:10px 12px}

.ptags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}

.pt{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(80px,1fr) 64px;gap:12px;align-items:center}

.pt i b.up{left:50%;background:var(--win)}.pt i b.dn{right:50%;background:var(--loss)}
.pt i::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--mu2)}

/* ===== 28.10 — три вида: «Labs» (чёрный + оранжевый, вкладки сверху), «Город» (как интерфейс Deadlock: латунь, кремовый, рамки ар-деко),
   «Графики» (как League of Graphs: сине-серые панели, бирюзовый, меню слева). html[data-skin], выбор — localStorage rl-skin ===== */
.skins{display:inline-flex;gap:4px;padding:3px;border-radius:10px;background:var(--s1);border:1px solid var(--ln)}
.skins button{width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.skins button i{width:14px;height:14px;border-radius:50%;display:block}
.skins button.on{background:var(--s3)}
.skins [data-s="labs"] i{background:linear-gradient(135deg,#ff6a00 50%,#0a0a0a 50%)}
.skins [data-s="city"] i{background:linear-gradient(135deg,#d6b46a 50%,#1a2a24 50%)}
.skins [data-s="graphs"] i{background:linear-gradient(135deg,#4be3e8 50%,#2f4466 50%)}
.skpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 18px}
.skpick button{text-align:left;padding:14px;border-radius:14px;border:1px solid var(--ln2);background:var(--s1)}
.skpick button.on{outline:2px solid var(--ac)}
.skpick b{display:block;font:600 16px/1.1 var(--h);letter-spacing:.05em;text-transform:uppercase;margin:10px 0 4px}
.skpick span{font-size:12.5px;color:var(--mu)}
.skpick .sw{height:56px;border-radius:9px}
.skpick [data-s="labs"] .sw{background:linear-gradient(90deg,#0a0a0a 0 60%,#ff6a00 60% 64%,#161616 64%)}
.skpick [data-s="city"] .sw{background:linear-gradient(90deg,#14201b 0 60%,#d6b46a 60% 64%,#efe3c6 64%)}
.skpick [data-s="graphs"] .sw{background:linear-gradient(90deg,#2a3b58 0 22%,#3a5078 22% 60%,#4be3e8 60% 64%,#46608c 64%)}
@media (max-width:640px){.skpick{grid-template-columns:minmax(0,1fr)}.skpick .sw{height:28px}}

/* --- Labs: строже и резче — почти чёрный, один оранжевый, углы 4px, всё капсом --- */
html[data-skin="labs"]{--bg:#070707;--s1:#0f0f0f;--s2:#151515;--s3:#1d1d1d;--ln:#232323;--ln2:#2e2e2e;--tx:#f5f5f5;--mu:#8a8a8a;--ac:#ff6a00;--acd:#160700;--hot:#ff2e2e;--r:4px}

html[data-skin="labs"] .tabs a{text-transform:uppercase;letter-spacing:.08em;font:700 13px/1 var(--h)}
html[data-skin="labs"] .tabs a.on{border-bottom-width:3px}
html[data-skin="labs"] .btn,html[data-skin="labs"] .seg,html[data-skin="labs"] .seg button,html[data-skin="labs"] .srch input,html[data-skin="labs"] .tag,html[data-skin="labs"] .hc,html[data-skin="labs"] .it{border-radius:3px}
html[data-skin="labs"] .btn{text-transform:uppercase;letter-spacing:.06em}
html[data-skin="labs"] .tag{background:transparent;border:1px solid currentColor;color:var(--ac)}
html[data-skin="labs"] .tag.g{color:var(--win)}html[data-skin="labs"] .tag.r{color:var(--loss)}html[data-skin="labs"] .tag.b{color:#6fb6ff}html[data-skin="labs"] .tag.h{background:var(--ac);color:#000;border-color:var(--ac)}
html[data-skin="labs"] .h2{border-left:3px solid var(--ac);padding-left:10px}
html[data-skin="labs"] .land{background:linear-gradient(115deg,#0d0d0d 0 55%,#ff6a00 55% 55.4%,#120a04 55.4%);border-radius:4px}
html[data-skin="labs"] .hh{border-radius:4px}html[data-skin="labs"] .hh .vi{box-shadow:none;border-bottom:4px solid var(--ac);border-radius:2px}
html[data-skin="labs"] .hh .nm{font-size:clamp(46px,7vw,86px)}

/* --- Город: как меню Deadlock — тёмно-зелёный, латунь, кремовые плашки, двойные рамки, Cormorant SC --- */
html[data-skin="city"]{--bg:#0e1512;--s1:#141e1a;--s2:#1a2722;--s3:#22332c;--ln:#2c3f37;--ln2:#3b5247;--tx:#efe3c6;--mu:#a49a80;--mu2:#7a735f;--ac:#d6b46a;--acd:#1b1406;--hot:#c8553d;--win:#8fcf8a;--loss:#e07a5f;--r:2px;
 --h:'Cormorant SC','Cormorant Garamond',Georgia,serif;--f:'IBM Plex Sans',system-ui,sans-serif}
html[data-skin="city"] body{background:radial-gradient(1200px 600px at 50% -10%,rgba(214,180,106,.10),transparent 70%),repeating-linear-gradient(90deg,rgba(214,180,106,.025) 0 1px,transparent 1px 64px),var(--bg)}
html[data-skin="city"] .nav{background:rgba(14,21,18,.95);border-bottom:1px solid var(--ac);box-shadow:0 3px 0 -2px var(--ac)}
html[data-skin="city"] .logo{font:700 28px/1 var(--h);letter-spacing:.16em}
html[data-skin="city"] .tabs a{font:700 17px/1 var(--h);letter-spacing:.08em;text-transform:none}
html[data-skin="city"] .tabs a.on{color:var(--ac)}
html[data-skin="city"] .h1{font:700 44px/1 var(--h);letter-spacing:.04em;text-transform:none}
html[data-skin="city"] .h2{font:700 21px/1 var(--h);letter-spacing:.06em;text-transform:none;justify-content:flex-start;gap:12px}
html[data-skin="city"] .h2::before{content:"";width:22px;height:9px;background:linear-gradient(var(--ac),var(--ac)) 0 50%/100% 1px no-repeat,linear-gradient(45deg,transparent 40%,var(--ac) 40% 60%,transparent 60%) 50% 50%/9px 9px no-repeat;flex:none;align-self:center}
html[data-skin="city"] .card{border:1px solid var(--ln2);outline:1px solid rgba(214,180,106,.18);outline-offset:3px;border-radius:2px}
html[data-skin="city"] .btn{border-radius:0;background:var(--ac);clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);padding:0 24px;font:700 15px/1 var(--h);letter-spacing:.08em}
html[data-skin="city"] .btn.g{background:var(--s3);color:var(--tx);border:0}
html[data-skin="city"] .tag{border-radius:0;background:#efe3c6;color:#2a2418;font:700 11.5px/1 var(--h);letter-spacing:.06em;text-transform:none}
html[data-skin="city"] .tag.g{background:#cfe6c7;color:#173a17}html[data-skin="city"] .tag.r{background:#f0c9bd;color:#5a1d0f}html[data-skin="city"] .tag.b{background:#c9dbe6;color:#13324a}html[data-skin="city"] .tag.h{background:var(--hot);color:#fff}
html[data-skin="city"] .seg,html[data-skin="city"] .seg button,html[data-skin="city"] .srch input,html[data-skin="city"] .hc,html[data-skin="city"] .it{border-radius:0}
html[data-skin="city"] .land{border-radius:2px;border:1px solid var(--ac);background:radial-gradient(700px 400px at 80% 20%,rgba(214,180,106,.14),transparent 70%),linear-gradient(180deg,#16231e,#0e1512)}
html[data-skin="city"] .land .h1{font-size:clamp(40px,5.4vw,66px)}
html[data-skin="city"] .hh{border-radius:2px;border:1px solid var(--ac)}
html[data-skin="city"] .hh .vi{border-radius:0;box-shadow:0 0 0 1px var(--ac),0 0 0 6px var(--bg),0 0 0 7px var(--ac)}
html[data-skin="city"] .hh .nm{font-family:var(--h);text-transform:none;font-size:clamp(44px,6vw,74px)}
html[data-skin="city"] .stat b,html[data-skin="city"] .hh .ss div b{color:var(--ac)}
html[data-skin="city"] .prof .nm{font-family:var(--h);text-transform:none;font-size:34px}

/* --- Графики: как League of Graphs — сине-серые панели, бирюзовые подчёркивания, меню слева на ПК, метки рамкой --- */
html[data-skin="graphs"]{--bg:#2a3b58;--s1:#3a4f73;--s2:#425a82;--s3:#4b6590;--ln:#4e678f;--ln2:#5a75a0;--tx:#f2f6fb;--mu:#b7c4d8;--mu2:#93a4bf;--ac:#4be3e8;--acd:#0b2a33;--hot:#ffd84b;--win:#4be3e8;--loss:#ff8fa3;--r:6px;--h:'Roboto',system-ui,sans-serif;--f:'Roboto',system-ui,sans-serif}
html[data-skin="graphs"] .h1,html[data-skin="graphs"] .h2,html[data-skin="graphs"] .prof .nm,html[data-skin="graphs"] .hh .nm,html[data-skin="graphs"] .tabs a,html[data-skin="graphs"] .logo{text-transform:none;letter-spacing:0}

html[data-skin="graphs"] .tag.g{border-color:var(--ac);color:var(--ac)}html[data-skin="graphs"] .tag.r{border-color:var(--loss);color:var(--loss)}html[data-skin="graphs"] .tag.a,html[data-skin="graphs"] .tag.h{border-color:var(--hot);color:var(--hot);background:transparent}
html[data-skin="graphs"] .btn{background:var(--ac);color:var(--acd);border-radius:4px}
html[data-skin="graphs"] .card{border:0;box-shadow:0 2px 0 rgba(0,0,0,.12)}
html[data-skin="graphs"] .mt .st{width:4px}

@media (min-width:1100px){
 html[data-skin="graphs"] .nav{position:fixed;left:0;top:0;bottom:0;width:230px;border:0;background:#33476a;z-index:40}
 html[data-skin="graphs"] .nav .in{flex-direction:column;align-items:stretch;height:100%;gap:6px;padding:18px 0}

}

.vd.h{background:var(--ac);color:#140b00}.vd.b{background:#0f2440;color:#8cc4ff}.vd.a{background:#3a2a07;color:var(--ac)}.vd.r{background:#3a1212;color:#ff8a80}
.vd.big{height:auto;padding:10px 16px;font:700 26px/1 var(--h);letter-spacing:.04em;border-radius:8px}

/* карты героев как в Marvel Snap */
.sng{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 28px;padding:14px 8px 0}
@media (max-width:640px){.sng{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 22px}}
.sn{position:relative;perspective:700px;cursor:pointer;outline:none}
.sn-in{position:relative;aspect-ratio:3/4.1;border-radius:14px;transform:rotateX(var(--rx,0)) rotateY(var(--ry,0));transform-style:preserve-3d;transition:transform .25s cubic-bezier(.2,.8,.2,1);background:#15151a;box-shadow:0 0 0 3px #3a3a44,0 10px 24px rgba(0,0,0,.5)}
.sn:hover .sn-in,.sn:focus-visible .sn-in{transition-duration:.08s}
.sn-bg{position:absolute;inset:0;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#24242c,#0e0e12)}
.sn-bg img{width:100%;height:100%;object-fit:cover;opacity:.0}
.sn-art{position:absolute;left:0;right:0;bottom:0;width:100%;height:100%;object-fit:cover;object-position:top;border-radius:14px;transform:translateZ(18px)}
.sn-nm{position:absolute;left:6px;right:6px;bottom:8px;text-align:center;font:700 17px/1 var(--h);letter-spacing:.04em;text-transform:uppercase;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 12px rgba(0,0,0,.8);transform:translateZ(30px)}
.sn-foil{position:absolute;inset:0;border-radius:14px;pointer-events:none;opacity:0}
.sn-lv,.sn-sc{position:absolute;top:-10px;width:34px;height:38px;display:grid;place-items:center;font:700 17px/1 var(--m);color:#fff;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);z-index:3}
.sn-lv{left:-8px;background:#2b6fd6;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.sn-sc{right:-8px;background:#e86a10}
.sn-n{display:block;text-align:center;margin-top:8px;color:var(--mu);font-size:12px}
/* 2 — рамка цвета героя */
.sn.l2 .sn-in,.sn.l3 .sn-in,.sn.l4 .sn-in,.sn.l5 .sn-in,.sn.l6 .sn-in{box-shadow:0 0 0 3px var(--hc),0 0 0 5px rgba(0,0,0,.6),0 10px 24px rgba(0,0,0,.5)}
/* 3 — арт выходит за рамку: арт выше карты, верх растворяется */
.sn.l3 .sn-art,.sn.l4 .sn-art,.sn.l5 .sn-art,.sn.l6 .sn-art{height:118%;border-radius:0 0 14px 14px;-webkit-mask-image:linear-gradient(0deg,#000 80%,transparent);mask-image:linear-gradient(0deg,#000 80%,transparent)}
.sn.l3 .sn-art,.sn.l4 .sn-art,.sn.l5 .sn-art,.sn.l6 .sn-art{transform:translateZ(28px)}
/* 4 — живой фон: фон героя плывёт, арт поверх */
.sn.l4 .sn-bg img,.sn.l5 .sn-bg img,.sn.l6 .sn-bg img{opacity:.9;animation:snPan 14s ease-in-out infinite alternate}
.sn.l4 .sn-art,.sn.l5 .sn-art,.sn.l6 .sn-art{opacity:.92}
@keyframes snPan{from{transform:scale(1.15) translateX(-4%)}to{transform:scale(1.15) translateX(4%)}}
/* 5 — переливающаяся рамка и имя в 3D */
.sn.l5 .sn-in::before,.sn.l6 .sn-in::before{content:"";position:absolute;inset:-4px;border-radius:17px;background:linear-gradient(115deg,var(--hc),#fff6d0,var(--hc),#7a4cff,var(--hc));background-size:300% 100%;animation:snShine 4s linear infinite;z-index:-1;transform:translateZ(-1px)}
@keyframes snShine{to{background-position:300% 0}}
.sn.l5 .sn-nm,.sn.l6 .sn-nm{font-size:21px;color:#fff6d8;text-shadow:0 1px 0 var(--hc),0 2px 0 var(--hc),0 3px 0 #000,0 4px 0 #000,0 6px 12px rgba(0,0,0,.8)}
/* 6 — фольга */
.sn.l6 .sn-foil{opacity:.55;mix-blend-mode:color-dodge;background:linear-gradient(115deg,transparent 20%,rgba(255,0,170,.5) 35%,rgba(0,255,230,.5) 50%,rgba(255,230,0,.5) 65%,transparent 80%);background-size:250% 100%;background-position:var(--fx,50%) 0;transform:translateZ(32px)}
.sn-lg{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:22px;color:var(--mu);font-size:12.5px}
.sn-lg b{display:inline-grid;place-items:center;width:20px;height:22px;margin-right:6px;background:#2b6fd6;color:#fff;font:700 12px/1 var(--m);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.sn-lg small{margin-left:4px;color:var(--mu2)}
.sno{position:fixed;inset:0;z-index:60;background:rgba(5,5,8,.96);display:grid;place-items:center;padding:24px;overflow:auto}
.sno-c{display:grid;grid-template-columns:280px minmax(0,420px);gap:30px;align-items:center}
.sn.big{width:280px}.sn.big .sn-nm{font-size:26px}.sn.big.l5 .sn-nm,.sn.big.l6 .sn-nm{font-size:30px}.sn.big .sn-lv,.sn.big .sn-sc{width:46px;height:52px;font-size:22px;top:-14px}
.sno-t{display:grid;gap:12px}.sno-t .ty{font:700 11px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;color:var(--ac)}
@media (max-width:700px){.sno-c{grid-template-columns:minmax(0,1fr);justify-items:center}.sn.big{width:220px}}
@media (prefers-reduced-motion:reduce){.sn-bg img,.sn-in::before{animation:none!important}}

<body>
<header class="nav"><div class="in">
 <a class="logo" href="#home">RESTLESS<small>ДЛЯ DEADLOCK</small></a>
 <nav class="tabs" id="tabs">
  <a href="#home" data-t="home">Главная</a>
  <a href="#live" data-t="live">Матч</a>
  <a href="#heroes" data-t="heroes">Герои</a>
  <a href="#matches" data-t="matches">Мои матчи</a>
 </nav>
 <span class="sp"></span>
 <form class="srch" id="sf" role="search" autocomplete="off">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="sq" placeholder="Игрок: ссылка Steam, ник или ID" aria-label="Найти игрока">

 </form>
 <a class="me hide" id="me" href="#home"></a>
 <div class="skins" id="skins" role="group" aria-label="Вид сайта"></div>
</div></header>
<main class="wrap" id="v"></main>
<p class="ft">Данные — открытый api.deadlock-api.com (матчи, ранги, винрейты). Restless не связан с Valve. Входить в Steam не нужно: профили и матчи в Deadlock открытые.</p>
<script src="data.js"></script>
<script>
'use strict';
const D = window.RL_DATA || {heroes:{}, items:{}, ranks:[], map:{}};
const API = 'https://api.deadlock-api.com/v1/';
const STEAM0 = 76561197960265728n;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => (n == null || isNaN(n)) ? '—' : Math.round(n).toLocaleString('ru-RU');
const pc = (w, n) => n ? Math.round(100 * w / n) : 0;
const pc1 = (w, n) => n ? (100 * w / n).toFixed(1).replace('.', ',') : '0';
const mmss = s => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const now = () => Math.floor(Date.now() / 1000);
const ago = t => { const d = now() - t; if (d < 3600) return Math.max(1, Math.round(d / 60)) + ' мин назад'; if (d < 86400) return Math.round(d / 3600) + ' ч назад'; const k = Math.round(d / 86400); return k + ' ' + pl(k, ['день', 'дня', 'дней']) + ' назад'; };
const pl = (n, a) => { n = Math.abs(Math.round(n)) % 100; const k = n % 10; return a[n > 10 && n < 20 ? 2 : k === 1 ? 0 : k > 1 && k < 5 ? 1 : 2]; };
const games = n => nf(n) + ' ' + pl(n, ['игра', 'игры', 'игр']);
const wrCls = (w, n, k = 5) => n >= k ? (100 * w / n >= 52 ? 'win' : 100 * w / n <= 47 ? 'loss' : '') : '';
const noimg = "this.style.visibility='hidden'";

// ---------- данные ----------
const CACHE = new Map();
async function api(p) {
  if (CACHE.has(p)) return CACHE.get(p);
  const pr = fetch(API + p).then(async r => {
    if (!r.ok) { const t = await r.text().catch(() => ''); throw new Error(r.status + ' ' + (t || r.statusText).slice(0, 140)); }
    return r.json();
  });
  CACHE.set(p, pr);
  pr.catch(() => CACHE.delete(p));
  return pr;
}
const TYPE_RU = {marksman: 'Стрелок', brawler: 'Боец', mystic: 'Мистик', assassin: 'Убийца'};
const hero = id => D.heroes[id] || {n: 'Герой #' + id, i: '', c: '', ab: []};
const heroImg = (id, cls = '') => `<img class="hi ${cls}" data-h="${id}" src="${esc(hero(id).i)}" alt="${esc(hero(id).n)}" title="${esc(hero(id).n)}" loading="lazy" onerror="${noimg}">`;
const item = id => D.items[id];
const itImg = id => `<img src="${esc((item(id) || {}).i)}" alt="" loading="lazy" onerror="${noimg}">`;
function rankOf(badge) {
  badge = +badge || 0;
  const t = Math.floor(badge / 10), s = badge % 10, R = D.ranks.find(x => x.t === t) || {};
  const img = t && s ? `${API}assets/ranks/${t}/${s}/image?format=webp` : ((R.i || {}).small_webp || (R.i || {}).large_webp || '');
  return {t, s, name: badge ? (R.n || '?') + (s ? ' ' + s : '') : 'Без ранга', img, color: R.c || '#888'};
}
const rankImg = (badge, cls = 'rk') => { const r = rankOf(badge); return r.img && badge ? `<img class="${cls}" src="${esc(r.img)}" alt="${esc(r.name)}" title="${esc(r.name)}" loading="lazy" onerror="${noimg}">` : `<span class="${cls}"></span>`; };

// фильтры статистики: ранг и период (общие для «Героев», страницы героя и лобби)
const BADGES = [['Все ранги', 0], ['Oracle+', 80], ['Ascendant+', 100], ['Eternus', 110]];
const DAYS = [[7, '7 дней'], [14, '14 дней'], [30, '30 дней']];
const F = {b: 80, d: 14};
try { const s = JSON.parse(localStorage.getItem('rl-f') || 'null'); if (s && s.d) Object.assign(F, s); } catch (e) {}
const fq = () => `min_unix_timestamp=${now() - F.d * 86400 - (now() % 3600)}${F.b ? '&min_average_badge=' + F.b : ''}`;
const fName = () => (BADGES.find(x => x[1] === F.b) || BADGES[0])[0] + ' · ' + (DAYS.find(x => x[0] === F.d) || DAYS[1])[1];
function fltHTML() {
  return `<div class="flt"><div class="seg" data-f="b">${BADGES.map(x => `<button class="${x[1] === F.b ? 'on' : ''}" data-v="${x[1]}">${x[0]}</button>`).join('')}</div>
    <div class="seg" data-f="d">${DAYS.map(x => `<button class="${x[0] === F.d ? 'on' : ''}" data-v="${x[0]}">${x[1]}</button>`).join('')}</div></div>`;
}
function fltBind(redo) {
  $$('.seg[data-f] button').forEach(b => b.onclick = () => { F[b.parentNode.dataset.f] = +b.dataset.v; try { localStorage.setItem('rl-f', JSON.stringify(F)); } catch (e) {} redo(); });
}
// общая статистика героев за период: винрейт, доля игр
async function heroStats() {
  const L = await api('analytics/hero-stats?' + fq());
  const tot = L.reduce((a, h) => a + h.matches, 0) / 12 || 1;
  const M = {};
  L.forEach(h => { if (D.heroes[h.hero_id]) M[h.hero_id] = {id: h.hero_id, w: h.wins, m: h.matches, wr: 100 * h.wins / Math.max(1, h.matches), pr: 100 * h.matches / tot,
    kda: (h.total_kills + h.total_assists) / Math.max(1, h.total_deaths), spm: h.total_net_worth / Math.max(1, h.matches)}; });
  return M;
}
// пары «герой против героя на линии» и «вместе»: один большой запрос на всё, держим в памяти
const counterStats = () => api('analytics/hero-counter-stats?same_lane_filter=true&' + fq());
const synergyStats = () => api('analytics/hero-synergy-stats?' + fq());

// советы против героев — из описаний способностей в файлах игры (SteamDatabase/GameTracking-Deadlock)
const TIPS = {
  86: ['Still Life', 'натюрморт', 'Бьёт и в конце станит, <b>пока смотрит на тебя</b>. Забеги за стену — набросок не дорисуется.', 'as long as you are looking at them'],
  25: ['Lock Down', 'запереть', 'Повесил проклятие — <b>сразу уходи с места</b>. Не сдвинулся вовремя — урон и не двигаешься.', 'if they don\'t move away from their initial position within the escape time'],
  4: ['Life Drain', 'высасывание жизни', 'Тянет твоё здоровье, <b>пока видит и ты рядом</b>. Зайди за угол или отбеги — связь рвётся.', 'Target must be in line of sight and within max range'],
  3: ['Stake', 'кол', 'Цепь держит у места, <b>где упал кол</b>. Не стой рядом с ним — дальше длины цепи не уйдёшь.', 'tethers enemies to the location where the stake lands']
};

// ---------- игрок ----------
let ME = null;
function idFrom(q) {
  q = String(q || '').trim();
  let m = q.match(/steamcommunity\.com\/profiles\/(\d{17})/) || q.match(/^(\d{17})$/);
  if (m) return Number(BigInt(m[1]) - STEAM0);
  m = q.match(/^\[?U:1:(\d+)\]?$/i) || q.match(/^(\d{4,11})$/);
  if (m) return +m[1];
  return null;
}
async function setMe(id, push = true) {
  id = +id; if (!id) return;
  ME = {id, name: 'Игрок ' + id, avatar: '', badge: null};
  try { localStorage.setItem('rl-id', String(id)); } catch (e) {}
  if (push) { const u = new URL(location.href); u.searchParams.set('id', id); history.replaceState(null, '', u.pathname + u.search + location.hash); }
  paintMe();
  try {
    const [s] = await api('players/steam?account_ids=' + id);
    if (s) { ME.name = s.personaname || ME.name; ME.avatar = s.avatarmedium || s.avatar || ''; }
    const r = await api('players/' + id + '/rank').catch(() => null);
    ME.badge = r && r.badge || 0;
  } catch (e) {}
  paintMe();
}
function paintMe() {
  const b = $('#me');
  if (!ME) { b.classList.add('hide'); return; }
  b.classList.remove('hide');
  b.innerHTML = `${ME.avatar ? `<img class="av" src="${esc(ME.avatar)}" alt="" onerror="${noimg}">` : '<i class="av" style="display:block;width:30px;height:30px;border-radius:50%;background:var(--s3)"></i>'}<div style="min-width:0"><b>${esc(ME.name)}</b><span>${ME.badge != null ? esc(rankOf(ME.badge).name) : 'ID ' + ME.id}</span></div>${ME.badge ? rankImg(ME.badge) : ''}`;
}

// поиск игрока в шапке: ссылка / ID — сразу; ник — список
let sT = 0;
$('#sq').addEventListener('input', e => {
  clearTimeout(sT);
  const q = e.target.value.trim(), dd = $('#sd');
  if (q.length < 2 || idFrom(q)) { dd.classList.add('hide'); return; }
  sT = setTimeout(async () => {
    const name = (q.match(/steamcommunity\.com\/id\/([^\/?#]+)/) || [])[1] || q;
    dd.classList.remove('hide'); dd.innerHTML = '<div class="load" style="padding:10px">Ищу…</div>';
    try {
      const L = await api('players/steam-search?limit=8&search_query=' + encodeURIComponent(name));
      dd.innerHTML = L.length ? L.map(s => `<button type="button" data-id="${s.account_id}"><img src="${esc(s.avatarmedium || s.avatar)}" alt="" onerror="${noimg}"><span><b>${esc(s.personaname)}</b><small>${esc(s.countrycode || '')} · ID ${s.account_id}</small></span></button>`).join('') : '<div class="empty">Никого. Вставь ссылку на профиль Steam.</div>';
    } catch (err) { dd.innerHTML = `<div class="err">${esc(err.message)}</div>`; }
  }, 350);
});
$('#sd').addEventListener('click', async e => { const b = e.target.closest('[data-id]'); if (!b) return; $('#sd').classList.add('hide'); $('#sq').value = ''; await setMe(b.dataset.id); location.hash = '#home'; route(); });
$('#sf').addEventListener('submit', async e => { e.preventDefault(); const id = idFrom($('#sq').value); if (id) { $('#sq').value = ''; $('#sd').classList.add('hide'); await setMe(id); location.hash = '#home'; route(); } else $('#sq').dispatchEvent(new Event('input')); });
document.addEventListener('click', e => { if (!e.target.closest('.srch')) $('#sd').classList.add('hide'); });

async function exampleTop() {
  try {
    const L = await api('leaderboard/Europe');
    const e = (L.entries || []).find(x => (x.possible_account_ids || []).length === 1) || (L.entries || [])[0];
    if (e) { await setMe(e.possible_account_ids[0]); location.hash = '#home'; route(); }
  } catch (err) { alertBox('Не вышло взять пример: ' + err.message); }
}
function alertBox(t) { const v = $('#v'); v.insertAdjacentHTML('afterbegin', `<div class="err" style="margin-bottom:14px">${esc(t)}</div>`); }

// ---------- главная ----------
async function viewHome() {
  if (!ME) return viewLanding();
  const seq = ++VSEQ;
  V('<div class="load">Собираю твой профиль…</div>');
  try {
    const [H, HS, R, HSt] = await Promise.all([api('players/' + ME.id + '/match-history'), api('players/hero-stats?account_ids=' + ME.id).catch(() => []), api('players/' + ME.id + '/rank').catch(() => null), api('analytics/hero-stats?' + fq()).catch(() => [])]);
    const HA = {}, HTOT = HSt.reduce((a, h) => a + h.matches, 0) / 12 || 1; HSt.forEach(h => { const n = Math.max(1, h.matches); HA[h.hero_id] = {spm: h.total_net_worth / n, dpm: h.total_deaths / n, kpm: h.total_kills / n, apm: h.total_assists / n, lhm: h.total_last_hits / n, den: (h.total_denies || 0) / n, pr: 100 * h.matches / HTOT}; });
    if (!vOk(seq)) return;
    if (!H.length) { V('<div class="empty">У этого игрока нет матчей в открытых данных.</div>'); return; }
    const won = m => m.player_team === m.match_result;
    const L20 = H.slice(0, 20), w20 = L20.filter(won).length;
    const sum = (L, k) => L.reduce((a, m) => a + (m[k] || 0), 0);
    const kda = (sum(L20, 'player_kills') + sum(L20, 'player_assists')) / Math.max(1, sum(L20, 'player_deaths'));
    const spm = sum(L20, 'net_worth') / Math.max(1, sum(L20, 'match_duration_s') / 60);
    const totM = HS.reduce((a, h) => a + h.matches_played, 0), totW = HS.reduce((a, h) => a + h.wins, 0);
    const rk = rankOf(R && R.badge);
    const ws = R && R.last_match ? R.last_match.player_rank_initial_win_streak : 0;
    // неделя по дням
    const day = 86400, t0 = now() - (now() % day) - 6 * day;
    const wk = Array.from({length: 7}, (_, i) => { const a = t0 + i * day, L = H.filter(m => m.start_time >= a && m.start_time < a + day); return {d: new Date(a * 1000), n: L.length, w: L.filter(won).length}; });
    const wkMax = Math.max(1, ...wk.map(x => x.n));
    const wkN = wk.reduce((a, x) => a + x.n, 0), wkW = wk.reduce((a, x) => a + x.w, 0);
    const DN = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
    // изменение ранга по матчам (ranked_delta)
    const rd = H.slice(0, 30).filter(m => m.ranked_delta != null).reduce((a, m) => a + m.ranked_delta, 0);
    const pool = HS.slice().sort((a, b) => b.matches_played - a.matches_played).slice(0, 7);
    V(`<div class="card prof">
        ${ME.avatar ? `<img class="av" src="${esc(ME.avatar)}" alt="" onerror="${noimg}">` : '<i class="av"></i>'}
        <div style="min-width:0"><div class="nm">${esc(ME.name)}</div><div class="sub">${nf(totM)} ${pl(totM, ['матч', 'матча', 'матчей'])} · ${pc(totW, totM)}% побед за всё время · ID ${ME.id}</div><div class="ptags">${tagsHTML(profTags(H, HS, HA))}</div></div>
        <div class="rkb">${rankImg(R && R.badge)}<div><b style="color:${esc(rk.color)}">${esc(rk.name)}</b><span class="sub">${ws >= 2 ? 'серия побед · ' + ws : R && R.badge ? 'ранг сейчас' : 'ранг скрыт или нет'}</span></div></div>
      </div>
      <div class="g4 st" style="margin-top:14px">
        <div class="card stat"><span>Победы · 20 матчей</span><b class="${w20 / Math.max(1, L20.length) >= .5 ? 'win' : 'loss'}">${pc(w20, L20.length)}%</b><small>${w20} из ${L20.length}</small></div>
        <div class="card stat"><span>KDA</span><b>${kda.toFixed(2).replace('.', ',')}</b><small>${(sum(L20, 'player_kills') / Math.max(1, L20.length)).toFixed(1)} / ${(sum(L20, 'player_deaths') / Math.max(1, L20.length)).toFixed(1)} / ${(sum(L20, 'player_assists') / Math.max(1, L20.length)).toFixed(1)}</small></div>
        <div class="card stat"><span>Души в минуту</span><b>${nf(spm)}</b><small>в среднем ${nf(sum(L20, 'net_worth') / Math.max(1, L20.length))} за матч</small></div>
        <div class="card stat"><span>Ранг · 30 матчей</span><b class="${rd > 0 ? 'win' : rd < 0 ? 'loss' : ''}">${rd > 0 ? '+' : ''}${nf(rd)}</b><small>очков ранга</small></div>
      </div>
      <div class="g2" style="margin-top:14px">
        <div class="card pad"><div class="h2" style="margin:0 0 12px">Последние матчи<small>нажми — разбор</small></div>

// ---------- метки игрока и паттерны (как на League of Graphs) — только то, что честно считается по матчам ----------
// T — [текст, класс плашки, пояснение]
// метки профиля как на League of Graphs, под Deadlock — только то, что честно считается из открытых данных
function profTags(H, HS, HA) {
  const won = m => m.player_team === m.match_result, T = [], pct = v => Math.round(100 * v);
  // форма
  let k = 0; while (k < H.length && won(H[k]) === won(H[0])) k++;
  if (k >= 3) T.push([won(H[0]) ? 'Винстрик' : 'Лузстрик', won(H[0]) ? 'g' : 'r', `${k} ${won(H[0]) ? 'побед' : 'поражений'} подряд`]);
  const L20 = H.slice(0, 20), w20 = L20.filter(won).length;
  if (L20.length >= 15 && w20 / L20.length >= .65) T.push(['Жарит', 'g', `${w20} побед из ${L20.length} последних — форма на пике`]);
  else if (L20.length >= 15 && w20 / L20.length <= .35) T.push(['Тонет', 'r', `${w20} побед из ${L20.length} последних — ничего не заходит`]);
  const RD = L20.map(m => m.ranked_delta).filter(v => typeof v === 'number');
  if (RD.length >= 5) { const s = RD.reduce((a, v) => a + v, 0); if (s > 0) T.push(['Подъём', 'g', `ранг растёт: +${s} очков за последние игры`]); else if (s < 0) T.push(['Падение', 'r', `ранг сыплется: ${s} очков за последние игры`]); }
  const P = profPatterns(H), all = H.filter(won).length / Math.max(1, H.length), tl = P.find(x => x.n.startsWith('После двух'));
  if (tl && tl.d <= -10) T.push(['Накрыло', 'r', `после двух поражений подряд побеждает в ${Math.round(tl.wr)}% (обычно ${pct(all)}%) — тильт`]);
  else if (tl && tl.d >= 8) T.push(['Стабильный', 'g', `после двух поражений подряд побеждает в ${Math.round(tl.wr)}% (обычно ${pct(all)}%) — голову не теряет`]);
  // герои
  const L30 = H.filter(m => m.start_time >= now() - 30 * 86400), cnt = {};
  L30.forEach(m => cnt[m.hero_id] = (cnt[m.hero_id] || 0) + 1);
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  if (top && L30.length >= 10) { const s = top[1] / L30.length, n = hero(top[0]).n;
    if (s >= .6) T.push(['OTP', 'a', `${pct(s)}% игр за 30 дней — на ${n}`]);
    else if (s >= .3) T.push(['Фанат', 'b', `${pct(s)}% игр за 30 дней — на ${n}`]);
    const ha = HA[top[0]], tm = L30.filter(m => m.hero_id === +top[0]);
    if (ha && tm.length >= 10) { const r = tm.reduce((a, m) => a + m.net_worth, 0) / tm.length / ha.spm; if (r >= 1.2) T.push(['Миллионер', 'g', `души за матч на ${pct(r - 1)}% выше обычного на ${n}`]); }
    if (ha && s >= .25 && ha.pr && Object.values(HA).filter(x => x.pr < ha.pr).length / Object.keys(HA).length <= .25) T.push(['Экзотика', 'b', `${n} берут редко — в ${ha.pr.toFixed(1).replace('.', ',')}% матчей`]); }
  const byH = HS.slice().sort((a, b) => b.matches_played - a.matches_played), vet = byH[0];
  if (vet && vet.matches_played >= 300) T.push(['Ветеран ' + hero(vet.hero_id).n, 'a', `${nf(vet.matches_played)} игр — самый накатанный герой`]);
  else if (vet && vet.matches_played >= 100) T.push(['Мейн ' + hero(vet.hero_id).n, 'a', `${nf(vet.matches_played)} игр — больше, чем на любом другом`]);
  const L50 = H.slice(0, 50), c50 = {}; L50.forEach(m => c50[m.hero_id] = (c50[m.hero_id] || 0) + 1);
  const many = Object.values(c50).filter(v => v >= 3).length; if (L50.length >= 30 && many >= 8) T.push(['Универсал', 'b', `${many} героев по 3+ игры из последних ${L50.length}`]);
  const last = H[0], hl = HS.find(h => h.hero_id === last.hero_id);
  if (hl && hl.matches_played < 10) T.push(['Стажёр', '', `всего ${games(hl.matches_played)} на ${hero(last.hero_id).n} — только раскачивается`]);
  // стиль: последние 20 игр против среднего по тем же героям (по каждому матчу)
  const S = L20.filter(m => HA[m.hero_id]);
  if (S.length >= 8) {
    const r = f => S.reduce((a, m) => a + f(m, HA[m.hero_id]), 0) / S.length;
    const soul = r((m, a) => m.net_worth / Math.max(1, a.spm)), dth = r((m, a) => m.player_deaths / Math.max(.1, a.dpm)),
      kil = r((m, a) => m.player_kills / Math.max(.1, a.kpm)), ast = r((m, a) => m.player_assists / Math.max(.1, a.apm)),
      lh = r((m, a) => m.last_hits / Math.max(1, a.lhm)), dn = r((m, a) => (m.denies || 0) / Math.max(.3, a.den));
    if (soul >= 1.15) T.push(['Фармила', 'g', `фармит на ${pct(soul - 1)}% больше душ, чем обычно`]);
    else if (soul <= .85) T.push(['Голодает', 'r', `души на ${pct(1 - soul)}% ниже обычного — фарм просел`]);
    if (dth >= 1.3) T.push(['Кормит', 'r', `умирает на ${pct(dth - 1)}% чаще обычного`]);
    else if (dth <= .75) T.push(['Живучий', 'g', `умирает на ${pct(1 - dth)}% реже обычного`]);
    if (kil >= 1.3) T.push(['Убийца', 'g', `убивает на ${pct(kil - 1)}% чаще обычного`]);
    if (ast >= 1.3) T.push(['Командный', 'g', `ассистов на ${pct(ast - 1)}% больше обычного`]);
    if (kil <= .7 && ast <= .8) T.push(['Пассивный', 'r', 'и убийств, и помощи меньше обычного — отсиживается']);
    if (lh >= 1.2) T.push(['Добиватель', 'g', `добиваний (лх) на ${pct(lh - 1)}% больше обычного`]);
    else if (lh <= .8) T.push(['Мажет', 'r', `добиваний (лх) на ${pct(1 - lh)}% меньше обычного`]);
    if (dn >= 1.5) T.push(['Жадина', 'g', 'денаев в 1,5 раза больше обычного — отжимает линию']);
  }
  const lv = L30.filter(m => m.abandoned_time_s).length;
  if (lv) T.push(['Ливер', 'r', `ливал ${lv} ${pl(lv, ['раз', 'раза', 'раз'])} за последние 30 дней — выходит из матчей`]);
  // когда играет
  const day = m => new Date(m.start_time * 1000), byDay = {}; L30.forEach(m => { const d = day(m).toDateString(); byDay[d] = (byDay[d] || 0) + 1; });
  const mx = Math.max(0, ...Object.values(byDay)); if (mx >= 8) T.push(['Марафонец', 'b', `до ${mx} игр за день`]);
  const d14 = new Set(H.filter(m => m.start_time >= now() - 14 * 86400).map(m => day(m).toDateString())).size;
  if (d14 >= 12) T.push(['Ежедневно', 'b', `играл ${d14} дней из последних 14`]);
  const night = L30.filter(m => day(m).getHours() < 6).length;
  if (L30.length >= 10 && night / L30.length >= .4) T.push(['Полуночник', 'b', `${pct(night / L30.length)}% игр с полуночи до 6 утра`]);
  const wk = L30.filter(m => [0, 6].includes(day(m).getDay())).length;
  if (L30.length >= 15 && wk / L30.length >= .6) T.push(['Воскресник', 'b', `${pct(wk / L30.length)}% игр — в субботу и воскресенье`]);
  if (H.length >= 2 && H[0].start_time - (H[1].start_time + H[1].match_duration_s) >= 14 * 86400) T.push(['Вернулся', 'b', `перерыв ${Math.round((H[0].start_time - H[1].start_time) / 86400)} дней перед последней игрой`]);
  return T;
}
// паттерны: винрейт в разных условиях против общего (сессия — матчи с перерывом меньше часа)
function profPatterns(H) {
  const won = m => m.player_team === m.match_result, A = H.slice().reverse(), all = A.filter(won).length / Math.max(1, A.length);
  const B = {s1: [], s2: [], s3: [], l2: [], long: []}; let pos = 0;
  A.forEach((m, i) => { const p = A[i - 1]; pos = p && m.start_time - (p.start_time + p.match_duration_s) < 3600 ? pos + 1 : 1;
    if (pos <= 3) B['s' + pos].push(won(m));
    if (i >= 2 && !won(A[i - 1]) && !won(A[i - 2]) && pos > 1) B.l2.push(won(m));
    if (m.match_duration_s >= 35 * 60) B.long.push(won(m)); });
  const N = {s1: 'Первый матч сессии', s2: 'Второй матч сессии', s3: 'Третий матч сессии', l2: 'После двух поражений подряд', long: 'Игры длиннее 35 минут'};
  return Object.entries(B).filter(([, v]) => v.length >= 12).map(([k, v]) => { const wr = v.filter(Boolean).length / v.length; return {n: N[k], d: 100 * (wr - all), wr: 100 * wr, c: v.length}; });
}

async function scout(players) {
  const ids = players.map(p => p.account_id).filter(Boolean);
  const q = 'account_ids=' + ids.join(',');
  const [steam, ranks, hs] = await Promise.all([api('players/steam?' + q).catch(() => []), api('players/rank?' + q).catch(() => []), api('players/hero-stats?' + q).catch(() => [])]);
  const S = {}, R = {}, H = {}, T = {};
  steam.forEach(s => S[s.account_id] = s);
  ranks.forEach(r => R[r.account_id] = r);
  hs.forEach(h => { (H[h.account_id] = H[h.account_id] || {})[h.hero_id] = h; const t = T[h.account_id] = T[h.account_id] || {m: 0, w: 0}; t.m += h.matches_played || 0; t.w += h.wins || 0; });
  return players.map(p => {
    const id = p.account_id, hid = p.hero_id, h = (H[id] || {})[hid] || {}, t = T[id] || {m: 0, w: 0}, r = R[id] || {};
    const hm = h.matches_played || 0, hw = h.wins || 0, tags = [];
    if (hm >= 20 && t.m && hm / t.m >= .25) tags.push(['a', 'Мейн', 'четверть+ всех игр за месяц — на этом герое']);
    else if (hm >= 150) tags.push(['b', 'Ветеран', '150+ игр на этом герое']);
    if (hm <= 2 && t.m >= 30) tags.push(['r', 'Дебют', hm ? `всего ${hm} ${pl(hm, ['игра', 'игры', 'игр'])} на герое` : 'первый матч на этом герое']);
    if (t.m && t.m < 60) tags.push(['', 'Новичок', `всего ${games(t.m)} в игре — аккаунт свежий`]);
    const ws = r.last_match && r.last_match.player_rank_initial_win_streak;
    if (ws >= 3 && r.last_match.start_time > now() - 86400 * 2) tags.push(['g', 'Винстрик', `${ws} побед подряд — с такими осторожнее`]);
    if (hm >= 15 && hw / hm >= .6) tags.push(['g', 'Сильный', `винрейт ${pc(hw, hm)}% за ${nf(hm)} игр на герое`]);
    if (hm >= 15 && hw / hm <= .4) tags.push(['r', 'Слабый', `винрейт ${pc(hw, hm)}% за ${nf(hm)} игр на герое`]);
    const threat = hm >= 10 ? (hw / hm - .5) * Math.min(1, hm / 60) + (ws >= 3 ? .05 : 0) + (r.badge || 0) / 1000 : (r.badge || 0) / 1000 - .1;
    return {id, hid, team: p.team, lane: p.assigned_lane, name: (S[id] || {}).personaname || 'Скрытый игрок', avatar: (S[id] || {}).avatarmedium, badge: r.badge || 0, hm, hw, tm: t.m, tw: t.w, kda: hm ? (h.kills + h.assists) / Math.max(1, h.deaths) : 0, tags, threat};
  });
}

function lineChart(series, w = 640, h = 220) {
  const xs = series.flatMap(s => s.pts.map(p => p[0])), ys = series.flatMap(s => s.pts.map(p => p[1]));
  const X = Math.max(...xs, 60), Y = Math.max(...ys, 1) * 1.08, pl0 = 44, pb = 22, pt = 10, pr = 10;
  const x = v => pl0 + (w - pl0 - pr) * v / X, y = v => pt + (h - pt - pb) * (1 - v / Y);
  const grid = [0, .25, .5, .75, 1].map(f => `<line x1="${pl0}" x2="${w - pr}" y1="${y(Y * f)}" y2="${y(Y * f)}" stroke="#26262e"/><text x="${pl0 - 6}" y="${y(Y * f) + 4}" text-anchor="end" font-size="10.5" fill="#6a665e">${nf(Y * f / 1000)}к</text>`).join('');
  const xt = []; for (let t = 0; t <= X; t += 300) xt.push(`<text x="${x(t)}" y="${h - 6}" text-anchor="middle" font-size="10.5" fill="#6a665e">${t / 60}</text>`);
  const lines = series.map(s => `<polyline fill="none" stroke="${s.c}" stroke-width="${s.w || 2.5}" ${s.dash ? 'stroke-dasharray="5 5"' : ''} points="${s.pts.map(p => x(p[0]) + ',' + y(p[1])).join(' ')}"/><circle cx="${x(s.pts[s.pts.length - 1][0])}" cy="${y(s.pts[s.pts.length - 1][1])}" r="3.5" fill="${s.c}"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Души по времени">${grid}${xt.join('')}${lines}</svg>`;
}
// ---------- разбор как у RUINER: вклад, вердикт, почему умирал, номинации, метки ----------
// всё считается внутри матча: игрок против среднего в этом матче (а не по слухам)
function mLast(p) { return p.stats[p.stats.length - 1] || {}; }
function mAt(p, t, k = 'net_worth') { let v = 0; for (const s of p.stats) if (s.time_stamp_s <= t) v = s[k] || 0; return v; }
function mAnalyze(mi) {
  const P = mi.players, dur = mi.duration_s, A = new Map();
  const avg = (L, f) => L.reduce((a, p) => a + f(p), 0) / Math.max(1, L.length);
  const dmg = p => mLast(p).player_damage || 0, boss = p => mLast(p).boss_damage || 0, heal = p => mLast(p).teammate_healing || 0;
  const tk = t => P.filter(p => p.team === t).reduce((a, p) => a + p.kills, 0);
  const avgD = avg(P, p => p.deaths), avgDmg = avg(P, dmg), avgB = avg(P, boss);
  const cap = v => Math.max(0, Math.min(2, v));
  for (const p of P) {
    const T = P.filter(q => q.team === p.team), s = mLast(p);
    const tnw = avg(T, q => q.net_worth), tkills = tk(p.team);
    const kp = tkills ? (p.kills + p.assists) / tkills : 0, tkp = avg(T, q => tkills ? (q.kills + q.assists) / tkills : 0);
    const shots = (s.shots_hit || 0) + (s.shots_missed || 0), acc = shots >= 300 ? s.shots_hit / shots : null;
    const r = {souls: cap(p.net_worth / Math.max(1, tnw)), dmg: cap(dmg(p) / Math.max(1, avgDmg)), kp: cap(tkp ? kp / tkp : 1), live: cap((avgD + 1) / (p.deaths + 1)), obj: cap(avgB ? boss(p) / avgB : 1)};
    let sc = .25 * r.souls + .25 * r.dmg + .2 * r.kp + .2 * r.live + .1 * r.obj;
    const hb = Math.min(.12, heal(p) / 40000); sc += hb;
    const score = Math.max(0, Math.min(100, Math.round(50 * sc)));
    const prob = [];
    if (p.deaths >= 5 && p.deaths >= avgD * 1.5) prob.push(`умирал ${p.deaths} раз — в 1,5 раза чаще среднего (${avgD.toFixed(1)})`);
    if (p.net_worth <= .75 * tnw) prob.push(`душ ${nf(p.net_worth)} — на ${pc(tnw - p.net_worth, tnw)}% меньше среднего в команде`);
    if (dmg(p) <= .7 * avgDmg && heal(p) < 8000) prob.push(`урона по героям ${nf(dmg(p))} — на ${pc(avgDmg - dmg(p), avgDmg)}% меньше среднего в матче`);
    if (tkills >= 10 && kp < .35) prob.push(`участие в убийствах ${Math.round(100 * kp)}% — почти не был в драках`);
    if (p.abandon_match_time_s) prob.push(`вышел из матча на ${mmss(p.abandon_match_time_s)}`);
    const won = mi.winning_team === p.team;
    let v;
    if (p.abandon_match_time_s && p.abandon_match_time_s < dur - 60) v = ['Ливнул', 'r'];
    else if (won) v = score >= 62 ? ['Тащил', 'h'] : score >= 40 || prob.length < 2 ? ['Норм', ''] : ['Под вопросом', 'a'];
    else v = score >= 62 ? ['Не вытащил', 'b'] : score >= 40 ? ['Норм', ''] : prob.length >= 2 && score < 35 ? ['Слил?', 'r'] : ['Под вопросом', 'a'];
    A.set(p, {score, r, kp, acc, prob, v, won, heal: heal(p), boss: boss(p), dmg: dmg(p), spm: p.net_worth / Math.max(1, dur / 60), kda: (p.kills + p.assists) / Math.max(1, p.deaths)});
  }
  return A;
}
// где был игрок в секунду t (match_paths: позиция = min + pos/res·(max−min))

    const nomin = P.filter(p => MD.get(p).length).map(p => MD.get(p).map(([n, h]) => `<div class="nm ${p.team === me.team ? 'us' : 'en'}${p === me ? ' me' : ''}">${heroImg(p.hero_id, 's')}<span><b>${n}</b><small>${esc(hero(p.hero_id).n)}${p === me ? ' · ты' : ''} — ${h}</small></span></div>`).join('')).join('');
    V(`<a href="#matches" class="sub" style="text-decoration:none">‹ Мои матчи</a>
      <div class="mh" style="margin-top:10px">${hero(me.hero_id).c ? `<img class="cardimg" src="${esc(hero(me.hero_id).c)}" alt="" onerror="${noimg}">` : ''}
        <div><div class="row" style="gap:8px;flex-wrap:wrap"><span class="tag ${won ? 'g' : 'r'}">${won ? 'победа' : 'поражение'}</span><span class="sub">${mmss(dur)} · ${ago(mi.start_time)} · матч ${mid}</span></div>
          <h1 class="h1" style="margin-top:8px">${esc(hero(me.hero_id).n)} · <span class="mono">${me.kills} / ${me.deaths} / ${me.assists}</span></h1>
          <div class="sub">${nf(me.net_worth)} душ · ${nf(a.spm)} в минуту · ${me.last_hits} добиваний · уровень ${me.level}</div>
          ${TG.length ? `<div class="ptags">${tagsHTML(TG)}</div>` : ''}</div></div>
      <div class="vdc card pad"><div class="vdb"><span class="vd big ${a.v[1]}">${a.v[0]}</span><div class="vds"><b class="mono">${a.score}</b><small>вклад из 100<br>50 — средний в матче</small></div></div>
        <p>${a.prob.length ? 'Что потянуло вниз: ' + esc(a.prob.join('; ')) + '.' : a.score >= 62 ? 'Сделал для команды больше среднего почти во всём.' : 'Провалов нет — сыграл ровно.'}</p>
        <details class="why"><summary>Не согласен? Как это считается</summary><p>Считаем только по цифрам этого матча: души против среднего в команде (25%), урон по героям против среднего в матче (25%), участие в убийствах (20%), смерти — чем меньше, тем лучше (20%), урон по башням и боссам (10%), плюс лечение своих. «Слил?» ставим только проигравшим и только если провала два и больше — с вопросом, потому что цифры не видят всего: может, ты стоял на линии один против двух или держал карту. Мы не знаем, что было в голосовом.</p></details></div>
      <div class="rgs">${rings}</div>
      <div class="h2">Главное</div><div class="card pad"><ul class="pts">${pts.map(x => `<li>${x}</li>`).join('')}</ul></div>
      <div class="g2">
        <div><div class="h2">Души по времени</div><div class="card pad">
          ${lineChart([{c: 'var(--ac)', pts: [[0, 0]].concat(me.stats.map(s => [s.time_stamp_s, s.net_worth]))}].concat(opp ? [{c: 'var(--en)', dash: 1, pts: [[0, 0]].concat(opp.stats.map(s => [s.time_stamp_s, s.net_worth]))}] : []))}
          <div class="row sub" style="gap:14px;margin-top:6px;flex-wrap:wrap"><span><b style="color:var(--ac)">━</b> ты</span>${opp ? `<span><b style="color:var(--en)">┅</b> ${esc(hero(opp.hero_id).n)} — соперник по линии</span>` : ''}<span class="sp"></span><span>минуты →</span></div></div></div>
        <div><div class="h2">Разница душ команд</div><div class="card pad">${diffChart(mi, me.team)}
          <div class="row sub" style="gap:14px;margin-top:6px;flex-wrap:wrap"><span class="win">выше нуля — твоя команда впереди</span><span class="loss">ниже — соперники</span></div></div></div>
      </div>
      <div class="g2">
        <div><div class="h2">Почему умирал · ${me.deaths}</div><div class="card pad"><ul class="pts">${mDeathSum(DD, dur)}</ul>
          ${DD.length ? `<div class="dl">${DD.map((d, i) => `<div class="dr"><i class="d">${i + 1}</i><span class="mono">${mmss(d.t)}</span><span style="min-width:0">${d.k ? heroImg(d.k.hero_id, 's') : ''}<b>${esc(d.k ? hero(d.k.hero_id).n : 'не герой')}</b><small>${esc(d.why.join(' · ') || (d.mates != null ? `рядом своих ${d.mates}, врагов ${d.foes}` : ''))}</small></span></div>`).join('')}</div>` : ''}</div></div>
        <div><div class="h2">Карта${hasP ? '<small>тяни — где кто был</small>' : ''}</div>
          <div class="map" id="mmap">${D.map.img ? `<img class="mi" src="${esc(D.map.img)}" alt="" onerror="this.remove()">` : ''}${deaths}${dots}</div>
          ${hasP ? `<div class="msl"><input type="range" id="mt" min="0" max="${dur}" value="${Math.min(dur, 600)}" aria-label="Время матча"><b class="mono" id="mtv"></b></div><div class="row sub" style="gap:14px;flex-wrap:wrap"><span><b style="color:var(--ac)">●</b> свои</span><span><b style="color:var(--en)">●</b> соперники</span><span><b style="color:var(--loss)">●</b> твои смерти</span></div>` : ''}</div>
      </div>
      <div class="h2">Покупки<small>Ascendant+ на этом герое, 30 дней</small></div>
      <div class="card pad"><div class="tln">${tl}<div class="tlx">${tlx.join('')}</div></div></div>
      <div class="card" style="margin-top:12px">
          ${buys.map(b => { const d = b.a && b.a.matches >= 30 ? b.it.game_time_s - b.a.avg_buy_time_s : null;
            return `<div class="ir">${itImg(b.it.item_id)}<span style="min-width:0"><b>${esc(b.I.n)}</b><small>${nf(b.I.p)} душ${b.a ? ' · у топов ' + pc(b.a.wins, b.a.matches) + '% побед' : ''}</small></span><span class="wr">${mmss(b.it.game_time_s)}${d == null ? '' : `<small class="${d > 60 ? 'loss' : d < -60 ? 'win' : ''}">${d > 0 ? '+' : '−'}${mmss(Math.abs(d))} ${d > 0 ? 'позже' : 'раньше'}</small>`}</span></div>`; }).join('') || '<div class="empty">Покупок не видно.</div>'}
      </div>
      ${nomin ? `<div class="h2">Номинации</div><div class="nms">${nomin}</div>` : ''}
      <div class="h2">Все игроки<small>сверху — больше вклад</small></div>
      <div class="g2">${[me.team, 1 - me.team].map(t => `<div class="card sbw"><table class="sb"><tr><th>${t === me.team ? 'Твоя команда' : 'Соперники'}${t === mi.winning_team ? ' · победа' : ''}</th><th>Итог</th><th>Вклад</th><th>K/D/A</th><th>Души</th><th>Урон</th></tr>${sb(t)}</table></div>`).join('')}</div>`);
    if (hasP) {
      const mv = () => { const t = +$('#mt').value; $('#mtv').textContent = mmss(t);
        $$('#mmap .hd').forEach(e => { const f = PT[e.dataset.s]; if (!f) return; const q = f(t), p = pos(q); e.style.left = p.l + '%'; e.style.top = p.t + '%'; e.classList.toggle('dead', q.hp <= 0); }); };
      $('#mt').oninput = mv; mv();
    }
  } catch (e) { if (vOk(seq)) V(`<div class="err">Не вышло разобрать матч: ${esc(e.message)}</div>`); }
}

// ---------- навигация ----------

// ---------- три вида ----------
const SKINS = [
  ['graphs', 'Графики', 'Как League of Graphs: глубокий синий, бирюза, золото рангов, меню слева'],
  ['labs', 'Labs', 'Чёрный и оранжевый, всё строго — как у Deadlock Labs'],
  ['city', 'Город', 'Как меню самой игры: латунь, кремовый, рамки ар-деко'],
  ['inferno', 'Инферно', 'Уголь и огонь: жжёный чёрный, раскалённый оранжевый, острые углы'],
  ['occult', 'Оккульт', 'Мистика: ночь, фиалка и магента, светящиеся рамки'],
  ['midnight', 'Полночь', 'Чёрный лёд и электрик-синий, неон на линиях'],
  ['forest', 'Джунгли', 'Тёмная зелень Айви и салатовый акцент, спокойный'],
  ['rivals', 'Ривалс', 'Комикс Marvel Rivals: жирные рамки, жёлтый, жёсткие тени'],
  ['arcade', 'Аркада', 'Ретро-неон: магента и циан, VHS-полосы'],
  ['paper', 'Газета', '1930-е: бумага, чернила, красный штамп — единственная светлая']
];
const SKIN_BG = {graphs:'#0a1420', labs:'#070707', city:'#0e1512', inferno:'#0c0906', occult:'#0a0612', midnight:'#04060c', forest:'#0a110b', rivals:'#0f1322', arcade:'#08040f', paper:'#e9e2d2'};
function skinSet(s) { document.documentElement.dataset.skin = s; try { localStorage.setItem('rl-skin', s); localStorage.setItem('rl-skin-pick', '1'); } catch (e) {} const _m = document.querySelector('meta[name=theme-color]'); if (_m && SKIN_BG[s]) _m.content = SKIN_BG[s]; $$('#skins button,.skpick button').forEach(b => b.classList.toggle('on', b.dataset.s === s)); }
function skinPickHTML() { const c = document.documentElement.dataset.skin; return `<div class="skpick">${SKINS.map(([k, n, d]) => `<button data-s="${k}" class="${k === c ? 'on' : ''}"><div class="sw"></div><b>${n}</b><span>${d}</span></button>`).join('')}</div>`; }
document.addEventListener('click', e => { const b = e.target.closest('#skins button,.skpick button'); if (b) skinSet(b.dataset.s); });
const _sb = $('#skins'); if (_sb && !_sb.children.length) _sb.innerHTML = SKINS.map(([k, n]) => `<button data-s="${k}" title="${n}"><i></i></button>`).join('');
skinSet(document.documentElement.dataset.skin || 'graphs');

// ---------- карточка героя при наведении на иконку (как в Marvel Snap) ----------
const HC = document.createElement('div'); HC.id = 'hcard'; HC.setAttribute('aria-hidden', 'true'); document.body.appendChild(HC);
let HCt = 0, HCh = 0, HClp = 0, HCg = {}, HCgt = 0;
function hcHide() { HCh = 0; clearTimeout(HCt); HC.classList.remove('on'); HC.innerHTML = ''; }
async function hcGames() { if (!ME || Date.now() - HCgt < 300000) return; HCgt = Date.now(); HCg = {}; try { (await api('players/hero-stats?account_ids=' + ME.id)).forEach(r => HCg[r.hero_id] = r.matches_played || 0); } catch (e) {} }
async function hcShow(id, t) {
  if (!D.heroes[id]) return;
  await hcGames();
  if (HCh !== id) return;
  const h = hero(id), n = HCg[id] || 0, L = lvOf(n);
  HC.innerHTML = snapCard(id, n, null) + `<div class="hcc"><b>${esc(h.n)}</b>${esc(TYPE_RU[h.ty] || '')}${h.cx ? ' · сложность ' + h.cx + '/3' : ''} · ур. ${L} — ${esc(LVN[L - 1])}${n ? ` · у тебя ${nf(n)} ${pl(n, ['игра', 'игры', 'игр'])}` : ''}</div>`;
  const r = t.getBoundingClientRect(), w = 176;
  let x = r.right + 12; if (x + w > innerWidth - 8) x = r.left - w - 12; if (x < 8) x = Math.max(8, Math.min(innerWidth - w - 8, r.left));
  HC.style.width = w + 'px'; HC.style.left = x + 'px'; HC.classList.add('on');
  requestAnimationFrame(() => { HC.style.top = Math.max(8, Math.min(innerHeight - HC.offsetHeight - 8, r.top - 4)) + 'px'; });
}
document.addEventListener('pointerover', e => {
  if (e.pointerType === 'touch' || e.target.closest('.sn,.sno,#hcard')) return;
  const t = e.target.closest('[data-h]');
  if (!t) { if (HCh) hcHide(); return; }
  const id = +t.dataset.h; if (!D.heroes[id]) return;
  if (HCh === id) return;
  clearTimeout(HCt); HCh = id;
  HCt = setTimeout(() => hcShow(id, t), 260);
});
document.addEventListener('pointermove', e => {
  if (!HCh || !HC.classList.contains('on')) return;
  const c = $('.sn', HC); if (!c) return;
  const r = c.getBoundingClientRect();
  if (e.clientX < r.left - 60 || e.clientX > r.right + 60 || e.clientY < r.top - 60 || e.clientY > r.bottom + 60) return;
  const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
  c.style.setProperty('--rx', (-y * 14).toFixed(2) + 'deg'); c.style.setProperty('--ry', (x * 16).toFixed(2) + 'deg'); c.style.setProperty('--fx', (50 + x * 80).toFixed(1) + '%');
});
addEventListener('scroll', () => { if (HCh) hcHide(); }, {passive: true});
addEventListener('blur', () => { if (HCh) hcHide(); });
document.addEventListener('touchstart', e => {
  const t = e.target.closest('[data-h]');
  if (!t || e.target.closest('.sn,.sno')) { if (HCh) hcHide(); return; }
  const id = +t.dataset.h; if (!D.heroes[id]) return;
  clearTimeout(HClp); HClp = setTimeout(() => { HCh = id; hcShow(id, t); }, 420);
}, {passive: true});
['touchend', 'touchmove', 'touchcancel'].forEach(v => document.addEventListener(v, () => clearTimeout(HClp), {passive: true}));
// ---------- подсказка меток: навёл на метку — узнал, за что она ----------
const TT = document.createElement('div'); TT.id = 'tagtip'; TT.setAttribute('aria-hidden', 'true'); TT.hidden = true; document.body.appendChild(TT);
document.addEventListener('pointerover', e => {
  const t = e.target.closest('.tag[data-tip],.md[data-tip]');
  if (!t) { TT.hidden = true; return; }
  TT.textContent = t.dataset.tip; TT.hidden = false;
  const r = t.getBoundingClientRect(), w = TT.offsetWidth;
  TT.style.left = Math.max(w / 2 + 8, Math.min(innerWidth - w / 2 - 8, r.left + r.width / 2)) + 'px';
  if (r.top < 76) { TT.classList.add('dn'); TT.style.top = r.bottom + 8 + 'px'; } else { TT.classList.remove('dn'); TT.style.top = r.top - 8 + 'px'; }
});
addEventListener('scroll', () => { TT.hidden = true; }, {passive: true});
document.addEventListener('click', e => { if (!e.target.closest('.tag[data-tip],.md[data-tip]')) TT.hidden = true; });
let VSEQ = 0; const vOk = s => s === VSEQ;
function V(html) { $('#v').innerHTML = html; }
function route() {
  TT.hidden = true;
  const h = location.hash.replace(/^#/, '') || 'home';
  const [t, a] = h.split('/');
  const tab = {m: 'matches', h: 'heroes', who: 'home', now: 'live', builds: 'heroes', b: 'heroes', profile: 'home'}[t] || t;
  $$('#tabs a').forEach(x => x.classList.toggle('on', x.dataset.t === tab));
  window.scrollTo(0, 0);
  if (t === 'live' || t === 'now') return viewLive();
  if (t === 'heroes' || t === 'builds') return viewHeroes();
  if ((t === 'h' || t === 'b') && a) return viewHero(a);
  if (t === 'matches') return viewMatches();
  if (t === 'm' && a) return viewMatch(a);
  return viewHome();
}
window.addEventListener('hashchange', route);
(async () => {
  const q = new URLSearchParams(location.search).get('id');
  let id = q && idFrom(q);
  if (!id) try { id = +localStorage.getItem('rl-id') || null; } catch (e) {}
  if (id) setMe(id, !!q && false);
  route();
})();
</script>
