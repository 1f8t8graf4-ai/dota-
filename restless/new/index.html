<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Restless — статистика Deadlock</title>
<meta name="description" content="Restless — статистика Deadlock: профиль игрока, разбор каждого матча, герои и сборки, лидеры, лайв-матч, патчи по-русски.">
<meta name="theme-color" content="#0d0e11">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@500;600&display=swap">
<style>
/* Restless — новый сайт с нуля (02.11). Чисто, как Deadlock Labs и League of Graphs: одна строка разделов, карточки, таблицы. */
:root{
  --bg:#0d0e11;--s1:#15171c;--s2:#1c1f26;--s3:#252933;--ln:#272b34;--ln2:#323743;
  --tx:#eceae4;--mu:#8e939d;--mu2:#646a75;--am:#f5a524;--am2:#ffcf6e;--win:#3ecf8e;--loss:#ff5d6c;
  --t0:#f5a524;--t1:#4f9dff;
  --fd:'Oswald','Arial Narrow',sans-serif;--fb:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  /* для разбора коуча (стили из lg6/lg7) */
  --q-ln:var(--ln);--q-bx:var(--s1);--q-am:var(--am);--h:var(--fd);--f:var(--fb);--s3x:var(--s3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%}
.win{color:var(--win)}.loss{color:var(--loss)}.am{color:var(--am)}.mu{color:var(--mu)}
.hide,[hidden]{display:none!important}
#nstub{display:none!important}
.q-skin,#swr{display:none!important}

/* шапка */
.nh{position:sticky;top:0;z-index:50;background:rgba(13,14,17,.94);border-bottom:1px solid var(--ln)}
.nh-in{max-width:1280px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:26px}
.nh-lg{font:600 23px/1 var(--fd);letter-spacing:.2em;color:var(--am);flex:none}
.nh-nav{display:flex;gap:4px;height:100%;overflow-x:auto;scrollbar-width:none}
.nh-nav a{display:flex;align-items:center;padding:0 12px;font-weight:700;font-size:14px;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s}
.nh-nav a:hover{color:var(--tx)}
.nh-nav a.on{color:var(--tx);border-bottom-color:var(--am)}
.nh-s{margin-left:auto;position:relative;width:min(320px,30vw)}
.nh-s input{width:100%;height:38px;border-radius:10px;border:1px solid var(--ln2);background:var(--s1);color:var(--tx);padding:0 12px 0 36px;font:inherit;outline:none}
.nh-s input:focus{border-color:var(--am)}
.nh-s svg{position:absolute;left:11px;top:11px;width:16px;height:16px;opacity:.5}
.nh-dd{position:absolute;top:44px;left:0;right:0;background:var(--s2);border:1px solid var(--ln2);border-radius:12px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.6);max-height:60vh;overflow:auto;z-index:60}
.nh-dd button{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;padding:7px;border:0;background:none;border-radius:8px}
.nh-dd button:hover{background:var(--s3)}
.nh-dd img{width:32px;height:32px;border-radius:50%}
.nh-dd b{display:block;font-size:13.5px}.nh-dd small{color:var(--mu);font-size:12px}
.nh-me{display:flex;align-items:center;gap:8px;flex:none;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--ln)}
.nh-me img{width:28px;height:28px;border-radius:50%}
.nh-me b{font-size:13px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* страница */
#v{max-width:1280px;margin:0 auto;padding:22px 20px 60px;min-height:70vh}
.ld{padding:60px 0;text-align:center;color:var(--mu)}
.ld::before{content:"";display:block;width:28px;height:28px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--ln2);border-top-color:var(--am);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.er{padding:16px;border-radius:12px;background:rgba(255,93,108,.08);border:1px solid rgba(255,93,108,.3);color:#ffb0b8}
.em{padding:24px;text-align:center;color:var(--mu)}
h1.pt{font:600 34px/1.1 var(--fd);text-transform:uppercase;letter-spacing:.02em;margin:4px 0 16px}
h1.pt em{font-style:normal;color:var(--am)}
.cd{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:16px 18px;min-width:0}
.cd-h{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:600 12px/1 var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.cd-h b{color:var(--tx);font-weight:600}
.cd-h .sp{flex:1}
.cd-h a{font-family:var(--fb);letter-spacing:0;text-transform:none;font-weight:700;font-size:12.5px;color:var(--am)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--s2);border:1px solid var(--ln)}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-weight:700;font-size:12.5px;color:var(--mu);white-space:nowrap}
.seg button.on{background:var(--s3);color:var(--tx)}
.sel{height:34px;border-radius:9px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);padding:0 10px;font:inherit;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--ln2);background:var(--s2);font-weight:700;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--am)}
.btn.p{background:var(--am);border-color:var(--am);color:#191207}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--ln);margin:0 0 18px;overflow-x:auto;scrollbar-width:none}
.tabs a,.tabs button{padding:11px 14px;border:0;background:none;font-weight:700;font-size:14px;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on,.tabs button.on{color:var(--tx);border-bottom-color:var(--am)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;background:var(--s3);font-size:11.5px;font-weight:700;color:var(--mu);white-space:nowrap}
.chip.w{background:rgba(62,207,142,.14);color:var(--win)}.chip.l{background:rgba(255,93,108,.14);color:var(--loss)}.chip.a{background:rgba(245,165,36,.15);color:var(--am)}
.num{font-family:var(--fd);font-weight:600;font-variant-numeric:tabular-nums}

/* картинки движка */
.q-fc{display:inline-block;width:40px;height:40px;border-radius:9px;overflow:hidden;background:var(--s3);flex:none;vertical-align:middle}
.q-fc img{width:100%;height:100%;object-fit:cover;display:block}
.q-fc.s{width:32px;height:32px;border-radius:8px}
.q-it{width:26px;height:26px;border-radius:6px;background:var(--s3);object-fit:cover;border:1px solid rgba(255,255,255,.06)}
.q-it.weapon{border-color:rgba(245,165,36,.5)}.q-it.vitality{border-color:rgba(62,207,142,.5)}.q-it.spirit{border-color:rgba(166,120,255,.6)}
.rk{width:44px;height:44px;object-fit:contain}
.hi{width:28px;height:28px;border-radius:7px;object-fit:cover;background:var(--s3)}

/* поиск на старте */
.lnd{max-width:760px;margin:60px auto 0;text-align:center}
.lnd h1{font:600 64px/1 var(--fd);letter-spacing:.18em;color:var(--am);margin:0}
.lnd p{color:var(--mu);font-size:16px;margin:12px 0 26px}
.lnd form{display:flex;gap:8px;max-width:560px;margin:0 auto}
.lnd input{flex:1;height:50px;border-radius:12px;border:1px solid var(--ln2);background:var(--s1);color:var(--tx);padding:0 16px;font:inherit;font-size:16px;outline:none}
.lnd input:focus{border-color:var(--am)}
.lnd .btn{height:50px;padding:0 22px;font-size:15px}
.lnd-dd{max-width:560px;margin:8px auto 0;text-align:left}
.lnd-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:40px;text-align:left}
.lnd-g a{display:block;padding:16px;border-radius:14px;background:var(--s1);border:1px solid var(--ln)}
.lnd-g a:hover{border-color:var(--am)}
.lnd-g b{display:block;font:600 16px/1.2 var(--fd);text-transform:uppercase;letter-spacing:.04em}
.lnd-g small{color:var(--mu)}

/* игрок: шапка */
.pb{position:relative;display:flex;align-items:center;gap:18px;padding:20px 22px;border-radius:16px;background:linear-gradient(100deg,var(--s2),var(--s1));border:1px solid var(--ln);overflow:hidden;margin-bottom:14px}
.pb-bg{position:absolute;inset:0 0 0 45%;background-size:cover;background-position:center 20%;opacity:.22;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.pb>*:not(.pb-bg){position:relative}
.pb-av{width:76px;height:76px;border-radius:14px;object-fit:cover;background:var(--s3);flex:none}
.pb-n{min-width:0}
.pb-n h1{margin:0;font:600 34px/1.05 var(--fd);text-transform:uppercase;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-n p{margin:6px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--mu);font-size:13px}
.pb-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}

/* игрок: обзор */
.pov{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
.pov-l{display:grid;gap:14px}
.rkc{display:flex;align-items:center;gap:14px}
.rkc .rk{width:64px;height:64px}
.rkc b{display:block;font:600 22px/1.1 var(--fd);text-transform:uppercase}
.rkc small{display:block;color:var(--mu);font-size:12.5px}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
.kpi span{display:grid;gap:2px}
.kpi small{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpi b{font:600 24px/1 var(--fd);font-variant-numeric:tabular-nums}
.kpi b.big{color:var(--am)}
.th3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.th3 a{position:relative;display:block;border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:var(--s3)}
.th3 img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
.th3 em{position:absolute;top:6px;left:6px;font-style:normal;font:600 12px/1 var(--fd);padding:4px 6px;border-radius:5px;background:rgba(0,0,0,.65)}
.th3 span{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:12px;line-height:1.2}
.th3 span b{display:block;font:600 14px/1.1 var(--fd);text-transform:uppercase}
.th3 span small{color:#c9cbd0;font-size:11px}
.thl a{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 2px;border-top:1px solid var(--ln)}
.thl a:hover{background:rgba(255,255,255,.03)}
.thl b{display:block;font-size:13.5px}.thl small{display:block;font-size:11.5px;color:var(--mu)}
.thl em{font-style:normal;font:600 15px/1 var(--fd)}
.act{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:10px}
.act i{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--ln2)}
.act i.w{background:var(--win);border-color:var(--win)}.act i.l{background:var(--loss);border-color:var(--loss)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;color:var(--mu)}
.wk span{display:grid;gap:4px}
.wk i{display:block;height:4px;border-radius:2px;background:var(--ln2)}
.wk i.w{background:var(--win)}.wk i.l{background:var(--loss)}.wk i.m{background:linear-gradient(90deg,var(--win) 50%,var(--loss) 50%)}
.hs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hs .sp{flex:1}

/* строка матча */
.mrs{display:grid;gap:8px}
.mr{position:relative;display:grid;grid-template-columns:62px minmax(110px,1.05fr) minmax(100px,.9fr) minmax(90px,.7fr) 186px minmax(0,1.5fr) 20px;gap:14px;align-items:center;padding:10px 12px 10px 14px;border-radius:12px;background:var(--s1);border:1px solid var(--ln);cursor:pointer;transition:border-color .15s,background .15s}
.mr::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--loss)}
.mr.w::before{background:var(--win)}
.mr:hover{border-color:var(--ln2);background:var(--s2)}
.mr.open{border-color:var(--am);border-bottom-left-radius:0;border-bottom-right-radius:0}
.mr-pt{position:relative;width:62px;height:72px;border-radius:9px;overflow:hidden;background:var(--s3)}
.mr-pt img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
.mr-pt em{position:absolute;left:0;right:0;bottom:0;font-style:normal;text-align:center;font:600 10px/1.6 var(--fd);letter-spacing:.08em;background:var(--loss);color:#fff}
.mr.w .mr-pt em{background:var(--win);color:#06140d}
.mr-h b{display:block;font:600 17px/1.1 var(--fd);text-transform:uppercase;letter-spacing:.02em}
.mr-h small{display:block;color:var(--mu);font-size:12px;margin:3px 0 5px}
.mr-h .chip{margin-right:4px}
.mr-k b{display:block;font:600 21px/1 var(--fd);font-variant-numeric:tabular-nums}
.mr-k b i{font-style:normal;color:var(--loss)}
.mr-k small,.mr-s small{display:block;color:var(--mu);font-size:12px;margin-top:3px}
.mr-s b{display:block;font:600 17px/1 var(--fd);font-variant-numeric:tabular-nums}
.mr-it{display:grid;grid-template-columns:repeat(6,26px);gap:4px}
.mr-it i{display:block;width:26px;height:26px;border-radius:6px;background:var(--s2);border:1px dashed var(--ln)}
.mr-tm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px;font-size:12px;line-height:1.45;min-width:0}
.mr-tm span{display:flex;align-items:center;gap:5px;min-width:0;color:var(--mu)}
.mr-tm span img{width:15px;height:15px;border-radius:4px;flex:none}
.mr-tm span em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr-tm span.me{color:var(--tx);font-weight:800}
.mr-ar{color:var(--mu);transition:transform .2s}
.mr.open .mr-ar{transform:rotate(180deg);color:var(--am)}
.mrx{margin-top:-8px;padding:14px;border:1px solid var(--am);border-top:0;border-radius:0 0 12px 12px;background:var(--s1)}
.mrx-ft{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:12px}

/* таблица матча */
.sb{display:grid;gap:14px}
.sb-h{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
.sb-h b{font:600 18px/1 var(--fd);text-transform:uppercase;letter-spacing:.04em}
.sb-team.t0 .sb-h b{color:var(--t0)}.sb-team.t1 .sb-h b{color:var(--t1)}
.sb-h em{font-style:normal;font-size:11.5px;font-weight:800;padding:3px 7px;border-radius:5px;background:rgba(62,207,142,.15);color:var(--win)}
.sb-h span{margin-left:auto;color:var(--mu);font-size:12.5px}
.sb-tw{overflow-x:auto;border-radius:10px;border:1px solid var(--ln)}
.sb-t{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
.sb-t th{padding:7px 8px;text-align:center;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:800;background:var(--s2)}
.sb-t td{padding:6px 8px;text-align:center;border-top:1px solid var(--ln);font-variant-numeric:tabular-nums;white-space:nowrap}
.sb-t th.p,.sb-t td.p{text-align:left;width:210px}
.sb-t td.p{display:flex;align-items:center;gap:9px}
.sb-t td.p b{display:block;font-size:13px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.sb-t td.p small{display:block;font-size:11.5px;color:var(--mu)}
.sb-t td.d{color:#ff9aa4}
.sb-t td.mx{color:var(--am);font-weight:800}
.sb-t td.it{text-align:left}
.sb-t td.it img{width:22px;height:22px;margin-right:2px;vertical-align:middle}
.sb-t tr{cursor:pointer}
.sb-t tbody tr:hover td{background:rgba(255,255,255,.025)}
.sb-t tr.me td{background:rgba(245,165,36,.07)}
.sb-t tr.on td{background:rgba(245,165,36,.13)}
.sb-t tr.on td.p{box-shadow:inset 3px 0 0 var(--am)}
.gr{display:inline-grid;place-content:center;min-width:30px;height:24px;padding:0 5px;border-radius:6px;font:600 13px/1 var(--fd);background:var(--s3)}
.gr.S,.gr.A{background:rgba(62,207,142,.16);color:var(--win)}.gr.B{background:rgba(245,165,36,.14);color:var(--am)}.gr.C,.gr.D,.gr.E{background:rgba(255,93,108,.14);color:var(--loss)}

/* матч: шапка */
.mh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:18px 22px;border-radius:16px;background:var(--s1);border:1px solid var(--ln);margin-bottom:14px}
.mh-t{display:flex;align-items:center;gap:10px}
.mh-t.t1{justify-content:flex-end;text-align:right}
.mh-t b{font:600 20px/1 var(--fd);text-transform:uppercase;letter-spacing:.04em}
.mh-t.t0 b{color:var(--t0)}.mh-t.t1 b{color:var(--t1)}
.mh-t em{font-style:normal;font-size:11.5px;font-weight:800;padding:3px 7px;border-radius:5px;background:rgba(62,207,142,.15);color:var(--win)}
.mh-c{text-align:center}
.mh-c .sc{font:600 42px/1 var(--fd);font-variant-numeric:tabular-nums}
.mh-c .sc i{font-style:normal;color:var(--mu2);margin:0 10px;font-size:26px;vertical-align:middle}
.mh-c .sc .a{color:var(--t0)}.mh-c .sc .b{color:var(--t1)}
.mh-c small{display:block;color:var(--mu);font-size:12.5px;margin-top:4px}
.mh-c .res{display:block;font:600 15px/1 var(--fd);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.ftr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;color:var(--mu);font-size:12.5px}

/* линия: сравнение полосками */
.lc{display:grid;gap:12px}
.lc-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lc-vs{display:flex;justify-content:center;align-items:center;gap:18px;padding:8px 0 4px}
.lc-vs .pr{display:flex;gap:10px}
.lc-vs .pr span{display:grid;justify-items:center;gap:3px;font-size:11.5px;color:var(--mu);max-width:84px;text-align:center}
.lc-vs .pr span b{color:var(--tx);font-size:12px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-vs>i{font:600 14px/1 var(--fd);color:var(--mu2)}
.lc-res{text-align:center}
.lc-row{display:grid;grid-template-columns:70px minmax(0,1fr) 70px;gap:10px;align-items:center}
.lc-row>b{font:600 15px/1 var(--fd);font-variant-numeric:tabular-nums}
.lc-row>b:last-child{text-align:right}
.lc-bar{display:grid;gap:4px}
.lc-bar small{text-align:center;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-weight:800}
.lc-bar div{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--s3)}
.lc-bar div i{display:block;height:100%}
.lc-bar div i.a{background:var(--win)}.lc-bar div i.b{background:var(--loss)}

/* урон: полоски */
.db{display:grid;gap:6px}
.db a,.db div.r{display:grid;grid-template-columns:22px 32px minmax(0,150px) minmax(0,1fr) 70px;gap:10px;align-items:center}
.db em{font-style:normal;color:var(--mu);font-size:12px;text-align:right}
.db b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db .bar{height:8px;border-radius:4px;background:var(--s3);overflow:hidden}
.db .bar i{display:block;height:100%;border-radius:4px}
.db .r.t0 .bar i{background:var(--t0)}.db .r.t1 .bar i{background:var(--t1)}
.db span.v{text-align:right;font-family:var(--fd);font-weight:600;font-variant-numeric:tabular-nums}
.lead{width:100%;height:120px;display:block}

/* герои */

.hc{position:relative;display:block;border-radius:12px;overflow:hidden;background:var(--s2);border:1px solid var(--ln);transition:transform .15s,border-color .15s}

.hc .im{aspect-ratio:3/4;background:var(--s3)}
.hc .im img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}

.hc .tr.S{color:var(--am)}.hc .tr.A{color:var(--win)}
.hc .bt{padding:9px 10px 10px}
.hc .bt b{display:block;font:600 15px/1.1 var(--fd);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .bt span{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-top:3px}
.hc .bt span b{display:inline;font-size:13px}

/* страница героя */
.hb{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:300px;border-radius:18px;overflow:hidden;background:var(--s1);border:1px solid var(--ln);margin-bottom:14px}
.hb-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35}

.hb-l{position:relative;padding:28px 30px;display:flex;flex-direction:column;justify-content:center;gap:10px}

.hb-l .tg{display:flex;flex-wrap:wrap;gap:6px}

.hst{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}

.bp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.hgr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}

/* лидеры */

/* патчи */
.up{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}

.upl button{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--s1)}

.ugrp h3{display:inline-flex;align-items:center;gap:8px;margin:0 0 10px;font:600 13px/1 var(--fd);letter-spacing:.14em;text-transform:uppercase;padding:7px 10px;border-radius:7px}
.ugrp.d h3{background:rgba(255,93,108,.12);color:var(--loss)}.ugrp.m h3{background:rgba(245,165,36,.12);color:var(--am)}.ugrp.u h3{background:rgba(62,207,142,.12);color:var(--win)}
.uhg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}

.uhg img{width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 15%;display:block}
.uhg span{display:block;padding:5px 4px;font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uhg em{position:absolute;top:4px;right:4px;display:flex;gap:2px;font-style:normal}
.uhg em i{font-style:normal;font-size:10px;font-weight:800;padding:1px 4px;border-radius:4px}
.uhg em i.u{background:var(--win);color:#06140d}.uhg em i.d{background:var(--loss);color:#fff}
.uln{display:grid;gap:4px}
.uln div{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--ln);font-size:13.5px}
.uln div>i{font-style:normal;font-weight:800;text-align:center}
.uln div.u>i{color:var(--win)}.uln div.d>i{color:var(--loss)}

.uln h4{margin:10px 0 2px;font:600 15px/1.2 var(--fd);text-transform:uppercase}

/* статистика */
.stg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.brs{display:grid;gap:8px}
.brs div{display:grid;grid-template-columns:110px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:13px}
.brs .bar{height:10px;border-radius:5px;background:var(--s3);overflow:hidden}
.brs .bar i{display:block;height:100%}
.brs em{font-style:normal;text-align:right;color:var(--mu);font-size:12px}
.brs em b{color:var(--tx);font-family:var(--fd);font-size:14px;margin-right:4px}
.spark{width:100%;height:140px;display:block}

/* разбор коуча — подогнать под новый вид */
.co2-txt,.co-hd,.co-box,.co-main,.co-task{border-radius:14px}

/* RESTLESS dev-gate: пока status.json не скажет open:true — сайт закрыт экраном-замком.
   Своё устройство открывается один раз: ссылка с ?dev=КЛЮЧ или ввод ключа на замке.
   Локальная копия (file://) всегда открыта. */
(function () {
  var DEV_KEY = 'vasyan2026';
  var dev = false;
  try { dev = localStorage.getItem('r_dev') === '1'; } catch (e) {}
  var m = location.search.match(/[?&]dev=([^&#+]*)/);
  if (m) {
    var k = '';
    try { k = decodeURIComponent(m[1]).replace(/\+/g, ' ').trim().toLowerCase(); } catch (e) { k = String(m[1]).toLowerCase(); }
    if (k === DEV_KEY) { dev = true; try { localStorage.setItem('r_dev', '1'); } catch (e) {} }
    var q = location.search.replace(/[?&]dev=[^&#+]*/g, '');
    if (q.charAt(0) === '&') q = '?' + q.slice(1);
    q = q.replace(/^\?&/, '?');
    if (q === '?') q = '';
    try { history.replaceState(null, '', location.pathname + q + location.hash); } catch (e) {}
  }
  if (dev || location.protocol === 'file:') { console.log('[Restless] dev-доступ: сайт открыт на этом устройстве'); return; }
  var ov = null;
  function lock() {
    if (ov) return;
    var st = document.createElement('style');
    st.id = 'rlk-st';
    st.textContent = '#rlk{position:fixed;inset:0;z-index:2147483647;background:#06080d;display:flex;align-items:center;justify-content:center;font:14px/1.5 Inter,system-ui,sans-serif;color:#e8e6df}#rlk .b{width:min(92vw,380px);text-align:center}#rlk .lg{font:700 34px/1 Unbounded,Inter,sans-serif;letter-spacing:.12em;color:#f6b73c}#rlk .lg small{display:block;font:500 11px/1 Inter,sans-serif;letter-spacing:.42em;color:#8a8577;margin-top:8px}#rlk p{color:#9b968a;margin:18px 0 14px}#rlk .row{display:flex;gap:8px}#rlk input{flex:1;background:#11141a;border:1px solid #262b35;border-radius:10px;color:#e8e6df;padding:11px 13px;font:600 13px Inter,sans-serif;outline:none;min-width:0}#rlk input:focus{border-color:#f6b73c}#rlk button{background:#f6b73c;border:0;border-radius:10px;color:#14100a;font:700 13px Inter,sans-serif;padding:11px 16px;cursor:pointer}#rlk .er{color:#ff7a6b;font:600 12px Inter,sans-serif;height:18px;margin-top:10px;opacity:0;transition:.2s}#rlk .er.on{opacity:1}#rlk.shake .b{animation:rlk-sh .3s}@keyframes rlk-sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}';
    document.head.appendChild(st);
    ov = document.createElement('div');
    ov.id = 'rlk';
    ov.innerHTML = '<div class="b"><div class="lg">RESTLESS<small>DEADLOCK</small></div><p>Сайт закрыт на разработку.<br>Для всех откроется позже — хозяин, ключ сюда.</p><div class="row"><input id="rlk-in" type="password" placeholder="Ключ доступа" autocomplete="off"><button id="rlk-go" type="button">Открыть</button></div><div class="er" id="rlk-er">Не тот ключ</div></div>';
    (document.body || document.documentElement).appendChild(ov);
    try { document.documentElement.style.overflow = 'hidden'; } catch (e) {}
    var inp = document.getElementById('rlk-in');
    function tryKey() {
      var v = (inp.value || '').trim().toLowerCase();
      if (v === DEV_KEY) { try { localStorage.setItem('r_dev', '1'); } catch (e) {} unlock(); }
      else {
        var er = document.getElementById('rlk-er');
        er.classList.add('on');
        ov.classList.remove('shake'); void ov.offsetWidth; ov.classList.add('shake');
      }
    }
    document.getElementById('rlk-go').addEventListener('click', tryKey);
    inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') tryKey(); });
    setTimeout(function () { try { inp.focus(); } catch (e) {} }, 50);
  }
  function unlock() {
    if (ov) { ov.remove(); ov = null; }
    var st = document.getElementById('rlk-st'); if (st) st.remove();
    try { document.documentElement.style.overflow = ''; } catch (e) {}
    console.log('[Restless] замок снят');
  }
  lock();
  if (location.protocol !== 'file:') {
    fetch('../status.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (j && j.open === true) { unlock(); console.log('[Restless] сайт открыт для всех (status.json)'); }
    }).catch(function () {});
  }
})();

<script>
'use strict';
'use strict';
const D = window.RL_DATA || {heroes:{}, items:{}, ranks:[], map:{}};
const API = 'https://api.deadlock-api.com/v1/';
const STEAM0 = 76561197960265728n;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => (n == null || isNaN(n)) ? '—' : Math.round(n).toLocaleString('ru-RU');
const pc = (w, n) => n ? Math.round(100 * w / n) : 0;
const pc1 = (w, n) => n ? (100 * w / n).toFixed(1).replace('.', ',') : '0';
const mmss = s => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const now = () => Math.floor(Date.now() / 1000);
const ago = t => { const d = now() - t; if (d < 3600) return Math.max(1, Math.round(d / 60)) + ' мин назад'; if (d < 86400) return Math.round(d / 3600) + ' ч назад'; const k = Math.round(d / 86400); return k + ' ' + pl(k, ['день', 'дня', 'дней']) + ' назад'; };
const pl = (n, a) => { n = Math.abs(Math.round(n)) % 100; const k = n % 10; return a[n > 10 && n < 20 ? 2 : k === 1 ? 0 : k > 1 && k < 5 ? 1 : 2]; };
const games = n => nf(n) + ' ' + pl(n, ['игра', 'игры', 'игр']);
const wrCls = (w, n, k = 5) => n >= k ? (100 * w / n >= 52 ? 'win' : 100 * w / n <= 47 ? 'loss' : '') : '';
const noimg = "this.style.visibility='hidden'";

// ---------- данные ----------
const CACHE = new Map();
async function api(p) {
  if (CACHE.has(p)) return CACHE.get(p);
  const pr = fetch(API + p).then(async r => {
    if (!r.ok) { const t = await r.text().catch(() => ''); throw new Error(r.status + ' ' + (t || r.statusText).slice(0, 140)); }
    return r.json();
  });
  CACHE.set(p, pr);
  pr.catch(() => CACHE.delete(p));
  return pr;
}
const TYPE_RU = {marksman: 'Стрелок', brawler: 'Боец', mystic: 'Мистик', assassin: 'Убийца'};
const hero = id => D.heroes[id] || {n: 'Герой #' + id, i: '', c: '', ab: []};
const heroImg = (id, cls = '') => `<img class="hi ${cls}" data-h="${id}" src="${esc(hero(id).i)}" alt="${esc(hero(id).n)}" title="${esc(hero(id).n)}" loading="lazy" onerror="${noimg}">`;
const item = id => D.items[id];
const itImg = id => `<img src="${esc((item(id) || {}).i)}" alt="" loading="lazy" onerror="${noimg}">`;
function rankOf(badge) {
  badge = +badge || 0;
  const t = Math.floor(badge / 10), s = badge % 10, R = D.ranks.find(x => x.t === t) || {};
  const img = t && s ? `${API}assets/ranks/${t}/${s}/image?format=webp` : ((R.i || {}).small_webp || (R.i || {}).large_webp || '');
  return {t, s, name: badge ? (R.n || '?') + (s ? ' ' + s : '') : 'Без ранга', img, color: R.c || '#888'};
}
const rankImg = (badge, cls = 'rk') => { const r = rankOf(badge); return r.img && badge ? `<img class="${cls}" src="${esc(r.img)}" alt="${esc(r.name)}" title="${esc(r.name)}" loading="lazy" onerror="${noimg}">` : `<span class="${cls}"></span>`; };

// фильтры статистики: ранг и период (общие для «Героев», страницы героя и лобби)
const BADGES = [['Все ранги', 0], ['Oracle+', 80], ['Ascendant+', 100], ['Eternus', 110]];
const DAYS = [[7, '7 дней'], [14, '14 дней'], [30, '30 дней']];
const F = {b: 80, d: 14};
try { const s = JSON.parse(localStorage.getItem('rl-f') || 'null'); if (s && s.d) Object.assign(F, s); } catch (e) {}
const fq = () => `min_unix_timestamp=${now() - F.d * 86400 - (now() % 3600)}${F.b ? '&min_average_badge=' + F.b : ''}`;
const fName = () => (BADGES.find(x => x[1] === F.b) || BADGES[0])[0] + ' · ' + (DAYS.find(x => x[0] === F.d) || DAYS[1])[1];
function fltHTML() {
  return `<div class="flt"><div class="seg" data-f="b">${BADGES.map(x => `<button class="${x[1] === F.b ? 'on' : ''}" data-v="${x[1]}">${x[0]}</button>`).join('')}</div>
    <div class="seg" data-f="d">${DAYS.map(x => `<button class="${x[0] === F.d ? 'on' : ''}" data-v="${x[0]}">${x[1]}</button>`).join('')}</div></div>`;
}
function fltBind(redo) {
  $$('.seg[data-f] button').forEach(b => b.onclick = () => { F[b.parentNode.dataset.f] = +b.dataset.v; try { localStorage.setItem('rl-f', JSON.stringify(F)); } catch (e) {} redo(); });
}
// общая статистика героев за период: винрейт, доля игр
async function heroStats() {
  const L = await api('analytics/hero-stats?' + fq());
  const tot = L.reduce((a, h) => a + h.matches, 0) / 12 || 1;
  const M = {};
  L.forEach(h => { if (D.heroes[h.hero_id]) M[h.hero_id] = {id: h.hero_id, w: h.wins, m: h.matches, wr: 100 * h.wins / Math.max(1, h.matches), pr: 100 * h.matches / tot,
    kda: (h.total_kills + h.total_assists) / Math.max(1, h.total_deaths), spm: h.total_net_worth / Math.max(1, h.matches)}; });
  return M;
}
// пары «герой против героя на линии» и «вместе»: один большой запрос на всё, держим в памяти
const counterStats = () => api('analytics/hero-counter-stats?same_lane_filter=true&' + fq());
const synergyStats = () => api('analytics/hero-synergy-stats?' + fq());

// советы против героев — из описаний способностей в файлах игры (SteamDatabase/GameTracking-Deadlock)
const TIPS = {
  86: ['Still Life', 'натюрморт', 'Бьёт и в конце станит, <b>пока смотрит на тебя</b>. Забеги за стену — набросок не дорисуется.', 'as long as you are looking at them'],
  25: ['Lock Down', 'запереть', 'Повесил проклятие — <b>сразу уходи с места</b>. Не сдвинулся вовремя — урон и не двигаешься.', 'if they don\'t move away from their initial position within the escape time'],
  4: ['Life Drain', 'высасывание жизни', 'Тянет твоё здоровье, <b>пока видит и ты рядом</b>. Зайди за угол или отбеги — связь рвётся.', 'Target must be in line of sight and within max range'],
  3: ['Stake', 'кол', 'Цепь держит у места, <b>где упал кол</b>. Не стой рядом с ним — дальше длины цепи не уйдёшь.', 'tethers enemies to the location where the stake lands']
};

// ---------- игрок ----------
let ME = null;
function idFrom(q) {
  q = String(q || '').trim();
  let m = q.match(/steamcommunity\.com\/profiles\/(\d{17})/) || q.match(/^(\d{17})$/);
  if (m) return Number(BigInt(m[1]) - STEAM0);
  m = q.match(/^\[?U:1:(\d+)\]?$/i) || q.match(/^(\d{4,11})$/);
  if (m) return +m[1];
  return null;
}
async function setMe(id, push = true) {
  id = +id; if (!id) return;
  ME = {id, name: 'Игрок ' + id, avatar: '', badge: null};
  try { localStorage.setItem('rl-id', String(id)); } catch (e) {}
  if (push) { const u = new URL(location.href); u.searchParams.set('id', id); history.replaceState(null, '', u.pathname + u.search + location.hash); }
  paintMe();
  try {
    const [s] = await api('players/steam?account_ids=' + id);
    if (s) { ME.name = s.personaname || ME.name; ME.avatar = s.avatarmedium || s.avatar || ''; }
    const r = await api('players/' + id + '/rank').catch(() => null);
    ME.badge = r && r.badge || 0;
  } catch (e) {}

function profTags(H, HS, HA) {
  const won = m => m.player_team === m.match_result, T = [], pct = v => Math.round(100 * v);
  // форма
  let k = 0; while (k < H.length && won(H[k]) === won(H[0])) k++;
  if (k >= 3) T.push([(won(H[0]) ? 'Винстрик ' : 'Лузстрик ') + k, won(H[0]) ? 'g' : 'r', `${k} ${won(H[0]) ? 'побед' : 'поражений'} подряд`]);
  const L20 = H.slice(0, 20), w20 = L20.filter(won).length;
  if (L20.length >= 15 && w20 / L20.length >= .65) T.push(['В ударе', 'g', `${w20} побед из ${L20.length} последних`]);

  const RD = L20.map(m => m.ranked_delta).filter(v => typeof v === 'number');
  if (RD.length >= 5) { const s = RD.reduce((a, v) => a + v, 0); if (s > 0) T.push(['Растёт в ранге', 'g', `очки ранга за последние игры: +${s}`]); else if (s < 0) T.push(['Теряет ранг', 'r', `очки ранга за последние игры: ${s}`]); }
  const P = profPatterns(H), all = H.filter(won).length / Math.max(1, H.length), tl = P.find(x => x.n.startsWith('После двух'));
  if (tl && tl.d <= -10) T.push(['Тильтует', 'r', `после двух поражений подряд побеждает в ${Math.round(tl.wr)}% (обычно ${pct(all)}%)`]);
  else if (tl && tl.d >= 8) T.push(['Не тильтует', 'g', `после двух поражений подряд побеждает в ${Math.round(tl.wr)}% (обычно ${pct(all)}%)`]);
  // герои
  const L30 = H.filter(m => m.start_time >= now() - 30 * 86400), cnt = {};
  L30.forEach(m => cnt[m.hero_id] = (cnt[m.hero_id] || 0) + 1);
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  if (top && L30.length >= 10) { const s = top[1] / L30.length, n = hero(top[0]).n;
    if (s >= .6) T.push(['OTP ' + n, 'a', `${pct(s)}% игр за 30 дней — на одном герое`]);
    else if (s >= .3) T.push([n + ' — моя любовь', 'b', `${pct(s)}% игр за 30 дней`]);
    const ha = HA[top[0]], tm = L30.filter(m => m.hero_id === +top[0]);
    if (ha && tm.length >= 10) { const r = tm.reduce((a, m) => a + m.net_worth, 0) / tm.length / ha.spm; if (r >= 1.2) T.push(['Миллионер на ' + n, 'g', `душ за матч на ${pct(r - 1)}% больше, чем обычно на этом герое`]); }
    if (ha && s >= .25 && ha.pr && Object.values(HA).filter(x => x.pr < ha.pr).length / Object.keys(HA).length <= .25) T.push(['Необычный пик', 'b', `${n} берут редко — в ${ha.pr.toFixed(1).replace('.', ',')}% матчей`]); }
  const byH = HS.slice().sort((a, b) => b.matches_played - a.matches_played), vet = byH[0];

  else if (vet && vet.matches_played >= 100) T.push(['Мейн ' + hero(vet.hero_id).n, 'a', `${nf(vet.matches_played)} игр на герое — больше всех`]);
  const L50 = H.slice(0, 50), c50 = {}; L50.forEach(m => c50[m.hero_id] = (c50[m.hero_id] || 0) + 1);
  const many = Object.values(c50).filter(v => v >= 3).length; if (L50.length >= 30 && many >= 8) T.push(['Мастер на все руки', 'b', `${many} героев по 3+ игры из последних ${L50.length}`]);
  const last = H[0], hl = HS.find(h => h.hero_id === last.hero_id);
  if (hl && hl.matches_played < 10) T.push(['Учит ' + hero(last.hero_id).n, '', `всего ${games(hl.matches_played)} на герое`]);

    const soul = r((m, a) => m.net_worth / Math.max(1, a.spm)), dth = r((m, a) => m.player_deaths / Math.max(.1, a.dpm)),

    else if (soul <= .85) T.push(['Плохой фарм', 'r', `душ на ${pct(1 - soul)}% меньше среднего по своим героям`]);
    if (dth >= 1.3) T.push(['Кормит', 'r', `смертей на ${pct(dth - 1)}% больше среднего по героям`]);
    else if (dth <= .75) T.push(['Живучий', 'g', `смертей на ${pct(1 - dth)}% меньше среднего по героям`]);
    if (kil >= 1.3) T.push(['Убийца', 'g', `убийств на ${pct(kil - 1)}% больше среднего по героям`]);
    if (ast >= 1.3) T.push(['Командный', 'g', `помощи в убийствах на ${pct(ast - 1)}% больше среднего по героям`]);
    if (kil <= .7 && ast <= .8) T.push(['Мало в драках', 'r', 'и убийств, и помощи меньше среднего по героям']);
    if (lh >= 1.2) T.push(['Мастер добивания', 'g', `добиваний на ${pct(lh - 1)}% больше среднего по героям`]);
    else if (lh <= .8) T.push(['Не добивает', 'r', `добиваний на ${pct(1 - lh)}% меньше среднего по героям`]);
    if (dn >= 1.5) T.push(['Отнимает души', 'g', 'отказов (денаев) в 1,5 раза больше среднего — не даёт сопернику добить']);
  }

  if (lv) T.push([`Ливал ${lv} ${pl(lv, ['раз', 'раза', 'раз'])}`, 'r', 'вышел из матча за последние 30 дней']);

  const mx = Math.max(0, ...Object.values(byDay)); if (mx >= 8) T.push(['Марафонец', 'b', `до ${mx} игр за день`]);
  const d14 = new Set(H.filter(m => m.start_time >= now() - 14 * 86400).map(m => day(m).toDateString())).size;
  if (d14 >= 12) T.push(['Каждый день', 'b', `играл ${d14} дней из последних 14`]);
  const night = L30.filter(m => day(m).getHours() < 6).length;
  if (L30.length >= 10 && night / L30.length >= .4) T.push(['Ночной игрок', 'b', `${pct(night / L30.length)}% игр с полуночи до 6 утра`]);
  const wk = L30.filter(m => [0, 6].includes(day(m).getDay())).length;

  if (H.length >= 2 && H[0].start_time - (H[1].start_time + H[1].match_duration_s) >= 14 * 86400) T.push(['Вернулся', 'b', `перерыв ${Math.round((H[0].start_time - H[1].start_time) / 86400)} дней перед последней игрой`]);
  return T;
}
// паттерны: винрейт в разных условиях против общего (сессия — матчи с перерывом меньше часа)
function profPatterns(H) {
  const won = m => m.player_team === m.match_result, A = H.slice().reverse(), all = A.filter(won).length / Math.max(1, A.length);
  const B = {s1: [], s2: [], s3: [], l2: [], long: []}; let pos = 0;
  A.forEach((m, i) => { const p = A[i - 1]; pos = p && m.start_time - (p.start_time + p.match_duration_s) < 3600 ? pos + 1 : 1;
    if (pos <= 3) B['s' + pos].push(won(m));
    if (i >= 2 && !won(A[i - 1]) && !won(A[i - 2]) && pos > 1) B.l2.push(won(m));
    if (m.match_duration_s >= 35 * 60) B.long.push(won(m)); });
  const N = {s1: 'Первый матч сессии', s2: 'Второй матч сессии', s3: 'Третий матч сессии', l2: 'После двух поражений подряд', long: 'Игры длиннее 35 минут'};
  return Object.entries(B).filter(([, v]) => v.length >= 12).map(([k, v]) => { const wr = v.filter(Boolean).length / v.length; return {n: N[k], d: 100 * (wr - all), wr: 100 * wr, c: v.length}; });
}

async function scout(players) {
  const ids = players.map(p => p.account_id).filter(Boolean);
  const q = 'account_ids=' + ids.join(',');
  const [steam, ranks, hs] = await Promise.all([api('players/steam?' + q).catch(() => []), api('players/rank?' + q).catch(() => []), api('players/hero-stats?' + q).catch(() => [])]);
  const S = {}, R = {}, H = {}, T = {};
  steam.forEach(s => S[s.account_id] = s);
  ranks.forEach(r => R[r.account_id] = r);
  hs.forEach(h => { (H[h.account_id] = H[h.account_id] || {})[h.hero_id] = h; const t = T[h.account_id] = T[h.account_id] || {m: 0, w: 0}; t.m += h.matches_played || 0; t.w += h.wins || 0; });
  return players.map(p => {
    const id = p.account_id, hid = p.hero_id, h = (H[id] || {})[hid] || {}, t = T[id] || {m: 0, w: 0}, r = R[id] || {};
    const hm = h.matches_played || 0, hw = h.wins || 0, tags = [];
    if (hm >= 20 && t.m && hm / t.m >= .25) tags.push(['a', 'мейн героя']);
    else if (hm >= 150) tags.push(['b', 'ветеран героя']);
    if (hm <= 2 && t.m >= 30) tags.push(['r', hm ? 'почти не играл' : 'первый раз на герое']);
    if (t.m && t.m < 60) tags.push(['', 'новичок']);
    const ws = r.last_match && r.last_match.player_rank_initial_win_streak;
    if (ws >= 3 && r.last_match.start_time > now() - 86400 * 2) tags.push(['g', 'серия побед · ' + ws]);
    if (hm >= 15 && hw / hm >= .6) tags.push(['g', 'сильный на герое']);
    if (hm >= 15 && hw / hm <= .4) tags.push(['r', 'слабый на герое']);
    const threat = hm >= 10 ? (hw / hm - .5) * Math.min(1, hm / 60) + (ws >= 3 ? .05 : 0) + (r.badge || 0) / 1000 : (r.badge || 0) / 1000 - .1;
    return {id, hid, team: p.team, lane: p.assigned_lane, name: (S[id] || {}).personaname || 'Скрытый игрок', avatar: (S[id] || {}).avatarmedium, badge: r.badge || 0, hm, hw, tm: t.m, tw: t.w, kda: hm ? (h.kills + h.assists) / Math.max(1, h.deaths) : 0, tags, threat};
  });
}

function heroTags(x, M) {
  const h = hero(x.id), T = [], L = Object.values(M), q = (f, p) => { const s = L.map(f).sort((a, b) => a - b); return s[Math.floor(p * (s.length - 1))]; };
  if (TYPE_RU[h.ty]) T.push([TYPE_RU[h.ty], 'b', 'роль из файлов игры']);
  if (x.wr >= 53) T.push(['Сильный сейчас', 'h', `${x.wr.toFixed(1).replace('.', ',')}% побед за период`]);
  else if (x.wr < 47) T.push(['Слабый сейчас', 'r', `${x.wr.toFixed(1).replace('.', ',')}% побед за период`]);
  if (x.pr >= q(y => y.pr, .75)) T.push(['Популярный', 'a', `берут в ${x.pr.toFixed(1).replace('.', ',')}% матчей`]);
  else if (x.pr <= q(y => y.pr, .2)) T.push(['Редко берут', '', `берут в ${x.pr.toFixed(1).replace('.', ',')}% матчей`]);
  if (h.cx === 1) T.push(['Простой', 'g', 'сложность 1 из 3 — для начала']); else if (h.cx === 3) T.push(['Сложный', 'r', 'сложность 3 из 3']);

}

// ----- Экономика: откуда души и куда уходят -----
const SRC = [['lane', 'Крипы на линии', '#3fbf8f', ['lane_creeps']], ['jg', 'Лес', '#a3d34a', ['neutrals']], ['kill', 'Убийства', '#ff6b81', ['players']], ['ast', 'Помощь', '#ff9eb0', ['assists']],

  ['acc', 'Точность', 'попадания из всех выстрелов', (g, p) => { const s = fin(p), a = (s.shots_hit || 0) + (s.shots_missed || 0); return a ? (s.shots_hit || 0) / a : 0; }, v => Math.round(100 * v) + '%'],
  ['crit', 'Криты', 'доля критов в попаданиях по героям', (g, p) => { const s = fin(p); return s.hero_bullets_hit ? (s.hero_bullets_hit_crit || 0) / s.hero_bullets_hit : 0; }, v => Math.round(100 * v) + '%'],
  ['heal', 'Лечение', 'себя и союзников, в минуту', (g, p) => (fin(p).player_healing || 0) / (g.dur / 60), v => nf(Math.round(v))],

// ---------- рейтинг на герое: точное место в мире среди всех игроков на герое (по победам на нём) ----------
// analytics/scoreboards/players отдаёт игроков героя по убыванию побед; своё значение берём фильтром account_ids,
// место ищем вилкой (несколько точечных запросов limit=1), потом одной страницей до 10 000 строк. При равенстве — лучшее место из равных.
const HRC = {}, RTH = {};

function heroRating(hid, id) {

    const base = `hero_id=${hid}&sort_by=wins`, me = ((await SBQ(`${base}&account_ids=${id}`).catch(() => [])) || [])[0];
    if (!me || !me.value) return {pos: 0, v: me ? me.value : 0, m: me ? me.matches : 0};
    const v = me.value, probe = async s => { const r = await SBQ(`${base}&start=${s}&limit=1`).catch(() => null); return r ? (r[0] ? {r: r[0].rank, v: r[0].value} : {r: s, v: -1}) : null; };
    let lo = {r: 0, v: Infinity}, hi = null, pts = [1000, 10000, 50000, 150000, 400000];
    for (let d = 0; d < 5; d++) {

      if (!hi) hi = {r: lo.r + 10000};
      if (hi.r - lo.r <= 10000) break;

function coFacts(p) {
  const X = MX, M = X.M.get(p), T = X.P.filter(q => teamOf(q.team) === teamOf(p.team)), E = X.P.filter(q => teamOf(q.team) !== teamOf(p.team));
  const DD = typeof mDeaths === 'function' ? mDeaths(X.mi, p, X.PT) : [];
  DD.forEach(d => { if (d.ttk != null && d.ttk < 0) { d.ttk = null; d.why = d.why.filter(w => !/врасплох/.test(w)); } }); // в данных бывает «−1 с»
  const n = DD.length, alone = DD.filter(d => d.mates === 0).length, fast = DD.filter(d => d.ttk != null && d.ttk < 3).length, low = DD.filter(d => d.hp != null && d.hp < 45).length, lane = DD.filter(d => d.t < 600).length;
  const K = {}; DD.forEach(d => { if (d.k && teamOf(d.k.team) !== teamOf(p.team)) K[d.k.hero_id] = (K[d.k.hero_id] || 0) + 1; });
  const killers = Object.entries(K).map(([h, c]) => ({h: +h, c})).sort((a, b) => b.c - a.c);
  const opp = mOpp(p), lane10 = opp ? mAt(p, 600) - mAt(opp, 600) : null;

  const tk = T.reduce((a, q) => a + (q.kills || 0), 0);
  return {p, M, DD, n, alone, fast, low, lane, killers, opp, lane10, tk, won: teamOf(p.team) === X.win,
    spmT: tAvg(m => m.spm), dpmL: lAvg(m => m.dpm), dAvg: mAvg(X.P, q => q.deaths || 0), opmL: lAvg(m => m.opm), score: (X.A.get(p) || {}).score || 50,
    spmPl: mPlace(X.P, q => X.M.get(q).spm, p), big: DD.filter(d => d.foes >= 3 && d.mates >= 2).length,
    long: DD.filter(d => d.mates === 0 && d.ttk > 12).map(d => d.ttk), dmg9: mAt(p, 540, 'player_damage'), dmg9T: mAvg(T, q => mAt(q, 540, 'player_damage')),
    csT: mAvg(T, q => X.M.get(q).cs || 0), T};
}

  const best = ok.slice().sort((p, q) => q.wins / q.matches - p.wins / p.matches), tiers = [['S+', best.slice(0, 5)], ['S', best.slice(5, 10)], ['A', best.slice(10, 15)]];

    <div class="hgr"><div class="cd" style="grid-column:span 2"><div class="cd-h">Лучшие предметы<span class="sp"></span><span>по винрейту</span></div><div class="it3">${tiers.map(([t, L]) => L.length ? `<div><b>${t}</b><span>${L.map(z => { const I = item(z.item_id); return `<i title="${esc(I.n)}"><img src="${esc(I.i)}" alt="" loading="lazy" onerror="${noimg}">${f1(100 * z.wins / z.matches)}%</i>`; }).join('')}</span></div>` : '').join('')}</div></div>
    <div class="cd" id="hmy"><div class="cd-h">Ты на ${esc(h.n)}</div><div class="em">${ME ? 'Считаю…' : 'Найди себя в поиске — покажу твою игру на герое.'}</div></div></div>`;
  put(n, '#hpw', strip + build + grid);
  if (ME) {
    const [HS, H] = await Promise.all([api('players/hero-stats?account_ids=' + ME.id).catch(() => []), api('players/' + ME.id + '/match-history').catch(() => [])]);
    if (n !== VQ) return;
    const r = HS.find(z => z.hero_id === hid), M = H.filter(m => m.hero_id === hid).slice(0, 5);
    put(n, '#hmy', `<div class="cd-h">Ты на ${esc(h.n)}</div>${r ? `<div class="kpi"><span><small>Игр</small><b>${nf(r.matches_played)}</b></span><span><small>Винрейт</small>${nwWr(r.wins, r.matches_played)}</span><span><small>KDA</small><b>${f2(nwKda(r))}</b></span></div>
      <div class="thl" style="margin-top:10px">${M.map(m => `<a href="#m/${m.match_id}">${heroImg(m.hero_id)}<span><b class="${nwWon(m) ? 'win' : 'loss'}">${nwWon(m) ? 'Победа' : 'Поражение'}</b><small>${m.player_kills}/${m.player_deaths}/${m.player_assists} · ${esc(ago(m.start_time))}</small></span><em>›</em></a>`).join('')}</div>` : '<div class="em">Ты ещё не играл на этом герое.</div>'}`);
  }
}

// ---------- лидеры ----------
const NW_RG = [['Europe', 'Европа'], ['NAmerica', 'Сев. Америка'], ['SAmerica', 'Юж. Америка'], ['Asia', 'Азия'], ['Oceania', 'Океания']];
async function nvLb(rg) {
  rg = NW_RG.some(x => x[0] === rg) ? rg : NW.lb; NW.lb = rg; const n = vNew();
  V(`<h1 class="pt">Лиде<em>ры</em></h1><div class="hgf">${nwSeg('lbr', NW_RG, rg, 'rg')}<input class="sel" id="lbq" placeholder="Найти ник" aria-label="Найти ник" style="flex:1;max-width:260px"></div><div id="lbw"><div class="ld">Загружаю топ…</div></div>`);
  $$('#lbr button').forEach(b => b.onclick = () => { location.hash = '#lb/' + b.dataset.rg; });
  let R; try { R = await api('leaderboard/' + rg); } catch (e) { put(n, '#lbw', `<div class="er">Не вышло: ${esc(e.message)}</div>`); return; }
  if (n !== VQ) return;
  const E = (R.entries || []).slice(0, 500);
  const draw = q => { const L = (q ? E.filter(e => String(e.account_name || '').toLowerCase().includes(q)) : E).slice(0, q ? 100 : 200);
    put(n, '#lbw', `<div class="lb">${L.map(e => { const one = (e.possible_account_ids || []).length === 1 ? e.possible_account_ids[0] : 0, tag = one ? 'a' : 'div';
      return `<${tag} class="r${e.rank <= 3 ? ' t3' : ''}"${one ? ` href="?id=${one}#home"` : ''}><span class="pl">${e.rank}</span><span><b>${esc(e.account_name || '—')}</b></span><span class="hs3">${(e.top_hero_ids || []).slice(0, 3).map(h => `<img src="${esc(hero(h).i)}" alt="" title="${esc(hero(h).n)}" loading="lazy" onerror="${noimg}">`).join('')}</span></${tag}>`; }).join('') || '<div class="em">Никого не нашёл</div>'}</div>`); };
  draw(''); $('#lbq').oninput = e => draw(e.target.value.trim().toLowerCase());
}

// ---------- лайв-матч ----------
async function nvLive(arg) {
  const n = vNew(), aid = +arg || (ME ? ME.id : 0);
  V(`<h1 class="pt">Лайв-<em>матч</em></h1><div class="lv"><form id="lvf" autocomplete="off"><input id="lvq" placeholder="Ник, ссылка Steam или ID" aria-label="Игрок"><button class="btn p" type="submit">Найти</button></form>
    <div class="nh-dd hide" id="lvd" style="position:static;max-width:560px;margin:-8px 0 16px"></div></div>
    <div id="lvb">${aid ? '<div class="ld">Ищу живой матч…</div>' : '<div class="cd em">Введи ник или ID — покажу всех 12 игроков его текущего матча: ранг, игры и винрейт на герое.</div>'}</div>`);
  nwFind($('#lvq'), $('#lvd'), id => { location.hash = '#live/' + id; });
  if (!aid) return;
  let A; try { A = await live(`matches/active?account_id=${aid}`); } catch (e) { put(n, '#lvb', `<div class="er">Не вышло: ${esc(e.message)}</div>`); return; }
  if (n !== VQ) return;
  const m = (A || [])[0];
  if (!m) { await steamNames([aid]); if (n !== VQ) return; put(n, '#lvb', `<div class="cd em">${esc((SN[aid] || {}).n || 'Игрок')} сейчас не в матче. <a class="am" href="?id=${aid}#home">Открыть профиль ›</a></div>`); return; }
  const P = m.players || [], ids = P.map(p => p.account_id).filter(Boolean), q = 'account_ids=' + ids.join(',');
  const [, RK, HS] = await Promise.all([steamNames(ids), api('players/rank?' + q).catch(() => []), api('players/hero-stats?' + q).catch(() => [])]);
  if (n !== VQ) return;
  const rk = {}; (RK || []).forEach(r => rk[r.account_id] = r.badge || 0);
  const row = p => { const s = (HS || []).find(z => z.account_id === p.account_id && z.hero_id === p.hero_id), sn = SN[p.account_id] || {};
    return `<a class="lvp${p.account_id === aid ? ' me' : ''}" href="?id=${p.account_id}#home">${face(p.hero_id, '', '')}<span><b>${esc(sn.n || 'Игрок')}</b><small>${esc(hero(p.hero_id).n)}${rk[p.account_id] ? ' · ' + esc(rankOf(rk[p.account_id]).name) : ''}</small></span>
      <span class="r">${s ? `<strong>${games(s.matches_played)}</strong>на герое · ${pc(s.wins, s.matches_played)}%` : '<strong>первая игра</strong>на герое'}</span></a>`; };
  const st = m.start_time ? Math.max(0, now() - m.start_time) : 0;
  put(n, '#lvb', `<div class="cd" style="margin-bottom:14px"><div class="cd-h">Идёт матч<span class="sp"></span><span>${esc(m.match_mode_parsed === 'Ranked' ? 'Ранговый' : m.match_mode_parsed === 'Unranked' ? 'Обычный' : (m.match_mode_parsed || ''))}${st ? ' · идёт ' + mmss(st) : ''}</span></div></div>
    <div class="lvt">${[0, 1].map(k => `<div class="cd"><div class="cd-h" style="color:var(--t${k})">${TEAMN[k]}</div>${P.filter(p => teamOf(p.team) === k).map(row).join('')}</div>`).join('')}</div>`);
}

// ---------- патчи ----------
async function nvUpd(sel) {
  const n = vNew();
  V(`<h1 class="pt">Пат<em>чи</em></h1><div id="upw"><div class="ld">Загружаю патчноуты…</div></div>`);
  let P; try { P = await apiU(API2 + 'patches'); if (typeof upLoad === 'function') await upLoad().catch(() => null); } catch (e) { put(n, '#upw', `<div class="er">Не вышло: ${esc(e.message)}</div>`); return; }
  if (n !== VQ) return;
  P = (P || []).slice().sort((a, b) => Date.parse(b.pub_date) - Date.parse(a.pub_date)).slice(0, 24);
  if (!P.length) { put(n, '#upw', '<div class="em">Патчноутов нет.</div>'); return; }
  let i = sel != null && sel !== '' && P[+sel] ? +sel : P.findIndex(p => parsePatch(p).patch); if (i < 0) i = 0;
  const p = P[i], X = parsePatch(p), lines = X.out.filter(x => x.t === 'l'), ch = {};
  lines.forEach(x => { if (!x.h) return; const o = ch[x.h] = ch[x.h] || {u: 0, d: 0, n: 0}; o.n++; if (x.k === 'u') o.u++; if (x.k === 'd') o.d++; });
  const G = {d: [], m: [], u: []}; Object.entries(ch).forEach(([h, o]) => { (o.d > o.u && !o.u ? G.d : o.u > o.d && !o.d ? G.u : G.m).push([+h, o]); });
  const tr = s => { const t = typeof upTr === 'function' ? upTr(s) : null; return t ? `${esc(t)}<small>${esc(s)}</small>` : esc(s); };
  const ln = x => `<div class="${x.k === 'u' ? 'u' : x.k === 'd' ? 'd' : ''}"><i>${x.k === 'u' ? '▲' : x.k === 'd' ? '▼' : '•'}</i><span>${tr(x.s)}</span></div>`;
  const grp = (k, t) => G[k].length ? `<div class="ugrp ${k}"><h3>${t} · ${G[k].length}</h3><div class="uhg">${G[k].sort((a, b) => b[1].n - a[1].n).map(([h, o]) => `<button type="button" data-uh="${h}" class="${NW.uh === h ? 'on' : ''}"><img src="${esc(nwCard(h))}" alt="" loading="lazy" onerror="${noimg}"><span>${esc(hero(h).n)}</span><em>${o.u ? `<i class="u">+${o.u}</i>` : ''}${o.d ? `<i class="d">−${o.d}</i>` : ''}</em></button>`).join('')}</div></div>` : '';
  const heroLines = () => { const hs = NW.uh && ch[NW.uh] ? [NW.uh] : Object.keys(ch).map(Number).sort((a, b) => ch[b].n - ch[a].n);
    return hs.map(h => `<h4>${esc(hero(h).n)}</h4>${lines.filter(x => x.h === h).map(ln).join('')}`).join(''); };
  const items = lines.filter(x => !x.h && x.i), gen = lines.filter(x => !x.h && !x.i);
  const t = Math.floor(Date.parse(p.pub_date) / 1000);
  put(n, '#upw', `<div class="up"><div class="upl">${P.map((x, k) => `<button type="button" data-i="${k}" class="${k === i ? 'on' : ''}"><b>${esc(x.title || 'Без названия')}</b><small>${esc(new Date(Date.parse(x.pub_date)).toLocaleDateString('ru-RU', {day: 'numeric', month: 'long'}))}</small></button>`).join('')}</div>
    <div><div class="uph"><h2>${esc(p.title || 'Патч')}</h2><p>${t ? esc(ago(t)) + ' · ' : ''}${nf(lines.length)} ${pl(lines.length, ['изменение', 'изменения', 'изменений'])}${Object.keys(ch).length ? ` · ${Object.keys(ch).length} ${pl(Object.keys(ch).length, ['герой', 'героя', 'героев'])}` : ''}</p></div>
      ${grp('d', 'Ослаблены')}${grp('m', 'Изменены')}${grp('u', 'Усилены')}
      ${Object.keys(ch).length ? `<div class="cd" style="margin-bottom:14px"><div class="cd-h">Герои${NW.uh ? `<span class="sp"></span><a href="javascript:void 0" data-uh="0">Показать всех</a>` : ''}</div><div class="uln">${heroLines()}</div></div>` : ''}
      ${items.length ? `<div class="cd" style="margin-bottom:14px"><div class="cd-h">Предметы</div><div class="uln">${items.map(ln).join('')}</div></div>` : ''}
      ${gen.length ? `<div class="cd"><div class="cd-h">Общее</div><div class="uln">${gen.slice(0, 80).map(ln).join('')}</div></div>` : ''}
      ${!lines.length ? `<div class="cd uln">${X.out.filter(x => x.t === 'p').slice(0, 40).map(x => `<div><i></i><span>${tr(x.s)}</span></div>`).join('') || '<div class="em">Пусто</div>'}</div>` : ''}</div></div>`);
  $('#upw').onclick = e => { const b = e.target.closest('[data-i]'); if (b) { NW.uh = 0; location.hash = '#upd/' + b.dataset.i; return; }
    const h = e.target.closest('[data-uh]'); if (h) { NW.uh = +h.dataset.uh === NW.uh ? 0 : +h.dataset.uh; nvUpd(String(i)); } };
}
window.addEventListener('hashchange', route);
(async () => {
  const q = new URLSearchParams(location.search).get('id');
  let id = q && idFrom(q);
  if (!id) try { id = +localStorage.getItem('rl-id') || null; } catch (e) {}
  if (id) setMe(id, !!q && false);
  route();
})();
