*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,'Segoe UI',Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 92%,rgba(16,19,24,0));padding:14px 14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--tx2);font-size:13px;margin-bottom:10px}
#q{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:10px 12px;font-size:16px;margin-bottom:10px}
#tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}

.tab.on{color:#fff;border-color:var(--acc);background:#2a2118}
.grid{display:grid;grid-template-columns:1fr;gap:12px;padding:14px}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card.done{border-color:var(--ok)}
.card h3{font-size:16px;margin:0 0 2px;line-height:1.3;overflow-wrap:anywhere}
.ru{color:var(--tx2);font-size:13px;margin-bottom:8px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.badge{font-size:11px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--tx2)}
.badge.draft{color:var(--warn);border-color:var(--warn)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.fix{color:var(--acc);border-color:var(--acc)}
.badge.test-b{color:#58a6ff;border-color:#58a6ff}
.badge.new{color:var(--tx2);border-style:dashed}
.hart{display:block;width:100%;max-width:280px;height:auto;border-radius:10px;margin:2px auto 10px;background:var(--card2)}
.fld{font-size:14px;margin:6px 0;overflow-wrap:anywhere}
.fld b{color:var(--tx2)}
.note{background:#2a2118;border:1px solid var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0;color:#ffd28a}
.pts{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.ptext{display:none;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:12.5px;color:var(--tx2);white-space:pre-wrap;max-height:130px;overflow:auto}
.ptext.open{display:block}
.btnrow{display:flex;flex-wrap:wrap;gap:7px}
.btn{background:var(--acc);border:none;color:#fff;border-radius:9px;padding:9px 13px;font-size:14px;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line);font-weight:400}
.btn.okb{background:var(--ok)}
.btn:disabled{opacity:.45;cursor:default}
.links{font-size:13px;margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.links a{color:#58a6ff;text-decoration:none}
.donerow{display:flex;align-items:center;gap:7px;margin-top:10px;color:var(--tx2);font-size:14px}
.donerow input{width:17px;height:17px;accent-color:var(--ok)}
.rules{max-width:760px;margin:0 auto}
.rules h2{font-size:17px;margin:18px 0 6px}
.rules li{margin:7px 0}
.rules .card{margin-bottom:12px}

#toast.show{opacity:1}
footer{color:var(--tx2);font-size:12px;padding:6px 14px 26px}

<script>
var D = window.DATA, tab = 'hero', LS = 'bgp-done-v1', done = {};
try { done = JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch(e){ done = {}; }
function saveDone(){ try { localStorage.setItem(LS, JSON.stringify(done)); } catch(e){} }
function isDone(k){ return !!done[k]; }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1400); }

function copyText(txt, btn){
  if (!txt) { toast('Пусто'); return; }
  function ok(){ toast('Скопировано ✓'); if (btn){ var o = btn.textContent;
    btn.classList.add('okb'); btn.textContent = 'Скопировано ✓';
    setTimeout(function(){ btn.classList.remove('okb'); btn.textContent = o; }, 1300); } }
  function fallback(){ var ta = document.createElement('textarea'); ta.value = txt;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); ok(); } catch(e){ toast('Не вышло — выдели текст руками'); }
    document.body.removeChild(ta); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fallback);
  else fallback();
}

function cdnURL(title, file){
  return 'https://cdn.deadlock.wiki/' + encodeURIComponent(title).replace(/%20/g, '_') + file;
}
document.addEventListener('error', function(ev){
  var el = ev.target;
  if (el && el.tagName === 'IMG' && el.classList.contains('hart')) {
    var rest = (el.dataset.fb || '').split('|').filter(Boolean);
    if (rest.length) { el.src = rest[0]; el.dataset.fb = rest.slice(1).join('|'); }
    else el.style.display = 'none';
  }
}, true);

function heroImg(h){
  var c = cdnURL(h.title, '_card.png'), v = cdnURL(h.title, '_vertical.png'), p = cdnURL(h.title, '.png');
  return '<img class="hart" loading="lazy" alt="' + esc(h.title) + '" src="' + c + '" data-fb="' + v + '|' + p + '">';
}

function copyBtn(text, label, ghost){
  return '<button class="btn' + (ghost ? ' ghost' : '') + '" data-txt="' + esc(text) + '">' + esc(label) + '</button>';
}
function doneRow(key){
  return '<label class="donerow"><input type="checkbox" data-key="' + esc(key) + '"' +
    (isDone(key) ? ' checked' : '') + '> Готово</label>';
}

function heroCard(h){
  var key = 'hero:deadlock:' + h.slug;
  var st, cls = '';
  if (h.fix) { st = h.fix.label; cls = h.fix.status; }
  else if (h.new) { st = 'новый герой — промта нет'; cls = 'new'; }
  else if (!h.draft) { st = 'готов (по старым правилам)'; cls = 'ok'; }
  else { st = 'черновик — можно пробовать'; cls = 'draft'; }

  var s = '<div class="card' + (isDone(key) ? ' done' : '') + '" data-key="' + esc(key) + '">';
  s += heroImg(h);
  s += '<h3>' + esc(h.title) + '</h3><div class="ru">' + esc(h.ru) + '</div>';
  s += '<div class="badges"><span class="badge ' + cls + '">' + esc(st) + '</span></div>';

  s += '<div class="pts">';
  if (h.fix && h.fix.variants) {
    h.fix.variants.forEach(function(v){
      s += '<div class="btnrow">' + copyBtn(v[1], 'Скопировать: ' + v[0]) + '</div>';
      s += '<div class="ptext">' + esc(v[1]) + '</div>';
    });
  } else if (h.animate) {
    s += '<div class="btnrow">' + copyBtn(h.animate, 'Скопировать промт оживления') + '</div>';
    s += '<div class="ptext">' + esc(h.animate) + '</div>';
  } else {
    s += '<div class="fld">Промта пока нет.</div>';
  }
  var neg = h.fix ? h.fix.neg : D.neg;
  if (h.animate || h.fix) {
    s += '<div class="btnrow">' + copyBtn(neg, 'Негатив' + (h.slug === 'rem' ? ' (обязателен!)' : ''), true) + '</div>';
    s += '<div class="ptext">' + esc(neg) + '</div>';
  }
  s += '</div>';

  if (h.repopath) {
    s += '<div class="links">' +
      '<a href="' + cdnURL(h.title, '_Render.png') + '" target="_blank" rel="noopener">арт (вики, оригинал)</a>' +
      '<a href="' + esc(D.raw + h.repopath) + '" target="_blank" rel="noopener">арт (репо, полный)</a></div>';
  }
  s += doneRow(key);
  s += '</div>';
  return s;
}

function bgCard(b){
  var title = esc(b.title) + (b.season ? ' · <span style="color:var(--acc);font-weight:700">' + esc(b.season) + '</span>' : '');
  var s = '<div class="card' + (isDone(b.key) ? ' done' : '') + '" data-key="' + esc(b.key) + '">';
  s += '<h3>' + title + '</h3>';
  var bd = '';
  if (b.test) bd += '<span class="badge test-b">тест: ' + esc(b.test) + '</span>';
  if (bd) s += '<div class="badges">' + bd + '</div>';
  if (b.what) s += '<div class="fld"><b>Что в кадре:</b> ' + esc(b.what) + '</div>';
  if (b.moves) s += '<div class="fld"><b>Что движется:</b> ' + esc(b.moves) + '</div>';
  if (b.note) s += '<div class="note">⚠ ' + esc(b.note) + '</div>';
  s += '<div class="pts">';
  if (b.photo) { s += '<div class="btnrow">' + copyBtn(b.photo, 'Скопировать ФОТО') + '</div>';
    s += '<div class="ptext">' + esc(b.photo) + '</div>'; }
  if (b.animate) { s += '<div class="btnrow">' + copyBtn(b.animate, 'Скопировать ОЖИВЛЕНИЕ') + '</div>';
    s += '<div class="ptext">' + esc(b.animate) + '</div>'; }
  if (b.video) { s += '<div class="btnrow">' + copyBtn(b.video, 'Скопировать ВИДЕО (сразу текстом)', true) + '</div>';
    s += '<div class="ptext">' + esc(b.video) + '</div>'; }
  s += '</div>' + doneRow(b.key) + '</div>';
  return s;
}

function rulesPage(){
  var s = '<div class="rules">';
  s += '<div class="card"><h2>Как делать (коротко)</h2><ol>' +
    '<li><b>Фото:</b> Gemini или Google Flow (labs.google/flow), формат <b>9:16</b>, 3–4 варианта — выбери один, где всё на месте и нет пластмассы. У героев фото не генерим — берём арт с вики (кнопки «арт» на карточке).</li>' +
    '<li><b>Оживить:</b> Flow → «Кадры в видео»: первый кадр = последний кадр = это фото (у героя — арт), 8 секунд. Промт оживления — кнопкой с карточки.</li>' +
    '<li>Ролик скинуть мне (ZAI) — я склею петлю, залью и отмечу «залит».</li></ol></div>';
  s += '<div class="card"><h2>Правило петли (главное)</h2><ul>' +
    '<li>Движение идёт <b>полным кругом</b>: последний кадр = первому. Никакого ping-pong (туда-обратно) — из-за него дёргается Крысиный король.</li>' +
    '<li><b>Герой немного двигается — НОРМА и желательна</b>: дыхание, покачивание, поворот головы, ткань. Не бороться с микродвижкой.</li>' +
    '<li>Ломают генерацию только: <b>перемещение по кадру, резкие крупные действия, кисти крупным планом</b>.</li>' +
    '<li>Слова-настроения не должны противоречить действию: «sleepy» валит героя в сон, даже если написать «staying awake».</li></ul></div>';
  s += '<div class="card"><h2>Негатив (общий)</h2><div class="fld">Вставлять в поле Negative, если сервис позволяет.</div>' +
    '<div class="btnrow">' + copyBtn(D.neg, 'Скопировать негатив') + '</div>' +
    '<div class="ptext">' + esc(D.neg) + '</div></div>';
  s += '<div class="card"><h2>Если вышло плохо</h2><ul>' +
    '<li>Не дописывай промт — скинь кадр и скажи одним словом, что не так (пластмасса, лишнее, не то место, кривые предметы).</li>' +
    '<li>Нормальный промт — целым куском, без правок на ходу. Отметил «Готово» — карточка подсветится.</li></ul></div>';
  s += '</div>';
  return s;
}

var TABS = [['hero','Герои'],['film','Фильмы'],['season','Сезоны'],['person','Интервью'],['moment','Момент'],['rules','Правила']];

function allHeroes(){ return D.heroes.concat(D.news); }
function render(){
  var q = $('q').value.trim().toLowerCase();
  $('tabs').innerHTML = TABS.map(function(t){
    var n = '';
    if (t[0] === 'hero') n = ' (' + allHeroes().length + ')';
    else if (t[0] !== 'rules') n = ' (' + D.bgs.filter(function(b){ return b.kind === t[0]; }).length + ')';
    return '<button class="tab' + (tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + n + '</button>';
  }).join('');

  var out = [];
  if (tab === 'rules') { $('grid').innerHTML = rulesPage(); return; }
  var list;
  if (tab === 'hero') list = allHeroes();
  else list = D.bgs.filter(function(b){ return b.kind === tab; });
  if (q) list = list.filter(function(x){
    var hay = (x.title || '') + ' ' + (x.ru || '') + ' ' + (x.slug || '') + ' ' + ((x.shows || []).join(' '));
    return hay.toLowerCase().indexOf(q) >= 0;
  });
  out = list.map(function(x){ return x.slug !== undefined && (x.kind === undefined) ? heroCard(x) : bgCard(x); });
  if (!out.length) out = ['<div class="card">Ничего не нашлось.</div>'];
  $('grid').innerHTML = out.join('');
}

function counters(){
  var all = allHeroes().map(function(h){ return 'hero:deadlock:' + h.slug; })
    .concat(D.bgs.map(function(b){ return b.key; }));
  var dn = all.filter(isDone).length;
  $('subline').innerHTML = 'Готово: <b>' + dn + '</b> из <b>' + all.length + '</b>' +
    (D.updated ? ' · данные промтов: ' + esc(D.updated) : '') +
    ' · галочки общие со страницей промтов';
}

document.addEventListener('click', function(ev){
  var t = ev.target.closest ? ev.target : null;
  var tb = ev.target.closest('[data-tab]');
  if (tb) { tab = tb.getAttribute('data-tab'); render(); window.scrollTo(0, 0); return; }
  var btn = ev.target.closest('[data-txt]');
  if (btn) { copyText(btn.getAttribute('data-txt'), btn); return; }
  var box = ev.target.closest('.btnrow + .ptext') || null;
  if (ev.target.classList && ev.target.classList.contains('fld') && ev.target.parentElement.classList.contains('pts')) {}
});

document.addEventListener('change', function(ev){
  var inp = ev.target;
  if (inp.getAttribute && inp.getAttribute('data-key') && inp.type === 'checkbox') {
    var key = inp.getAttribute('data-key');
    if (inp.checked) done[key] = 1; else delete done[key];
    saveDone();
    var cards = document.querySelectorAll('.card[data-key="' + key + '"]');
    Array.prototype.forEach.call(cards, function(c){ c.classList.toggle('done', inp.checked); });
    counters();
  }
});

$('q').addEventListener('input', render);
$('ftr').innerHTML = 'Фото героев — CDN deadlock.wiki · полные арты — репо, ветка ' + D.raw.split('/').slice(-2)[0] +
  ' · если промты обновились — свежий пульт в репо.';
render(); counters();
</script>
