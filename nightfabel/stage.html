<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;font-weight:700;src:url(fonts/poppins-latin-700-normal.woff2)}
@font-face{font-family:P;font-weight:800;src:url(fonts/poppins-latin-800-normal.woff2)}
@font-face{font-family:P;font-weight:900;src:url(fonts/poppins-latin-900-normal.woff2)}
@font-face{font-family:N;font-weight:800;src:url(fonts/nunito-latin-800-normal.woff2)}
@font-face{font-family:N;font-weight:900;src:url(fonts/nunito-latin-900-normal.woff2)}
html,body{margin:0;padding:0;background:#0B1029;overflow:hidden}
#root{position:relative;width:1080px;height:1920px;overflow:hidden}
svg{position:absolute;left:0;top:0}
#cap{position:absolute;left:70px;width:880px;top:1235px;height:230px;display:flex;flex-wrap:wrap;
  justify-content:center;align-content:center;gap:8px 34px;font-family:P;font-weight:900;font-size:86px;
  line-height:1.08;text-transform:uppercase;letter-spacing:.5px}
#cap span{position:relative;display:inline-block;color:#fff;-webkit-text-stroke:12px #120B26;paint-order:stroke fill;
  text-shadow:0 8px 0 rgba(10,6,24,.55)}
#cap span.y{color:#FFC94A}#cap span.r{color:#FF5A6A}#cap span.g{color:#57E39B}
#cap span.on{color:#120B26;-webkit-text-stroke:0;text-shadow:none}
#cap span.on::before{content:'';position:absolute;left:-12px;right:-12px;top:4px;bottom:0;border-radius:22px;z-index:-1;background:#fff;
  box-shadow:0 8px 0 rgba(10,6,24,.55)}
#cap span.on.y::before{background:#FFC94A}#cap span.on.r::before{background:#FF5A6A}#cap span.on.g::before{background:#57E39B}
text{font-family:N;font-weight:900}
</style></head>
<body><div id="root"><svg id="bg" width="1080" height="1920"></svg><svg id="st" width="1080" height="1920"></svg><div id="cap"></div></div>
<script>
// ===================== утилиты =====================
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-clamp(k),3);
const eio=k=>{k=clamp(k);return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2};
const sp=k=>{if(k<=0)return 0;if(k>=1)return 1;return 1-Math.exp(-7*k)*Math.cos(11*k)};   // пружина с перелётом
const pr=(t,a,d)=>clamp((t-a)/d);
const R=(n,s=0)=>{const x=Math.sin(n*127.1+s*311.7)*43758.5453;return x-Math.floor(x)};
const G=(tr,op,c)=>`<g transform="${tr}" opacity="${op.toFixed(3)}">${c}</g>`;
// появление элемента: пружина масштаба из точки
function pop(t,at,c,x=0,y=0,d=.45){const k=pr(t,at,d);if(k<=0)return'';const s=sp(k);
  return `<g transform="translate(${x} ${y}) scale(${s.toFixed(3)})" opacity="${clamp(k*3).toFixed(3)}">${c}</g>`}
function fade(t,at,c,dy=24,d=.35){const k=pr(t,at,d);if(k<=0)return'';const e=eo(k);
  return `<g transform="translate(0 ${((1-e)*dy).toFixed(1)})" opacity="${e.toFixed(3)}">${c}</g>`}
function pill(x,y,txt,o={}){const fs=o.fs||40,pad=o.pad||26,w=o.w||(txt.length*fs*.62+pad*2),h=fs*1.7;
  return `<g transform="translate(${x} ${y})"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="${o.bg||'rgba(255,255,255,.10)'}" stroke="${o.st||'rgba(255,255,255,.28)'}" stroke-width="3"/>
  <text x="0" y="${fs*.36}" text-anchor="middle" font-size="${fs}" fill="${o.fg||'#fff'}" letter-spacing="1.5">${txt}</text></g>`}
function src(t,at,txt){return fade(t,at,`<text x="90" y="1172" font-size="27" fill="rgba(235,225,255,.55)" font-weight="800">Source: ${txt}</text>`,10)}

// ===================== фон =====================
const STARS=[...Array(90)].map((_,i)=>({x:R(i,1)*1080,y:R(i,2)*1500,r:.8+R(i,3)*2.4,p:R(i,4)*6.28,s:.6+R(i,5)*1.6}));
function bg(t){
  let s=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A0E26"/><stop offset=".55" stop-color="#151140"/><stop offset="1" stop-color="#26134A"/></linearGradient>
  <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFE7A8" stop-opacity=".55"/><stop offset=".35" stop-color="#FFC94A" stop-opacity=".16"/><stop offset="1" stop-color="#FFC94A" stop-opacity="0"/></radialGradient>
  <radialGradient id="flo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7B4BD6" stop-opacity=".35"/><stop offset="1" stop-color="#7B4BD6" stop-opacity="0"/></radialGradient></defs>
  <rect width="1080" height="1920" fill="url(#sky)"/>
  <circle cx="${930+Math.sin(t*.2)*8}" cy="250" r="330" fill="url(#moon)"/>
  <ellipse cx="540" cy="1700" rx="760" ry="420" fill="url(#flo)"/>`;
  for(const a of STARS){const o=.25+.55*(.5+.5*Math.sin(t*a.s+a.p));s+=`<circle cx="${a.x.toFixed(1)}" cy="${a.y.toFixed(1)}" r="${a.r.toFixed(2)}" fill="#fff" opacity="${o.toFixed(2)}"/>`}
  // месяц-логотип и ник
  s+=`<g transform="translate(540 252)" opacity=".75"><path d="M-128,-14 a20,20 0 1,0 22,26 a16,16 0 1,1 -22,-26z" fill="#FFC94A"/>
  <text x="14" y="12" text-anchor="middle" font-size="34" fill="#EDE6FF" letter-spacing="2">@nightfabel</text></g>`;
  return s}

// ===================== сова-рассказчица =====================
function owl(x,y,s,o,t){
  const mood=o.mood||'n',talk=o.talk||0,lx=(o.look||[0,0])[0],ly=(o.look||[0,0])[1];
  const bob=Math.sin(t*2.4)*6,blink=((t+(o.ph||0))%3.3)<.12;
  let op=blink?.12:1; if(mood==='wow')op=blink?.12:1.18; if(mood==='happy')op=1;
  const pr_=mood==='wow'?15:mood==='worry'?14:21;
  const eye=(ex,sg)=>{
    if(mood==='happy'&&!blink) return `<circle cx="${ex}" cy="-40" r="50" fill="#FFF8EC"/><path d="M${ex-26},-34 Q${ex},-66 ${ex+26},-34" stroke="#1A1230" stroke-width="10" fill="none" stroke-linecap="round"/>`;
    return `<ellipse cx="${ex}" cy="-40" rx="50" ry="${50*op}" fill="#FFF8EC"/>`+(blink?'':
      `<circle cx="${ex+lx*14}" cy="${-40+ly*14}" r="${pr_}" fill="#1A1230"/><circle cx="${ex+lx*14+7}" cy="${-48+ly*14}" r="7" fill="#fff"/>`)};
  let brows='';
  if(mood==='worry') brows=`<path d="M-88,-110 L-24,-96 M88,-110 L24,-96" stroke="#5A3A22" stroke-width="10" stroke-linecap="round"/>`;
  if(mood==='think') brows=`<path d="M-86,-100 L-26,-104 M86,-116 L28,-100" stroke="#5A3A22" stroke-width="10" stroke-linecap="round"/>`;
  const open=clamp(talk)*16+(mood==='wow'?8:0)+(mood==='hungry'?10:0);
  const beak=`<path d="M-17,-2 L17,-2 L0,${22} Z" fill="#F59E2B" transform="translate(0 ${-open*.25})"/><path d="M-13,${10+open*.0} L13,${10} L0,${26+open} Z" fill="#D9821C" transform="translate(0 ${open*.35})"/>`;
  const wf=Math.sin(t*(o.wave?9:1.6))*(o.wave?22:4);
  let extra='';
  if(mood==='worry') extra=`<path d="M112,-120 q12,22 0,32 q-12,-10 0,-32z" fill="#7FD3FF" opacity=".9"/>`;
  if(mood==='hungry') extra=`<path d="M8,${44+open} q10,${18+Math.sin(t*3)*6} 0,${30+Math.sin(t*3)*6} q-10,-12 0,-${30+Math.sin(t*3)*6}z" fill="#9EDCFF" opacity=".9"/>`;
  return `<g transform="translate(${x} ${y+bob}) scale(${s})">
   <ellipse cx="0" cy="168" rx="120" ry="18" fill="#000" opacity=".25"/>
   <g transform="rotate(${-8-wf} -110 10)"><ellipse cx="-118" cy="40" rx="42" ry="92" fill="#8E5E36"/></g>
   <g transform="rotate(${8+(o.wave?wf*2.4-30:wf)} 110 10)"><ellipse cx="118" cy="40" rx="42" ry="92" fill="#8E5E36"/></g>
   <path d="M-96,-118 L-74,-178 L-40,-128 Z M96,-118 L74,-178 L40,-128 Z" fill="#8A5A34"/>
   <ellipse cx="0" cy="10" rx="128" ry="150" fill="#B07A4A"/>
   <ellipse cx="0" cy="58" rx="84" ry="96" fill="#F3E3C7"/>
   <path d="M-44,30 q14,14 28,0 M16,30 q14,14 28,0 M-58,70 q14,14 28,0 M-14,72 q14,14 28,0 M30,70 q14,14 28,0 M-36,110 q14,14 28,0 M8,110 q14,14 28,0" stroke="#D9B98F" stroke-width="6" fill="none" stroke-linecap="round"/>
   <path d="M-112,-40 C-112,-112 -10,-112 0,-70 C10,-112 112,-112 112,-40 C112,22 20,24 0,8 C-20,24 -112,22 -112,-40Z" fill="#E9C9A0"/>
   ${eye(-50,-1)}${eye(50,1)}
   <circle cx="-50" cy="-40" r="60" fill="none" stroke="#231A3D" stroke-width="10"/><circle cx="50" cy="-40" r="60" fill="none" stroke="#231A3D" stroke-width="10"/>
   <path d="M-14,-46 Q0,-58 14,-46" stroke="#231A3D" stroke-width="9" fill="none"/>
   <path d="M-84,-78 a40,40 0 0,1 20,-14" stroke="#fff" stroke-width="6" opacity=".6" fill="none" stroke-linecap="round"/>
   ${brows}${beak}${extra}
   <path d="M-46,150 l-14,18 M-46,150 l0,22 M-46,150 l14,18 M46,150 l-14,18 M46,150 l0,22 M46,150 l14,18" stroke="#F59E2B" stroke-width="9" stroke-linecap="round"/>
  </g>`}

// ===================== рисунки =====================
const BRAIN=`<path d="M-140,10 C-150,-60 -90,-110 -30,-100 C0,-130 70,-120 90,-80 C140,-80 160,-20 140,20 C160,70 110,110 60,100 C30,125 -40,120 -60,95 C-120,105 -160,60 -140,10 Z" fill="#FF9EC4" stroke="#E0679A" stroke-width="7"/>
 <path d="M-90,-40 C-60,-62 -40,-18 -10,-42 M14,-74 C34,-42 62,-62 84,-30 M-104,42 C-72,20 -50,62 -20,40 M24,30 C52,8 72,52 104,28 M-8,-92 C-24,-40 14,0 -4,62 M-52,74 C-34,56 -12,84 6,70" stroke="#E0679A" stroke-width="6" fill="none" stroke-linecap="round"/>`;
function brain(x,y,s,glow=0,extra=''){return `<g transform="translate(${x} ${y}) scale(${s})">
 ${glow>0?`<ellipse cx="0" cy="0" rx="${210+glow*40}" ry="${170+glow*30}" fill="url(#gl)" opacity="${clamp(glow)}"/>`:''}${BRAIN}${extra}</g>`}
function leaf(x,y,s,c='#57E39B'){let p='';const L=[[0,1],[32,.86],[-32,.86],[62,.68],[-62,.68],[98,.42],[-98,.42]];
 for(const[a,l]of L){p+=`<g transform="rotate(${a})"><path d="M0,0 C${22*l},${-48*l} ${22*l},${-140*l} 0,${-196*l} C${-22*l},${-140*l} ${-22*l},${-48*l} 0,0Z" fill="${c}"/><path d="M0,-8 L0,${-180*l}" stroke="#2FA36B" stroke-width="5" stroke-linecap="round"/></g>`}
 return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0,0 L0,120" stroke="#2FA36B" stroke-width="12" stroke-linecap="round"/>${p}</g>`}
function heart(x,y,s,c='#FF5A6A'){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0,60 C-90,0 -110,-60 -60,-90 C-30,-108 -6,-90 0,-66 C6,-90 30,-108 60,-90 C110,-60 90,0 0,60Z" fill="${c}"/><path d="M-62,-62 q-16,10 -12,30" stroke="#fff" stroke-width="10" opacity=".45" fill="none" stroke-linecap="round"/></g>`}
function drop(x,y,s,c='#6EC8FF'){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0,-90 C30,-40 60,-10 60,30 C60,70 30,95 0,95 C-30,95 -60,70 -60,30 C-60,-10 -30,-40 0,-90Z" fill="${c}"/><path d="M-30,20 q-6,30 16,46" stroke="#fff" stroke-width="10" opacity=".5" fill="none" stroke-linecap="round"/></g>`}
function cotton(x,y,s,o){return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}"><circle cx="-26" cy="6" r="30" fill="#F4F1FA"/><circle cx="8" cy="-14" r="36" fill="#fff"/><circle cx="38" cy="10" r="28" fill="#ECE7F6"/><circle cx="2" cy="20" r="30" fill="#F7F4FC"/></g>`}
function food(i,x,y,s){const F=['🍔','🍟','🍩','🍕','🌮','🍪'];return `<text x="${x}" y="${y}" font-size="${110*s}" text-anchor="middle">${F[i%F.length]}</text>`}
function fatcell(x,y,r,k,t,i){let d='';const n=5;for(let j=0;j<n;j++){const a=j/n*6.28+t*.6+i;const rr=r*.5;
  d+=`<circle cx="${(Math.cos(a)*rr).toFixed(1)}" cy="${(Math.sin(a)*rr).toFixed(1)}" r="${(9*k).toFixed(1)}" fill="#57E39B"/>`}
  return `<g transform="translate(${x} ${y})"><circle r="${r}" fill="#FFD879" stroke="#E6B54A" stroke-width="5"/><circle cx="${-r*.35}" cy="${-r*.35}" r="${r*.18}" fill="#fff" opacity=".45"/>${d}</g>`}

// ===================== сцены =====================
let TL,SC,ENV;
function init(tl){TL=tl;ENV=tl.env;SC=[];
  for(const s of tl.sent){const last=SC[SC.length-1];if(last&&last.key===s.scene){last.sents.push(s);last.words.push(...s.words)}else SC.push({key:s.scene,sents:[s],words:[...s.words]})}
  SC.forEach((s,i)=>{s.a=i?s.sents[0].a-.2:0;s.b=i<SC.length-1?SC[i+1].sents[0].a-.2:tl.dur;s.e=s.sents[s.sents.length-1].b});
  const ws=[];for(const s of tl.sent)ws.push(...s.words);TL.W=ws;
  CHUNKS=[];for(const s of tl.sent){let cur=[];const L=()=>cur.reduce((a,w)=>a+w.d.length+1,0);
    s.words.forEach((w,i)=>{if(cur.length&&L()+w.d.length>17){CHUNKS.push(cur);cur=[]}cur.push(w);
      if(/[.,?!…:]$/.test(w.d)||w.br||cur.length>=3||i===s.words.length-1){CHUNKS.push(cur);cur=[]}})}
}
let CHUNKS=[];
function cueOf(S,w,n=0){const k=w.toLowerCase();let m=0;for(const x of S.words){const d=x.d.toLowerCase().replace(/[^a-z0-9%×+–'-]/g,'');if(d.startsWith(k)){if(m===n)return x.a;m++}}return S.a}
const LABEL={hook:'',brain:'LUNGS → BLOOD → BRAIN',bliss:'THE BLISS MOLECULE',dopa:'REWARD SYSTEM',memory:'MEMORY',forget:'MEMORY',time:'TIME',eyes:'EYES',heart:'HEART',mouth:'MOUTH',munch:'HUNGER',potency:'POTENCY',anx:'ANXIETY',stay:'HOW LONG IT STAYS',teen:'TEEN BRAIN',psych:'PSYCHOSIS',outro:'WHAT’S NEXT?'};

const D={};
D.hook=(t,S,T)=>{const c=w=>cueOf(S,w);
  const ring=clamp(t/1.8),CX=610,CY=830,RR=190;
  const H=(y,txt,col,fs)=>`<text x="540" y="${y}" text-anchor="middle" font-size="${fs}" fill="${col}" style="font-family:P;font-weight:900;paint-order:stroke;stroke:#120B26;stroke-width:14px;stroke-linejoin:round" letter-spacing="1">${txt}</text>`;
  let s=H(470,'WHAT ONE HIT','#fff',100)+H(585,'DOES TO YOU','#FFC94A',100);
  s+=`<circle cx="${CX}" cy="${CY}" r="${RR}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="22"/>
   <circle cx="${CX}" cy="${CY}" r="${RR}" fill="none" stroke="#57E39B" stroke-width="22" stroke-linecap="round" stroke-dasharray="${(2*Math.PI*RR*ring).toFixed(1)} 2000" transform="rotate(-90 ${CX} ${CY})"/>
   <rect x="${CX-22}" y="${CY-RR-44}" width="44" height="28" rx="9" fill="#57E39B"/>`;
  s+=`<g transform="translate(${CX} ${CY}) scale(${(1+Math.sin(t*3)*.02).toFixed(3)})"><ellipse rx="175" ry="175" fill="url(#gg)"/></g>`;
  s+=leaf(CX,CY+45,.82);
  s+=pop(t,c('weed'),pill(0,0,'1 HIT',{fs:44,bg:'#57E39B',st:'#57E39B',fg:'#0B2A1B'}),CX+175,CY-170);
  s+=owl(250,1040,.66,{mood:'wow',talk:T.talk,look:[.8,-.4]},t);
  s+=`<text x="540" y="1185" text-anchor="middle" font-size="27" fill="rgba(235,225,255,.5)">science, not advice · 18+</text>`;
  return s};
D.brain=(t,S,T)=>{const c=w=>cueOf(S,w);const X=600,Y=860;
  let s=`<g transform="translate(${X} ${Y})">
   <circle cx="0" cy="-330" r="118" fill="#2C2766" stroke="#6A63C4" stroke-width="6"/>
   <rect x="-38" y="-222" width="76" height="70" fill="#2C2766" stroke="#6A63C4" stroke-width="6"/>
   <path d="M-220,-110 Q-220,-160 -160,-165 L160,-165 Q220,-160 220,-110 L208,290 L-208,290 Z" fill="#2C2766" stroke="#6A63C4" stroke-width="6"/>
   <rect x="-34" y="-200" width="68" height="60" fill="#2C2766"/>
   <ellipse cx="-86" cy="0" rx="72" ry="116" fill="#FF8FA3" opacity=".9"/><ellipse cx="86" cy="0" rx="72" ry="116" fill="#FF8FA3" opacity=".9"/>
   <path d="M-86,-80 L-86,60 M-86,-20 L-120,30 M-86,-20 L-52,30 M86,-80 L86,60 M86,-20 L120,30 M86,-20 L52,30" stroke="#E0607A" stroke-width="7" stroke-linecap="round" fill="none"/>
   ${heart(16,-36,.42,'#FF3D57')}
   ${brain(0,-336,.56,clamp((t-c('brain'))/.4))}`;
  // путь крови: лёгкие → сердце → сонная артерия → мозг
  const P=[[-86,-10],[10,-40],[16,-150],[10,-240],[0,-320]];const pt=u=>{const n=P.length-1,f=clamp(u)*n,i=Math.min(n-1,Math.floor(f)),k=f-i;return[lerp(P[i][0],P[i+1][0],k),lerp(P[i][1],P[i+1][1],k)]};
  const vk=clamp((t-c('lungs'))/.6);
  s+=`<path d="M-86,-10 L10,-40 L16,-150 L10,-240 L0,-320" stroke="#FF3D57" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${(560*vk).toFixed(0)} 900" opacity=".9"/>`;
  for(let i=0;i<9;i++){const a=c('lungs')+i*.32;const u=(t-a)/1.5;if(u>0&&u<1){const[px,py]=pt(eio(u));s+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="13" fill="#57E39B" stroke="#E9FFF4" stroke-width="4"/>`}}
  s+=`</g>`;
  s+=pop(t,c('lungs'),pill(0,0,'LUNGS',{fs:38,bg:'#FF8FA3',st:'#FF8FA3',fg:'#3A0F1E'}),290,900);
  s+=pop(t,c('blood'),pill(0,0,'BLOOD',{fs:38,bg:'#FF3D57',st:'#FF3D57',fg:'#fff'}),820,700);
  s+=pop(t,c('brain'),pill(0,0,'BRAIN',{fs:38,bg:'#FF9EC4',st:'#FF9EC4',fg:'#3A0F2A'}),845,500);
  s+=pop(t,c('seconds'),pill(0,0,'⏱ WITHIN SECONDS',{fs:36}),300,470);
  s+=src(t,S.a+.4,'NIDA');
  return s};
D.bliss=(t,S,T)=>{const c=w=>cueOf(S,w);
  const mol=(x,y,col,lab)=>`<g transform="translate(${x} ${y})"><path d="M-110,0 l30,-52 h60 l30,52 l-30,52 h-60z" fill="none" stroke="${col}" stroke-width="12" stroke-linejoin="round"/>
   <path d="M20,0 l30,-52 h60 l30,52 l-30,52 h-60z" fill="none" stroke="${col}" stroke-width="12" stroke-linejoin="round"/><path d="M140,0 l40,-30 l40,20 l36,-24" stroke="${col}" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
   <text x="40" y="125" text-anchor="middle" font-size="44" fill="${col}" letter-spacing="2">${lab}</text></g>`;
  let s=pop(t,S.a+.1,`<g transform="scale(1.25)">${mol(0,0,'#57E39B','THC')}</g>`,260,600);
  // маскировка: очки и усы на THC
  const dk=pr(t,c('pretends'),.5);
  if(dk>0) s+=`<g transform="translate(310 512) scale(${(sp(dk)*1.25).toFixed(3)})"><circle cx="-36" cy="0" r="30" fill="#141026" stroke="#fff" stroke-width="5"/><circle cx="36" cy="0" r="30" fill="#141026" stroke="#fff" stroke-width="5"/><path d="M-6,0 h12" stroke="#fff" stroke-width="5"/>
   <path d="M-60,56 C-30,30 -6,44 0,54 C6,44 30,30 60,56 C40,50 20,64 0,58 C-20,64 -40,50 -60,56Z" fill="#3A2512"/></g>`;
  s+=pop(t,c('anandamide'),`<g transform="scale(1.25)">${mol(0,0,'#FFC94A','ANANDAMIDE')}</g>`,560,790);
  s+=pop(t,c('anandamide')+.15,`<text x="0" y="0" text-anchor="middle" font-size="130" fill="#fff">≈</text>`,780,640);
  s+=fade(t,c('bliss'),`<g transform="translate(540 1080)"><rect x="-370" y="-60" width="740" height="120" rx="30" fill="rgba(255,201,74,.14)" stroke="#FFC94A" stroke-width="4"/>
   <text x="0" y="-8" text-anchor="middle" font-size="40" fill="#FFC94A">“ananda” = bliss</text><text x="0" y="38" text-anchor="middle" font-size="30" fill="rgba(255,255,255,.75)">(Sanskrit) · your body makes it itself</text></g>`);
  return s};

  s+=pop(t,c('alcohol')+.2,`<text x="0" y="0" text-anchor="middle" font-size="58" fill="#fff">or</text>`,515,1000);

  s+=pop(t,cueOf(S,'drinks')+.45,pill(0,0,'+ FOLLOW @nightfabel',{fs:36,bg:'#FF5A6A',st:'#FF5A6A',fg:'#fff'}),540,790);
  return s};

const DEFS=`<defs><radialGradient id="gl"><stop offset="0" stop-color="#FFC94A" stop-opacity=".55"/><stop offset="1" stop-color="#FFC94A" stop-opacity="0"/></radialGradient>
 <radialGradient id="gg"><stop offset="0" stop-color="#57E39B" stop-opacity=".35"/><stop offset="1" stop-color="#57E39B" stop-opacity="0"/></radialGradient>

function stage(t){
  let i=SC.findIndex((s,j)=>t>=s.a&&t<s.b);if(i<0)i=SC.length-1;const S=SC[i];
  const fr=Math.min(ENV.length-1,Math.floor(t*30));const T={talk:ENV[fr]||0};
  const e=i===0?1:eo(pr(t,S.a,.3)),x=eo(pr(t,S.a,.22));
  let s=DEFS;
  // ярлык сцены: тот же у соседей — стоит на месте
  const lab=LABEL[S.key],prev=i?LABEL[SC[i-1].key]:null;
  const P=(l,o,dy)=>l?G(`translate(0 ${dy.toFixed(1)})`,o,pill(540,328,l,{fs:34,bg:'rgba(255,201,74,.16)',st:'rgba(255,201,74,.55)',fg:'#FFE3A0'})):'';
  if(prev===lab) s+=P(lab,1,0); else {if(i&&x<1)s+=P(prev,1-x,-24*x);s+=P(lab,e,(1-e)*-20)}
  // уходящая сцена
  if(i>0&&x<1){const Q=SC[i-1];s+=G(`translate(0 ${(-36*x).toFixed(1)})`,1-x,D[Q.key](t,Q,T))}
  s+=G(`translate(0 ${((1-e)*44).toFixed(1)}) `,e,D[S.key](t,S,T));
  return s}

let CUR=-1;
function caps(t){
  let ci=-1;for(let i=0;i<CHUNKS.length;i++){if(t>=CHUNKS[i][0].a-.06)ci=i;else break}
  const el=document.getElementById('cap');
  if(ci<0){el.innerHTML='';return}
  const ch=CHUNKS[ci];const last=ch[ch.length-1];const nx=CHUNKS[ci+1];
  // фраза висит до следующей, но не дольше 0,7 с после последнего слова
  if(t>last.b+.7&&(!nx||t<nx[0].a-.06)){el.innerHTML='';return}
  const k=pr(t,ch[0].a-.06,.12);const sc=lerp(.86,1,eo(k));
  let h='';ch.forEach(w=>{const on=t>=w.a-.03&&t<w.b+.02;const cls=(w.c||'')+(on?' on':'');const pk=on?pr(t,w.a-.03,.12):1;const ws=on?lerp(1.16,1.06,eo(pk)):1;
    h+=`<span class="${cls}" style="transform:scale(${ws.toFixed(3)})">${w.d}</span>`});
  el.style.transform=`scale(${sc.toFixed(3)})`;el.style.opacity=clamp(k*2).toFixed(2);
  el.innerHTML=h}
