<!doctype html>
<html><head><meta charset="utf-8">
<!-- Проба «как у топовых»: сцена с фоном, светом, размытием. Кокаин, 4 фразы, ~15 с. Факты — tools/tt_demo_facts.md -->
<style>
@font-face{font-family:M;src:url(../tt_demo_fonts/Montserrat%5Bwght%5D.ttf);font-weight:100 900}
@font-face{font-family:J;src:url(../tt_demo_fonts/JetBrainsMono%5Bwght%5D.ttf);font-weight:100 800}
html,body{margin:0;background:#05030a;width:1080px;height:1920px;overflow:hidden}
svg{position:absolute;left:0;top:0}
.cap{position:absolute;left:90px;right:90px;top:1300px;text-align:center;font:900 80px/1.1 M;text-transform:uppercase;letter-spacing:-1px;color:#fff;
  text-shadow:0 5px 0 rgba(0,0,0,.55),0 0 34px rgba(0,0,0,.75)}
.cap i{font-style:normal;color:rgba(255,255,255,.26)}
.cap i.on{color:#fff}.cap i.on.y{color:#ffd23f}.cap i.on.r{color:#ff3b4e}
.pill{position:absolute;left:56px;top:118px;display:flex;align-items:center;gap:14px;padding:12px 20px;border-radius:12px;
  background:rgba(12,8,22,.72);border:1.5px solid rgba(255,255,255,.14);font:700 30px J;color:#fff;letter-spacing:1px}
.pill b{width:14px;height:14px;border-radius:50%;background:#ff3b4e;box-shadow:0 0 12px #ff3b4e}
.pulse{position:absolute;right:56px;top:104px;width:190px;padding:10px 0 12px;border-radius:14px;text-align:center;background:rgba(12,8,22,.75);
  border:2px solid rgba(255,255,255,.16);font:700 22px J;color:rgba(255,255,255,.7);letter-spacing:2px}
.pulse div{font:900 66px/1 M;color:#fff;letter-spacing:0;margin-top:6px}
.pulse.hot{border-color:#ff3b4e;box-shadow:0 0 26px rgba(255,59,78,.45)}.pulse.hot div{color:#ff3b4e}
.card{position:absolute;left:56px;top:220px;width:400px;padding:22px 26px 24px;border-radius:16px;background:#f5f1ea;color:#16131c;
  box-shadow:0 18px 50px rgba(0,0,0,.55);transform-origin:0 0}
.card .l{display:flex;justify-content:space-between;font:700 20px J;color:#8b8494;letter-spacing:2px}
.card .l span{background:#e8344a;color:#fff;padding:4px 10px;border-radius:6px;letter-spacing:1px}
.card .n{font:900 78px/1 M;margin:10px 0 6px;letter-spacing:-1px}
.card .s{font:700 26px M;color:#4a4453}
</style></head><body>
<svg id="sv" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<div class="pill"><b></b><span id="clock">ПЯТНИЦА · 23:40</span></div>
<div class="pulse" id="pulse">ПУЛЬС<div id="bpm">72</div></div>
<div class="card" id="card"><div class="l">ДОСЬЕ<span>ПЯТНИЦА</span></div><div class="n">ДИМА</div><div class="s">23 года · клуб · первый раз</div></div>
<div class="cap" id="cap"></div>
<script>
const W=1080,H=1920;
const cl=x=>x<0?0:x>1?1:x, sm=x=>{x=cl(x);return x*x*(3-2*x)}, mix=(a,b,k)=>a+(b-a)*k;
const ease=x=>{x=cl(x);return 1-Math.pow(1-x,3)};
// *слово* — жёлтым, !слово! — красным
const BEATS=[
  {d:3.7, cap:'Пятница, клуб. Это *Дима,* ему 23.', clock:'ПЯТНИЦА · 23:40', bpm:[72,74]},
  {d:3.7, cap:'Друг суёт *пакетик:* «Да один раз».', clock:'ПЯТНИЦА · 23:41', bpm:[74,78]},
  {d:3.9, cap:'Через пару минут !сердце! колотится как бешеное.', clock:'СУББОТА · 00:03', bpm:[80,131]},
  {d:4.3, cap:'В первый час риск !инфаркта! выше в !24! раза.', clock:'СУББОТА · 00:31', bpm:[128,136]},
];
let acc=0; for(const b of BEATS){b.t0=acc; acc+=b.d}
window.DUR=acc+0.4;

// ---------- общее ----------
const DEFS=`<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b0c2e"/><stop offset=".55" stop-color="#2a1245"/><stop offset="1" stop-color="#12081f"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241238"/><stop offset=".35" stop-color="#0e0718"/><stop offset="1" stop-color="#05030a"/></linearGradient>
 <linearGradient id="bm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3fb0" stop-opacity=".75"/><stop offset=".6" stop-color="#ff3fb0" stop-opacity=".16"/><stop offset="1" stop-color="#ff3fb0" stop-opacity="0"/></linearGradient>
 <linearGradient id="bc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fe6ff" stop-opacity=".7"/><stop offset=".6" stop-color="#3fe6ff" stop-opacity=".14"/><stop offset="1" stop-color="#3fe6ff" stop-opacity="0"/></linearGradient>
 <linearGradient id="bv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9d6bff" stop-opacity=".7"/><stop offset=".6" stop-color="#9d6bff" stop-opacity=".15"/><stop offset="1" stop-color="#9d6bff" stop-opacity="0"/></linearGradient>
 <linearGradient id="low" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05030a" stop-opacity="0"/><stop offset=".45" stop-color="#05030a" stop-opacity=".88"/><stop offset="1" stop-color="#05030a" stop-opacity="1"/></linearGradient>
 <radialGradient id="vig" cx=".5" cy=".42" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient>
 <radialGradient id="redv" cx=".5" cy=".4" r=".7"><stop offset=".35" stop-color="#ff0a2a" stop-opacity="0"/><stop offset="1" stop-color="#ff0a2a" stop-opacity=".75"/></radialGradient>
 <radialGradient id="amb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb04a" stop-opacity=".55"/><stop offset="1" stop-color="#ffb04a" stop-opacity="0"/></radialGradient>
 <radialGradient id="hb" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#5a0a18"/><stop offset=".6" stop-color="#1c040a"/><stop offset="1" stop-color="#070205"/></radialGradient>
 <radialGradient id="heart" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#ff7a86"/><stop offset=".45" stop-color="#e3243d"/><stop offset="1" stop-color="#7a0a1c"/></radialGradient>
 <filter id="b3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
 <filter id="b8" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
 <filter id="b16" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
 <filter id="b30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="rimL" x="-10%" y="-10%" width="120%" height="120%"><feFlood flood-color="#ff5fc0"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="-7" dy="-2"/><feGaussianBlur stdDeviation="1.2" result="a"/><feFlood flood-color="#55e8ff"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="6" dy="-2"/><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="a"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="cam" x="0" y="0" width="100%" height="100%"><feGaussianBlur id="camb" stdDeviation="0"/></filter>
 <filter id="dof" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>`;

function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}

// ---------- человек (ноги в 0,0; рост ~670) ----------
function guy(o){
  const id=o.id, sk=o.skin, sk2=o.skin2, h=o.hood, h2=o.hood2;
  const torso='M-118,-330 C-118,-396 -84,-424 -40,-428 L40,-428 C84,-424 118,-396 118,-330 L110,-188 C110,-180 104,-174 96,-174 L-96,-174 C-104,-174 -110,-180 -110,-188 Z';
  const lk=(o.look||0)*13, pu=o.pup||11, md=o.mood||'n';
  let s=`<g transform="translate(${o.x},${o.y}) scale(${o.s})"><ellipse cx="0" cy="0" rx="160" ry="26" fill="#000" opacity=".55" filter="url(#b8)"/><g ${o.rim?'filter="url(#rimL)"':''}>`;
  // ноги, обувь
  s+=`<rect x="-72" y="-196" width="62" height="176" rx="24" fill="${o.pants}"/><rect x="10" y="-196" width="62" height="176" rx="24" fill="${o.pants}"/>`;
  s+=`<rect x="10" y="-196" width="62" height="176" rx="24" fill="#000" opacity=".22"/>`;
  s+=`<rect x="-86" y="-38" width="82" height="38" rx="17" fill="${o.shoe}"/><rect x="4" y="-38" width="82" height="38" rx="17" fill="${o.shoe}"/>`;
  s+=`<rect x="-86" y="-10" width="82" height="10" rx="5" fill="#000" opacity=".18"/><rect x="4" y="-10" width="82" height="10" rx="5" fill="#000" opacity=".25"/>`;
  // руки
  const arm=(sx,ex,ey,mx,my,shade)=>`<path d="M${sx},-396 Q${mx},${my} ${ex},${ey}" stroke="${h}" stroke-width="56" stroke-linecap="round" fill="none"/>`+
     (shade?`<path d="M${sx},-396 Q${mx},${my} ${ex},${ey}" stroke="#000" stroke-opacity=".2" stroke-width="56" stroke-linecap="round" fill="none"/>`:'')+
     `<circle cx="${ex}" cy="${ey+10}" r="28" fill="${sk}"/>`;
  if(o.reach!=null){ // тянет левую руку к середине
    const k=o.reach, ex=mix(-136,-262,k), ey=mix(-222,-352,k);
    s+=arm(-108,ex,ey,mix(-150,-200,k),mix(-300,-330,k),false);
    if(o.bag&&k>.6){const bx=ex-22,by=ey-30;
      s+=`<g transform="translate(${bx},${by}) rotate(-12) scale(1.35)"><rect x="-26" y="-34" width="52" height="58" rx="5" fill="#fff" opacity=".9"/><rect x="-26" y="-34" width="52" height="9" fill="#ff4f7a"/>`+
         `<path d="M-20,8 Q0,-6 20,8 L20,18 L-20,18 Z" fill="#f2eef6"/><rect x="-26" y="-34" width="52" height="58" rx="5" fill="none" stroke="#c9c2d3" stroke-width="3"/></g>`;
      s+=`<circle cx="${ex}" cy="${ey+10}" r="28" fill="${sk}"/><rect x="${ex-30}" y="${ey-4}" width="40" height="22" rx="11" fill="${sk2}"/>`;
    }
  } else s+=arm(-108,-138,-222,-132,-300,false);
  s+=arm(108,138,-222,132,-300,true);
  // торс
  s+=`<clipPath id="c${id}"><path d="${torso}"/></clipPath>`;
  s+=`<ellipse cx="0" cy="-424" rx="104" ry="36" fill="${h2}"/>`;
  s+=`<path d="${torso}" fill="${h}"/><g clip-path="url(#c${id})"><rect x="34" y="-440" width="100" height="280" fill="#000" opacity=".2"/><rect x="-130" y="-440" width="40" height="280" fill="#fff" opacity=".06"/>`+
     `<rect x="-74" y="-272" width="148" height="66" rx="22" fill="${h2}" opacity=".55"/></g>`;
  s+=`<path d="M-24,-418 L-30,-336" stroke="#ecebf4" stroke-width="7" stroke-linecap="round"/><path d="M24,-418 L30,-336" stroke="#ecebf4" stroke-width="7" stroke-linecap="round"/>`;
  s+=`<rect x="-27" y="-458" width="54" height="44" rx="10" fill="${sk2}"/>`;
  // голова
  s+=`<ellipse cx="-96" cy="-540" rx="21" ry="29" fill="${sk2}"/><ellipse cx="96" cy="-540" rx="21" ry="29" fill="${sk2}"/>`;
  s+=`<clipPath id="h${id}"><ellipse cx="0" cy="-545" rx="98" ry="106"/></clipPath>`;
  s+=`<ellipse cx="0" cy="-545" rx="98" ry="106" fill="${sk}"/><g clip-path="url(#h${id})"><ellipse cx="78" cy="-530" rx="60" ry="120" fill="#000" opacity=".09"/></g>`;
  s+=`<path d="M-104,-556 C-110,-642 -44,-676 8,-672 C72,-670 112,-634 104,-556 C96,-590 74,-606 44,-598 C24,-616 -8,-620 -30,-604 C-60,-612 -90,-598 -104,-556 Z" fill="${o.hair}"/>`;
  if(o.sweat){const k=o.sweat;
    s+=`<g opacity="${k}" fill="#bfe6ff" stroke="#7fb6db" stroke-width="2"><path d="M86,-612 q10,18 0,26 q-10,-8 0,-26z"/><path d="M-88,-596 q9,16 0,23 q-9,-7 0,-23z"/><path d="M60,-640 q7,12 0,18 q-7,-6 0,-18z"/></g>`;}
  // брови
  const br=md==='w'?[[-16,-604,-62,-590],[16,-604,62,-590]]:md==='t'?[[-16,-596,-62,-606],[16,-596,62,-606]]:[[-18,-598,-62,-596],[18,-598,62,-596]];
  for(const b of br)s+=`<path d="M${b[0]},${b[1]} L${b[2]},${b[3]}" stroke="${o.hair}" stroke-width="10" stroke-linecap="round"/>`;
  // глаза
  for(const ex of [-38,38]){
    s+=`<ellipse cx="${ex}" cy="-548" rx="30" ry="33" fill="#fff" stroke="#17141f" stroke-width="5"/>`;
    s+=`<circle cx="${ex+lk}" cy="-545" r="${pu}" fill="#17141f"/><circle cx="${ex+lk-pu*.35}" cy="${-545-pu*.4}" r="${Math.max(3,pu*.32)}" fill="#fff"/>`;
  }
  s+=`<circle cx="-64" cy="-504" r="17" fill="#ff6f86" opacity=".32"/><circle cx="64" cy="-504" r="17" fill="#ff6f86" opacity=".32"/>`;
  s+=`<path d="M-7,-516 Q0,-505 9,-513" stroke="${sk2}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if(md==='s')s+=`<path d="M-28,-488 Q0,-462 28,-488" stroke="#5a2228" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  else if(md==='w')s+=`<path d="M-22,-478 Q-11,-488 0,-480 Q11,-472 22,-482" stroke="#5a2228" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  else if(md==='t')s+=`<rect x="-30" y="-494" width="60" height="24" rx="8" fill="#fff" stroke="#5a2228" stroke-width="4"/><path d="M-30,-482 H30 M-15,-494 V-470 M0,-494 V-470 M15,-494 V-470" stroke="#5a2228" stroke-width="3"/>`;
  else s+=`<path d="M-20,-482 Q0,-476 20,-482" stroke="#5a2228" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  return s+'</g></g>';
}
const DIMA={id:'d',skin:'#f1c39c',skin2:'#d99f7a',hood:'#3d57bf',hood2:'#2b3f93',pants:'#1b1f33',shoe:'#e9e8f2',hair:'#2b1b16'};
const DRUG={id:'f',skin:'#e2b088',skin2:'#c48d68',hood:'#c53a4b',hood2:'#8e2634',pants:'#22202a',shoe:'#2c2a33',hair:'#121014'};

// ---------- клуб (мир 1080×1920, пол на 1200) ----------
function club(t,o){
  let s=`<rect width="1080" height="1920" fill="url(#wall)"/>`;
  // панели стены
  for(let i=0;i<7;i++)s+=`<rect x="${i*160-20}" y="0" width="150" height="1200" fill="#fff" opacity="${.012+.012*(i%2)}"/>`;
  // неон NIGHT
  const fl=(t%2.6>1.9&&t%2.6<1.97)?.35:1;
  s+=`<g opacity="${fl}"><text x="70" y="470" font-family="M" font-weight="800" font-style="italic" font-size="160" fill="none" stroke="#ff4fb5" stroke-width="16" opacity=".5" filter="url(#b16)">NIGHT</text>`+
     `<text x="70" y="470" font-family="M" font-weight="800" font-style="italic" font-size="160" fill="none" stroke="#ffc2e6" stroke-width="5">NIGHT</text>`+
     `<path d="M80,512 h170 l26,-22 l26,22 h200" stroke="#4fe8ff" stroke-width="12" fill="none" opacity=".55" filter="url(#b8)"/><path d="M80,512 h170 l26,-22 l26,22 h200" stroke="#c9fbff" stroke-width="4" fill="none"/></g>`;
  // бар: полки и бутылки
  s+=`<ellipse cx="860" cy="760" rx="300" ry="190" fill="url(#amb)"/>`;
  const cols=['#d98a2b','#2f8a5a','#a9cfe0','#b8402e','#e0b84a'];
  for(let r=0;r<3;r++){const y=700+r*96;
    s+=`<rect x="650" y="${y}" width="420" height="8" rx="3" fill="#3a2550"/><rect x="650" y="${y}" width="420" height="3" fill="#ffcf8a" opacity=".35"/>`;
    for(let i=0;i<9;i++){const x=668+i*45+(r%2)*12, c=cols[(i*3+r)%5], hh=50+((i+r)%3)*10;
      s+=`<rect x="${x}" y="${y-hh}" width="24" height="${hh}" rx="6" fill="${c}" opacity=".88"/><rect x="${x+8}" y="${y-hh-18}" width="8" height="22" rx="3" fill="${c}" opacity=".88"/><rect x="${x+4}" y="${y-hh+8}" width="5" height="${hh-14}" rx="2" fill="#fff" opacity=".28"/>`;}}
  // стойка
  s+=`<rect x="620" y="930" width="470" height="280" fill="#150b22"/>`;
  for(let i=0;i<9;i++)s+=`<rect x="${640+i*52}" y="960" width="3" height="240" fill="#fff" opacity=".04"/>`;
  s+=`<rect x="600" y="912" width="490" height="26" rx="4" fill="#2c1b40"/><path d="M604,940 H1080" stroke="#ff5fb4" stroke-width="10" opacity=".6" filter="url(#b8)"/><path d="M604,940 H1080" stroke="#ffc6e6" stroke-width="3"/>`;
  // ферма и прожекторы
  s+=`<rect x="0" y="96" width="1080" height="30" fill="#0f0819"/>`;
  for(let i=0;i<27;i++)s+=`<path d="M${i*40},96 l20,30 l20,-30" stroke="#24163a" stroke-width="3" fill="none"/>`;
  const fx=[[190,'bm',.9,0],[540,'bv',1.3,2],[890,'bc',1.1,4]];
  let beams='';
  for(const [x,g,sp,ph] of fx){const a=Math.sin(t*sp+ph)*16;
    s+=`<rect x="${x-30}" y="126" width="60" height="40" rx="8" fill="#1c1130"/>`;
    beams+=`<g transform="rotate(${a} ${x} 160)"><path d="M${x-26},160 L${x+26},160 L${x+300},1260 L${x-300},1260 Z" fill="url(#${g})" filter="url(#b8)" style="mix-blend-mode:screen"/></g>`;
    const fxp=x+Math.tan(-a*Math.PI/180)*1100*-1;
    beams+=`<ellipse cx="${x-Math.sin(a*Math.PI/180)*1100}" cy="1230" rx="230" ry="44" fill="${g==='bm'?'#ff3fb0':g==='bc'?'#3fe6ff':'#9d6bff'}" opacity=".22" filter="url(#b16)"/>`;
    s+=`<circle cx="${x}" cy="160" r="15" fill="#fff" filter="url(#glow)"/>`;
  }
  // пол
  s+=`<rect x="0" y="1196" width="1080" height="724" fill="url(#floor)"/><rect x="0" y="1196" width="1080" height="3" fill="#ff5fb4" opacity=".25"/>`;
  // толпа (средний план, слегка размыта)
  let cr='';
  for(let row=0;row<2;row++)for(let i=0;i<9;i++){
    const sc=row?1:.82, x=-10+i*76+(row?36:0)+rnd(i+row*9)*18, by=row?1215:1150;
    const bob=-Math.abs(Math.sin(t*Math.PI*2.05+i*1.7+row))*12*sc, y=by+bob, c=row?'#3a2160':'#2a1748';
    const up=rnd(i*3+row)>.62;
    if(up){const w=Math.sin(t*6+i)*8;cr+=`<path d="M${x-30*sc},${y-170*sc} L${x-52*sc+w},${y-290*sc} M${x+30*sc},${y-170*sc} L${x+56*sc-w},${y-286*sc}" stroke="${c}" stroke-width="${24*sc}" stroke-linecap="round"/>`;}
    cr+=`<path d="M${x-62*sc},${y} L${x-58*sc},${y-150*sc} Q${x},${y-196*sc} ${x+58*sc},${y-150*sc} L${x+62*sc},${y} Z" fill="${c}"/>`;
    cr+=`<circle cx="${x}" cy="${y-218*sc}" r="${40*sc}" fill="${c}"/><path d="M${x-40*sc},${y-226*sc} A${40*sc},${40*sc} 0 0 1 ${x+40*sc},${y-226*sc}" stroke="${row?'#ff6fc0':'#7fe9ff'}" stroke-width="${5*sc}" fill="none" opacity=".55"/>`;
  }
  s+=`<g filter="url(#b3)">${cr}</g>`;
  s+=beams;
  // дымка и пылинки
  for(let i=0;i<3;i++)s+=`<ellipse cx="${(200+i*360+t*20*(i%2?1:-1))%1300-100}" cy="${640+i*170}" rx="420" ry="120" fill="#b07bff" opacity=".07" filter="url(#b30)"/>`;
  for(let i=0;i<46;i++){const x=rnd(i)*1080, y=(rnd(i+50)*1100+200-t*(14+rnd(i+9)*20))%1100+150, f=.25+.5*Math.abs(Math.sin(t*1.4+i));
    s+=`<circle cx="${x}" cy="${y}" r="${1.6+rnd(i+7)*2.4}" fill="#fff" opacity="${f*.6}"/>`;}
  // люди
  s+=guy({...DRUG,rim:1,x:880,y:1262,s:1.02,look:-1,mood:o.fmood||'s',reach:o.reach,bag:o.reach!=null});
  s+=guy({...DIMA,rim:1,x:400,y:1276,s:1.1,look:o.look||0,mood:o.mood||'n'});
  if(o.bubble){const k=o.bubble, sc=ease(k*1.6)*1;
    s+=`<g transform="translate(770,540) scale(${sc*.62})"><path d="M-250,-70 h500 a26,26 0 0 1 26,26 v88 a26,26 0 0 1 -26,26 h-170 l40,60 l-70,-60 h-274 a26,26 0 0 1 -26,-26 v-88 a26,26 0 0 1 26,-26z" fill="#fff"/>`+
       `<text x="0" y="16" text-anchor="middle" font-family="M" font-weight="900" font-size="50" fill="#14111a">ДА ОДИН РАЗ!</text></g>`;}
  return s;
}
// подсветка сцены цветом (как свет от прожекторов на людях)
function grade(){return `<rect width="1080" height="1920" fill="#7a2cff" opacity=".07" style="mix-blend-mode:screen"/>`}

// ---------- кадры фраз ----------
function camT(fx,fy,cx,cy,s){return `translate(${cx},${cy}) scale(${s}) translate(${-fx},${-fy})`}
function beat0(t,k){return `<g transform="${camT(540,900,540,900,mix(1.0,1.06,k))}">${club(t,{mood:'s',fmood:'s'})}</g>`}
function beat1(t,k){
  return `<g transform="${camT(650,820,540,800,mix(1.5,1.6,k))}">${club(t,{reach:sm(k*2.2),look:k>.25?1:0,mood:k>.4?'w':'n',fmood:'s',bubble:cl((k-.3)*2)})}</g>`}
function beat2(t,k,tt){
  const bpm=mix(80,131,sm(k)), ph=(tt*bpm/60)%1, thump=Math.exp(-ph*9);
  let s=`<g filter="url(#dof)" opacity=".7"><g transform="${camT(560,780,540,760,1.25)}">${club(t,{})}</g></g>`;
  s+=`<rect width="1080" height="1920" fill="#14040c" opacity=".35"/>`;
  const sc=2.65*(1+thump*.018*k);
  s+=guy({...DIMA,x:540,y:700+545*sc,s:sc,look:0,pup:mix(11,20,sm(k*1.2)),mood:k>.35?'t':'w',sweat:cl((k-.25)*2.2)});
  // монитор пульса
  let path='M0,70'; for(let x=0;x<=560;x+=4){const u=(x/560*2.4+tt*1.8*bpm/80)%1;const y=u>.42&&u<.46?70-110*Math.sin((u-.42)/.04*Math.PI):u>.46&&u<.5?70+40*Math.sin((u-.46)/.04*Math.PI):70+Math.sin(x*.08)*1.5;path+=` L${x},${y}`;}
  s+=`<g transform="translate(260,1080)"><rect x="-24" y="-20" width="608" height="180" rx="18" fill="#070a10" opacity=".86" stroke="#ff3b4e" stroke-opacity=".5" stroke-width="2"/>`+
     `<path d="${path}" stroke="#ff3b4e" stroke-width="10" fill="none" opacity=".45" filter="url(#b8)"/><path d="${path}" stroke="#ff8a96" stroke-width="4" fill="none"/></g>`;
  s+=`<rect width="1080" height="1920" fill="url(#redv)" opacity="${.25+.6*thump*k}"/>`;
  return s;
}
function beat3(t,k,tt){
  const ph=(tt*134/60)%1, thump=Math.exp(-ph*8), sc=1+thump*.05;
  let s=`<rect width="1080" height="1920" fill="url(#hb)"/>`;
  for(let i=0;i<5;i++)s+=`<circle cx="540" cy="470" r="${200+((ph+i/5)%1)*560}" fill="none" stroke="#ff2e45" stroke-width="3" opacity="${(1-((ph+i/5)%1))*.35}"/>`;
  const hp='M0,90 C-40,30 -150,20 -150,-60 C-150,-130 -90,-170 -40,-160 C-15,-155 0,-135 0,-115 C0,-135 15,-155 40,-160 C90,-170 150,-130 150,-60 C150,20 40,30 0,90 Z';
  s+=`<g transform="translate(540,470) scale(${1.55*sc})"><path d="${hp}" fill="#ff1f3d" opacity=".55" filter="url(#b16)"/><path d="${hp}" fill="url(#heart)"/>`+
     `<path d="M-60,-120 C-90,-110 -112,-80 -110,-50" stroke="#fff" stroke-width="12" stroke-linecap="round" fill="none" opacity=".45"/>`+
     `<path d="M-150,-20 H-60 L-35,-70 L-5,40 L25,-40 L45,-20 H150" stroke="#fff" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="${.5+.5*thump}"/></g>`;
  const pop=ease(cl((k-.08)*3.2));
  s+=`<g transform="translate(540,960) scale(${.6+.4*pop})" opacity="${pop}"><text text-anchor="middle" y="0" font-family="M" font-weight="900" font-size="300" fill="#ff1f3d" opacity=".6" filter="url(#b16)">×24</text>`+
     `<text text-anchor="middle" y="0" font-family="M" font-weight="900" font-size="300" fill="#ff3b4e">×24</text>`+
     `<text text-anchor="middle" y="74" font-family="J" font-weight="700" font-size="34" fill="#ffb3bb" letter-spacing="4">РИСК ИНФАРКТА · 1-Й ЧАС</text></g>`;
  s+=`<text x="540" y="1172" text-anchor="middle" font-family="J" font-weight="500" font-size="22" fill="#fff" opacity="${.45*pop}">Mittleman et al., Circulation, 1999</text>`;
  return s;
}
const DRAW=[beat0,beat1,beat2,beat3];

// ---------- субтитры ----------
function capHTML(b,k){
  const ws=b.cap.split(' '), n=ws.length, shown=Math.min(n,Math.floor(k*n/0.62)+1);
  return ws.map((w,i)=>{let c='';if(/^\*.*\*[,.:]?$/.test(w)){c='y';w=w.replace(/\*/g,'')}else if(/^!.*![,.:]?$/.test(w)){c='r';w=w.replace(/!/g,'')}
    return `<i class="${i<shown?'on ':''}${c}">${w}</i>`}).join(' ');
}

const sv=document.getElementById('sv'), cap=document.getElementById('cap'), clock=document.getElementById('clock'),
  bpmEl=document.getElementById('bpm'), pulse=document.getElementById('pulse'), card=document.getElementById('card');
let lastCap='';
window.R=function(tt){
  let bi=BEATS.length-1; for(let i=0;i<BEATS.length;i++)if(tt<BEATS[i].t0+BEATS[i].d){bi=i;break}
  const b=BEATS[bi], lt=tt-b.t0, k=cl(lt/b.d);
  // переход: размытие в конце фразы и в начале следующей
  const tin=cl(lt/.16), tout=cl((b.d-lt)/.14), blur=bi===0?mix(0,18,1-tout):mix(18,0,tin)*(1)+ (bi<BEATS.length-1?mix(18,0,tout):0);
  const pop=bi>0?1+.05*(1-ease(tin)):1;
  sv.innerHTML=DEFS+`<g filter="url(#cam)"><g transform="translate(540,960) scale(${pop}) translate(-540,-960)">${DRAW[bi](tt,k,tt)}${bi<3?grade():''}</g></g>`+
    `<rect width="1080" height="1920" fill="url(#vig)"/><rect y="1150" width="1080" height="770" fill="url(#low)"/>`;
  document.getElementById('camb').setAttribute('stdDeviation',Math.min(18,blur).toFixed(1));
  const c=capHTML(b,k); if(c!==lastCap){cap.innerHTML=c;lastCap=c}
  const capIn=ease(cl(lt/.18)); cap.style.transform=`translateY(${(1-capIn)*30}px) scale(${.96+.04*capIn})`; cap.style.opacity=capIn*cl((window.DUR-tt)/.3);
  clock.textContent=b.clock;
  const bpm=Math.round(mix(b.bpm[0],b.bpm[1],sm(k))); bpmEl.textContent=bpm; pulse.classList.toggle('hot',bpm>=100);
  const ci=bi===0?ease(cl((tt-.35)/.35)):0, co=bi===0?cl((b.d-lt)/.2):0;
  card.style.opacity=ci*co; card.style.transform=`translateX(${(1-ci)*-60}px) rotate(${(1-ci)*-4-1.5}deg)`;
};
window.R(0);
</script></body></html>
