<style>

<svg id="sv" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<div class="pill"><b></b><span id="clock">ПЯТНИЦА · 23:40</span></div>

<div class="card" id="card"><div class="l">ДОСЬЕ<span>ПЯТНИЦА</span></div><div class="n">ДИМА</div><div class="s">23 года · клуб · первый раз</div></div>
<div class="cap" id="cap"></div>
<script>
const W=1080,H=1920;
const cl=x=>x<0?0:x>1?1:x, sm=x=>{x=cl(x);return x*x*(3-2*x)}, mix=(a,b,k)=>a+(b-a)*k;
const ease=x=>{x=cl(x);return 1-Math.pow(1-x,3)};
const DEFS=`<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b0c2e"/><stop offset=".55" stop-color="#2a1245"/><stop offset="1" stop-color="#12081f"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241238"/><stop offset=".35" stop-color="#0e0718"/><stop offset="1" stop-color="#05030a"/></linearGradient>
 <linearGradient id="bm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3fb0" stop-opacity=".75"/><stop offset=".6" stop-color="#ff3fb0" stop-opacity=".16"/><stop offset="1" stop-color="#ff3fb0" stop-opacity="0"/></linearGradient>
 <linearGradient id="bc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fe6ff" stop-opacity=".7"/><stop offset=".6" stop-color="#3fe6ff" stop-opacity=".14"/><stop offset="1" stop-color="#3fe6ff" stop-opacity="0"/></linearGradient>
 <linearGradient id="bv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9d6bff" stop-opacity=".7"/><stop offset=".6" stop-color="#9d6bff" stop-opacity=".15"/><stop offset="1" stop-color="#9d6bff" stop-opacity="0"/></linearGradient>
 <linearGradient id="low" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05030a" stop-opacity="0"/><stop offset=".45" stop-color="#05030a" stop-opacity=".88"/><stop offset="1" stop-color="#05030a" stop-opacity="1"/></linearGradient>
 <radialGradient id="vig" cx=".5" cy=".42" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient>
 <radialGradient id="redv" cx=".5" cy=".4" r=".7"><stop offset=".35" stop-color="#ff0a2a" stop-opacity="0"/><stop offset="1" stop-color="#ff0a2a" stop-opacity=".75"/></radialGradient>
 <radialGradient id="amb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb04a" stop-opacity=".55"/><stop offset="1" stop-color="#ffb04a" stop-opacity="0"/></radialGradient>
 <radialGradient id="hb" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#5a0a18"/><stop offset=".6" stop-color="#1c040a"/><stop offset="1" stop-color="#070205"/></radialGradient>
 <radialGradient id="heart" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#ff7a86"/><stop offset=".45" stop-color="#e3243d"/><stop offset="1" stop-color="#7a0a1c"/></radialGradient>
 <filter id="b3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
 <filter id="b8" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
 <filter id="b16" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
 <filter id="b30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="rimL" x="-10%" y="-10%" width="120%" height="120%"><feFlood flood-color="#ff5fc0"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="-7" dy="-2"/><feGaussianBlur stdDeviation="1.2" result="a"/><feFlood flood-color="#55e8ff"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="6" dy="-2"/><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="a"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="cam" x="0" y="0" width="100%" height="100%"><feGaussianBlur id="camb" stdDeviation="0"/></filter>
 <filter id="dof" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>`;

function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}

// ---------- человек (ноги в 0,0; рост ~670) ----------
function guy(o){
  const id=o.id, sk=o.skin, sk2=o.skin2, h=o.hood, h2=o.hood2;
  const torso='M-118,-330 C-118,-396 -84,-424 -40,-428 L40,-428 C84,-424 118,-396 118,-330 L110,-188 C110,-180 104,-174 96,-174 L-96,-174 C-104,-174 -110,-180 -110,-188 Z';
  const lk=(o.look||0)*13, pu=o.pup||11, md=o.mood||'n';
  let s=`<g transform="translate(${o.x},${o.y}) scale(${o.s})"><ellipse cx="0" cy="0" rx="160" ry="26" fill="#000" opacity=".55" filter="url(#b8)"/><g ${o.rim?'filter="url(#rimL)"':''}>`;
  // ноги, обувь
  s+=`<rect x="-72" y="-196" width="62" height="176" rx="24" fill="${o.pants}"/><rect x="10" y="-196" width="62" height="176" rx="24" fill="${o.pants}"/>`;
  s+=`<rect x="10" y="-196" width="62" height="176" rx="24" fill="#000" opacity=".22"/>`;
  s+=`<rect x="-86" y="-38" width="82" height="38" rx="17" fill="${o.shoe}"/><rect x="4" y="-38" width="82" height="38" rx="17" fill="${o.shoe}"/>`;
  s+=`<rect x="-86" y="-10" width="82" height="10" rx="5" fill="#000" opacity=".18"/><rect x="4" y="-10" width="82" height="10" rx="5" fill="#000" opacity=".25"/>`;
  // руки
  const arm=(sx,ex,ey,mx,my,shade)=>`<path d="M${sx},-396 Q${mx},${my} ${ex},${ey}" stroke="${h}" stroke-width="56" stroke-linecap="round" fill="none"/>`+
     (shade?`<path d="M${sx},-396 Q${mx},${my} ${ex},${ey}" stroke="#000" stroke-opacity=".2" stroke-width="56" stroke-linecap="round" fill="none"/>`:'')+
     `<circle cx="${ex}" cy="${ey+10}" r="28" fill="${sk}"/>`;
  if(o.reach!=null){ // тянет левую руку к середине
    const k=o.reach, ex=mix(-136,-262,k), ey=mix(-222,-352,k);
    s+=arm(-108,ex,ey,mix(-150,-200,k),mix(-300,-330,k),false);
    if(o.bag&&k>.6){const bx=ex-22,by=ey-30;
      s+=`<g transform="translate(${bx},${by}) rotate(-12) scale(1.35)"><rect x="-26" y="-34" width="52" height="58" rx="5" fill="#fff" opacity=".9"/><rect x="-26" y="-34" width="52" height="9" fill="#ff4f7a"/>`+
         `<path d="M-20,8 Q0,-6 20,8 L20,18 L-20,18 Z" fill="#f2eef6"/><rect x="-26" y="-34" width="52" height="58" rx="5" fill="none" stroke="#c9c2d3" stroke-width="3"/></g>`;
      s+=`<circle cx="${ex}" cy="${ey+10}" r="28" fill="${sk}"/><rect x="${ex-30}" y="${ey-4}" width="40" height="22" rx="11" fill="${sk2}"/>`;
    }
  } else if(o.arms==='up'){const w=o.wave||0;
    s+=arm(-108,-176+w*18,-648-w*10,-196,-520,false); s+=arm(108,176-w*18,-648+w*10,196,-520,true);}
  else s+=arm(-108,-138,-222,-132,-300,false);
  if(o.arms!=='up') s+=arm(108,138,-222,132,-300,true);
  // торс
  s+=`<g transform="translate(0,${-(o.br||0)*7})">`;
  s+=`<clipPath id="c${id}"><path d="${torso}"/></clipPath>`;
  s+=`<ellipse cx="0" cy="-424" rx="104" ry="36" fill="${h2}"/>`;
  s+=`<path d="${torso}" fill="${h}"/><g clip-path="url(#c${id})"><rect x="34" y="-440" width="100" height="280" fill="#000" opacity=".2"/><rect x="-130" y="-440" width="40" height="280" fill="#fff" opacity=".06"/>`+
     `<rect x="-74" y="-272" width="148" height="66" rx="22" fill="${h2}" opacity=".55"/></g>`;
  s+=`<path d="M-24,-418 L-30,-336" stroke="#ecebf4" stroke-width="7" stroke-linecap="round"/><path d="M24,-418 L30,-336" stroke="#ecebf4" stroke-width="7" stroke-linecap="round"/>`;
  s+=`<rect x="-27" y="-458" width="54" height="44" rx="10" fill="${sk2}"/>`;
  // голова
  s+=`<ellipse cx="-96" cy="-540" rx="21" ry="29" fill="${sk2}"/><ellipse cx="96" cy="-540" rx="21" ry="29" fill="${sk2}"/>`;
  s+=`<clipPath id="h${id}"><ellipse cx="0" cy="-545" rx="98" ry="106"/></clipPath>`;
  s+=`<ellipse cx="0" cy="-545" rx="98" ry="106" fill="${sk}"/><g clip-path="url(#h${id})"><ellipse cx="78" cy="-530" rx="60" ry="120" fill="#000" opacity=".09"/></g>`;
  s+=`<path d="M-104,-556 C-110,-642 -44,-676 8,-672 C72,-670 112,-634 104,-556 C96,-590 74,-606 44,-598 C24,-616 -8,-620 -30,-604 C-60,-612 -90,-598 -104,-556 Z" fill="${o.hair}"/>`;
  if(o.sweat){const k=o.sweat;
    s+=`<g opacity="${k}" fill="#bfe6ff" stroke="#7fb6db" stroke-width="2"><path d="M86,-612 q10,18 0,26 q-10,-8 0,-26z"/><path d="M-88,-596 q9,16 0,23 q-9,-7 0,-23z"/><path d="M60,-640 q7,12 0,18 q-7,-6 0,-18z"/></g>`;}
  // брови
  const br=md==='w'?[[-16,-604,-62,-590],[16,-604,62,-590]]:md==='t'?[[-16,-596,-62,-606],[16,-596,62,-606]]:[[-18,-598,-62,-596],[18,-598,62,-596]];
  for(const b of br)s+=`<path d="M${b[0]},${b[1]} L${b[2]},${b[3]}" stroke="${o.hair}" stroke-width="10" stroke-linecap="round"/>`;
  // глаза
  for(const ex of [-38,38]){
    if(o.blink){s+=`<path d="M${ex-30},-546 Q${ex},-530 ${ex+30},-546" stroke="#17141f" stroke-width="6" fill="none" stroke-linecap="round"/>`;continue}
    s+=`<ellipse cx="${ex}" cy="-548" rx="30" ry="33" fill="#fff" stroke="#17141f" stroke-width="5"/>`;
    s+=`<circle cx="${ex+lk}" cy="-545" r="${pu}" fill="#17141f"/><circle cx="${ex+lk-pu*.35}" cy="${-545-pu*.4}" r="${Math.max(3,pu*.32)}" fill="#fff"/>`;
  }
  s+=`<circle cx="-64" cy="-504" r="17" fill="#ff6f86" opacity=".32"/><circle cx="64" cy="-504" r="17" fill="#ff6f86" opacity=".32"/>`;
  s+=`<path d="M-7,-516 Q0,-505 9,-513" stroke="${sk2}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if(md==='s')s+=`<path d="M-28,-488 Q0,-462 28,-488" stroke="#5a2228" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  else if(md==='w')s+=`<path d="M-22,-478 Q-11,-488 0,-480 Q11,-472 22,-482" stroke="#5a2228" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  else if(md==='t')s+=`<rect x="-30" y="-494" width="60" height="24" rx="8" fill="#fff" stroke="#5a2228" stroke-width="4"/><path d="M-30,-482 H30 M-15,-494 V-470 M0,-494 V-470 M15,-494 V-470" stroke="#5a2228" stroke-width="3"/>`;
  else s+=`<path d="M-20,-482 Q0,-476 20,-482" stroke="#5a2228" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  return s+'</g></g></g>';
}
const DIMA={id:'d',skin:'#f1c39c',skin2:'#d99f7a',hood:'#3d57bf',hood2:'#2b3f93',pants:'#1b1f33',shoe:'#e9e8f2',hair:'#2b1b16'};
const DRUG={id:'f',skin:'#e2b088',skin2:'#c48d68',hood:'#c53a4b',hood2:'#8e2634',pants:'#22202a',shoe:'#2c2a33',hair:'#121014'};

// ---------- клуб (мир 1080×1920, пол на 1200) ----------
function club(t,o){
  let s=`<rect width="1080" height="1920" fill="url(#wall)"/>`;
  // панели стены
  for(let i=0;i<7;i++)s+=`<rect x="${i*160-20}" y="0" width="150" height="1200" fill="#fff" opacity="${.012+.012*(i%2)}"/>`;
  // неон NIGHT
  const fl=(t%2.6>1.9&&t%2.6<1.97)?.35:1;
  s+=`<g opacity="${fl}"><text x="70" y="470" font-family="M" font-weight="800" font-style="italic" font-size="160" fill="none" stroke="#ff4fb5" stroke-width="16" opacity=".5" filter="url(#b16)">NIGHT</text>`+
     `<text x="70" y="470" font-family="M" font-weight="800" font-style="italic" font-size="160" fill="none" stroke="#ffc2e6" stroke-width="5">NIGHT</text>`+
     `<path d="M80,512 h170 l26,-22 l26,22 h200" stroke="#4fe8ff" stroke-width="12" fill="none" opacity=".55" filter="url(#b8)"/><path d="M80,512 h170 l26,-22 l26,22 h200" stroke="#c9fbff" stroke-width="4" fill="none"/></g>`;
  // бар: полки и бутылки
  s+=`<ellipse cx="860" cy="760" rx="300" ry="190" fill="url(#amb)"/>`;
  const cols=['#d98a2b','#2f8a5a','#a9cfe0','#b8402e','#e0b84a'];
  for(let r=0;r<3;r++){const y=700+r*96;
    s+=`<rect x="650" y="${y}" width="420" height="8" rx="3" fill="#3a2550"/><rect x="650" y="${y}" width="420" height="3" fill="#ffcf8a" opacity=".35"/>`;
    for(let i=0;i<9;i++){const x=668+i*45+(r%2)*12, c=cols[(i*3+r)%5], hh=50+((i+r)%3)*10;
      s+=`<rect x="${x}" y="${y-hh}" width="24" height="${hh}" rx="6" fill="${c}" opacity=".88"/><rect x="${x+8}" y="${y-hh-18}" width="8" height="22" rx="3" fill="${c}" opacity=".88"/><rect x="${x+4}" y="${y-hh+8}" width="5" height="${hh-14}" rx="2" fill="#fff" opacity=".28"/>`;}}
  // стойка
  s+=`<rect x="620" y="930" width="470" height="280" fill="#150b22"/>`;
  for(let i=0;i<9;i++)s+=`<rect x="${640+i*52}" y="960" width="3" height="240" fill="#fff" opacity=".04"/>`;
  s+=`<rect x="600" y="912" width="490" height="26" rx="4" fill="#2c1b40"/><path d="M604,940 H1080" stroke="#ff5fb4" stroke-width="10" opacity=".6" filter="url(#b8)"/><path d="M604,940 H1080" stroke="#ffc6e6" stroke-width="3"/>`;
  // ферма и прожекторы
  s+=`<rect x="0" y="96" width="1080" height="30" fill="#0f0819"/>`;
  for(let i=0;i<27;i++)s+=`<path d="M${i*40},96 l20,30 l20,-30" stroke="#24163a" stroke-width="3" fill="none"/>`;
  const fx=[[190,'bm',.9,0],[540,'bv',1.3,2],[890,'bc',1.1,4]];
  let beams='';
  for(const [x,g,sp,ph] of fx){const a=Math.sin(t*sp+ph)*16;
    s+=`<rect x="${x-30}" y="126" width="60" height="40" rx="8" fill="#1c1130"/>`;
    beams+=`<g transform="rotate(${a} ${x} 160)"><path d="M${x-26},160 L${x+26},160 L${x+300},1260 L${x-300},1260 Z" fill="url(#${g})" filter="url(#b8)" style="mix-blend-mode:screen"/></g>`;
    const fxp=x+Math.tan(-a*Math.PI/180)*1100*-1;
    beams+=`<ellipse cx="${x-Math.sin(a*Math.PI/180)*1100}" cy="1230" rx="230" ry="44" fill="${g==='bm'?'#ff3fb0':g==='bc'?'#3fe6ff':'#9d6bff'}" opacity=".22" filter="url(#b16)"/>`;
    s+=`<circle cx="${x}" cy="160" r="15" fill="#fff" filter="url(#glow)"/>`;
  }
  // пол
  s+=`<rect x="0" y="1196" width="1080" height="724" fill="url(#floor)"/><rect x="0" y="1196" width="1080" height="3" fill="#ff5fb4" opacity=".25"/>`;
  // толпа (средний план, слегка размыта)
  let cr='';
  for(let row=0;row<2;row++)for(let i=0;i<9;i++){
    const sc=row?1:.82, x=-10+i*76+(row?36:0)+rnd(i+row*9)*18, by=row?1215:1150;
    const bob=-Math.abs(Math.sin(t*Math.PI*2.05+i*1.7+row))*12*sc, y=by+bob, c=row?'#3a2160':'#2a1748';
    const up=rnd(i*3+row)>.62;
    if(up){const w=Math.sin(t*6+i)*8;cr+=`<path d="M${x-30*sc},${y-170*sc} L${x-52*sc+w},${y-290*sc} M${x+30*sc},${y-170*sc} L${x+56*sc-w},${y-286*sc}" stroke="${c}" stroke-width="${24*sc}" stroke-linecap="round"/>`;}
    cr+=`<path d="M${x-62*sc},${y} L${x-58*sc},${y-150*sc} Q${x},${y-196*sc} ${x+58*sc},${y-150*sc} L${x+62*sc},${y} Z" fill="${c}"/>`;
    cr+=`<circle cx="${x}" cy="${y-218*sc}" r="${40*sc}" fill="${c}"/><path d="M${x-40*sc},${y-226*sc} A${40*sc},${40*sc} 0 0 1 ${x+40*sc},${y-226*sc}" stroke="${row?'#ff6fc0':'#7fe9ff'}" stroke-width="${5*sc}" fill="none" opacity=".55"/>`;
  }
  s+=`<g filter="url(#b3)">${cr}</g>`;
  s+=beams;
  // дымка и пылинки
  for(let i=0;i<3;i++)s+=`<ellipse cx="${(200+i*360+t*20*(i%2?1:-1))%1300-100}" cy="${640+i*170}" rx="420" ry="120" fill="#b07bff" opacity=".07" filter="url(#b30)"/>`;
  for(let i=0;i<46;i++){const x=rnd(i)*1080, y=(rnd(i+50)*1100+200-t*(14+rnd(i+9)*20))%1100+150, f=.25+.5*Math.abs(Math.sin(t*1.4+i));
    s+=`<circle cx="${x}" cy="${y}" r="${1.6+rnd(i+7)*2.4}" fill="#fff" opacity="${f*.6}"/>`;}
  // люди
  if(!o.noFriend)s+=guy({...DRUG,rim:1,x:880,y:1262,s:1.02,look:-1,br:o.br2,blink:o.blink2,mood:o.fmood||'s',reach:o.reach,bag:o.reach!=null});
  if(!o.noDima)s+=guy({...DIMA,rim:1,x:o.dx||400,y:1276+(o.dy||0),s:1.1,look:o.look||0,mood:o.mood||'n',arms:o.arms,wave:o.wave,br:o.br,blink:o.blink,pup:o.pup,sweat:o.sweat});
  if(o.glass)s+=glass(560,912,1);
  if(o.bubble){const k=o.bubble, sc=ease(k*1.6)*1;
    s+=`<g transform="translate(770,540) scale(${sc*.62})"><path d="M-250,-70 h500 a26,26 0 0 1 26,26 v88 a26,26 0 0 1 -26,26 h-170 l40,60 l-70,-60 h-274 a26,26 0 0 1 -26,-26 v-88 a26,26 0 0 1 26,-26z" fill="#fff"/>`+
       `<text x="0" y="16" text-anchor="middle" font-family="M" font-weight="900" font-size="50" fill="#14111a">ДА ОДИН РАЗ!</text></g>`;}
  return s;
}
// подсветка сцены цветом (как свет от прожекторов на людях)
function grade(){return `<rect width="1080" height="1920" fill="#7a2cff" opacity=".07" style="mix-blend-mode:screen"/>`}


// ---------- проба v2: приёмы из всех 30 примеров (см. референсы-рисовка-08.11.md) ----------
const BEATS=[
  {d:2.8, cap:'Диме 23. Сегодня он впервые попробует *кокаин.*', clock:'ПЯТНИЦА · 23:12', bpm:[70,72], f:shotA, tout:'zoom'},
  {d:3.0, cap:'Друг суёт *пакетик:* «Да один раз».', clock:'ПЯТНИЦА · 23:41', bpm:[74,78], f:shotB, tin:'flash'},
  {d:2.6, cap:'Сначала — эйфория и прилив сил.', clock:'ПЯТНИЦА · 23:46', bpm:[92,104], f:shotC},
  {d:2.8, cap:'Но !сердце! уже колотится.', clock:'ПЯТНИЦА · 23:49', bpm:[112,131], f:shotD, tout:'smoke'},
  {d:3.0, cap:'Через полчаса отпускает — и *тянет* ещё.', clock:'СУББОТА · 00:17', bpm:[118,108], f:shotE, tin:'smoke', tout:'zoom'},
  {d:3.0, cap:'Плюс алкоголь — в печени *кокаэтилен.*', clock:'СУББОТА · 00:21', bpm:[112,124], f:shotF, tin:'amber', tout:'red'},
  {d:2.8, cap:'Он бьёт по !сердцу! сильнее и дольше.', clock:'СУББОТА · 00:24', bpm:[128,142], f:shotG, tin:'red'},
  {d:3.4, cap:'В первый час риск !инфаркта! выше в !24! раза.', clock:'СУББОТА · 00:40', bpm:[140,134], f:shotH},
  {d:3.2, cap:'А ты бы *взял?* Пиши в комментарии.', clock:'СУББОТА · 00:41', bpm:[134,134], f:shotI},
];
let acc=0; for(const b of BEATS){b.t0=acc; acc+=b.d}
window.DUR=acc+0.3;
const FX={};
const blinkAt=(t,s)=>((t+s)%3.3)<0.13, breath=(t,s)=>Math.sin((t+s)*2.3)*.5+.5;
const wordK=(b,i)=>i*0.62/b.cap.split(' ').length;
function camT(fx,fy,cx,cy,s){return `translate(${cx},${cy}) scale(${s}) translate(${-fx},${-fy})`}
const easeIn=x=>{x=cl(x);return x*x*x};

// ---------- предметы ----------
function glass(x,y,s){ // стакан со льдом, дно в (x,y)
  return `<g transform="translate(${x},${y}) scale(${s})"><ellipse cx="0" cy="-2" rx="46" ry="9" fill="#000" opacity=".35" filter="url(#b3)"/>`+
   `<path d="M-38,-110 L38,-110 L32,0 L-32,0 Z" fill="#ffffff" opacity=".12" stroke="#e8f4ff" stroke-opacity=".55" stroke-width="3"/>`+
   `<path d="M-36,-70 L36,-70 L32,0 L-32,0 Z" fill="#e8952e" opacity=".85"/><rect x="-20" y="-92" width="26" height="24" rx="5" fill="#e9fbff" opacity=".7" transform="rotate(12)"/>`+
   `<rect x="2" y="-84" width="22" height="22" rx="5" fill="#e9fbff" opacity=".6" transform="rotate(-10)"/><path d="M-30,-104 L-26,-8" stroke="#fff" stroke-width="5" opacity=".45" stroke-linecap="round"/></g>`;
}
function bag(x,y,r,s){
  return `<g transform="translate(${x},${y}) rotate(${r}) scale(${s})"><rect x="-58" y="-74" width="116" height="140" rx="10" fill="#ffffff" opacity=".88"/>`+
   `<rect x="-58" y="-74" width="116" height="18" rx="6" fill="#ff4f7a"/><path d="M-46,30 Q-10,0 46,28 L46,54 L-46,54 Z" fill="#f4f0f8"/>`+
   `<rect x="-58" y="-74" width="116" height="140" rx="10" fill="none" stroke="#cfc8da" stroke-width="5"/><path d="M-42,-46 L-36,40" stroke="#fff" stroke-width="7" opacity=".7" stroke-linecap="round"/></g>`;
}
function bigHand(t,k){ // крупный план: рука друга протягивает пакетик
  const sk='#e2b088', sk2='#c48d68', mv=ease(k)*30, bob=Math.sin(t*3)*4;
  let s=`<g transform="translate(${-mv},${bob})">`;
  s+=`<g transform="rotate(-9 900 930)"><rect x="740" y="830" width="460" height="200" rx="90" fill="#c53a4b"/><rect x="740" y="830" width="460" height="200" rx="90" fill="#000" opacity=".12"/>`+
     `<rect x="726" y="826" width="70" height="208" rx="32" fill="#8e2634"/></g>`;
  s+=`<ellipse cx="672" cy="918" rx="128" ry="98" fill="${sk}"/><ellipse cx="700" cy="955" rx="95" ry="55" fill="${sk2}" opacity=".45"/>`;
  for(let i=0;i<3;i++)s+=`<rect x="${560-i*4}" y="${930+i*40}" width="128" height="46" rx="23" fill="${sk}"/><path d="M${566-i*4},${972+i*40} H${676-i*4}" stroke="${sk2}" stroke-width="4" opacity=".6"/>`;
  s+=`<rect x="520" y="842" width="160" height="52" rx="26" fill="${sk}"/><path d="M528,890 H668" stroke="${sk2}" stroke-width="4" opacity=".6"/>`;
  s+=bag(470,850,-12,1.15);
  s+=`<path d="M690,850 Q610,792 528,808" stroke="${sk}" stroke-width="58" stroke-linecap="round" fill="none"/><path d="M690,862 Q612,812 534,826" stroke="${sk2}" stroke-width="10" stroke-linecap="round" fill="none" opacity=".45"/>`;
  return s+'</g>';
}
function bubble(x,y,sc,txt){
  return `<g transform="translate(${x},${y}) scale(${sc})"><path d="M-250,-70 h500 a26,26 0 0 1 26,26 v88 a26,26 0 0 1 -26,26 h-170 l40,60 l-70,-60 h-274 a26,26 0 0 1 -26,-26 v-88 a26,26 0 0 1 26,-26z" fill="#fff"/>`+
    `<text x="0" y="16" text-anchor="middle" font-family="M" font-weight="900" font-size="50" fill="#14111a">${txt}</text></g>`;
}
function tag(x,y,txt,bg,fg,sc,rot){
  const w=txt.length*25+56;
  return `<g transform="translate(${x},${y}) rotate(${rot||0}) scale(${sc})"><rect x="${-w/2}" y="-34" width="${w}" height="68" rx="14" fill="${bg}"/>`+
    `<text x="0" y="13" text-anchor="middle" font-family="M" font-weight="900" font-size="36" fill="${fg}" letter-spacing="1">${txt}</text></g>`;
}

// ---------- снаружи: клуб ночью под дождём ----------
function street(t){
  let s=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07061a"/><stop offset=".5" stop-color="#1a0f34"/><stop offset="1" stop-color="#3a1a52"/></linearGradient>`+
    `<linearGradient id="door" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7ac8"/><stop offset="1" stop-color="#7a2bd6"/></linearGradient>`+
    `<linearGradient id="spill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5fb4" stop-opacity=".5"/><stop offset="1" stop-color="#ff5fb4" stop-opacity="0"/></linearGradient>`+
    `<linearGradient id="asph" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1230"/><stop offset="1" stop-color="#06040c"/></linearGradient>`+
    `<radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd38a" stop-opacity=".7"/><stop offset="1" stop-color="#ffd38a" stop-opacity="0"/></radialGradient></defs>`;
  s+=`<rect width="1080" height="1300" fill="url(#sky)"/>`;
  for(let i=0;i<40;i++)s+=`<circle cx="${rnd(i+300)*1080}" cy="${rnd(i+340)*420}" r="${1+rnd(i+380)*1.6}" fill="#fff" opacity="${.25+.35*Math.abs(Math.sin(t*1.3+i))}"/>`;
  // дальние дома
  let fb='';
  for(let i=0;i<9;i++){const x=i*130-40, w=120+rnd(i+10)*40, h=380+rnd(i+20)*360, y=1180-h;
    fb+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#130b25"/>`;
    for(let r=0;r<h/46-1;r++)for(let c=0;c<w/34-1;c++){if(rnd(i*97+r*13+c)>.55)fb+=`<rect x="${x+12+c*34}" y="${y+18+r*46}" width="16" height="22" fill="#ffcf7a" opacity="${.15+rnd(i+r+c*3)*.45}"/>`;}}
  s+=`<g filter="url(#b3)" opacity=".9">${fb}</g>`;
  // клуб
  s+=`<rect x="150" y="390" width="780" height="800" fill="#1e1236"/><rect x="150" y="390" width="780" height="10" fill="#3a2560"/>`;
  for(let r=0;r<20;r++)s+=`<rect x="150" y="${420+r*40}" width="780" height="2" fill="#fff" opacity=".035"/>`;
  const fl=(t%2.2>1.5&&t%2.2<1.56)?.3:1;
  s+=`<g opacity="${fl}"><text x="540" y="600" text-anchor="middle" font-family="M" font-weight="800" font-style="italic" font-size="170" fill="none" stroke="#ff4fb5" stroke-width="18" opacity=".55" filter="url(#b16)">NIGHT</text>`+
     `<text x="540" y="600" text-anchor="middle" font-family="M" font-weight="800" font-style="italic" font-size="170" fill="none" stroke="#ffd0ea" stroke-width="5">NIGHT</text></g>`;
  s+=`<ellipse cx="540" cy="560" rx="360" ry="150" fill="#ff4fb5" opacity=".12" filter="url(#b30)"/>`;
  // козырёк с лампочками, дверь, свет
  s+=`<rect x="410" y="760" width="260" height="40" rx="6" fill="#120a20"/>`;
  for(let i=0;i<9;i++)s+=`<circle cx="${424+i*29}" cy="790" r="6" fill="#ffe2a0" opacity="${.5+.5*((Math.floor(t*4)+i)%2)}"/>`;
  s+=`<rect x="455" y="820" width="170" height="365" fill="url(#door)"/><rect x="455" y="820" width="170" height="365" fill="none" stroke="#2a1840" stroke-width="10"/>`;
  s+=`<rect x="430" y="800" width="220" height="400" fill="#ff5fb4" opacity=".22" filter="url(#b30)"/>`;
  // тротуар и асфальт
  s+=`<rect x="0" y="1182" width="1080" height="90" fill="#251740"/><rect x="0" y="1270" width="1080" height="10" fill="#3b2758"/><rect x="0" y="1280" width="1080" height="640" fill="url(#asph)"/>`;
  s+=`<path d="M455,1185 L625,1185 L780,1520 L300,1520 Z" fill="url(#spill)" filter="url(#b8)"/>`;
  s+=`<rect x="380" y="1290" width="320" height="420" fill="#ff4fb5" opacity=".18" filter="url(#b16)"/>`;
  for(let i=0;i<4;i++)s+=`<ellipse cx="${200+i*230}" cy="${1420+rnd(i)*160}" rx="${90+rnd(i+4)*60}" ry="16" fill="#ff8fd0" opacity=".12" filter="url(#b3)"/>`;
  // ограждение и очередь
  s+=`<path d="M300,1180 Q360,1205 420,1180" stroke="#c4203f" stroke-width="10" fill="none"/><rect x="292" y="1110" width="14" height="75" fill="#d9b25a"/><rect x="414" y="1110" width="14" height="75" fill="#d9b25a"/>`;
  let q='';
  for(let i=0;i<5;i++){const x=180+i*48, y=1186, sc=.7+rnd(i+60)*.1, bob=Math.sin(t*2+i)*2;
    q+=`<path d="M${x-50*sc},${y} L${x-46*sc},${y-160*sc+bob} Q${x},${y-205*sc+bob} ${x+46*sc},${y-160*sc+bob} L${x+50*sc},${y} Z" fill="#2a1847"/>`+
       `<circle cx="${x}" cy="${y-226*sc+bob}" r="${36*sc}" fill="#2a1847"/><path d="M${x+20*sc},${y-250*sc+bob} A${36*sc},${36*sc} 0 0 1 ${x+36*sc},${y-220*sc+bob}" stroke="#ff7ac8" stroke-width="5" fill="none"/>`;}
  s+=q;
  // фонарь
  s+=`<rect x="972" y="760" width="16" height="780" fill="#0c0816"/><path d="M980,770 Q980,730 930,730" stroke="#0c0816" stroke-width="14" fill="none"/>`+
     `<rect x="900" y="722" width="56" height="20" rx="6" fill="#1a1228"/><circle cx="928" cy="748" r="14" fill="#fff4d8" filter="url(#glow)"/>`+
     `<path d="M908,750 L948,750 L1060,1520 L800,1520 Z" fill="#ffd38a" opacity=".1" filter="url(#b8)"/><ellipse cx="930" cy="760" rx="160" ry="160" fill="url(#lamp)"/>`;
  // дождь
  let rn='';
  for(let i=0;i<110;i++){const x=(rnd(i+500)*1400-160+t*-260)%1400, y=(rnd(i+600)*2000+t*1500)%2000-80, L=36+rnd(i+700)*30;
    rn+=`<path d="M${(x+1400)%1400-160},${y} l${-L*.22},${L}" stroke="#c8d2ff" stroke-width="${1.5+rnd(i+800)*1.5}" opacity="${.18+rnd(i+900)*.25}"/>`;}
  s+=rn;
  // Дима на улице
  s+=guy({...DIMA,rim:1,x:790,y:1500,s:1.0,look:-1,mood:'s',br:breath(t,0),blink:blinkAt(t,.4)});
  return s;
}

// ---------- кадры ----------
function shotA(t,lt,k,d){
  const push=mix(1.0,1.16,sm(k)), end=easeIn(cl((lt-(d-.4))/.4)), s=push*(1+end*2.6);
  return `<g transform="${camT(mix(560,540,end),mix(1000,1000,end),540,960,s)}">${street(t)}</g>`;
}
function shotB(t,lt,k,d){
  const cut=1.55;
  FX.blur=14*(1-cl(Math.abs(lt-cut)/.09));
  if(lt<cut){const kk=lt/cut;
    return `<g transform="${camT(650,820,540,800,mix(1.48,1.56,kk))}">${club(t,{reach:sm(kk*1.6),look:kk>.3?1:0,mood:kk>.45?'w':'n',fmood:'s',br:breath(t,1),br2:breath(t,2),blink:blinkAt(t,.9)})}</g>`;}
  const kk=(lt-cut)/(d-cut);
  let s=`<g filter="url(#dof)"><g transform="${camT(600,760,540,760,1.7)}">${club(t,{noDima:true,noFriend:true})}</g></g><rect width="1080" height="1920" fill="#0a0414" opacity=".35"/>`;
  s+=`<g transform="translate(640,900) scale(${mix(1.7,1.85,kk)}) translate(-620,-880)">${bigHand(t,kk)}</g>`;
  s+=bubble(600,360,ease(cl(kk*3))*1.05,'ДА ОДИН РАЗ!');
  return s;
}
function shotC(t,lt,k,d){
  const bounce=-Math.abs(Math.sin(t*Math.PI*2.1))*22;
  let s=`<g transform="${camT(mix(400,560,sm(k)),840,540,820,1.32)}">${club(t*1.4,{arms:'up',wave:Math.sin(t*9),mood:'s',fmood:'s',dy:bounce,br2:breath(t,2),blink:blinkAt(t,1.7),pup:14})}</g>`;
  for(let i=0;i<14;i++){const a=t*1.5+i*.45, r=230+40*Math.sin(t*3+i);
    s+=`<path d="M0,-14 L4,-4 L14,0 L4,4 L0,14 L-4,4 L-14,0 L-4,-4Z" transform="translate(${400+Math.cos(a)*r},${560+Math.sin(a)*r*.6}) scale(${.8+.6*Math.abs(Math.sin(t*4+i))})" fill="${i%2?'#ffe27a':'#ff9ad8'}" opacity=".85"/>`;}
  return s;
}
function shotD(t,lt,k,d){
  const b=BEATS[3], bpm=mix(112,131,sm(k)), ph=(t*bpm/60)%1, thump=Math.exp(-ph*9);
  const punch=.16*ease(cl((k-wordK(b,1))/.07));
  let s=`<g filter="url(#dof)" opacity=".7"><g transform="${camT(560,780,540,760,1.25)}">${club(t,{noDima:true})}</g></g><rect width="1080" height="1920" fill="#14040c" opacity=".35"/>`;
  const sc=2.65*(1+thump*.02)*(1+punch);
  s+=guy({...DIMA,x:540,y:700+545*sc,s:sc,look:0,pup:mix(13,21,sm(k*1.2)),mood:k>.3?'t':'w',sweat:cl((k-.15)*2.2),blink:false});
  let path='M0,70'; for(let x=0;x<=560;x+=4){const u=(x/560*2.4+t*1.8*bpm/80)%1;const y=u>.42&&u<.46?70-110*Math.sin((u-.42)/.04*Math.PI):u>.46&&u<.5?70+40*Math.sin((u-.46)/.04*Math.PI):70+Math.sin(x*.08)*1.5;path+=` L${x},${y}`;}
  s+=`<g transform="translate(260,1080)"><rect x="-24" y="-20" width="608" height="180" rx="18" fill="#070a10" opacity=".86" stroke="#ff3b4e" stroke-opacity=".5" stroke-width="2"/>`+
     `<path d="${path}" stroke="#ff3b4e" stroke-width="10" fill="none" opacity=".45" filter="url(#b8)"/><path d="${path}" stroke="#ff8a96" stroke-width="4" fill="none"/></g>`;
  s+=`<rect width="1080" height="1920" fill="url(#redv)" opacity="${.25+.6*thump*k}"/>`;
  return s;
}
function shotE(t,lt,k,d){
  const end=easeIn(cl((lt-(d-.42))/.42)), z=mix(1.42,1.5,k)*(1+end*5);
  let s=`<g transform="${camT(mix(560,690,end),mix(840,820,end),540,mix(800,960,end),z)}">${club(t*.6,{dx:390,mood:'w',pup:17,sweat:.7,reach:sm(cl((k-.35)*2.5)),fmood:'s',br:breath(t,3),br2:breath(t,4),blink:blinkAt(t,2.2),look:k>.5?1:0,glass:1})}</g>`;
  s+=tag(330,330,'ТЯНЕТ ПОВТОРИТЬ','#ffd23f','#14111a',ease(cl((k-.15)*4)),-4);
  return s;
}
function shotF(t,lt,k,d){
  const zin=ease(cl(lt/.5)), sc=mix(2.2,1,zin);
  let s=`<defs><radialGradient id="lv" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#d0545c"/><stop offset=".55" stop-color="#9a2532"/><stop offset="1" stop-color="#4e0c18"/></radialGradient>`+
    `<radialGradient id="lbg" cx=".5" cy=".38" r=".7"><stop offset="0" stop-color="#3a1418"/><stop offset="1" stop-color="#0a0406"/></radialGradient></defs>`;
  s+=`<rect width="1080" height="1920" fill="url(#lbg)"/>`;
  s+=`<g transform="translate(540,620) scale(${sc})">`;
  const hot=ease(cl((k-.5)*3)), pul=1+.025*Math.sin(t*9)*hot;
  const lp='M-260,-40 C-262,-150 -120,-182 30,-172 C170,-162 278,-120 262,-36 C250,46 120,66 26,118 C-60,160 -210,128 -250,40 Z';
  s+=`<g transform="scale(${1.25*pul})"><path d="${lp}" fill="#ff2e45" opacity="${.25+.35*hot}" filter="url(#b30)"/><path d="${lp}" fill="url(#lv)"/>`+
     `<path d="M-180,-120 C-120,-150 -40,-155 40,-150" stroke="#fff" stroke-width="12" opacity=".3" fill="none" stroke-linecap="round"/>`+
     `<path d="M-40,-160 C-30,-60 0,20 26,110" stroke="#5e0f1c" stroke-width="6" opacity=".5" fill="none"/></g>`;
  // кокаин + алкоголь → кокаэтилен
  const fly=ease(cl((k-.1)/.4)), merged=k>.5;
  if(!merged){
    const lx=mix(-560,-90,fly), rx=mix(560,90,fly), y=mix(-340,-30,fly)+Math.sin(fly*Math.PI)*-120;
    s+=`<g transform="translate(${lx},${y})"><path d="M0,-62 L54,-31 L54,31 L0,62 L-54,31 L-54,-31Z" fill="#f4f7ff" stroke="#c9d6ff" stroke-width="6" filter="url(#glow)"/>`+
       `<text y="112" text-anchor="middle" font-family="M" font-weight="900" font-size="40" fill="#fff">КОКАИН</text></g>`;
    s+=`<g transform="translate(${rx},${y})"><path d="M0,-70 C34,-24 52,4 52,30 A52,52 0 0 1 -52,30 C-52,4 -34,-24 0,-70Z" fill="#f2a03a" stroke="#ffd59a" stroke-width="6" filter="url(#glow)"/>`+
       `<text y="122" text-anchor="middle" font-family="M" font-weight="900" font-size="40" fill="#ffd59a">АЛКОГОЛЬ</text></g>`;
  } else {
    const p=ease(cl((k-.5)/.18)), fl=1-cl((k-.5)/.12);
    s+=`<circle cx="0" cy="-30" r="${200*(1-fl)+20}" fill="#fff" opacity="${fl*.9}" filter="url(#b16)"/>`;
    s+=`<g transform="translate(0,-30) scale(${.5+.5*p})"><rect x="-300" y="-70" width="600" height="140" rx="70" fill="#ff2e45" opacity=".6" filter="url(#b16)"/>`+
       `<rect x="-300" y="-70" width="600" height="140" rx="70" fill="#ff2e45"/><text y="24" text-anchor="middle" font-family="M" font-weight="900" font-size="66" fill="#fff">КОКАЭТИЛЕН</text></g>`;
  }
  s+=`<text x="0" y="250" text-anchor="middle" font-family="J" font-weight="700" font-size="34" fill="#ffb3bb" letter-spacing="8" opacity=".75">ПЕЧЕНЬ</text>`;
  s+=`</g>`;
  s+=`<text x="540" y="1000" text-anchor="middle" font-family="J" font-weight="700" font-size="32" fill="#ffb3bb" letter-spacing="5" opacity="${merged?ease(cl((k-.6)*4)):0}">ТОКСИЧНЕЕ ДЛЯ СЕРДЦА</text>`;
  return s;
}
function heart(t,bpm,irr,sc0){
  const ph=(t*bpm/60+irr*Math.sin(t*2.7))%1, thump=Math.exp(-ph*8), sc=sc0*(1+thump*.06);
  const hp='M0,90 C-40,30 -150,20 -150,-60 C-150,-130 -90,-170 -40,-160 C-15,-155 0,-135 0,-115 C0,-135 15,-155 40,-160 C90,-170 150,-130 150,-60 C150,20 40,30 0,90 Z';
  return {thump,svg:`<g transform="translate(540,520) scale(${sc})"><path d="${hp}" fill="#ff1f3d" opacity=".55" filter="url(#b16)"/><path d="${hp}" fill="url(#heart)"/>`+
    `<path d="M-60,-120 C-90,-110 -112,-80 -110,-50" stroke="#fff" stroke-width="12" stroke-linecap="round" fill="none" opacity=".45"/></g>`};
}
function shotG(t,lt,k,d){
  const h=heart(t,mix(128,150,k),.35,1.7);
  let s=`<rect width="1080" height="1920" fill="url(#hb)"/>`;
  for(let i=0;i<4;i++){const r=((t*1.3+i/4)%1);s+=`<circle cx="540" cy="520" r="${220+r*520}" fill="none" stroke="#ff2e45" stroke-width="3" opacity="${(1-r)*.35}"/>`;}
