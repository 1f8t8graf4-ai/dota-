<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="lib.css">
<!-- Стиль 1 · нуар: силуэты с цветным контуром, неон, туман, дождь. Лица не рисуются. -->
<style>
.pill,.pulse{background:rgba(4,4,10,.6);border-color:rgba(255,95,192,.35)}
.cap i.on.y{color:#ff6fc4}
</style></head><body>
<svg id="sv" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<div class="pill"><b></b><span id="clock"></span></div>
<div class="pulse" id="pulse">ПУЛЬС<div id="bpm">72</div></div>
<div class="cap" id="cap"></div>
<div class="style">СТИЛЬ 1 · НУАР</div>
<script src="lib.js"></script>
<script>
const SIL='#05040a';
const D=`<linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07071a"/><stop offset=".55" stop-color="#2a0f3e"/><stop offset=".85" stop-color="#7a1f6a"/><stop offset="1" stop-color="#c2387e"/></linearGradient>
 <linearGradient id="nwet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0c30"/><stop offset="1" stop-color="#030208"/></linearGradient>
 <linearGradient id="beamP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3fa8" stop-opacity=".8"/><stop offset="1" stop-color="#ff3fa8" stop-opacity="0"/></linearGradient>
 <linearGradient id="beamC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fe0ff" stop-opacity=".75"/><stop offset="1" stop-color="#3fe0ff" stop-opacity="0"/></linearGradient>
 <radialGradient id="xr" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff2a4a" stop-opacity=".9"/><stop offset="1" stop-color="#ff2a4a" stop-opacity="0"/></radialGradient>
 ${rimF('rimN','#ff4fb5','#45e3ff',7)}${rimF('rimR','#ff2a4a','#ff8a5a',8)}`;

function skyline(t){
  let s=`<rect width="1080" height="1300" fill="url(#nsky)"/>`;
  s+=`<ellipse cx="540" cy="1150" rx="700" ry="260" fill="#ff4fb5" opacity=".25" filter="url(#b30)"/>`;
  for(let L=0;L<2;L++)for(let i=0;i<10;i++){const w=90+rnd(i+L*20)*90, x=i*120-60+L*50, h=(L?260:420)+rnd(i*3+L)*380, y=1190-h;
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${L?'#0a0712':'#150c22'}"/>`;
    if(!L&&rnd(i+7)>.5)s+=`<rect x="${x+w/2-2}" y="${y-60}" width="4" height="60" fill="#150c22"/><circle cx="${x+w/2}" cy="${y-62}" r="5" fill="#ff3b4e" opacity="${(Math.floor(t*1.5+i)%2)?1:.2}"/>`;}
  return s;
}
function fog(t,y,op){let s='';for(let i=0;i<4;i++)s+=`<ellipse cx="${(i*380+t*40*(i%2?1:-1))%1500-200}" cy="${y+i*40}" rx="520" ry="90" fill="#ffd6ef" opacity="${op}" filter="url(#b30)"/>`;return s}

function shot1(t,lt,k,d){
  const cam=camT(540,1050,540,1000,mix(1.0,1.12,sm(k)));
  let s=`<g transform="${cam}">`+skyline(t);
  // клуб и неон
  s+=`<rect x="250" y="620" width="580" height="580" fill="${SIL}"/>`;
  const fl=(t%2.4>1.7&&t%2.4<1.76)?.25:1;
  s+=`<g opacity="${fl}"><text x="540" y="780" text-anchor="middle" font-family="M" font-weight="800" font-style="italic" font-size="150" fill="none" stroke="#ff3fa8" stroke-width="20" opacity=".6" filter="url(#b16)">NIGHT</text>`+
     `<text x="540" y="780" text-anchor="middle" font-family="M" font-weight="800" font-style="italic" font-size="150" fill="none" stroke="#ffd0ea" stroke-width="5">NIGHT</text></g>`;
  s+=`<rect x="480" y="930" width="120" height="270" fill="#ff7ac8"/><rect x="440" y="900" width="200" height="320" fill="#ff4fb5" opacity=".35" filter="url(#b16)"/>`;
  // мокрый асфальт с отражениями
  s+=`<rect x="0" y="1196" width="1080" height="730" fill="url(#nwet)"/>`;
  s+=`<g transform="translate(0,2396) scale(1,-1)" opacity=".35" filter="url(#b8)"><rect x="480" y="930" width="120" height="270" fill="#ff7ac8"/><text x="540" y="780" text-anchor="middle" font-family="M" font-weight="800" font-style="italic" font-size="150" fill="none" stroke="#ff3fa8" stroke-width="10">NIGHT</text></g>`;
  s+=fog(t,1180,.12);
  // Дима силуэтом на переднем плане, отражение
  const P={...DIMA,x:200,y:1500,s:1.02,sil:SIL,rim:'rimN',br:breath(t,0),noShadow:1};
  s+=`<g transform="translate(0,3000) scale(1,-1)" opacity=".25" filter="url(#b3)">${person({...P,id:'dr',rim:null})}</g>`;
  s+=person(P);
  s+=`</g>`+rain(t,120,'#ffd6ef',.28);
  return s;
}
function club(t,dark){
  let s=`<rect width="1080" height="1920" fill="#0a0612"/>`;
  const B=[[200,'beamP',.9,0],[540,'beamC',1.2,2],[880,'beamP',1.05,4]];
  for(const [x,g,sp,ph] of B){const a=Math.sin(t*sp+ph)*18;
    s+=`<g transform="rotate(${a} ${x} 80)"><path d="M${x-22},80 L${x+22},80 L${x+340},1300 L${x-340},1300 Z" fill="url(#${g})" opacity="${dark?.35:.6}" filter="url(#b8)" style="mix-blend-mode:screen"/></g>`;
    s+=`<circle cx="${x}" cy="80" r="16" fill="#fff" filter="url(#glow)"/>`;}
  s+=fog(t,700,.08)+fog(t,1050,.1);
  // толпа силуэтами
  let cr='';
  for(let row=0;row<2;row++)for(let i=0;i<11;i++){const sc=row?1:.8, x=-20+i*104+(row?50:0)+rnd(i+row*9)*20, by=row?1240:1170;
    const y=by-Math.abs(Math.sin(t*Math.PI*2.05+i*1.7+row))*12*sc, up=rnd(i*3+row)>.6;
    if(up){const w=Math.sin(t*6+i)*8;cr+=`<path d="M${x-30*sc},${y-170*sc} L${x-52*sc+w},${y-300*sc} M${x+30*sc},${y-170*sc} L${x+56*sc-w},${y-296*sc}" stroke="${SIL}" stroke-width="${24*sc}" stroke-linecap="round"/>`;}
    cr+=`<path d="M${x-64*sc},${y+40} L${x-58*sc},${y-150*sc} Q${x},${y-198*sc} ${x+58*sc},${y-150*sc} L${x+64*sc},${y+40} Z" fill="${SIL}"/><circle cx="${x}" cy="${y-220*sc}" r="${40*sc}" fill="${SIL}"/>`;}
  return s+cr;
}
function shot2(t,lt,k,d){
  const cam=camT(560,900,540,880,mix(1.25,1.32,k));
  let s=`<g transform="${cam}">`+club(t,true);
  const r=sm(cl(k*2));
  s+=person({...DRUG,x:780,y:1420,s:1.15,sil:SIL,rim:'rimN',pose:'reach',k:r,bag:0,br:breath(t,2),noShadow:1});
  s+=person({...DIMA,x:330,y:1430,s:1.18,sil:SIL,rim:'rimN',br:breath(t,1),noShadow:1});
  // светится только пакетик
  if(r>.6){const bx=780-226*1.15-20, by=1420-520*1.15-22;
    s+=`<circle cx="${bx}" cy="${by}" r="90" fill="#fff" opacity=".25" filter="url(#b16)"/>`+bagS(bx,by,-10,.75*1.15)+`<circle cx="${bx+44}" cy="${by+8}" r="18" fill="${SIL}"/>`;}
  s+=`</g>`;
  if(k>.35){const p=ease(cl((k-.35)*4));s+=`<g opacity="${p}" transform="translate(730,${330+(1-p)*20})"><rect x="-220" y="-56" width="440" height="100" rx="14" fill="none" stroke="#fff" stroke-width="3"/><path d="M60,44 L90,96 L100,44" fill="none" stroke="#fff" stroke-width="3"/>`+
    `<text y="12" text-anchor="middle" font-family="J" font-weight="700" font-size="44" fill="#fff" letter-spacing="2">«ДА ОДИН РАЗ»</text></g>`;}
  return s;
}
// профиль головы и плеч, смотрит вправо
const PROF='M-70,150 C-82,96 -104,40 -104,-24 C-104,-118 -46,-168 18,-160 C80,-152 108,-104 104,-50 L110,-22 C116,-10 115,0 108,6 L124,40 C128,48 124,54 112,55 L110,64 C118,68 116,76 107,78 L108,86 C114,94 108,103 96,106 C80,116 58,116 38,108 L34,150 L40,176 C150,196 262,240 300,360 L-320,360 C-280,230 -170,184 -70,160 Z';
function shot3(t,lt,k,d){
  const bpm=mix(110,131,sm(k)), ph=(t*bpm/60)%1, th=Math.exp(-ph*9);
  const punch=.12*ease(cl((k-wordK(SCRIPT[2],1))/.08));
  let s=`<rect width="1080" height="1920" fill="#08030a"/><g opacity=".5" filter="url(#dof)">${club(t,true)}</g><rect width="1080" height="1920" fill="#3a0612" opacity=".4"/>`;
  s+=fog(t,900,.08);
  const sc=2.35*(1+punch)*(1+th*.012);
  s+=`<g transform="translate(470,540) scale(${sc})"><g filter="url(#rimR)"><path d="${PROF}" fill="${SIL}"/></g>`;
  // сердце просвечивает
  s+=`<g transform="translate(-40,262) scale(${.42*(1+th*.12)})"><circle r="240" fill="url(#xr)" opacity="${.4+.5*th}"/><path d="${HEART}" fill="#ff2a4a" opacity="${.55+.45*th}" filter="url(#glow)"/></g>`;
  s+=`<path d="M-20,250 C-10,200 10,160 30,120" stroke="#ff2a4a" stroke-width="4" fill="none" opacity="${.3+.5*th}" filter="url(#glow)"/></g>`;
  let path='M0,0'; for(let x=0;x<=900;x+=5){const u=(x/900*2.6+t*1.9*bpm/80)%1;const y=u>.42&&u<.46?-110*Math.sin((u-.42)/.04*Math.PI):u>.46&&u<.5?40*Math.sin((u-.46)/.04*Math.PI):Math.sin(x*.07)*2;path+=` L${x},${y}`;}
  s+=`<g transform="translate(90,1250) scale(1,.6)"><path d="${path}" stroke="#ff2a4a" stroke-width="12" fill="none" opacity=".5" filter="url(#b8)"/><path d="${path}" stroke="#ffc0c8" stroke-width="4" fill="none"/></g>`;
  s+=`<rect width="1080" height="1920" fill="url(#redv)" opacity="${.2+.55*th}"/>`;
  return s;
}
function shot4(t,lt,k,d){
  let s=`<rect width="1080" height="1920" fill="#040208"/>`+fog(t,700,.06)+fog(t,1000,.06);
  // неон загорается с миганием
  const on=lt<.15?0:lt<.25?1:lt<.32?0:lt<.5?1:lt<.55?.3:1, fl=(t%3.1>2.5&&t%3.1<2.55)?.4:1, a=on*fl;
  s+=`<g opacity="${a}"><g transform="translate(540,470) scale(1.2)"><path d="${HEART}" fill="none" stroke="#ff2a4a" stroke-width="22" opacity=".55" filter="url(#b16)"/><path d="${HEART}" fill="none" stroke="#ffc6cc" stroke-width="7"/></g>`+
     `<text x="540" y="960" text-anchor="middle" font-family="M" font-weight="800" font-style="italic" font-size="290" fill="none" stroke="#ff2a4a" stroke-width="26" opacity=".6" filter="url(#b16)">×24</text>`+
     `<text x="540" y="960" text-anchor="middle" font-family="M" font-weight="800" font-style="italic" font-size="290" fill="none" stroke="#ffd0d6" stroke-width="7">×24</text></g>`;
  s+=`<ellipse cx="540" cy="860" rx="520" ry="200" fill="#ff2a4a" opacity="${.12*a}" filter="url(#b30)"/>`;
  s+=`<text x="540" y="1040" text-anchor="middle" font-family="J" font-weight="700" font-size="32" fill="#ffb3bb" letter-spacing="6" opacity="${a*.9}">РИСК ИНФАРКТА · 1-Й ЧАС</text>`+
     `<text x="540" y="1170" text-anchor="middle" font-family="J" font-weight="500" font-size="22" fill="#fff" opacity=".4">Mittleman et al., Circulation, 1999</text>`;
  return s;
}
run(beats([shot1,shot2,shot3,shot4]),{defs:D,top:()=>`<rect width="1080" height="1920" fill="url(#vig)"/><rect y="1150" width="1080" height="770" fill="url(#low)"/>`});
</script></body></html>
