<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Духless · опенинг (тест графики)</title>
<style>
@font-face{font-family:'Manrope';src:url('../../fonts/manrope-latin-600-normal.woff2') format('woff2');font-weight:600}
@font-face{font-family:'Manrope';src:url('../../fonts/manrope-latin-800-normal.woff2') format('woff2');font-weight:800}
@font-face{font-family:'Oswald';src:url('../../fonts/oswald-latin-700-normal.woff2') format('woff2');font-weight:700}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
/* Тест графики «Духless»: 5 кадров за 3 с. window.R(t) рисует кадр t (с размытием движения,
   зерном, виньеткой, свечением). window.RC(t) — то же после двух фото каруселью (свайп в 1,951 с). */
(function(){
const W=1080,H=1920,TAU=Math.PI*2,DEG=Math.PI/180;
const cv=document.getElementById('c'),X=cv.getContext('2d');
function mk(w,h){const c=document.createElement('canvas');c.width=w||W;c.height=h||H;return c;}
const L=mk(),LX=L.getContext('2d'),A=mk(),AX=A.getContext('2d'),M=mk(),MX=M.getContext('2d');
const T1=mk(),T1X=T1.getContext('2d'),T2=mk(),T2X=T2.getContext('2d');
const BL=mk(270,480),BLX=BL.getContext('2d'),T3=mk(),T3X=T3.getContext('2d');
const clamp=(v,a,b)=>Math.max(a===undefined?0:a,Math.min(b===undefined?1:b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=t=>{t=clamp(t);return t*t*(3-2*t);};
const eOutBack=(t,s)=>{t=clamp(t);if(s===undefined)s=1.70158;const c=s+1;return 1+c*Math.pow(t-1,3)+s*Math.pow(t-1,2);};
const eInExpo=t=>{t=clamp(t);return t<=0?0:Math.pow(2,10*t-10);};
const eOutExpo=t=>{t=clamp(t);return t>=1?1:1-Math.pow(2,-10*t);};
const eOutCubic=t=>1-Math.pow(1-clamp(t),3);
const eInCubic=t=>{t=clamp(t);return t*t*t;};
const eInQuad=t=>{t=clamp(t);return t*t;};
const eOutQuad=t=>{t=clamp(t);return 1-(1-t)*(1-t);};
const eInOutSine=t=>-(Math.cos(Math.PI*clamp(t))-1)/2;
const eInOutCubic=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
function rng(seed){let s=((seed*2654435761)>>>0)||1;return function(){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function sn(t,k){return Math.sin(t*5.3+k*1.91)*0.5+Math.sin(t*11.7+k*4.37)*0.3+Math.sin(t*23.9+k*2.63)*0.2;}
function shake(t,a){if(a===undefined)a=1.8;return {x:a*sn(t,1),y:a*0.9*sn(t+3.1,2),r:0.0021*sn(t+7.7,3)};}
function cam(c,o){c.translate(W/2+(o.dx||0),H/2+(o.dy||0));if(o.r)c.rotate(o.r);c.scale(o.s,o.s);c.translate(-o.cx,-o.cy);}
function lg(c,x0,y0,x1,y1,st){const g=c.createLinearGradient(x0,y0,x1,y1);for(const s of st)g.addColorStop(s[0],s[1]);return g;}
function rg(c,x0,y0,r0,x1,y1,r1,st){const g=c.createRadialGradient(x0,y0,r0,x1,y1,r1);for(const s of st)g.addColorStop(s[0],s[1]);return g;}
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function cap(c,x,y,w,h){rr(c,x,y,w,h,Math.min(w,h)/2);}
function ell(c,x,y,rx,ry,a){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),a||0,0,TAU);}
function poly(c,p){c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)c.lineTo(p[i][0],p[i][1]);c.closePath();}
function spoly(c,p){const n=p.length,m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];const s=m(p[n-1],p[0]);c.beginPath();c.moveTo(s[0],s[1]);for(let i=0;i<n;i++){const e=m(p[i],p[(i+1)%n]);c.quadraticCurveTo(p[i][0],p[i][1],e[0],e[1]);}c.closePath();}
function quad(c,p,f){poly(c,p);c.fillStyle=f;c.fill();}
function bbox(p){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const q of p){a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[0]);d=Math.max(d,q[1]);}return [a,b,c,d];}
function limb(pts,ws){const Lp=[],Rp=[];for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[Math.min(i+1,pts.length-1)],o=pts[Math.max(i-1,0)];let dx=q[0]-o[0],dy=q[1]-o[1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;const w=ws[i];Lp.push([p[0]-dy*w,p[1]+dx*w]);Rp.push([p[0]+dy*w,p[1]-dx*w]);}return Lp.concat(Rp.reverse());}
function rimFill(c,p,base,rim,rw,sm){const b=bbox(p);c.fillStyle=lg(c,b[0],0,b[2],0,[[0,rim],[rw,base],[1-rw,base],[1,rim]]);sm?spoly(c,p):poly(c,p);c.fill();}
function reset(c){c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';c.filter='none';}
function noise(w,h,seed,lo,hi){const c=mk(w,h),x=c.getContext('2d'),d=x.createImageData(w,h),r=rng(seed);for(let i=0;i<w*h;i++){const v=lo+(hi-lo)*r();d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=v;d.data[i*4+3]=255;}x.putImageData(d,0,0);return c;}
const GRAIN=[0,1,2,3,4,5].map(i=>noise(540,960,11+i,0,255));
const FINE=noise(540,960,77,70,185);
// размытие копии холста: весь кадр (k=null) или дальний план по маске
function rimify(src,w,top,bot){ // контровой свет: тонкое кольцо по краю силуэта слоя
  const sx=src.getContext('2d'),d=Math.max(1,Math.round(w));
  reset(T1X);T1X.clearRect(0,0,W,H);T1X.drawImage(src,0,0);T1X.globalCompositeOperation='destination-in';
  for(let i=0;i<8;i++){const a=i*Math.PI/4;T1X.drawImage(src,Math.round(Math.cos(a)*d),Math.round(Math.sin(a)*d));}reset(T1X);
  reset(T3X);T3X.clearRect(0,0,W,H);T3X.drawImage(src,0,0);T3X.globalCompositeOperation='source-in';T3X.fillStyle=lg(T3X,0,0,0,H,[[0,top],[1,bot]]);T3X.fillRect(0,0,W,H);
  T3X.globalCompositeOperation='destination-out';T3X.drawImage(T1,0,0);reset(T3X);T3X.clearRect(0,0,W,d+1);T3X.clearRect(0,H-d-1,W,d+1);T3X.clearRect(0,0,d+1,H);T3X.clearRect(W-d-1,0,d+1,H);
  sx.save();reset(sx);sx.globalCompositeOperation='source-atop';sx.drawImage(T3,0,0);sx.restore();
}
function blurPass(c,px,mask){reset(T1X);T1X.clearRect(0,0,W,H);T1X.filter=`blur(${px}px)`;T1X.drawImage(c.canvas,0,0);T1X.filter='none';
  if(mask){T1X.globalCompositeOperation='destination-in';T1X.fillStyle=mask(T1X);T1X.fillRect(0,0,W,H);T1X.globalCompositeOperation='source-over';}
  c.save();reset(c);if(!mask)c.clearRect(0,0,W,H);c.drawImage(T1,0,0);c.restore();}

/* ================= КАДР 1 · защёлка кабинки ================= */
const S1={px:540,py:1000,rx:255,ry:385};
const BRUSH=(function(){const c=mk(520,780),x=c.getContext('2d'),r=rng(5);for(let i=0;i<1500;i++){const y=r()*780,x0=r()*560-40,l=40+r()*380,a=0.02+r()*0.08;x.strokeStyle=r()<0.55?`rgba(255,255,255,${a})`:`rgba(0,0,0,${a*0.9})`;x.lineWidth=r()<0.8?1:1.8;x.beginPath();x.moveTo(x0,y);x.lineTo(x0+l,y+(r()-.5)*1.2);x.stroke();}return c;})();
const SCR=(function(){const r=rng(9),a=[];for(let i=0;i<26;i++)a.push([r()*1500-200,r()*2300-200,r()*60+10,(r()-.5)*0.8,0.04+r()*0.07]);return a;})();
function s1Door(c){
  c.fillStyle='#8C948E';c.fillRect(-300,-300,W+600,H+600);
  c.fillStyle=lg(c,0,0,W,H,[[0,'rgba(255,255,255,0.17)'],[0.45,'rgba(255,255,255,0.03)'],[1,'rgba(0,0,0,0.34)']]);c.fillRect(-300,-300,W+600,H+600);
  c.save();c.globalAlpha=0.18;c.globalCompositeOperation='overlay';c.drawImage(FINE,-300,-300,W+600,H+600);c.restore();
  c.fillStyle=rg(c,400,720,0,520,960,900,[[0,'rgba(255,255,255,0.12)'],[1,'rgba(255,255,255,0)']]);c.fillRect(-300,-300,W+600,H+600);
  c.save();c.lineCap='round';for(const s of SCR){c.strokeStyle=`rgba(255,255,255,${s[4]})`;c.lineWidth=1.2;c.beginPath();c.moveTo(s[0],s[1]);c.lineTo(s[0]+Math.cos(s[3])*s[2],s[1]+Math.sin(s[3])*s[2]);c.stroke();}c.restore();
  c.save();c.filter='blur(7px)';
  c.fillStyle=lg(c,-300,0,150,0,[[0,'#545B56'],[1,'#69716B']]);c.fillRect(-300,-300,450,H+600);
  c.fillStyle='#141816';c.fillRect(150,-300,16,H+600);c.fillStyle='rgba(255,255,255,0.25)';c.fillRect(166,-300,5,H+600);
  c.restore();
}
function screw(c,x,y,r,a){
  c.save();c.filter='blur(2px)';c.fillStyle='rgba(0,0,0,0.5)';ell(c,x+3,y+4,r+2,r+2);c.fill();c.restore();
  c.save();c.fillStyle=rg(c,x-r*0.35,y-r*0.4,1,x,y,r,[[0,'#F6F9FA'],[0.45,'#AEB6BC'],[1,'#4B5359']]);ell(c,x,y,r,r);c.fill();
  c.strokeStyle='rgba(0,0,0,0.6)';c.lineWidth=1.5;c.stroke();
  c.translate(x,y);c.rotate(a);c.fillStyle='#1A1E21';c.fillRect(-r*0.72,-r*0.12,r*1.44,r*0.24);c.fillRect(-r*0.12,-r*0.72,r*0.24,r*1.44);
  c.fillStyle='rgba(255,255,255,0.5)';c.fillRect(-r*0.72,r*0.12,r*1.44,1.5);c.fillRect(r*0.12,-r*0.72,1.5,r*1.44);c.restore();
}
function s1Window(c,u,click){
  const wx=S1.px,wy=S1.py-205,ww=220,wh=100;
  c.save();
  rr(c,wx-ww/2-11,wy-wh/2-11,ww+22,wh+22,27);c.fillStyle=lg(c,0,wy-wh/2-11,0,wy+wh/2+11,[[0,'#14181B'],[0.5,'#3A4146'],[1,'#D4DBE0']]);c.fill();
  rr(c,wx-ww/2,wy-wh/2,ww,wh,18);c.save();c.clip();
  const kk=u<click?0:eOutBack(clamp((u-click-0.006)/0.07),2.4),off=kk*wh;
  c.fillStyle=lg(c,0,wy-wh/2-off,0,wy+wh/2-off,[[0,'#E6E6DE'],[0.5,'#FBFBF7'],[1,'#D2D2C8']]);c.fillRect(wx-ww/2,wy-wh/2-off,ww,wh);
  c.fillStyle=lg(c,0,wy+wh/2-off,0,wy+wh*1.5-off,[[0,'#CC1A1A'],[0.45,'#A81010'],[1,'#5A0303']]);c.fillRect(wx-ww/2,wy+wh/2-off,ww,wh);
  c.fillStyle='rgba(0,0,0,0.55)';c.fillRect(wx-ww/2,wy+wh/2-off-2,ww,4);
  c.fillStyle=lg(c,0,wy-wh/2,0,wy+wh/2,[[0,'rgba(0,0,0,0.6)'],[0.3,'rgba(0,0,0,0)'],[0.7,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,0.62)']]);c.fillRect(wx-ww/2,wy-wh/2,ww,wh);
  c.fillStyle=lg(c,0,wy-wh/2,0,wy-wh/2+28,[[0,'rgba(0,0,0,0.65)'],[1,'rgba(0,0,0,0)']]);c.fillRect(wx-ww/2,wy-wh/2,ww,28);
  c.globalCompositeOperation='screen';
  c.fillStyle=lg(c,wx-ww/2,wy-wh/2,wx+ww/2,wy+wh/2,[[0,'rgba(255,255,255,0.38)'],[0.33,'rgba(255,255,255,0.07)'],[0.5,'rgba(255,255,255,0)'],[1,'rgba(255,255,255,0.1)']]);c.fillRect(wx-ww/2,wy-wh/2,ww,wh);
  c.fillStyle='rgba(255,255,255,0.6)';ell(c,wx-ww*0.27,wy-wh*0.25,34,7,-0.16);c.fill();
  c.restore();
  rr(c,wx-ww/2,wy-wh/2,ww,wh,18);c.strokeStyle='rgba(0,0,0,0.85)';c.lineWidth=3;c.stroke();
  if(kk>0.15){c.globalCompositeOperation='screen';c.fillStyle=rg(c,wx,wy,10,wx,wy,210,[[0,`rgba(200,22,22,${0.24*clamp(kk)})`],[1,'rgba(200,22,22,0)']]);ell(c,wx,wy,220,130);c.fill();}
  c.restore();
}
function s1Boss(c){
  const bx=S1.px,by=S1.py+45,br=122;
  c.save();c.filter='blur(14px)';c.fillStyle='rgba(0,0,0,0.52)';ell(c,bx+14,by+20,br,br);c.fill();c.restore();
  c.fillStyle=rg(c,bx-45,by-55,8,bx,by,br,[[0,'#F7FAFB'],[0.3,'#C5CCD1'],[0.72,'#6C757B'],[1,'#2A3034']]);ell(c,bx,by,br,br);c.fill();
  c.save();ell(c,bx,by,br,br);c.clip();for(let i=0;i<28;i++){c.strokeStyle=i%2?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.07)';c.lineWidth=1.2;const q=br*(0.18+0.82*i/28);ell(c,bx,by,q,q);c.stroke();}c.restore();
  c.strokeStyle=lg(c,bx-br,by-br,bx+br,by+br,[[0,'rgba(255,255,255,0.85)'],[0.5,'rgba(255,255,255,0.05)'],[1,'rgba(0,0,0,0.75)']]);c.lineWidth=6;ell(c,bx,by,br-3,br-3);c.stroke();
  c.strokeStyle='rgba(0,0,0,0.8)';c.lineWidth=2;ell(c,bx,by,br,br);c.stroke();
}
function s1Handle(c,u,click){
  const bx=S1.px,by=S1.py+45,k=u<click?0:eOutBack(clamp((u-click)/0.11),1.9),a=k*Math.PI/2,hw=80,hl=350;
  c.save();c.translate(bx+16,by+24);c.rotate(a);c.filter='blur(10px)';c.fillStyle='rgba(0,0,0,0.5)';cap(c,-hw/2,-hl/2,hw,hl);c.fill();c.restore();
  c.save();c.translate(bx,by);c.rotate(a);
  c.fillStyle=lg(c,-hw/2,0,hw/2,0,[[0,'#5A636A'],[0.1,'#DDE4E8'],[0.3,'#FFFFFF'],[0.46,'#C4CBD0'],[0.72,'#757E85'],[1,'#22272B']]);cap(c,-hw/2,-hl/2,hw,hl);c.fill();
  c.fillStyle=lg(c,0,-hl/2,0,hl/2,[[0,'rgba(0,0,0,0.28)'],[0.12,'rgba(0,0,0,0)'],[0.88,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,0.38)']]);cap(c,-hw/2,-hl/2,hw,hl);c.fill();
  c.save();cap(c,-hw/2,-hl/2,hw,hl);c.clip();c.globalAlpha=0.6;c.drawImage(BRUSH,-hw/2,-hl/2,hw,hl);c.restore();
  c.fillStyle=lg(c,-11,0,11,0,[[0,'#020304'],[0.6,'#0D1012'],[1,'#2A3034']]);cap(c,-11,-120,22,240);c.fill();
  c.fillStyle='rgba(255,255,255,0.6)';c.fillRect(9,-110,2.4,220);c.fillStyle='rgba(0,0,0,0.75)';c.fillRect(-13,-112,2,224);
  c.fillStyle='rgba(255,255,255,0.85)';c.fillRect(-hw*0.24,-hl*0.38,3,hl*0.76);
  c.strokeStyle='rgba(0,0,0,0.65)';c.lineWidth=2;cap(c,-hw/2,-hl/2,hw,hl);c.stroke();
  c.restore();
}
function s1Plate(c,u,click){
  const {px,py,rx,ry}=S1;
  c.save();c.filter='blur(28px)';c.fillStyle='rgba(0,0,0,0.55)';ell(c,px+26,py+38,rx,ry);c.fill();c.restore();
  c.save();c.filter='blur(5px)';c.fillStyle='rgba(0,0,0,0.5)';ell(c,px+5,py+8,rx,ry);c.fill();c.restore();
  c.fillStyle=lg(c,px-rx,py-ry,px+rx,py+ry,[[0,'#3E454A'],[0.16,'#8F989F'],[0.3,'#E8EEF2'],[0.42,'#C9D0D5'],[0.58,'#7E878E'],[0.78,'#454D52'],[1,'#23282C']]);ell(c,px,py,rx,ry);c.fill();
  c.save();ell(c,px,py,rx,ry);c.clip();c.drawImage(BRUSH,px-rx,py-ry,rx*2,ry*2);c.restore();
  c.strokeStyle=lg(c,px-rx,py-ry,px+rx,py+ry,[[0,'rgba(255,255,255,0.9)'],[0.5,'rgba(255,255,255,0.05)'],[1,'rgba(0,0,0,0.8)']]);c.lineWidth=13;ell(c,px,py,rx-7,ry-7);c.stroke();
  c.strokeStyle=lg(c,px-rx,py-ry,px+rx,py+ry,[[0,'rgba(0,0,0,0.5)'],[1,'rgba(255,255,255,0.4)']]);c.lineWidth=3;ell(c,px,py,rx-16,ry-16);c.stroke();
  c.strokeStyle='rgba(10,12,14,0.9)';c.lineWidth=2.5;ell(c,px,py,rx,ry);c.stroke();
  screw(c,px,py-ry+62,21,0.4);screw(c,px,py+ry-62,21,1.1);
  s1Window(c,u,click);s1Boss(c);s1Handle(c,u,click);
  // бегущий блик по стали
  c.save();ell(c,px,py,rx,ry);c.clip();c.globalCompositeOperation='screen';c.filter='blur(16px)';
  c.translate(px-430+820*(u/0.45),py);c.rotate(-0.42);c.fillStyle=lg(c,-95,0,95,0,[[0,'rgba(255,255,255,0)'],[0.5,'rgba(255,255,255,0.5)'],[1,'rgba(255,255,255,0)']]);c.fillRect(-95,-760,190,1520);c.restore();
}
function shot1(c,u){
  const click=0.16,k=u>=click?Math.exp(-(u-click)*34):0,sh=shake(u*1.3+0.2,1.7),z=1.32*(1+0.12*eInOutSine(u/0.45));
  c.save();cam(c,{cx:540,cy:985-40*(u/0.45),s:z*(1+0.02*k),r:sh.r+0.006*k*Math.sin((u-click)*80),dx:sh.x+8*k*Math.sin((u-click)*130),dy:sh.y+6*k*Math.cos((u-click)*105)});
  s1Door(c);s1Plate(c,u,click);c.restore();
}

/* ================= КАДР 2 · дорожка на чёрном стекле ================= */
const S2={f:1400,yh:-900,cx:540};
function P2(x,z){return [S2.cx+S2.f*x/z,S2.yh+S2.f/z];}
const LA={x:-0.10,z:0.72},LB={x:0.30,z:1.30},LWD=0.017;
const LDIR=(function(){const dx=LB.x-LA.x,dz=LB.z-LA.z,l=Math.hypot(dx,dz);return {ux:dx/l,uz:dz/l,len:l};})();
const GR=(function(){const r=rng(21),a=[],{ux,uz,len}=LDIR,nx=-uz,nz=ux;
  for(let i=0;i<4400;i++){const s=r();let off=(r()+r()+r()-1.5)/1.5*LWD*0.55;if(r()<0.05)off=(r()-0.5)*LWD*4.4;
    const al=clamp(s+(r()-0.5)*0.004)*len,x=LA.x+ux*al+nx*off,z=LA.z+uz*al+nz*off,big=r()<0.025;
    a.push({s:al/len,x,z,sz:big?0.0030+r()*0.0022:0.0006+r()*r()*0.0021,b:0.72+r()*0.28,air:r()<0.22,vx:r()-0.5,vy:0.4+r()*0.6,vr:r(),ph:r()*TAU});}
  a.sort((p,q)=>q.z-p.z);return a;})();
const DUST=(function(){const r=rng(31),a=[];for(let i=0;i<220;i++)a.push([r()*1300-110,r()*2100-90,0.6+r()*1.8,0.06+r()*0.3]);return a;})();
function s2tc(s){return s<=Math.pow(2,-10)?0.20:0.20+0.35*((Math.log2(s)+10)/10);}

  c.fillStyle=lg(c,-70,0,70,0,[[0,'#E7B89C'],[0.5,'#D39C7F'],[1,'#A9705A']]);spoly(c,[[-72,-40],[70,-44],[78,60],[40,110],[-40,112],[-80,60]]);c.fill();
  for(let i=0;i<4;i++){const fx=-52+i*34;c.fillStyle=lg(c,fx-16,0,fx+16,0,[[0,'#C78C70'],[0.5,'#E2AE92'],[1,'#B07560']]);cap(c,fx-15,70,30,90-Math.abs(i-1.5)*14);c.fill();}
  c.restore();
}
function shot5(c,u){
  const land=0.12,kick=u>land?Math.exp(-(u-land)*28):0,sh=shake(u*1.4+12.2,1.7),st=1-eOutExpo(u/0.12);
  const o={cx:540,cy:960,s:1.02*(1+0.025*kick),r:-6*DEG+sh.r+0.01*kick*Math.sin((u-land)*70),dx:sh.x+620*st+9*kick*Math.sin((u-land)*110),dy:sh.y+900*st+7*kick*Math.cos((u-land)*95)};
  c.save();cam(c,o);s5Desk(c,u);s5Throw(c,u);c.restore();
}

/* ================= сборка кадра ================= */
const SHOTS=[[0,0.45,shot1],[0.45,1.05,shot2],[1.05,1.90,shot3],[1.90,2.50,shot4],[2.50,3.0001,shot5]];
function shotAt(t){for(const s of SHOTS)if(t<s[1])return s;return SHOTS[4];}
function samp(t){ // сколько подкадров на кадр и выдержка (размытие движения)
  if(t>=0.16&&t<0.30)return [8,1/50];
  if(t>=0.51&&t<0.66)return [10,1/45];
  if(t>=0.66&&t<0.90)return [6,1/60];
  if(t>=0.90&&t<1.05)return [22,1/40];
  if(t>=1.05&&t<1.20)return [8,1/60];
  if(t>=1.45&&t<1.76)return [12,1/75];
  if(t>=1.76&&t<1.90)return [12,1/45];
  if(t>=2.40&&t<2.50)return [16,1/22];
  if(t>=2.50&&t<2.62)return [14,1/26];
  if(t>=2.62&&t<2.85)return [10,1/45];
  return [4,1/60];
}
let BLOOM=0.3,FI=0;
function post(dx,src){
  reset(dx);dx.drawImage(src,0,0);
  reset(BLX);BLX.clearRect(0,0,270,480);BLX.filter='brightness(0.6) contrast(3.4) blur(7px)';BLX.drawImage(src,0,0,270,480);BLX.filter='none';
  dx.globalCompositeOperation='lighter';dx.globalAlpha=BLOOM;dx.drawImage(BL,0,0,W,H);
  dx.globalCompositeOperation='source-over';dx.globalAlpha=1;dx.fillStyle=rg(dx,540,980,420,540,960,1260,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,0.58)']]);dx.fillRect(0,0,W,H);
  dx.globalAlpha=0.045;dx.drawImage(GRAIN[FI%6],0,0,W,H);reset(dx);
}
function montage(t){
  const s=shotAt(t),ns=samp(t),N=ns[0],shu=ns[1];
  reset(AX);AX.clearRect(0,0,W,H);
  for(let k=0;k<N;k++){let tk=N>1?t+(k/(N-1)-0.5)*shu:t;tk=clamp(tk,s[0],s[1]-1e-4);
    reset(LX);LX.clearRect(0,0,W,H);LX.save();s[2](LX,tk-s[0]);LX.restore();reset(LX);
    AX.globalAlpha=1/(k+1);AX.drawImage(L,0,0);}
  reset(AX);
  BLOOM=(t>=1.90&&t<2.50)?lerp(0.95,0.42,eOutExpo((t-1.90)/0.3)):0.3;FI=Math.round(t*30);
  MX.clearRect(0,0,W,H);post(MX,A);return M;
}
window.R=function(t){const m=montage(t);reset(X);X.clearRect(0,0,W,H);X.drawImage(m,0,0);};

/* ================= карусель: 2 фото → свайп → опенинг ================= */
const BEAT=60/123,T_SW1=29/30,T_SW2=59/30,SWD=0.26; // свайпы на 2-й и 4-й доле (123 BPM), ровно по кадрам: дальше кадры опенинга = кадры R(t)
const PH=[null,null],CAP=['Zara drip','Money drip'];
let M0=null;
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});}
function cover(c,img,x,s){if(!img){c.fillStyle='#222';c.fillRect(x,0,W,H);return;}const k=Math.max(W/img.width,H/img.height)*s,w=img.width*k,h=img.height*k;c.drawImage(img,x+(W-w)/2,(H-h)/2,w,h);}
function slide(c,i,x,t){const s=1.02+0.035*clamp(t/2),j=shake(t*0.8+i*5,2.2);c.save();c.translate(j.x,j.y);cover(c,PH[i],x,s);c.restore();
  c.save();c.font='600 82px Manrope, sans-serif';c.textAlign='center';c.textBaseline='middle';c.shadowColor='rgba(0,0,0,0.55)';c.shadowBlur=14;c.shadowOffsetY=3;c.fillStyle='#FFFFFF';c.fillText(CAP[i],x+W/2,330);c.restore();}
function dots(c,act,al){c.save();c.globalAlpha=al;for(let i=0;i<3;i++){c.fillStyle=i===act?'#FFFFFF':'rgba(255,255,255,0.42)';ell(c,W/2-26+i*26,1590,7,7);c.fill();}c.restore();}
function carousel(c,t){
  if(t<T_SW1-SWD){slide(c,0,0,t);dots(c,0,1);return;}
  if(t<T_SW1){const k=eOutCubic((t-(T_SW1-SWD))/SWD);slide(c,0,-W*k,t);slide(c,1,W*(1-k),t);dots(c,k>0.5?1:0,1);return;}
  if(t<T_SW2-SWD){slide(c,1,0,t);dots(c,1,1);return;}
  const k=eOutCubic((t-(T_SW2-SWD))/SWD);slide(c,1,-W*k,t);c.drawImage(M0,W*(1-k),0);dots(c,k>0.5?2:1,1);
}
window.RC=function(t){
  if(!M0&&t>=T_SW2-SWD){M0=mk();M0.getContext('2d').drawImage(montage(0),0,0);} // кадр 0 опенинга считаем заранее: montage() пользуется теми же холстами
  reset(X);X.clearRect(0,0,W,H);
  if(t>=T_SW2){const m=montage(t-T_SW2);X.drawImage(m,0,0);const a=1-clamp((t-T_SW2)/0.3);if(a>0)dots(X,2,a);return;}
  // размытие движения на свайпах
  const N=1; // свайп в TikTok — без размытия, как интерфейс
  reset(AX);AX.clearRect(0,0,W,H);
  for(let k=0;k<N;k++){const tk=N>1?t+(k/(N-1)-0.5)/60:t;reset(LX);LX.clearRect(0,0,W,H);carousel(LX,tk);AX.globalAlpha=1/(k+1);AX.drawImage(L,0,0);}
  reset(AX);X.drawImage(A,0,0);
};
window.T_SW2=T_SW2;
Promise.all([document.fonts.load('600 82px Manrope'),document.fonts.load('700 120px Oswald'),loadImg('_media/p1.webp').then(i=>PH[0]=i),loadImg('_media/p2.webp').then(i=>PH[1]=i)]).then(()=>{window.READY=true;});
})();
